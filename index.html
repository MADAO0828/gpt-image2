靠性的要点；2) 黄色“实用（黄色）”，配中性脸图标，包含三点关于 Terminal 对 GPT-5.5 的优势、使用模型选择及 Bedrock 可用性的要点；3) 红色“怀疑（红色）”，配悲伤脸图标，包含三点关于配额消耗、高额 Token 消耗以及对 4.7/4.6 对比的质疑；4) 白色总结行，配微型柱状图图标：“整体偏向积极，但初期不满也很明确。”\n\n第 5 章节，中央中部，“竞争地图”：绘制象限图，纵轴从上至下为“高性能・高可靠性”到“低成本・高速”，横轴从左至右为“通用/对话向”到“实务・长时间任务向”。包含 3 张模型卡片：左上/中央的蓝色“GPT-5.5”卡片，标注“terminal coding 强项”；右上角的橙色“Claude Opus 4.8”卡片，配大脑图标，文字“长期 Agent / SWE / OS 操作 / 金融文档”；左下角的绿色“Gemini 3.1 Pro”卡片，配 Google 风格 G 图标，文字“Google 整合・低成本 / 速度轴独立评估”。添加虚线圆形引导及底部的橙色奖杯丝带，文字“非最强唯一解，而是按用途区分使用”。\n\n第 6 章节，右侧中部，“Anthropic 企业价值故事”：分为 2 张卡片。顶部粉色卡片标题“市场对话（X 上的传播）”，配人物图标、增长箭头及三行加粗融资信息：“$65B 融资”、“$965B 投后估值”、“$47B 营收运行率”；添加小字免责声明，说明 X 将其视为市场对话，并非官方公告数据。底部绿色卡片标题“官方一手信息（Anthropic / 官方发布）”，包含 2 行：点赞图标“接受度：企业级 AI 基础设施的霸权候选”；问号图标“怀疑：是否为证明过高估值而发布的版本？”。\n\n第 7 章节，左下角，“给 Yoshi 的实务建议”：制作 4 行带彩色图标的内容：1) 绿色勾选“使用场景”：后续跟进任务如长时间、多步骤、自我验证、Claude Code、迁移及重构；2) 黄色警告“规避场景”：后续跟进低延迟单次请求、简单搜索及高成本大批量处理；3) 红色感叹号“不做的风险”：后续跟进在工程和产品领域错过早期信号；4) 蓝色剪贴板“导入方针”：后续跟进对比 Shadow 模式与 Opus 4.7/4.8，并记录失败、修正次数、Token 消耗及完成率。\n\n底部工作流条带，位于第 7 章节右侧：标题为“推荐工作流（通过 Shadow 对比进行学习・优化）”。展示 5 个由箭头连接的流程步骤：1) 任务定义剪贴板图标“任务定义”；2) 带有两个胶囊“Opus 4.7”和橙色“Opus 4.8”的对比块，标签“执行（并行）”；3) 放大镜/图表图标“评估・测量”；4) 天平图标“对比・分析”；5) 目标图标“改善・定着”。下方添加指标分类行，包含 5 个芯片/图标：“失败率”、“修正次数”、“Token 消耗（成本）”、“完成率”、“所需时间”。\n\n页脚：底部添加微小的来源和置信度文本：“来源：Anthropic 公告/文档 + X 搜索，观察日期 2026-05-29 JST。”以及“置信度：官方规格高 / X 情绪中 / 融资数字中。”右下角包含一个小盾牌图标。\n\n视觉约束：主要使用橙色、黑色、灰色、绿色、蓝色、黄色和红色点缀；包含大量小图标但无照片写实感；保持页面清晰、扁平、易读且信息密集；无水印；除 7 个编号章节和工作流条带外，无额外章节。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23079/01.jpg","partial":false},{"id":10038,"c":"ThinkAI / 信息图 / 教育视觉图","t":"古典人物 MBTI 信息图海报","p":"请生成一张 [高端国风古典人物 MBTI 信息图海报]。\n\n[人物]\n人物名称：{argument name=\"character name\" default=\"潘金莲\"}\n[预分析要求]\n请基于该人物在古典文学、历史叙事或民间文化中的主流形象，完成并应用以下信息：\n人物拼音：使用标准汉语拼音，建议标注声调。\nMBTI 类型：选择最符合该人物核心性格的类型。\nMBTI 英文标题：使用常见的 MBTI 标题，例如 The Commander / The Logistician / The Advocate。\n中文性格标签：用 8-14 个字概括人物气质。\n人物特征提取：身份定位、核心价值观、4-6 个性格关键词、象征性风格元素、代表性道具/武器/坐骑、1-3 个经典故事元素、人物结局或历史评价。\n[整体风格]\n竖版 3:4 构图，4K 超高清，高端国风人物设定海报。视觉融合：中国水墨、浅色工笔、宣纸纹理、传统纹样与现代高质量信息图布局。背景为温暖的宣纸白，配以淡墨云纹、回纹、窗棂格栅及朱砂印章。整体气质：优雅、庄重、具有收藏价值、文化底蕴深厚、简洁且高端。\n[核心视觉：3D 出框效果]\n人物主体必须具有强烈的“3D 破框而出 / 跳出画作”的半写实效果。人物上半身或全身位于中央主视觉区，营造清晰的前后景深。衣袖、武器、飘带、发丝、坐骑、云雾或标志性道具可以突破中式边框，营造出 3D 浮雕般的出框感。视觉焦点必须是人物。保持东方古典美学；禁止现代游戏 UI，禁止赛博朋克，禁止西方奇幻盔甲，禁止夸张的动漫脸。\n[人物造型]\n基于 {argument name=\"character name\" default=\"潘金莲\"} 的主流形象进行设计：保留最具辨识度的服饰、面部特征、姿态及时代气质。表情需符合性格。动作应具有叙事感，体现人物命运与性格张力。\n[布局结构]\n海报分为三个区域：1. 顶部标题区：主标题、大字号 MBTI、英文标题、中文性格标签，包裹在传统窗棂中。2. 中部主视觉区：人物占据核心，3D 效果突出，水墨渲染。3. 底部信息区：设计为 4 个整齐的模块，分别用于介绍、性格特征、经典语录及人物档案。\n[色彩]\n主色调：宣纸白、淡墨灰、朱砂红、深金。辅色根据人物气质进行调整。色彩克制且高端。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23029/01.jpg","partial":false},{"id":10039,"c":"ThinkAI / 信息图 / 教育视觉图","t":"拼拼豆豆像素风信息图海报","p":"生成一张 16:9 的横向信息图海报。\n\n主题：{argument name=\"subject\" default=\"潘金莲\"}\n\n必备知识点：\n[点 1] 到 [点 8]\n\n视觉风格定义：\n这是一种采用“拼拼豆豆 / 熔合豆豆 / 像素豆豆阵列”风格的结构化扁平信息图海报。图像由大量排列整齐的圆形塑料豆豆组成，每个豆豆都有清晰的圆形边界、轻微的中心凹陷、均匀的间距、低饱和度的塑料质感以及稳定的网格顺序。整体构图必须保持正视的扁平布局，呈现出一种公共文化信息图海报的质感，而非玩具摄影、3D 模型、卡通插画或普通的像素艺术。\n\n核心构图：\n将主题压缩为大面积的单色豆豆图像场。主题必须从画面边缘涌入，跨越页面边界并进行裁剪，仿佛一张更大的豆豆媒介图像碎片进入了页面。主题占据主要的视觉权重但并未完整呈现；观众必须通过轮廓、方向、缺失区域、豆豆密度和局部纹理来重构主题。\n\n主题形态：\n主题的外边缘呈现出低分辨率的豆豆阶梯感、块状断裂、硬切缝隙、像素化锯齿轮廓、缺失的豆豆横截面以及采样后的粗糙边界。禁止使用平滑的轮廓、完整的图标外框或写实细节。仅在主体内部使用相同主题结构色的不同亮度等级，以形成低对比度的图像碎片、半色调噪点、扫描颗粒、材质残影、档案纹理和局部密度变化。\n\n背景与负空间：\n背景使用高亮度的浅色豆豆场，接近未印刷的纸张、浅奶油色塑料板或灰白色豆豆阵列。背景不是装饰性的底色，而是主动切入主题，形成巨大的留白、蜿蜒的通道、安静的文字窗口、阅读停顿区以及知识点容器。留白必须在切割主题结构的同时提供呼吸感。\n\n色彩系统：\n采用严格的三层功能配色方案：\n1. 浅色背景场（60%–70%）：如旧纸白、浅米色或冷灰白色，用于呼吸感和文字窗口。\n2. 主题结构色（25%–35%）：定义主题和氛围。根据主题选择（例如：冷色调主题使用深蓝/深绿；暖色调主题使用赭红/焦橙）。\n3. 高对比度信息色（3%–6%）：如红色、黑色或亮蓝色等鲜明色彩，用于标题、编号和关键注释。\n\n信息图系统：\n将知识点 1 到 8 转化为豆豆信息节点（编号标签、注释框、图例块、坐标线等）。节点应散布在留白窗口、色域边界和主题缝隙中。确保文字大小具有清晰的层级结构。\n\n排版：\n使用窄体现代无衬线字体或等宽元数据字体。文字必须排列在留白窗口和底部信息栏中，切勿压在主题中心。\n\n豆豆材质：\n所有视觉元素均由豆豆构成。表面具有哑光塑料质感，带有轻微的制造不规则感、细微颗粒和轻微磨损。结构色区域可以表现出半色调风格的密度变化和特殊的叠印感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23021/01.jpg","partial":false},{"id":10040,"c":"ThinkAI / 信息图 / 教育视觉图","t":"四格高尔夫挥杆动作序列","p":"目标：创作一张逼真的 2x2 教学运动照片拼图，展示一名女性高尔夫球手完成动态挥杆动作的全过程，拍摄视角为极低的地平线角度，背景为阳光明媚的高尔夫球场。\n\n画布：垂直 4:5 比例图像，精确划分为 4 个等大的面板，面板间有细缝，呈两列两行排列。每个面板应呈现出在户外明亮蓝天、稀疏白云、绿色球道草坪及地平线附近树木背景下拍摄的高速动作照片效果。\n\n主体细节：同一位运动型年轻女性出现在所有 4 个面板中，身穿无袖 {argument name=\"outfit color\" default=\"白色\"} 高尔夫球裙，搭配百褶裙摆、白色高尔夫手套和白色运动鞋。她留着长 {argument name=\"hair color\" default=\"棕色\"} 发，扎成高马尾，随动作剧烈飘动。为保护隐私，她的面部应使用柔和的方形模糊处理。使用带有深色球头的发球木杆。\n\n布局与面板数量要求：包含 4 个带编号的动作面板，每个面板左上角带有白色小字中文标签：1. 「站位准备」展示球手处于击球准备姿势，双脚分开，杆头靠近草地上的球；2. 「上杆顶点」展示上杆顶点，双臂举过头顶，身体呈弧形，裙摆和头发随之摆动；3. 「击球瞬间」展示击球瞬间，球杆扫过球体，泥土和草屑向镜头方向飞溅，杆头带有强烈的动态模糊；4. 「收杆定格」展示收杆动作，球杆挥至身后，头发飞扬，草屑和泥土颗粒悬浮在空中。\n\n视觉风格：超写实运动摄影，电影级高速快门与细腻的动态模糊相结合，极具冲击力的低角度视角使球手显得高大且充满力量，明亮的正午阳光，清晰的阴影，饱和的自然色彩，充满活力的动态捕捉，草地附近具有浅景深效果。\n\n约束条件：保持精确的 4 个面板和 4 个指定的标签，不要添加额外的说明文字、Logo、水印，避免产品广告布局或购物海报风格。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23094/01.jpg","partial":false},{"id":10041,"c":"ThinkAI / 信息图 / 教育视觉图","t":"日文 GPT Image2 营销漫画","p":"目标：创作一张方形的日式社交媒体漫画信息图，内容是关于尝试使用 GPT Image2 制作营销海报，营造出轻松愉快的办公室氛围和可爱的动漫风格。\n\n画布：1:1 正方形图片，明亮的柔和色调，柔和的日间办公室背景，带有蓝色、粉色、紫色和绿色轮廓的云朵状面板，装饰有闪光、箭头、涂鸦、贴纸和富有表现力的反应图标。整体设计应呈现出精致的 X/Twitter 帖子配图风格。\n\n主体：一位可爱的 Q 版/动漫风格办公室女性，留着波浪短发，身穿白衬衫，佩戴金色小饰品，在设计中多次出现，姿势各异。保持面部匿名/空白，每张脸部上方覆盖柔和的矩形模糊效果。同一个角色总共出现 7 次：1) 左上角小图，正在使用笔记本电脑；2) 上方中心，欣赏生成的海报；3) 右上角，竖起大拇指；4) 左侧中部，在提示词说明旁显得困惑；5) 右侧大图，背影/侧影，坐在桌前看着显示器；6) 左下角，双手抱头显得苦恼；7) 右下角，躺在床上说晚安。\n\n布局：将六个带编号的故事步骤放置在中央电脑显示器周围的云朵面板中。使用带有白色数字的圆形步骤编号：步骤 1（蓝色）在左上角，步骤 2（蓝色）在上部中心，步骤 3（粉色）在右上角，步骤 4（紫色）在左侧中部，步骤 5（紫色）在左下角，步骤 6（绿色）在右下角。用粗壮的彩色箭头连接各步骤，包括从步骤 1 到步骤 2 的蓝色箭头、指向步骤 3 的粉色箭头、指向步骤 5 的紫色向下箭头，以及指向步骤 6 的绿色虚线路径。\n\n中心物体：桌上的一台大型电脑显示器，显示着顶部标有“GPT Image2”的设计应用界面。显示器内的画布上是 {argument name=\"brand name\" default=\"Lumière\"} 的护肤品营销海报，包含日文标题文本、产品瓶身、白花、绿叶和金色圆形功效徽章。画面中包含键盘、鼠标、咖啡杯、笔记本待办事项清单、钢笔、小盆栽和整洁的办公桌。背景展示柔和模糊的现代办公室窗户和绿植。\n\n文本内容：艺术作品中使用日文。步骤 1 标题：“AIで画像生成を試してみよう！”（让我们试试用 AI 生成图像吧！），配有问号和灯泡涂鸦。步骤 2 标题：“GPT Image2すごい”（GPT Image2 太厉害了），后接惊讶表情符号，并展示一张生成的小型营销海报预览。步骤 3 标题：“感動しました！”（太感动了！），配有爱心；包含一个清单，有 4 个绿色勾选项：“テーマ◎”（主题完美）、“雰囲気◎”（氛围完美）、“訴求ポイント◎”（诉求点完美）、“ロゴも完璧!”（Logo 也完美！）。步骤 4 标题：“他のAIは少し難しい”（其他 AI 有点难），配有涂鸦图标；包含一张名为“他社AIツール”（其他 AI 工具）的迷你卡片，内有 3 个堆叠的指令框：“プロンプトを詳細に入力”（详细输入提示词）、“構成を細かく指定してください”（请详细指定构图）、“ネガティブプロンプトも設定してください…”（也请设置负面提示词…）。步骤 5 标题：“ポイントがどんどん減っていく…”（积分在不断减少…），配有哭泣/流汗表情；包含一个名为“保有ポイント”（持有积分）的垂直积分表，列出 5 个数值：“1000 pt”、“600 pt”、“230 pt”、一个向下箭头以及红色的“50 pt”。步骤 6 标题：“明日またトライします”（明天再试一次），配有闪光。右下角睡前气泡：“おやすみなさい また明日！”（晚安，明天见！），配有爱心。\n\n海报细节：护肤品广告应写有 {argument name=\"campaign headline\" default=\"うるおい続く 私らしい毎日へ。\"}（滋润持久，开启属于我的每一天。）以及较小的文案“肌も心も、やさしく満たす。”（滋润肌肤与心灵。）。包含 3 个金色功效圆圈：“高保湿”、“敏感肌処方”（敏感肌配方）、“うるおいキープ”（保持滋润）。在“Lumière / ルミエール”上方展示一个简洁的叶子 Logo。\n\n办公桌细节：底部中央打开的笔记本应标为“やることリスト”（待办事项清单），包含 5 个复选框项目，其中几个用红色勾选；可见项目包括“企画”（策划）、“ビジュアル”（视觉）、“キャッチコピー”（宣传语）和“予算確認”（预算确认）。在苦恼的角色附近添加一些飞散的小装饰性积分币。\n\n风格限制：可爱的日式漫画信息图，简洁的商业设计，圆润的字体，角色剪影周围有粗白色轮廓，柔和的赛璐璐阴影，细节丰富但在社交媒体尺寸下清晰易读。保留六个步骤、七次角色出现以及可见的日文标签。无水印，无照片写实感，无额外面板。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23089/01.jpg","partial":false},{"id":10042,"c":"ThinkAI / 信息图 / 教育视觉图","t":"东京夜景立体模型地图","p":"目标：创建一个高度精细的 3D 微缩立体模型地图，标题为 {argument name=\"map title\" default=\"TOKYO — NOCTURNAL URBAN ARCHIVE\"}，将东京呈现为一座夜间实体建筑景观档案模型，包含发光的城市灯光、凸起的建筑、道路、铁路线、水道和地标标签。\n\n画布：3:2 横向构图，采用类似博物馆展示台的俯视斜角视角。地图置于深色桌面上，呈现为一个带有斜切边缘的厚矩形项目，底座为深海军蓝黑色，配有细奶油色边框和印刷坐标网格。\n\n主场景：将 {argument name=\"city\" default=\"Tokyo\"} 的密集夜景渲染为微缩城市模型。使用数以千计的微小建筑和温暖的窗户灯光、精细的街道网络、铁路走廊、高速公路和深蓝色水面。整体质感应为高级实体地图，而非扁平的数字地图：具有凸起的类地形城市肌理、微型建筑块、雕刻标签和逼真的深度感。\n\n地标与标签：包含 10 个黑色的双语（日文/英文）标签牌，放置在城市上方：1) 新宿 (Shinjuku)，2) 上野 (Ueno)，3) 浅草 (Asakusa)，4) 东京晴空塔 (Tokyo Skytree)，5) 皇居 (Imperial Palace)，6) 涩谷 (Shibuya)，7) 东京塔 (Tokyo Tower)，8) 银座 (Ginza)，9) 台场 (Odaiba)，10) 东京湾 (Tokyo Bay)。让东京塔在左中位置发出橙色光芒，东京晴空塔在右侧发出蓝紫色光芒，皇居在中心附近呈现为大面积深绿色公园区域，彩虹大桥横跨右下方的海湾。\n\n网格与地图标记：在地图周围添加印刷网格，顶部为 1 到 10 的数字列，左侧为 A 到 E 的字母行。边缘添加细微的经纬度标记。使用细奶油色制图线条和小型技术注释。\n\n底部信息栏：沿底边创建一个宽大的印刷图例和档案面板，分为多个部分。包含 6 个带有彩色线条样本的图例项：1) 山手线 (Yamanote Line)，2) 中央线 (Chuo Line)，3) 银座线 (Ginza Line)，4) 浅草线 (Asakusa Line)，5) 百合海鸥线 (Yurikamome Line)，6) 水域 (Water)。包含一个中心标题块，文字为 {argument name=\"map title\" default=\"TOKYO — NOCTURNAL URBAN ARCHIVE\"}，副标题为“Landscape Archive Model”，档案代码为 {argument name=\"archive code\" default=\"TKY-NAM-2024-001\"}。右下角添加比例尺（1:25,000）和指北针。添加一个标注为 A1 到 E5 的小型索引网格。\n\n视觉风格：手工建筑模型的电影级微距摄影，超精细，前景清晰，带有轻微的大气雾感，逼真的微缩照明，暖金色与冷蓝色的对比，高级博物馆展品美学，深海军蓝与炭灰色调，搭配奶油色字体。强调分层的地标、实体地图纹理以及统一的建筑立体模型语言。\n\n约束：画面中不得出现作为主体的人物和车辆。除列出的 10 个地标外，不得添加额外标签。避免卡通风格、扁平信息图表美学或现代应用 UI 元素。所有文字应呈现为印刷效果或地图项目上的小型实体铭牌。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23071/01.jpg","partial":false},{"id":10043,"c":"ThinkAI / 信息图 / 教育视觉图","t":"巴黎夜景立体模型地图","p":"目标：创建一个 {argument name=\"city name\" default=\"巴黎\"} 的高端 3D 建筑模型地图夜景，呈现为一块名为 {argument name=\"map title\" default=\"PARIS — NOCTURNAL URBAN ARCHIVE\"} 的实体档案项目。\n\n画布：横向 3:2 视角，从深色桌面上的倾斜俯视角度拍摄。地图为一块带有斜角边缘的厚实黑色矩形项目，配有金色细边框、顶部和侧面的坐标网格标签，呈现出精致的博物馆档案美学。\n\n视觉风格：深海军蓝与炭灰色的实体地图质感，凸起的微缩城市街区，雕刻的街道，勾勒出主要大道和交叉路口的温暖金色灯光，光泽感深蓝色水域，微妙的电影级阴影，高细节的微缩模型工艺，奢华制图风格，黄铜与墨色的配色方案。\n\n主要地图内容：展示一张带有发光道路网络和凸起地标模型的夜间微缩城市规划图。包含 4 个显著的 3D 地标：1) 左下/中左区域靠近河流处金光闪闪的埃菲尔铁塔，2) 左上区域带有放射状大道的凯旋门，3) 中右侧岛屿或河岸上类似巴黎圣母院的大教堂，4) 右上角山丘上类似圣心大教堂的巴西利卡。包含一条从左侧斜向右下角贯穿地图的蜿蜒河流，配有多座桥梁、深色反光水面和金色的河岸灯光。\n\n地图标签：使用优雅的金色墨水小写衬线字体标签。包含 20 个巴黎区级标签：I 卢浮宫区 (Louvre)、II 交易所区 (Bourse)、III 圣殿区 (Temple)、IV 市政厅区 (Hôtel de Ville)、V 先贤祠区 (Panthéon)、VI 卢森堡区 (Luxembourg)、VII 波旁宫区 (Palais Bourbon)、VIII 爱丽舍区 (Élysée)、IX 歌剧院区 (Opéra)、X 仓库区 (Entrepôt)、XI 巴士底区 (Bastille)、XII 勒伊区 (Reuilly)、XIII 戈布兰区 (Gobelins)、XIV 蒙帕纳斯区 (Montparnasse)、XV 沃吉拉尔区 (Vaugirard)、XVI 帕西区 (Passy)、XVII 巴蒂诺尔-蒙索区 (Batignolles-Monceau)、XVIII 蒙马特高地区 (Butte-Montmartre)、XIX 拉维莱特区 (La Villette)、XX 梅尼蒙当区 (Ménilmontant)。同时标注主要路线和区域，包括香榭丽舍大街 (Champs-Élysées)、奥斯曼大道 (Boulevard Haussmann)、圣日耳曼大道 (Boulevard Saint-Germain)、伏尔泰大道 (Boulevard Voltaire)、布洛涅森林 (Bois de Boulogne) 以及塞纳河 (River Seine)。\n\n底部信息栏：添加一个宽阔的制图页脚，分为 5 个面板：1) 左侧图例框，2) 指北针框，3) 居中的大型标题块，4) 比例尺框，5) 右侧插图框。图例框必须列出 5 个项目：纪念碑、主轴线、大道、桥梁、公园/花园、水域。居中的标题块包含地图标题、副标题“CITY OF LIGHTS · HISTORIC CORE · HAUSSMANN NETWORK”以及档案代码“ARCHIVE CODE: PAR-NAM-2024-001”。比例尺面板显示“SCALE 1:10,000”及 0 到 1000 米的比例尺条。右侧插图面板显示一张小型网格地图和一个标有“CENTRAL PARIS FRANCE”的微型轮廓图。\n\n约束条件：保持所有排版清晰且合理，画面中不得出现人物、车辆、现代 UI，也不得出现凸起地图表面之外的写实天际线。整张图像应给人一种掌控微缩夜间城市世界的感觉：层叠的地标、真实的地图材质、连贯的建筑模型语言以及温暖的夜间照明。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23070/01.jpg","partial":false},{"id":10044,"c":"ThinkAI / 信息图 / 教育视觉图","t":"纽约夜景 3D 档案地图","p":"目标：创建一个电影质感的 {argument name=\"city name\" default=\"纽约市\"} 3D 微缩建筑地图，呈现为一个夜间城市档案项目，包含凸起的建筑、发光的街道、水道、地标标注和技术制图注释。\n\n画布：16:9 横屏图像，以俯视视角呈现，如同在深色桌面上观看实体立体模型地图。使用深海军蓝、炭灰、暖黄铜和琥珀色灯光色调。该项目具有厚实的深色边框、细金边线条、顶部/底部及左/右边缘的网格坐标，并具有高级博物馆档案质感。\n\n主体：一张高度精细的曼哈顿及周边行政区夜间 3D 浮雕地图。曼哈顿位于中心，构建为一个密集的微缩城市，拥有数百座挤压成型的建筑、温暖的窗灯、路灯网络、桥梁、码头和深色反光水域。最高且被照亮的焦点塔楼是位于中心附近的 {argument name=\"central landmark\" default=\"帝国大厦\"}，中城周围环绕着明亮的暖光。南端包括高耸的世贸中心一号大楼。中央公园作为一个长方形深色区域位于曼哈顿上城。周围平面的地图区域显示左侧的新泽西州、右侧的皇后区以及右下方的布鲁克林，街道网格以细金线绘制。\n\n顶部标题栏：在左上角，添加一个带框的档案标签，文字内容为“NEW YORK CITY”，副标题为“NOCTURNAL URBAN ARCHIVE”，并附带一行小型档案代码“NYC-NAM-2024-001”。在顶部边缘添加微小的标题文本，如“LANDSCAPE ARCHIVE MODEL / 地景档案模型”，顶部标注列字母，右上角添加一个小型研究标签，文字为“EAST RIVER CORRIDOR STUDY”和“EDITION 01”。\n\n标注和标签：包含 11 个指定的地图标签/标注框：1) “NEW JERSEY / HUDSON COUNTY,” 2) “HUDSON RIVER,” 3) “ONE WORLD TRADE CENTER / 1,776 ft / 541 m,” 4) “TIMES SQUARE / THEATER DISTRICT,” 5) “EMPIRE STATE BUILDING / 1,454 ft / 443 m,” 6) “CENTRAL PARK,” 7) “CHRYSLER BUILDING / 1,046 ft / 319 m,” 8) “EAST RIVER,” 9) “BROOKLYN BRIDGE / 1,595 ft / 486 m,” 10) “QUEENS / LONG ISLAND CITY,” 11) “BROOKLYN / DOWNTOWN BROOKLYN。” 使用细引导线将标注框连接到地标。\n\n底部信息面板：在底部边缘添加 4 个技术面板：1) 一个图例面板，包含 6 个符号条目，标注为“PRIMARY ROAD”、“SECONDARY ROAD”、“RAIL LINE”、“WATER BODY”、“PARK / GREEN SPACE”和“MAJOR LANDMARK / BUILDING FOOTPRINT”；2) 一个显示真北和网格北的指北针面板；3) 一个标注为“SCALE 1:25,000”的比例尺面板，带有英制和公制比例尺；4) 一个档案说明面板，包含小字文本，包括“ARCHIVE NOTES”、“This model represents a nocturnal capture of New York City urban form, infrastructure, and landmark illumination”，以及用于填写“ARCHIVE CODE NYC-NAM-2024-001”、“MODEL NO. 001”和“SHEET NO. 01 / 01”的方框。\n\n视觉风格：超精细照片级真实微缩模型，融合技术蓝图/地图设计，清晰的微型排版，精确的金色线条，实体纸张纹理，轻微的斜角和阴影，忧郁的夜间灯光，河流上的真实反射，以及温暖的琥珀色建筑照明。城市应呈现出精心设计的微缩城市世界感，而非平面地图。\n\n约束：除已指定的微小双语档案标题外，所有文本均保持英文。不要添加人物、作为主体对象的车辆、徽标或水印。在整张图像中保持一致的建筑立体模型语言。使用 {argument name=\"lighting mood\" default=\"深色夜间琥珀色城市灯光\"} 和档案制图美学，背景使用 {argument name=\"map base color\" default=\"深海军蓝\"}，注释使用 {argument name=\"linework color\" default=\"陈旧黄铜金\"}。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23069/01.jpg","partial":false},{"id":10045,"c":"ThinkAI / 信息图 / 教育视觉图","t":"伦敦夜景立体模型地图","p":"创建一个电影级的 3D 微缩建筑立体模型地图，展示 {argument name=\"city\" default=\"London\"} 的夜景，呈现为放置在深色桌面上的实体博物馆档案项目。该项目为宽幅横向矩形，采用高位斜角视角，带有斜切边缘、深海军蓝纸张、纤细的青铜金色制图线条、坐标网格以及温暖的琥珀色城市灯光。渲染一张密集的低浮雕城市街道地图，河流穿过中心，包含凸起的标志性建筑和桥梁、逼真的微缩纹理以及精致的历史地图集美感。在顶部边缘使用 6 个高大的标注针，分别标注：“BUCKINGHAM PALACE”、“BIG BEN / PALACE OF WESTMINSTER”、“ST. PAUL’S CATHEDRAL”、“THE SHARD”、“THE GHERKIN” 和 “CANARY WHARF”。在城市各处添加额外的小型地图标签，例如 Regent’s Park、Paddington、Marylebone、Oxford Street、Hyde Park、Green Park、St. James’s Park、Buckingham Palace、Victoria、Westminster、Westminster Abbey、City of London、Southwark、The Shard、The Gherkin、London Bridge、Tower Bridge、The Tower of London、Bermondsey、Greenwich、Kensington，以及沿河流标注的 “RIVER THAMES”。强调凸起的地标：左下角灯火通明的 Buckingham Palace、河畔的 Palace of Westminster 和 Big Ben、中心附近的 St. Paul’s 圆顶、作为发光玻璃金字塔塔楼的 The Shard、作为深色圆形塔楼的 The Gherkin、作为金色高层建筑群的 Canary Wharf，以及横跨河流的 Tower Bridge。在项目底部，创建一个包含 5 个主要区域的信息面板：一个图例框，包含主要地标、历史建筑、公园/绿地、水体、桥梁和火车站的小图标；一个中央标题块，写着 “{argument name=\"map title\" default=\"LONDON — NOCTURNAL URBAN ARCHIVE\"}”；一个以英里和公里为单位的比例尺；一个带有 N 指向的罗盘玫瑰；以及一个小型索引网格插图和坐标系统注释。添加副标题 “LANDSCAPE ARCHIVE MODEL / 地景档案模型” 和档案代码 “{argument name=\"archive code\" default=\"LDN-NAM-2024-001\"}”。灯光应呈现出忧郁的夜间氛围，带有金色边缘高光、微小的发光窗户、发光的道路、深蓝色水面、柔和的阴影、浅景深以及高度精细的微缩工艺。保持所有排版清晰、优雅且具有地图集风格；避免出现人物、大于微型船只的车辆、现代 UI 元素、徽标或水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23068/01.jpg","partial":false},{"id":10046,"c":"ThinkAI / 信息图 / 教育视觉图","t":"日式水彩素描风格分级海报","p":"目标：制作一张复古手绘风格的日式信息图海报，标题为 {argument name=\"headline text\" default=\"AIイラスト用手描き風／水彩・スケッチ系画風Tier表３\"}，展示用于手绘、水彩和素描美学的 AI 插画提示词分级/列表。\n\n画布：竖版海报，4:5 比例，复古奶油色羊皮纸背景，带有做旧边缘、细微的网格纹理、和纸胶带碎片、墨点、小星星、植物涂鸦以及剪贴簿风格的装饰边框。使用深蓝色手写日文标题字体，并带有水彩装饰。\n\n顶部区域：左上方放置大标题。下方添加较小的日文副标题：「フリーハンド・水彩スプラッシュ・柔らかい線画表現に使える画風プロンプト一覧」。左侧放置一张装饰性备忘卡，包含四项关于柔和线条、模糊感、混合媒介和温暖感的复选框要点。顶部中央展示 4 个胶带固定的样本色块：1 张石墨涂鸦草图、1 张蓝色水彩晕染图、1 张粉紫色水彩晕染图以及 1 张黑色城市线条草图。右上角展示一位留着长黑发、披着花纹披肩的年轻女性艺术家，周围环绕着画笔、墨水瓶、水彩调色盘和素描本；包含一个写有「画材感で使い分けてね。」的小对话气泡，以及一张写着“Create Inspire Explore”的小便签。\n\n主要布局：一个整齐的 3 列 4 行网格，包含 12 张圆角矩形信息卡片。每张卡片左上角有一个带数字 1 到 12 的彩色圆形徽章，一行微小的分类文字“C. 手描き風 / 水彩 / スケッチ (Hand-drawn / Watercolor / Sketch)”，以及英文风格名称、日文风格名称、简短的日文说明、“Sample Prompt:”（英文）和一个小型手绘样本插图。使用深蓝色文字、暖米色卡片背景、细蓝灰色边框和精致的水彩阴影。\n\n12 张卡片内容如下：\n1. “English Style: Freehand Line Art” / 「日本語名：フリーハンドラインアート」，配以桌边头脑风暴的随性墨水画。\n2. “English Style: Watercolor Splash” / 「日本語名：水彩スプラッシュ」，配以围绕发光灯泡图标的明亮水彩溅射效果。\n3. “English Style: Soft Pencil Sketch” / 「日本語名：ソフト鉛筆スケッチ」，配以窗边带有植物的柔和铅笔书桌场景。\n4. “English Style: Mixed Media Sketch” / 「日本語名：混合技法スケッチ」，配以结合了层叠纹理、纸张、颜料和钢笔的创意设计师书桌。\n5. “English Style: Handmade Sketch Illustration” / 「日本語名：手作りスケッチイラスト」，配以四人握手的温馨手工商业插画。\n6. “English Style: Gentle Watercolor” / 「日本語名：優しい水彩」，配以柔和色彩中老师在教室桌旁辅导学生的场景。\n7. “English Style: Fine Line Drawing” / 「日本語名：ファインラインドローイング」，配以用精致细线条绘制的奢华腕表。\n8. “English Style: Whimsical Sketch” / 「日本語名：ファンシースケッチ」，配以载着文件和咖啡的异想天开的飞行办公桌。\n9. “English Style: Expressive Brushstroke” / 「日本語名：表現的な筆使い」，配以动态墨水和色彩笔触冲过终点线的跑步者。\n10. “English Style: Casual Doodle Sketch” / 「日本語名：カジュアルドゥードルスケッチ」，配以头脑风暴的涂鸦图标：IDEA 灯泡、齿轮、便利贴、饼图和柱状图。\n11. “English Style: Loose Colored Pencil Sketch” / 「日本語名：ラフな色鉛筆スケッチ」，配以休闲会议中快乐团队的场景，带有松散的色铅笔纹理。\n12. “English Style: Soft Sketch Watercolor Combo” / 「日本語名：ソフトスケッチ水彩コンボ」，配以舒适的家庭办公环境，包含笔记本电脑、书架、植物和素描工具。\n\n底部区域：添加一个水平说明面板。左侧是一个深蓝色垂直标签块，上面用醒目的白色日文字符写着「解説」，并配有花卉装饰。右侧包含五个简洁的日文要点，解释该图表有助于为 AI 插画提示词选择手绘、水彩和素描风格，英文风格名称可直接插入提示词中，且笔触强度涵盖从涂鸦、色铅笔到表现力笔触和精细线条画。右下角放置一组艺术用品静物：堆叠的书籍（分别标有“DESIGN”、“PROMPT”和“AI NOTE”）、水彩调色盘、杯中的画笔、标有“INK”的墨水瓶、铅笔、钢笔以及一张写着「目的に合わせて選んでね。」的小便签。\n\n视觉风格：手绘信息图、水彩素描、模拟文具美学、柔和的墨水轮廓、轻微去饱和的米色与海军蓝配色，辅以柔和的水彩点缀，营造舒适的艺术日记氛围，日式杂志排版，细节丰富且易于阅读。\n\n限制：使用 12 张编号风格卡片，4 个顶部样本色块，以及底部说明区域。保持所有文字清晰可读，并像精美的教育海报一样排列。请勿添加任何徽标、水印、二维码或额外的卡片。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23083/01.jpg","partial":false}],"total":100,"page":1,"limit":36,"pages":3,"source":"prebuilt-bootstrap-category-full"},"ThinkAI / YouTube 缩略图":{"prompts":[{"id":10111,"c":"ThinkAI / YouTube 缩略图","t":"动漫主角与伙伴生成器","p":"使用提供的图像作为角色参考基准。如果参考图像中的角色是某部虚构的动漫、漫画或游戏杰作中的重要人物，请生成一个“最合适的主角”，要求该主角能与参考角色并肩作战、共同旅行、深度参与其命运，并使他们的故事成为可能。主角应是自然衍生自参考角色的存在。主角并非现有角色，必须是全新的设计。然而，他们必须具备压倒性的魅力和存在感，让人一眼就能认定“这绝对是主角”。主角的性别不固定，应根据与参考角色的兼容性、流派、世界观和叙事逻辑自然决定。主角的设计应达到足以成为商业动画、少年/青年漫画、轻小说或游戏作品门面的精致程度。在面部、发型、发色、眼睛、种族、服装、轮廓、设计语言、性格表现、世界观和角色身份等方面，必须与参考角色保持高度的一致性。将主角置于稍靠前的位置，参考角色置于稍靠后的位置，且不能削弱参考角色的存在感。两者必须明确属于同一个故事。他们的目光、距离、站位、姿态和表情应让观众感受到“这两人之间绝对有故事”。主角可以是保护参考角色的人、并肩作战的伙伴、旅途同伴、对手或师徒，关系应由世界观自然决定。构图不固定，但通常主角在前，参考角色在中景或背景，优先考虑最能体现两人关系的构图。一个 {argument name=\"era\" default=\"20 世纪 90 年代末至 21 世纪初\"} 的 {argument name=\"media type\" default=\"日本动漫杂志封面\"}。一部虚构传奇动漫的官方关键视觉图。日本动漫美学。{argument name=\"visual style\" default=\"赛璐珞动漫风格\"}。商业动漫官方插画质量。强烈的视觉冲击力。令人印象深刻的轮廓。那种让人想翻阅动漫杂志封面的魅力。目标是达到让观众本能地产生“我想看这部动画”想法的完成度。可以自然地放置虚构的动漫标题 Logo 或作品 Logo。[禁止事项] 禁止设置素材布局。禁止对比图。禁止三视图。不要让主角和参考角色成为无关人员。不要制作简单的群体插画。不要制作只有主角突出的插画。确保两者之间有明确的叙事联系。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23633/01.jpg","partial":false},{"id":10112,"c":"ThinkAI / YouTube 缩略图","t":"未来赛博朋克创意领袖海报","p":"仅参考所提供的本人照片以获取面部相似度。请勿复制原图的姿势、服装、发型、背景或光影。将我塑造成一位强大的未来主义创意领袖 / 赛博朋克远见者。创作一张高端电影感赛博朋克海报，主角是一位自信的 {argument name=\"ethnicity\" default=\"南亚裔\"} 男性，坐在黑色真皮行政椅上，身着全黑奢华装束：黑色定制西装外套、黑色衬衫、黑色长裤、高级腕表，整体风格精致干练。将发型改为更蓬松、更有电影感的凌乱发型，增加发量与纹理感，并保留修剪整齐的胡须。表情应表现出强烈、冷静、自信且具有统治力。构图：主体位于中右侧，身体微微前倾，一只手靠近面部，另一只手放在椅扶手上。在他身后，左侧展示一个巨大的半透明侧脸肖像，由蓝色数字故障碎片、像素位移、扫描线、破碎的数据块和全息畸变构成。环境：未来主义暗色办公室 / 创意指挥室，包含玻璃、反射、霓虹蓝与橙色灯光、烟雾、漂浮的玻璃碎片、抽象金属丝带、数字界面面板、光亮桌面上的棋子、相机镜头、香水瓶、笔记本电脑以及电影感的城市灯光氛围。视觉风格：超精细、戏剧性光影、蓝橙对比、锐利阴影、光泽反射、破碎玻璃颗粒、数字损坏、控制论叠加、全息 UI、碎片化霓虹数据、高级编辑构图、强大的氛围、电影级写实、高级时尚广告、暗黑奢华美学。排版：在右侧添加粗体海报文字：“CREATE YOUR REALITY”。添加较小的文字元素：“BUILT DIFFERENT FOR A DIFFERENT PATH”、“FOCUS. DISCIPLINE. VISION. LEGACY.”、“NOTHING IS RANDOM. EVERY MOVE IS YOU.”、“DISCIPLINE TODAY. LEGACY TOMORROW.”。使用简洁的未来主义字体与笔刷风格的冲击力文字相结合。保持文字极简、时尚，并融入设计中。氛围：强大、神秘、高端、远见卓识、电影感、叛逆、未来主义、自信、高地位、艺术感、戏剧性。格式：竖版海报，4:5 比例，超写实，高分辨率，锐利的面部细节，自然的皮肤纹理。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23456/01.jpg","partial":false},{"id":10113,"c":"ThinkAI / YouTube 缩略图","t":"微缩模型风格肖像","p":"一张电影感广角镜头，以上传的人脸作为参考，骑着 {argument name=\"vehicle\" default=\"复古浅绿色滑板车\"}，穿着 {argument name=\"attire\" default=\"深色西装和红色领带\"}，表情严肃地直视镜头；滑板车位于一个风格化的地图状表面上，周围有道路和蜿蜒的蓝色路径，并环绕着微缩建筑、树木、车辆和人群，营造出强制透视效果；左上角有巨大的 3D 白色字母拼写出 \"{argument name=\"text\" default=\"AI TRENDS\"}\"；左下角附近放置了一个红色定位图钉，右下角有 \"SCHOOL\" 和 \"HOME\" 标志；场景光线明亮，呈现自然日光，投射出柔和的阴影，营造出充满活力且俏皮的氛围；风格让人联想到精心制作的微缩模型，呈现出超写实的细节；摄像机角度为高角度拍摄，赋予了场景尺度感和透视感，浅景深效果使背景略微模糊，将注意力集中在滑板车和骑手身上；色调以明亮、饱和的色彩为主，混合了冷暖色调，构成了视觉上引人入胜且充满动感的画面。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23277/01.jpg","partial":false},{"id":10114,"c":"ThinkAI / YouTube 缩略图","t":"四季日本全景","p":"创作一幅超宽幅电影级日本奇幻全景图，风格融合了细节丰富的动漫手绘背景与历史浮世绘风格的数字插画。场景视角位于传统的榻榻米房间内，透过敞开的障子门，望向远方横跨山谷的 {argument name=\"mountain landmark\" default=\"富士山\"}。前景中，放置一位 {argument name=\"main subject\" default=\"身着华丽米色和服、系着深色花卉腰带的年轻女子\"}，她坐在木质走廊上，主要以背影和侧影呈现，梳着优雅的黑色盘发，面部区域刻意处理为方形像素化/模糊效果。她周围环绕着飘逸的和服布料、茶具托盘、小茶杯、水壶、灯笼、榻榻米、矮家具、竹帘和花枝。构图应呈现为连续的屏风画或三联画，带有微妙的垂直面板接缝，上下方带有黑色遮幅边框。\n\n从左至右无缝融合 4 个季节区域：1) 房间周围开满淡粉色樱花的春季庭院，2) 温暖的夏日/金色日落景观，包含水域、岛屿、松树、红色拱桥和村庄屋顶，3) 枫叶红遍、橙色暮光笼罩的秋季区域，4) 树木覆盖积雪、深蓝色天空下悬挂新月的冬季夜晚区域。室外需包含 3 个主要的建筑/景观焦点：左中部的红色拱桥、地平线中央的远山，以及最右侧的深色宝塔。前景需包含 2 个可见的茶具相关物品：左侧的黑色水壶和女子身旁的小茶托及茶杯。运用温暖的灯笼光、大气薄雾、水面波光、精致的花卉细节和极具张力的景深。配色方案：琥珀色日落、柔和金、樱花粉、枫叶红、雪景蓝和深靛蓝。画面要求高度精细、具有绘画感、浪漫、宁静、怀旧且呈全景式，画面中不得出现任何文字、水印或现代物品。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23244/01.jpg","partial":false},{"id":10115,"c":"ThinkAI / YouTube 缩略图","t":"真人版动漫电影海报","p":"“超电影感动漫真人版巨型视角海报”\n\n主要角色：\n\n[{argument name=\"character\" default=\"五条悟\"}]\n\n剧情主题：\n\n[{argument name=\"plot\" default=\"新宿决战\"}]\n\n视觉风格：\n\n超低角度虫眼视角，\n超广角镜头，\n强烈的透视缩短效果，\n角色双脚极度靠近镜头，\n营造出巨大的压迫感和空间冲击力。\n\n角色动作：\n\n“向镜头走来”的动作构图。\n\n前脚跨在镜头前方，\n鞋底纹理清晰可见，\n营造强烈的视觉张力。\n\n角色要求：\n\n真人电影质感，\n超高颜值，\n动漫真人化改编，\n逼真的皮肤细节，\n清晰的发丝，\n具有真实质感的布料，\n电影级灯光与氛围感。\n\n角色服装自动匹配角色身份与世界观。\n\n氛围：\n\n日式动漫电影海报风格，\n新海诚电影灯光，\n斯皮尔伯格电影镜头运动感，\n高动态范围光照，\n电影级景深，\n空气透视，\n阳光穿透云层，\n兼具青春感与史诗规模。\n\n背景世界：\n\n根据角色剧情，\n自动生成相应的世界观场景：\n\n例如：\n\n忍者村，\n未来都市，\n废土城市，\n神庙，\n天空之城，\n魔法学院，\n蒸汽朋克城市，\n赛博城市，\n古战场，\n异世界王国，\n山林，\n海滨城市，\n巨型机械都市。\n\n背景必须具备：\n\n超大的空间感，\n写实的建筑层次，\n城市远景，\n电影级的天空与云层。\n\n排版：\n\n在顶部添加超大电影标题文字，\n字体为：\n\n透明玻璃质感，\n液体字体，\n金属字体，\n未来感字体，\n动漫电影标题字体。\n\n海报周围添加：\n\n日式手写英文，\n角色头衔，\n阵营信息，\n世界观标签，\n神秘符号，\n小型设定文字。\n\n整体布局参考：\n\n动漫电影海报，\n游戏角色主视觉图，\nNetflix 真人版海报，\n日式轻小说封面。\n\n色彩：\n\n高饱和度电影色彩，\n天蓝色，\n云朵白，\n金色阳光，\n主角色色彩自动匹配角色设定。\n\n细节要求：\n\n电影级清晰度，\n8K，\n超精细，\n写实皮肤，\n逼真的鞋底纹理，\n飘逸的头发，\n布料动态，\n空气微粒，\n阳光轮廓光，\n镜头光晕，\n景深模糊，\n极致的透视感。\n\n禁止：\n\n低质量，\nQ 版风格，\n卡通感，\n扁平插画，\n混乱的多人构图，\n普通的站姿，\n低细节背景，\n裁切掉双脚，\n错误的透视，\n肢体畸形，\n模糊的画质。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23200/01.jpg","partial":false},{"id":10116,"c":"ThinkAI / YouTube 缩略图","t":"日本电视新闻：兔兔咖啡馆","p":"保持参考图中的双胞胎角色，写实真人风格，模拟日本电视资讯节目的专题报道，标题为“{argument name=\"special feature name\" default=\"人气兔兔咖啡馆专题\"}”。明亮可爱的热门兔兔咖啡馆内景。前景中，一名记者正对着镜头微笑着介绍店铺。采用新闻/资讯节目的字幕设计。屏幕顶部显示文字“{argument name=\"title\" default=\"人气兔兔咖啡馆\"}”，底部显示“{argument name=\"subtitle\" default=\"人气背后的秘密是什么？\"}”。采用白色、粉色和橙色的柔和配色方案，布局如同真实的电视转播。不包含任何企业标志或真实店名。\n\n店内有许多真实的兔子在自由活动。木屋、干草、坐垫、柔和的灯光，营造出一个治愈空间。其中，参考图中的双胞胎自然地混入其中，身着“兔子 Cosplay”。轻量级的兔子 Cosplay，例如长兔耳发箍、毛茸茸的白尾巴和柔软的兔系服装。两人都在地板或坐垫上与真实的兔子一起自然地放松。一人蹲在兔子群中，另一人拿着干草融入周围环境。起初看起来像是普通的兔兔咖啡馆介绍，但仔细观察会发现，这是一种滑稽的构图：双胞胎虽然是人类，却自然地与兔子融为一体，显得格外引人注目。\n\n记者正在严肃地进行介绍。具有电视转播摄像机的自然视频感，浅景深，温暖的室内照明，逼真的兔毛，真实的皮肤纹理，纪录片风格，照片级真实感，超高清，真实的电视节目画质。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23032/01.jpg","partial":false},{"id":10117,"c":"ThinkAI / YouTube 缩略图","t":"温泉电视节目报道场景","p":"一个温泉旅馆介绍节目的现场直播场景。在 {argument name=\"location\" default=\"安静的日式豪华温泉旅馆\"} 的露天浴池中，一位 {argument name=\"reporter\" default=\"年轻可爱的成年女性播音员\"} 正在进行泡汤报道。她表情明亮优雅，正微笑着向镜头介绍温泉的魅力。背景包括 {argument name=\"details\" default=\"木质旅馆、岩石浴池、竹篱笆、柔和的日式灯光、升腾的蒸汽以及宁静的自然景观\"}。播音员浸泡在水中，水位及肩，露出部分适度，给人以清爽的感觉，构图符合旅游节目的安全标准。镜头略微正对人物且保持稳定，呈现出电视广播的质感。整体氛围明亮、高质量且 {argument name=\"atmosphere\" default=\"如同温泉介绍节目般治愈\"}。此时，熊猫尚未出现。写实、高质量、自然光、电视节目风格、优雅、亲切的氛围。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22887/01.jpg","partial":false},{"id":10118,"c":"ThinkAI / YouTube 缩略图","t":"动漫角色转入现实世界","p":"以参考图像作为角色设计的基础，描绘“{argument name=\"situation\" default=\"转入现实学校的转生动漫角色\"}”这一瞬间。准确保持角色作为动漫插画的氛围感。请勿破坏角色的特征，也不要将其转化为真人。角色部分需保持动漫插画的表达方式。角色身着写实的日本高中校服（西装外套、领带、丝带、开衫、衬衫、学校指定的裙子）。场景设定为写实的日本高中教室，包含黑板、课桌、日光灯、讲义、窗帘和储物柜。背景不应过于整洁，需强调日常生活和学校的杂乱感。构图应呈现为带有 TikTok 或 Instagram Reels UI 元素的竖屏手机视频样式。前景自然地构图出学生手持手机的手部、课桌和笔记本。在教室前方，一位写实的老师正在黑板上用粉笔写下名为 {argument name=\"name\" default=\"蓝发精灵\"} 的动漫转校生名字。角色应表现出略微紧张或面无表情的样子，试图自然地融入环境。光影应在角色与教室之间保持统一。添加类似手机拍摄的质感：轻微的 HDR、传感器噪点、细微的 JPEG 伪影以及手持摄像机的晃动感。避免电影级或高光渲染；优先体现随手拍摄并发布视频的真实感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22723/01.jpg","partial":false},{"id":10119,"c":"ThinkAI / YouTube 缩略图","t":"黄金炒饭分镜脚本页","p":"目标：为一段关于 {argument name=\"dish theme\" default=\"黄金炒饭\"} 的 15 秒烹饪视频创作一张超高质量、细节丰富的动画风格分镜脚本页，按时间顺序展示完整的烹饪过程。\n\n画布：一张 16:9 的宽幅分镜脚本页，分为 12 个面板，以 4 列 3 行的整齐网格排列。使用细黑色边框，采用电影级特写镜头，营造温暖的餐厅厨房灯光、戏剧性的蒸汽、油光闪烁、飞舞的米粒以及诱人的金黄色调。无字幕、无对话气泡、无面板编号、无水印。\n\n视觉风格：高端日本动画美食广告风格，高度精细的半写实烹饪插画，光泽高光，浅景深，动态动作构图，橙色火光与金黄色蛋液色调，米粒、葱花、肉丁、炒锅金属与木质项目上的纹理清晰可见。\n\n分镜面板，按此顺序共 12 个：\n1. 木质项目上的食材准备俯拍镜头：一个装有熟白米饭的大玻璃碗、一个小碗里的 4 个褐色鸡蛋、长青葱、一碗切好的猪肉或火腿丁，以及 3 个装有白盐、黑胡椒和深色酱油的小调料碟。\n2. 特写镜头：双手在木质项目上用大厨刀将青葱切成绿色小段。\n3. 特写镜头：双手将一个鸡蛋打入透明玻璃搅拌碗，蛋黄和蛋清落下时带有闪烁的高光。\n4. 特写镜头：打散的鸡蛋在玻璃碗中用筷子用力搅拌，形成旋转的亮橙黄色液体。\n5. 明火上的热黑炒锅，油呈细长的金黄色流线倒入，蒸汽升腾。\n6. 将蛋液倒入滋滋作响的炒锅中；鸡蛋开始翻炒并冒泡，形成柔软的金黄色凝块。\n7. 将米饭、肉丁、葱花和鸡蛋在炒锅中翻炒；食材在空中划出戏剧性的弧线向上飞起。\n8. 高能量的翻炒镜头，周围环绕着强烈的橙色火焰和火花，黄金炒饭在空中散开。\n9. 极具诱惑力的成品炒饭特写，展示光泽分明的米粒、黄色蛋块、绿色葱花和焦香的肉丁。\n10. 更广角的厨房动作镜头：厨师的手从上方将调料撒入冒着热气的炒锅中，炒饭在火焰上烹饪。\n11. 招牌装盘镜头：一盘整齐的圆顶状黄金炒饭放在带有精致花纹边缘的白盘中，蒸汽升腾，背景为温暖的厨房。\n12. 最终勺子特写镜头：金属勺舀起光泽诱人的黄金炒饭，包含鸡蛋、葱花和一块大肉丁，背景为虚化的盘中炒饭。\n\n约束：保持网格布局精确，包含 12 个独立的面板，按从左到右、从上到下的时间顺序叙事，无可见文字，强调 {argument name=\"main color palette\" default=\"金色、琥珀色、橙色火光、深黑色炒锅、新鲜绿色葱花\"}，使菜肴看起来浓郁、热气腾腾且美味可口。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22653/01.jpg","partial":false},{"id":10120,"c":"ThinkAI / YouTube 缩略图","t":"带有闪电光环的动漫机车少女","p":"超写实的电影感动漫剪辑，画面中是一位 {argument name=\"character\" default=\"年轻机车少女\"} 坐在 {argument name=\"bike\" default=\"红色 KTM Duke 运动摩托车\"} 上，姿势和正面角度与参考图完全一致，身穿黑色短款上衣、黑白皮夹克、超大款破洞深灰色阔腿牛仔裤、黑色运动鞋，佩戴全黑头盔遮住面部，一条腿着地，另一条腿搁在摩托车上，双手摆放位置与原图完全一致，身后站着一个 {argument name=\"warrior\" default=\"巨大的发光蓝色电能动漫战士\"}，拥有巨大的尖刺状蓝发和强壮的肌肉，强烈的蓝色闪电光环环绕整个场景，电能环绕在摩托车和身体周围，背景为暴风雨多云天空，戏剧性的蓝色霓虹光效，超细节，高对比度，奇幻动漫风格，写实的街道地面纹理，相同的构图，相同的取景，相同的视角，相同的摄像机角度，相同的摩托车位置，相同的光照，相同的背景景深，电影级景深，超高清 8k，清晰对焦，强大的能量效果，无多余物体。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22284/01.jpg","partial":false},{"id":10121,"c":"ThinkAI / YouTube 缩略图","t":"峡谷列车动作英雄","p":"创作一张超现实的电影级动作肖像，采用 9:16 垂直画幅，以一种不可思议的高空俯拍视角，俯瞰一列正在日落时分的狭窄沙漠峡谷中飞驰的复古列车。在前景中，展示 {argument name=\"main character\" default=\"一位硬朗的男性动作英雄\"} 强有力地站在火车头车顶，身体朝前，姿态自信，身穿 {argument name=\"outfit\" default=\"一件随风飘动的深棕色皮夹克、黑色衬衫、黑色长裤、战术腰带、靴子和一条银色项链\"}。他的面部应刻意遮挡或轻微模糊，头发深色且打理整齐。他右手向下握着 1 把左轮手枪，大腿上系着枪套。火车应有 1 个清晰可见的前大灯在发光，车头为深色复古引擎，带有窗户和格栅，多节相连的客车厢向峡谷深处蜿蜒而去。在他身后，加入 1 架低空盘旋在火车上方的军用直升机，并有 2 道明亮的探照灯光束向下照射在车厢上。在中间距离的峡谷岩壁或轨道旁加入 1 处火光冲天的爆炸，并在左下角前景处加入从火车轮毂或轨道上迸发的火花。环境：两侧为红岩峡谷悬崖，空气中弥漫着尘土，极速带来的动态模糊，地平线上低垂的温暖黄金时刻阳光，戏剧性的镜头光晕，体积雾，飞扬的尘埃轨迹，电影大片级的写实感。采用动态广角视角，英雄位于画面下方中央，直升机和爆炸位于其身后，具有强烈的景深感、高对比度、锐利的写实细节，以及史诗级的动作电影调色，无文字，无 Logo，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22444/01.jpg","partial":false},{"id":10122,"c":"ThinkAI / YouTube 缩略图","t":"体育场观众转播肖像","p":"一张超写实的体育转播剧照，展现了一位迷人的女性坐在拥挤的 {argument name=\"location\" default=\"足球场观众席\"} 中，背景是夜间比赛。她身穿 {argument name=\"outfit\" default=\"深棕色无袖高领缎面背心\"}，佩戴黑色方形耳环，齐肩浅棕/金色波浪卷发。她正随性地 {argument name=\"action\" default=\"用一只手喝着高罐蓝色铝罐饮料，另一只手拿着吃了一半的芝士汉堡\"}。周围的球迷身穿亮黄色和蓝色的足球球衣并佩戴围巾，形成了强烈的球队色彩对比。画面呈现出抓拍的电影质感，采用电视转播摄像机视角，具有浅景深效果。包含逼真的体育场座位、拥挤的观众氛围，左上角带有显示实时足球比分和比赛时间的转播叠加图形，右上角带有体育频道水印。自然竞技场灯光，细腻的皮肤纹理，焦点清晰地落在女性身上，背景观众略微模糊，呈现真实的体育直播美学，16:9 构图。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22253/01.jpg","partial":false},{"id":10123,"c":"ThinkAI / YouTube 缩略图","t":"Sakura Travel Cinema 标题卡","p":"目标：为短视频合集制作一张充满活力的日本旅行视频标题卡，将电影感的春季旅行照片背景与光泽感霓虹 UI 图形相结合。\n\n画布：横向 16:9 图像，1152×768 质感，高分辨率，明亮的柔和色调，柔和的光晕和镜头光斑。\n\n背景：一位年轻女性旅行者站在右侧的火车站台上，身旁是一列现代火车，采用背影/四分之三侧背视角，面部刻意用纯肤色的矩形模糊处理。她留着深棕色长卷发，身穿浅米色风衣，背着棕色单肩包，底部中央附近握着一个小行李箱的拉杆。场景设定在梦幻般的春季樱花车站，左侧和上方背景布满粉色樱花树，花瓣飘落，阳光温暖，景深较浅。\n\n主要图形布局：在左侧中心放置一个巨大的圆角渐变横幅，向女性方向延伸。横幅采用蓝-紫-粉半透明光泽渐变，最左侧有一个大圆形徽章。圆圈内显示一个巨大的白色数字 {argument name=\"section number\" default=\"4.\"}。圆圈右侧设置醒目的白色圆角日文标题文本：{argument name=\"headline text\" default=\"旅行・季節・青春シネマ\"}。下方添加一个较小的白色圆角胶囊标签，内含紫粉色文本：{argument name=\"subtitle text\" default=\"情緒・旅感・短編向け\"}。\n\n可见文本数量：共 3 个文本元素：1 个显示为“4.”的大数字徽章，1 个显示为“旅行・季節・青春シネマ”的主标题，以及 1 个显示为“情緒・旅感・短編向け”的副标题胶囊标签。\n\n霓虹图标叠加数量：在横幅周围和右侧共有 9 个发光的粉白色线条图标和装饰元素：左上角 1 个行李箱图标，左上中心附近 1 个樱花图标，横幅上方 1 个相机图标，右上角圆角矩形内 1 个播放按钮图标，中右侧 1 个场记板图标，左下角 1 个路标箭头图标，左下至中心扫过的 1 条虚线旅行路径，虚线路径末端附近 1 个地图定位点，以及顶部中心和右侧附近的 2 个小闪光/星星装饰。保持所有图标半透明、霓虹轮廓且带有柔和光泽。\n\n风格：日本社交媒体缩略图设计，可爱的旅行美学，光泽感渐变面板，粉色和薰衣草色调氛围，电影级虚化，梦幻樱花瓣，简洁的圆角排版，带有微弱光泽的明亮白色文本，精致的宣传卡片构图。\n\n约束：保持女性在右侧，图形标题块在左侧，不要添加额外文本，不要添加徽标或水印，保持面部被简单的矩形模糊遮盖，并保持愉悦的春季旅行氛围。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22411/01.jpg","partial":false},{"id":10124,"c":"ThinkAI / YouTube 缩略图","t":"日式霓虹营销缩略图","p":"创建一个充满活力的日式营销课程缩略图，主题为 {argument name=\"campaign topic\" default=\"CM・広告・商品訴求\"}。使用 16:9 横向画布，1184×768 风格，采用亮面紫蓝色霓虹美学和柔和的景深办公照明。背景：一个现代化的化妆品营销工作区，模糊的大显示器上显示着活动仪表盘；显示器上可见的英文文本包括“NEW CAMPAIGN”以及小型图表/产品面板。右侧放置一位身穿淡紫色衬衫的年轻女性营销人员，坐在桌前，一只手托着下巴拿着一支笔；她的脸部被一个大的不透明哑光棕色矩形刻意遮挡。桌面细节包含 5 个主要物品：左侧一台打开的笔记本电脑、前方一个一次性咖啡杯、印有彩色布局缩略图的营销单页、右侧的化妆品瓶，以及一个写着“NEW ARRIVAL 30% OFF LIMITED CAMPAIGN”的小标牌。在左下角至中心处覆盖一个带有发光和透明效果的蓝色渐变至紫色的圆角大横幅。横幅最左侧放置一个大的圆形徽章，内有白色文本“2.”。横幅上的主要日文标题为粗体白色圆角无衬线字体“CM・広告・商品訴求”，其中“商品訴求”位于第二行。在其下方，添加一个带有蓝色和粉色文本的白色胶囊状标签：“商品訴求・販促・告知向け”。添加 3 个大型霓虹线条图标：左上角一个青色扩音器，其下方一个粉色购物袋，右上角一个圆角矩形内的紫色播放按钮。在构图中散布 8 个小型发光闪烁装饰，并在底部中心附近添加一个小型的粉色上升柱状图图标。整体风格：日式 YouTube 缩略图，精致的数字广告设计，发光渐变，电影级模糊，清晰易读的排版，无水印，除指定标签外无额外文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22410/01.jpg","partial":false},{"id":10125,"c":"ThinkAI / YouTube 缩略图","t":"ASMR YouTuber 缩略图","p":"目标：为 ASMR 主播领域创作一张光泽感十足的 YouTube 缩略图风格图像，将写实的舒适创作者照片与醒目的日文标题图形及霓虹社交媒体图标相结合。\n\n画布：横向 16:9 缩略图，1152×768 构图风格，电影级浅景深，冷蓝色和紫色灯光搭配柔和的粉色高光。\n\n主体：一位年轻的女性 ASMR YouTuber 坐在画面右侧，身处舒适的卧室或直播间，穿着露肩薰衣草紫针织毛衣，佩戴黑色入耳式监听耳机。她的脸部被一个哑光棕色的巨大扁平矩形隐私遮挡块刻意遮住，从额头到下巴居中覆盖。她手持一个巨大的黑色电容麦克风，麦克风带有银色金属网罩，安装在支架的黑色防震架上。她露出的双手修剪整齐，指甲呈浅色。整体氛围亲密、宁静，呈现耳语直播主题。\n\n背景：柔焦卧室/工作室，配有窗帘、搁板、小盆栽、仙女灯以及一张床或沙发。全程使用蓝紫色环境光，背景中心有粉色光斑。右下角添加一个发光的蘑菇形状台灯，旁边隐约可见白色和薰衣草紫色的耳机。\n\n布局：将创作者和麦克风置于右侧，在左下至左中位置放置一个巨大的半透明圆角矩形标题面板。面板采用蓝紫渐变的磨砂玻璃效果。在面板最左侧，包含一个巨大的圆形渐变徽章，内含粗体白色数字“1.”。在徽章右侧，放置粗体圆润的白色主标题：第一行写“ASMR・配信・”，第二行写“YouTuber”。在下方添加一个较小的白色胶囊状标签，内含蓝粉渐变文字“ささやき・会話・配信向け”。\n\n可见文字：精确使用 3 个文本块：1) 圆形徽章内的“1.”，2) 主标题“{argument name=\"headline text\" default=\"ASMR・配信・YouTuber\"}”，3) 副标题“{argument name=\"subtitle text\" default=\"ささやき・会話・配信向け\"}”。保持所有文字清晰易读，并忠实于日文字符。\n\n装饰元素：在场景周围精确包含 7 个霓虹/社交图形元素：1) 左上角的发光云朵轮廓，2) 云朵下方的白色霓虹麦克风图标，3) 旁边带有三个点的白色霓虹聊天气泡，4) 右上角发光的播放按钮轮廓，5) 左下角的音频波形线，6) 底部中心附近的白色音符图标，7) 散布在图标和右边缘附近的多个小闪烁星星，作为单一的闪烁星簇风格。使用紫色、白色和粉色的霓虹光效。\n\n视觉风格：以写实照片为基础，叠加简洁的矢量图形，现代创作者经济缩略图设计，柔和光晕，高对比度，光泽渐变，圆润字体，梦幻般的 ASMR 氛围，无水印，无额外 Logo，无额外文字。使用 {argument name=\"main color palette\" default=\"薰衣草紫、蓝色、紫色和柔和粉色\"} 灯光，并强调 {argument name=\"content niche\" default=\"ASMR 直播和 YouTuber 提示词\"}。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22408/01.jpg","partial":false},{"id":10126,"c":"ThinkAI / YouTube 缩略图","t":"配备全息 HUD 的探险摩托车手","p":"一张电影感、广角摄影作品，展现了一位探险摩托车手和两辆装载齐全的旅行摩托车停在风景优美的山顶观景台上。他们下方的柏油路上呈现出金色的全息地图叠加层，显示着 {argument name=\"location\" default=\"India\"}。这个科幻风格的 HUD（抬头显示）叠加层清晰地展示了路线线条、州界，以及显示 GPS 导航指标的数字发光文本，例如 \"{argument name=\"route\" default=\"Ahmedabad to Goa\"}\"、\"{argument name=\"stats\" default=\"20 hr 56 min (1,091 km)\"}\" 以及旅行统计数据项目。整体氛围是未来旅行与硬核户外探索的结合，具有高对比度的色调和逼真的阴天日光效果。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/21834/01.jpg","partial":false},{"id":10127,"c":"ThinkAI / YouTube 缩略图","t":"动漫视觉小说风格教室横幅","p":"一张宽幅动漫横幅插画，画面中央是 {argument name=\"character name\" default=\"Sayori\"} 站在明亮梦幻的教室中，采用精致的高端视觉小说风格渲染，光影柔和细腻，色调为温暖的柔粉色系，氛围闪耀动人。画面中是一位活泼的少女，留着蓬松的珊瑚粉色短发，层次感十足的波波头，右侧别着一个大红蝴蝶结；身穿日本校服，内搭白衬衫、红丝带领结和棕色针织背心，外罩浅棕色西装外套，下着海军蓝百褶裙。她站在画面偏左位置，双臂张开，姿态欢快且极具亲和力，仿佛在欢迎观众，发丝与衣物带有动态感。她的面部被一个扁平的肤色遮挡块刻意遮住。背景中，高大的教室窗户透出湛蓝的天空，白云朵朵，温暖的阳光倾泻而入。画面右半部分包含一行巨大的装饰性手写体文字 {argument name=\"headline text\" default=\"Sayori\"}，采用奶油白色字体，配以柔和的橙金色轮廓与光晕，完美融入剪贴簿风格的墙面背景中。场景周围装饰着挂在绳子上的照片，包括天空和向日葵照片，以及手绘的云朵、星星、爱心和太阳涂鸦。添加蓝色与黄色的纸星星、丝带、漂浮的纸屑、蓝色纸飞机、笔记本页面、螺旋装订素描本以及散落的文具元素。前景和边缘处点缀着醒目的向日葵，配以温暖的金色光斑和柔和的景深效果。整体构图充满活力、可爱、怀旧且令人心情愉悦，犹如高级动漫主题 YouTube 横幅或角色致敬页眉，细节丰富、画面整洁、时尚明亮且极具视觉冲击力。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/21868/01.jpg","partial":false},{"id":10128,"c":"ThinkAI / YouTube 缩略图","t":"夜间卧铺火车自拍缩略图","p":"创作一张 16:9 的 YouTube 缩略图风格照片级写实广角自拍，场景设定在夜间的卧铺火车车厢内。在右侧前景中，展示一名年轻男性，留着 {argument name=\"hair color\" default=\"浅金棕色\"} 的凌乱头发，身穿纯黑色 T 恤，佩戴一只黑色智能手表，手放在头顶，呈现出焦虑或惊讶的姿势；他的脸部被一个巨大的不透明垂直矩形遮挡，矩形呈温暖的中棕色，覆盖了从额头到下巴的整个面部区域。图像左半部分展示了一个紧凑型卧铺车厢的开放式门廊和窗户，配有米色木镶板、金属门框、明亮的白色室内照明、红色/橙色床铺或毯子、白色枕头以及铺位上的小型旅行用品。在火车左侧远处的平行轨道上，展示一列正在疾驰的红色 ÖBB 客运列车，带有动态模糊效果，车厢窗户发出亮光，清晰可见白色的“ÖBB”标志，背景为深色山脉，深蓝色夜空中挂着一轮明亮的满月。采用戏剧性的超广角透视，形成车厢暖光与室外冷色调的强烈对比，具有真实的镜头畸变，室内和人物细节清晰，仅在经过的列车和轨道上使用动态模糊，画面中不添加任何文字叠加，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/21615/01.jpg","partial":false},{"id":10129,"c":"ThinkAI / YouTube 缩略图","t":"日本 AI 工具对比缩略图","p":"目标：制作一张宽幅的日本社交媒体对比缩略图，介绍如何使用三款图像生成 AI 工具，采用简洁的科技信息图风格，并包含一位手持手机示例屏幕的演示者。\n\n画布：16:9 横向横幅，深海军蓝背景，带有微妙的圆点图案和细小的闪光点缀。在左上角和中心使用一个巨大的圆角白色标题面板，右侧留给演示者。明亮、高对比度、精致的 YouTube/X 缩略图风格，配有清晰的矢量文字、柔和的阴影、圆角卡片和光泽感的 3D 图标。\n\n主标题区域：在巨大的白色圆角矩形中，放置醒目的日语标题文本：{argument name=\"headline text\" default=\"画像生成AI 3ツール\\nどう使い分ける？\"}（图像生成 AI 3 款工具，如何区分使用？）。将“3ツール”放大并设为深蓝色，其余部分设为粗体黑色。在其下方，添加一个浅灰色圆角子框，包含两行文字：“全部最強！！”（全部最强！！）和“用途で分かれる時代に、それぞれの強みを整理。”（在按用途划分的时代，整理各自的优势。）\n\n顶部装饰图标：在标题面板右上角附近包含 2 个浮动的 3D 图标：1 个带有 5 个彩色颜料点的白色调色板，以及 1 个带有紫色-蓝色霓虹灯“AI”字母的圆角方形 AI 应用图标。\n\n对比部分：在左下/中部水平放置 3 张圆角白色工具卡片，每张卡片带有彩色边框、图标、标题和两行标签行。卡片 1 带有绿色边框和聊天气泡图标，标题为“GPT image 2”，标签“強み”（优势）对应文本“会話で細かく修正”（通过对话精细修改），标签“用途”对应文本“文字入り画像・図解”（带文字图像/图解）。卡片 2 带有黄色边框和星星图标，标题为“Nanobanana 2”，标签“強み”对应文本“日本語サムネ一発仕上げ”（日语缩略图一键完成），标签“用途”对应文本“SNS用サムネ・一貫キャラ”（SNS 缩略图/一致性角色）。卡片 3 带有紫色边框和简单的帆船线条图标，标题为“Midjourney”，标签“強み”对应文本“雰囲気重視のビジュアル”（注重氛围的视觉效果），标签“用途”对应文本“アート系・写実的ドラマ”（艺术系/写实戏剧）。标签使用绿色/黄色/紫色胶囊徽章，并保持所有日语文本粗体且易读。\n\n演示者和手机：在右侧，展示一位穿着修身白色 T 恤和黑色长裤、休闲装扮的肌肉型男性演示者，从头部到大腿进行裁剪，站在海军蓝背景前。他的脸部应刻意用一个纯肤色的矩形模糊/遮挡块遮住。他手中扇形展开拿着 3 部智能手机。手机 1 标注为“GPT image 2”，显示一张带有图表和日语文本的投资入门信息图；手机 2 标注为“Nanobanana 2”，显示一张带有人物和醒目黄色文本的日语晨间例行缩略图；手机 3 标注为“Midjourney”，显示一张带有山脉和戏剧性光影的电影感奇幻风景图。手机应略微重叠，并带有光泽感的黑色边框。\n\n底部横幅：在底部添加一个长圆角浅黄色横幅，左侧带有灯泡图标，并配有醒目的日语文本：{argument name=\"bottom message\" default=\"1つに絞らんでええ。3つ揃えて、プロの作業環境に。\"}（不必只选一个。集齐 3 个，打造专业工作环境。）。将“3つ揃えて”设为深蓝色并带有黄色下划线以示强调。\n\n视觉风格：日本创作者缩略图、现代信息图、简洁的圆角矩形、粗体排版、高可读性、深蓝/白/黄/绿/紫配色、卡片周围有微妙的发光效果，专业且友好。避免使用多余的卡片、多余的手机、水印或难以阅读的小字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/21585/01.jpg","partial":false},{"id":10130,"c":"ThinkAI / YouTube 缩略图","t":"爆款 YouTube 缩略图模板","p":"创建一个高点击率的 YouTube 缩略图。主体：{argument name=\"subject\" default=\"主要人物/物体/角色\"} 表情 / 动作：[强烈情绪、反应、动作、姿势] 构图：[特写 / 中景 / 远景] [主体位置] [摄像机角度] [前景/背景分离] 视觉层级：主要焦点应立即吸引对 [重要主体] 的关注，次要细节应在不造成杂乱的前提下辅助叙事。光影：{argument name=\"lighting\" default=\"电影级光影风格\"} [轮廓光 / 发光效果 / 戏剧性对比 / 柔光] 色彩分布：主色调：[ ] 点缀色：[ ] 主体与背景之间的高对比度。背景：[简洁易读的环境] 避免杂乱，仅用于辅助叙事。风格：[写实 / 动漫 / 电影感 / 水彩 / 风格化 / 等] 缩略图优化：在小尺寸下极具可读性、高对比度剪影、夸张的面部表情、干净的留白、极简的物体、强烈的视觉情感表达、高饱和度、焦点突出、专业的 YouTube 缩略图构图。长宽比：{argument name=\"aspect ratio\" default=\"16:9\"}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/21541/01.jpg","partial":false},{"id":10131,"c":"ThinkAI / YouTube 缩略图","t":"动漫足球传奇海报","p":"超精细动漫足球传奇海报，电影级体育插画， t=\"14:00\"}\"，并在其下方显示 \"{argument name=\"title\" default=\"咖啡馆约会☕\"}\"。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/21085/01.jpg","partial":false},{"id":10135,"c":"ThinkAI / YouTube 缩略图","t":"将照片转化为史诗级动漫电影海报","p":"使用上传的参考图像作为角色的面部特征参考。在整个艺术创作过程中，保持相同的面部结构、眼睛、鼻子、嘴唇、发型、美妆细节、肤色以及整体外观的一致性。\n创作一张超电影感的动漫海报，灵感源自 {argument name=\"anime style\" default=\"暗黑奇幻军事动漫\"} 美学，风格类似于 {argument name=\"reference title\" default=\"进击的巨人\"}，将照片级真实渲染与优质动漫风格化相结合。少女应呈现出饱经风霜却依然美丽的形象，带有细微的污渍、轻微的划痕、逼真的皮肤纹理、明亮且充满情感的眼睛，以及自然随风飘动的发丝。\n构图采用豪华电影海报的竖向布局。胸部以上的侧面姿势，仰望光线，表情坚定、充满情感且带有一丝希望。以极高的相似度保留参考图像中的面部特征。\n服装应采用细节丰富的战术军事风动漫制服，配有分层腰带、皮质背带、金属战斗装备、深色修身夹克、逼真的织物褶皱、风化纹理以及随风飘动的围巾。添加电影级的灰烬颗粒、烟雾、雾气、余烬以及浅景深效果，以营造氛围。\n背景应描绘一座饱受战争蹂躏的废墟城市，包含巨大的墙壁、破坏痕迹、漂浮的烟雾、远处使用立体机动装置的士兵，以及她身后隐没在云层中的巨大巨人剪影。环境应给人以史诗感、情感共鸣和宏大叙事的感觉。\n灯光应采用戏剧性的 {argument name=\"lighting time\" default=\"金色日落\"}，混合忧郁的阴影和柔和的轮廓光，照亮面部和头发。使用逼真的反射、电影级对比度、细腻的胶片颗粒以及高端的 Unreal Engine 渲染质量。\n包含优质的日式海报设计元素：\n左侧醒目的大号垂直日文排版，\n文字上方的军事徽章/标志，\n下方的小型情感引语，\n整洁的排版间距，\n细腻的画笔分割纹理，\n具有收藏价值的 IMAX 动漫海报美学。\n色调应结合烟熏炭色、温暖的琥珀色高光、柔和的红色以及电影级对比度。超精细、充满情感、大师级品质，超写实动漫与真人电影结合的风格，8K 电影级画质。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/21033/01.jpg","partial":false},{"id":10136,"c":"ThinkAI / YouTube 缩略图","t":"末日废土仙人掌战士","p":"创作一张 9:16 比例的电影级竖版动作海报：一位名为 {argument name=\"character name\" default=\"未命名仙人掌战士\"} 的凶猛女性末日战士站在现代废墟城市中央，采用低角度透视，背景是沙尘暴和破碎的建筑。她身穿紧身黑色皮革铠甲胸衣，领口深开，搭配黑色战术裤、腰带、收纳袋、绑带、深色金属肩甲和臂甲，腰间垂挂着破烂的黄色布片。她湿漉漉的深棕色头发在风中飞舞，但她的脸部被一个位于头部的微小不透明棕色矩形遮挡块刻意隐藏。她将一把巨大的金属带刺钉头锤向镜头猛力挥出，营造出极具冲击力的前景透视：钉头锤锤头巨大，因景深效果略显模糊，表面覆盖着金色尖刺、深色磨损金属、划痕，正面刻有仙人掌状浮雕。在她身后，一片巨大的仙人掌叶片从右下角向左上角斜向耸立，宛如一面狰狞的盾牌，呈现黄绿色且伤痕累累，上面布满了长长的白色尖刺和红色的仙人掌果实芽；碎片和火花在空中飞舞。在右上角背景中，加入一个巨大的幽灵般女性头部或头发剪影，部分隐没在仙人掌后，其面部被一个大型不透明棕色矩形遮挡块覆盖。总共使用 2 个遮挡矩形：1 个小方块遮住战士面部，1 个大方块遮住背景人物面部。整体氛围充满爆发力、硬核、超细节、暗黑奇幻科幻风格、照片级真实概念艺术、高对比度黄金时刻背光、体积烟雾、坠落的瓦砾、动态感、浅景深，无文字，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20889/01.jpg","partial":false},{"id":10137,"c":"ThinkAI / YouTube 缩略图","t":"Q 版旅行 Vlog 海报设计","p":"可爱的 Q 版旅行 Vlog 海报设计，包含 {argument name=\"characters\" default=\"可爱的迷你旅行者\"} 在世界著名城市中探险的场景，巨大的 3D 粗体 {argument name=\"city\" default=\"城市名称\"} 字体中填充了地标摄影和城市风光，卡哇伊风格的角色在字母周围坐着或行走，电影感旅行拼贴美学，光泽感旅行杂志封面设计，明亮的蓝天背景，充满活力的度假氛围，可收藏的明信片风格，超细节可爱动漫渲染，柔和光影，俏皮的构图，写实地标与风格化角色的融合，旅行印章，护照标记，手写旅行笔记，笔刷字体写着“{argument name=\"text\" default=\"TRAVEL LOG\"}”，简洁现代的图形布局，高分辨率旅游海报，奇趣的叙事感，色彩丰富的编辑设计，Instagram 旅行美学，精致的商业艺术作品，旅行剪贴簿元素，背着相机、地图和行李的迷你背包客，高度精细的纹理，可爱的比例，梦幻的度假心情，竖构图。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20487/01.jpg","partial":false},{"id":10138,"c":"ThinkAI / YouTube 缩略图","t":"日式泳池采访缩略图","p":"目标：制作一张逼真的日式 YouTube 综艺/采访风格缩略图，场景设定在户外公共游泳池，展示三位身穿竞技连体泳衣的成年女性在夏日阳光下的泳池甲板上。\n\n画布：16:9 宽屏图像，明亮的日光，高分辨率写实风格，带有略微过饱和的在线缩略图质感。顶部包含一个细长的电脑窗口标题栏，带有小型系统文字，营造出截图的视觉效果。\n\n主体：前景中站立着 3 位成年女性，为了保护隐私，她们的面部均经过模糊/马赛克处理。左侧女性：短黑发，身穿带有白色侧边装饰的藏青色运动连体泳衣，身体略微转向中心。中间女性：棕色扎发，身穿亮面灰褐色连体泳衣，一只手靠近胸前，站在绿色泳池垫上。右侧女性：高个子，齐肩黑发，身穿带有亮蓝色侧边和灰色细曲线的黑色连体泳衣，双手背在身后，面向中心。三位主体应呈现出采访时随意的交谈状态，而非时尚大片的摆拍姿势。\n\n背景：户外公共泳池设施，浅色混凝土甲板，绿松石色的游泳池，远处有许多游泳者和家庭，甲板周围摆放着蓝色交通锥，泳池上方有一座白色拱形人行桥，左侧为铁丝网围栏，茂密的绿树，蓝天白云，充满夏季活动氛围。\n\n文字内容：添加醒目的日式综艺节目缩略图文字。左上角标题分为两行：{argument name=\"top headline text\" default=\"フレッシュプール撮影会\"} 和 {argument name=\"subheadline text\" default=\"水着美女にインタビュー!!\"}。使用粗圆体日文字体，白色填充，黑色粗描边，并带有亮粉色/黄色的强调笔触。底部横跨下三分之一处的字幕：{argument name=\"bottom caption text\" default=\"『ちっぱい番付』に出ています\"}。底部字幕需非常醒目，采用白字粉边、黑色粗描边并带有轻微投影，以符合日本电视综艺的美学风格。\n\n视觉风格：写实摄影，广角纪录片构图，明亮的夏季色彩，清晰的泳池细节，强烈的缩略图对比度，趣味性的娱乐新闻设计。保持面部为矩形柔和马赛克模糊处理。除这 3 位女性外，前景不要添加额外人物，除泳衣上隐含的品牌标志外，不要添加任何其他 Logo 或水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20691/01.jpg","partial":false},{"id":10139,"c":"ThinkAI / YouTube 缩略图","t":"日式泳池采访缩略图","p":"目标：为公共户外泳池采访环节制作一张明亮的日式 YouTube 风格缩略图，画面中包含 {argument name=\"number of women\" default=\"三位\"} 身着竞技连体泳装的成年女性站在泳池边，她们的面部均经过柔和的矩形模糊处理。氛围阳光、休闲且具有纪录片感，仿佛是在夏季泳池活动中拍摄的。\n\n画布：16:9 横向图像，高分辨率，写实摄影风格，日光，色彩鲜艳，焦点清晰，略带广角透视。在最顶部添加一条细长的桌面窗口/标题栏，包含类似电脑截图的时间戳和位置的小字。\n\n布局：将三位女性置于前景，展示从头部到大腿上部或膝盖的全身像。左侧女性身穿带有白色侧边装饰的深蓝色竞速泳装，短发，黑色，身体微向中心转动。中间女性身穿亮面灰褐色竞速泳装，棕色头发扎起，一只手靠近胸前，仿佛正在接受采访。右侧女性较高，身穿带有亮蓝色侧板的黑色竞速泳装，齐肩黑发，双手背在身后，身体微向中心转动。为所有 3 个面部添加矩形马赛克模糊效果。\n\n背景：阳光明媚的一天，繁忙的户外市政泳池，有浅色混凝土甲板、蓝色泳池、游泳者、家庭、遮阳伞、树木、铁丝网围栏、横跨泳池的白色拱形人行桥以及多个蓝色安全锥。在中景处准确放置 4 个显眼的蓝色安全锥：一个在左侧甲板附近，一个在左中区域后方，一个在右中区域附近，另一个在更靠右的泳池边缘附近。\n\n文字内容：在左上角添加两行醒目的彩色日文标题：{argument name=\"top headline\" default=\"フレッシュプール撮影会\\n水着美女にインタビュー!!\"}。使用粗圆字体，白色填充，黑色描边，配以红/粉/黄装饰，呈现俏皮的综艺节目风格。在底部添加一行几乎横跨整个宽度的巨大字幕：{argument name=\"bottom caption\" default=\"『ちっぱい番付』に出ています\"}。底部文字设为白色带黑色描边，并在选定字符上使用粉色强调，以匹配日式综艺节目的字幕效果。\n\n视觉风格：超写实的夏季泳池摄影与日式电视节目缩略图图形相结合，明亮饱和的蓝色和绿色，强烈的阳光，清晰的皮肤高光，写实的泳装面料光泽，充满活力的构图。\n\n约束条件：所有女性必须表现为成年人，内容非色情，站姿自然，无裸露，无暗示性姿势，前景中不得有额外人员，必须保留 3 个模糊的面部以及 3 位主要的泳装采访对象。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20689/01.jpg","partial":false},{"id":10140,"c":"ThinkAI / YouTube 缩略图","t":"写实风格足球场球迷肖像","p":"请使用上传的女性参考图像作为身份和发型的核心锚点。该女性必须与参考图像中的成年女性完全一致，而非仅是相似。请高度优先保留其面部特征：相同的脸型、精致的下颌线、眼型与间距、鼻型、唇形、肤色、冷静而专注的表情，以及与原始参考图像完全相同的发型。请勿更改其发型。创作一张超写实的足球转播抓拍截图，画面内容为同一位女性在观众席观看足球比赛。她是 {argument name=\"team name\" default=\"拜仁慕尼黑\"} 的球迷，身穿 {argument name=\"jersey color\" default=\"红色\"} 的 {argument name=\"team name\" default=\"拜仁慕尼黑\"} 足球球衣。她眼神严肃且专注，仿佛正全神贯注地观看比赛。她手中拿着一条 {argument name=\"team name\" default=\"拜仁慕尼黑\"} 的手持毛巾。毛巾应呈现为官方球迷周边，配色为 {argument name=\"jersey color\" default=\"红色\"} 与白色，并带有明显的 {argument name=\"team name\" default=\"拜仁慕尼黑\"} 元素。将上传的 {argument name=\"opponent name\" default=\"巴黎\"} 对阵 {argument name=\"team name\" default=\"拜仁慕尼黑\"} 的比分图像放置在构图左上角，作为电视转播的叠加信息。比分图像应清晰可见，并自然地融入转播截图中。球场氛围需真实自然：包括足球观众、足球场灯光、现场电视转播视角、轻微的视频柔化感、背景中轻微的运动模糊、长焦镜头压缩感、真实的皮肤纹理、非刻意的抓拍构图，以及 16:9 的横向电视转播比例。请勿包含任何与棒球相关的元素。严禁出现棒球场、棒球场地、棒球球衣、棒球帽、棒球棒、加油棒、手套、棒球场布局、球员休息区或棒球记分牌。请勿使其面部变宽、变老、轮廓变锐利、过度西化、偶像化或大众化。请保持参考图像中细腻的个人特征，并将其自然地融入真实的足球场环境中。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20514/01.jpg","partial":false},{"id":10141,"c":"ThinkAI / YouTube 缩略图","t":"Seedance 提示词：\n\n创作一段 2.5D 动画，电影感","p":"创作一段 2.5D 动画，电影感正午光效，风格化写实，色彩鲜艳，体积光，景深，胶片颗粒，运动模糊，电影级运镜。\n\n🌊 尼科西亚蓝色泻湖：前 15 秒\n\n🎬 镜头 1：城市全景\n\n阳光明媚的塞浦路斯尼科西亚","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20541/01.jpg","partial":false},{"id":10142,"c":"ThinkAI / YouTube 缩略图","t":"3D 丛林探险海报","p":"一张色彩极其丰富且充满冒险气息的竖版海报，洋溢着热带丛林的活力。画面中心是一位勇敢的 3D {argument name=\"character\" default=\"卡通探险家角色\"} —— 一个有着大圆脑袋的快乐小男孩，戴着亮橙色的探险帽，背着青柠绿的背包，穿着厚实的黄色靴子，自信地高举双臂，兴奋不已。环绕在他周围的是一系列巨大的 3D 丛林元素：十种深浅不一的翠绿与青柠色光泽热带巨叶，玫红、洋红与电光紫色的巨大异域花卉，栖息在糖果色粗藤蔓上、色彩斑斓的 3D 大鹦鹉（红色、黄色与钴蓝色），以及一只从巨叶后俏皮探出头、橙色毛发配黑色条纹的可爱卡通幼虎。背景中，一道闪烁的绿松石色瀑布倾泻而下，折射出彩虹般的光芒。天空呈现出从电光蓝到暖金黄的鲜艳渐变色，彩虹色全息蝴蝶在画面中翩翩起舞。顶部是粗体圆润的文字 \"{argument name=\"main text\" default=\"GO WILD\"}\"，采用从热粉色到明黄色的巨大渐变色字体；下方是较小的趣味副标题 \"{argument name=\"subtitle\" default=\"Adventure is out there · Go find it\"}\"。整体采用超饱和的热带色彩，呈现高级 3D 插画质感，比例为 9:16 竖屏。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20194/01.jpg","partial":false},{"id":10143,"c":"ThinkAI / YouTube 缩略图","t":"水镜幻梦少女","p":"创作一张竖构图的奇幻动漫插画，描绘 {argument name=\"character name\" default=\"水镜少女 Suikyo\"} 赤脚站在月光下如镜面般完美的湖面上，背景是深蓝色的星空和明亮的银河。她是一位优雅的年轻女性，拥有 {argument name=\"hair color\" default=\"极长的飘逸银蓝色秀发\"}，以四分之三背影示人，她的头发和半透明丝带仿佛被柔和的夜风吹拂，向右侧戏剧性地飘动；保持面部柔和模糊或背对镜头，不要有清晰的面部细节。为她穿上一件空灵的 {argument name=\"dress color\" default=\"淡冰蓝色\"} 高级奇幻礼服，礼服由多层透明雪纺制成，饰有水晶珠饰、银色刺绣、雪花装饰、肩带、高侧开叉，以及像玻璃花瓣一样铺展在水面上的长拖尾。添加精致的花卉和水晶发饰、小脚链、闪烁的水滴以及织物上微小的星状高光。水面应清晰地倒映出她的全身和礼服，脚下有圆形的涟漪和星辰的明亮倒影。在左侧，加入一个由银色树枝、冰和水晶组成的巨大华丽新月环结构，部分框住人物；旁边悬挂着竖排日文 {argument name=\"vertical text\" default=\"水镜\"}，并配有一个小巧的悬垂水晶装饰。场景周围环绕着发光的蝴蝶、前景角落的白蓝色莲花、微小的萤火虫光点、散落的雪花图案和魔法粒子。背景：宁静的地平线，远处的山脉，地平线附近有柔和的暮光，上方是深钴蓝色的夜空，密集的星群和星云。视觉风格：超精细的日式奇幻主视觉图，发光水彩与数字绘画的融合，柔和的辉光照明，冷蓝紫色调，精致的线条，梦幻的氛围，高细节，优雅的构图，无水印，无现代物体，除竖排日文字符外无其他可读文本。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20414/01.jpg","partial":false},{"id":10144,"c":"ThinkAI / YouTube 缩略图","t":"电影感 Kodak 胶片海报","p":"采用电影级画质、Kodak 胶片风格、略微降低饱和度、高动态范围以及逼真的对比度。\n\n镜头：{argument name=\"lens\" default=\"85mm 镜头\"}，{argument name=\"aperture\" default=\"f/1.8 光圈\"}，浅景深，RAW 格式照片级真实感，细节丰富。\n\n生成一张以 {argument name=\"character name\" default=\"角色名称\"} 为主角的电影角色海报。\n\n这既是一张角色海报，也是其故事的缩影。\n\n角色面部的大型优雅侧影占据画面的一半，带有透视感和动感，营造出略微广角镜头的视觉效果。\n\n角色的外观和服装与原始角色设计相符。\n\n皮肤毛孔清晰。解剖结构正确。手指自然放松。不戴手套。\n\n面部和服装特征也应根据原始设计进行调整，包括手中持有的武器，以及与角色设计一致的表情和姿势，生成 9:16 的海报图像。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/20005/01.jpg","partial":false},{"id":10145,"c":"ThinkAI / YouTube 缩略图","t":"匿名深夜电台玩偶主播","p":"创建一个垂直构图的电影级写实深夜电台直播间场景。一位逼真的球形关节女性玩偶主播，留着短款 {argument name=\"hair color\" default=\"深棕色\"} 波波头和直刘海，坐在黑色皮椅上，面前是木质广播台，佩戴着大型头戴式耳机，身穿一件带有细微闪光效果的黑色短袖连衣裙，搭配精致的项链和手链；她的脸部被一个居中的 {argument name=\"face cover color\" default=\"深棕色\"} 长方形色块刻意遮挡，呈现出匿名状态。在她的嘴部正前方放置一个带有防震架和悬臂支架的大型专业电容麦克风，前景处放置一个带有发光彩色按钮的调音台。画面中需包含 6 个显眼的桌面/工作室道具：一个红色的“ON AIR”发光标牌、一个显示为“20:03:15”的数字时钟、一个印有“Night Radio”字样的白色马克杯、一个透明塑料水瓶、带有钢笔的手写笔记，以及一小叠纸张或笔记本。工作室内部应营造出狭窄、温暖且富有氛围感的感觉，墙上贴有海报和通知，左上角挂着一个模拟时钟，右侧边缘有 CD 或唱片架，抛光的木质表面上有倒影。透过她身后的巨大窗户，展示一个下雨的 {argument name=\"city\" default=\"东京\"} 夜晚街道，地面湿润，交通灯光模糊，高层办公楼窗户灯火通明，并可见垂直的日式霓虹灯招牌，包括蓝色的卡拉 OK 招牌。使用情绪化的低调照明，室内温暖的钨丝灯高光与室外冷色调的城市灯光形成对比，采用浅景深效果，呈现逼真的玻璃反射和高细节纹理，营造出一种主播正在阅读听众来信的私密深夜广播氛围。添加可选的日语广播节目情绪文字内容：{argument name=\"quote\" default=\"次のお便りは異教徒さんから〜\"}。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/19916/01.jpg","partial":false},{"id":10146,"c":"ThinkAI / YouTube 缩略图","t":"日文短视频片尾变体","p":"{\"type\":\"三种变体的竖屏短视频片尾故事板 / 片尾设计图\",\"canvas\":{\"overall\":\"包含三张并排的竖屏手机格式卡片的宽幅对比图，背景为浅灰色点阵\",\"each_card_size\":\"9:16 竖屏，576 x 1024，白色背景\",\"top_caption\":\"每张卡片上方均有一个灰色小标题，显示 ChatGPT Image 2 (Low) 和 576 x 1024。\"},\"style\":{\"visual_style\":\"适用于新闻或评论类短视频的简洁日式流行平面设计，明亮友好，扁平化矢量排版，留白充足\",\"palette\":\"天蓝色、白色、柠檬黄、黑色、浅灰色点缀\",\"typography\":\"蓝色大号粗体倾斜日文标题，圆体无衬线辅助文字，趣味对话气泡形状及点阵装饰\",\"branding\":\"每张卡片底部附近标注 Produced by SLAP®\"},\"shared_main_headline\":{\"text\":\"{argument name=\\\"main headline text\\\" default=\\\"今日のニュース話していい?\\\"}\",\"position\":\"每张竖屏卡片的上半部分\",\"appearance\":\"位于蓝色细线对话气泡内或与其重叠的大号动态蓝色日文文本，略微倾斜，配有黄色虚线和黄色小爆发点\"},\"layout\":{\"variant_count\":3,\"variants\":[{\"title\":\"变体 1：互动图标片尾\",\"position\":\"左侧卡片\",\"elements_count\":6,\"elements\":[\"上方居中的大标题\",\"蓝色圆角横幅，文字为 {argument name=\\\"thank you banner text\\\" default=\\\"最後までご視聴ありがとうございました！\\\"}\",\"一行三个蓝色社交图标：点赞图标标注“いいね”，评论气泡标注“コメント”，分享箭头标注“シェア”\",\"蓝色水平虚线分割线\",\"Produced by 文字位于大号黑色 SLAP® Logo 上方\",\"角落装饰：蓝色/黄色圆角斜条、圆点、小圆形点缀及微型爆发点\"],\"bottom_badge\":\"左下角小型深色圆角 9:16 标签\"},{\"title\":\"变体 2：带蓝色波浪底部的订阅引导片尾\",\"position\":\"中间卡片\",\"elements_count\":6,\"elements\":[\"上方居中的大标题\",\"居中黑色信息：{argument name=\\\"viewer thanks text\\\" default=\\\"ご視聴いただきありがとうございました！\\\"}\",\"黄色胶囊状行动号召按钮，蓝色文字：{argument name=\\\"call to action text\\\" default=\\\"チャンネル登録＆高評価お願いします！\\\"}\",\"底部带有大号弧形蓝色波浪，上方配有细黄色弧线\",\"蓝色波浪内包含白色 Produced by 文字及大号白色 SLAP® Logo\",\"底部区域周围装饰有小型三角形、圆形、点阵网格及蓝色放射状标记\"],\"bottom_badge\":\"左下角小型深色圆角 9:16 标签\"},{\"title\":\"变体 3：活力订阅/分享片尾\",\"position\":\"右侧卡片\",\"elements_count\":7,\"elements\":[\"上方居中的大标题，边缘带有蓝色放射状速度线\",\"居中加粗黑色信息：{argument name=\\\"closing thanks text\\\" default=\\\"ご視聴ありがとうございました！\\\"}\",\"蓝色水平行动号召栏，包含三个部分：点赞图标“高評価”、播放按钮图标“チャンネル登録”、分享箭头“シェア”\",\"下方居中黑色文字：よろしくお願いします！\",\"Produced by 文字位于灰色/黑色 SLAP® Logo 上方\",\"散落的蓝色和黄色闪光、圆形、菱形及圆点装饰\",\"边框周围的对角线运动线条，营造出庆祝般的爆发效果\"],\"bottom_badge\":\"左下角小型深色圆角 9:16 标签\"}]},\"composition_notes\":\"生成一张横向图片，展示所有三款 9:16 片尾设计，从左到右均匀排列，中间留有窄缝，如同设计对比预览。保持日文文本清晰易读，维持强烈的蓝/黄品牌一致性，并确保卡片呈现出可直接用于短视频片尾的效果。\"}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/19896/01.jpg","partial":false}],"total":50,"page":1,"limit":36,"pages":2,"source":"prebuilt-bootstrap-category-full"},"ThinkAI / 漫画 / 故事板":{"prompts":[{"id":10161,"c":"ThinkAI / 漫画 / 故事板","t":"动漫武术对决","p":"一幅极具动态感的动漫插画，描绘了两名少女在传统木质道场内进行激烈武术对决的场景。在前景中，一名留着 {argument name=\"character 1 hair\" default=\"黑色高丸子头配红色丝带\"} 的少女摆出强有力的低位武术架势，正奋力挥拳。她身穿 {argument name=\"character 1 outfit\" default=\"带有红色流苏的白色中式上衣和红色宽松长裤\"}，强烈的红色能量斩击环绕着她挥动的四肢。在右侧半空中，一名留着 {argument name=\"character 2 hair\" default=\"浅紫色双丸子头\"} 的少女优雅地跃起，自信地微笑着，身穿 {argument name=\"character 2 outfit\" default=\"带有金色刺绣的深绿色连衣裙和黑色紧身裤\"}，伴随着扫过的蓝色水流状能量轨迹。背景是质朴的木质寺庙内部，上方悬挂着一块写有“{argument name=\"sign text\" default=\"武術会\"}”的醒目招牌。场景充满了爆发性的动作感，飞扬的尘土、破碎的木质地板、发光的彩色粒子特效，以及将角色与精细背景完美区分开来的戏剧性低角度光影。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/13467/01.jpg","partial":false},{"id":10162,"c":"ThinkAI / 漫画 / 故事板","t":"风格化 3D 卡通艺术项目","p":"创建一系列四个垂直 2:3 超高清风格化 3D {argument name=\"style\" default=\"cartoon\"} 编辑级渲染图。采用精致的玩具质感角色外观、光滑的哑光皮肤、富有表现力的大眼睛、清晰的轮廓、带有真实投影的柔和摄影棚灯光、细腻的背景颗粒感以及强烈的单色艺术指导。保持每张图像简洁、高级且与背景清晰分离，无文字、无水印、无 Logo。\n\n图像 1：一位风格化卡通女性，身穿修身罗纹蓝色吊带裙，短棕色乱发上架着一副红色太阳镜，脚穿红色蝴蝶结高跟凉鞋，以俏皮的弯曲姿势交叉双腿，站在纯色鲜艳的红色哑光摄影棚墙前。侧光在红色背景上投射出清晰的阴影。\n\n图像 2：一位开朗的风格化卡通女性，全绿旅行造型，黑色头发扎成两个麻花辫，戴着绿色鸭舌帽，无袖绿色短款上衣，宽松的绿色束脚裤，白色运动鞋，一根手指轻触嘴唇，手握一个亮面绿色硬壳行李箱的拉杆。纯绿色摄影棚背景，全身照，平视视角。\n\n图像 3：一个温馨的居中场景，两个风格化卡通角色坐在深红色房间的红色沙发上。左侧的女性裹着质感红色毯子，赤脚，表情平静，双眼向上看。右侧的男性裹着橙色质感毯子，穿着袜子，表情中性温和，向上凝视。采用平衡的对称构图，针织面料质感，温暖怀旧的灯光，以及布艺质感的红色墙面。\n\n图像 4：一位红发风格化卡通女孩站在温暖米色房间的挂墙镜前。展示她的背影，极长的亮面红发垂在背上，镜中倒映出她担忧的小脸、蓝色眼睛、红色服装以及柔和的焦虑表情。侧面柔和的阳光，干净的地板，简单的镜框，充满情感的故事书氛围。\n\n全局质量：8K，超高清，高细节 3D 渲染，逼真的柔和阴影，极致清晰度，边缘锐利，无噪点，无压缩，高级编辑级构图，色块背景，电影感但极简。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23610/01.jpg","partial":false},{"id":10163,"c":"ThinkAI / 漫画 / 故事板","t":"精灵与机器人木偶剧剧照","p":"目标：创作一张温馨的日本儿童电视木偶剧剧照，展示一个名为 {argument name=\"show title\" default=\"エルフィと機械の花畑\"} 的木偶风格奇幻场景，营造柔和的绘本氛围，并带有可见的电视广播图形。\n\n画布：4:3 横屏画幅，温暖的电影感光效，浅景深，细节丰富的手工微缩模型布景。\n\n主场景：乡村小屋的厨房内部，墙壁为粘土抹灰，带有外露的木梁；左侧有一扇木窗，望向明亮的黄色花田和蓝天；背景是搁板和悬挂的香草，前景是一张小木桌。两个木偶角色坐在桌旁喝茶：1) 左侧是一个精致的精灵女孩木偶，有着淡薄荷白色的波波头、长尖耳、简单的奶油色亚麻连衣裙、纤细的木制木偶手臂，上方可见悬挂的细线；她的面部区域被柔和地模糊/遮挡，仿佛经过了匿名处理。2) 右侧是一个大型类人机器人木偶，由深色铆接金属板制成，露出电缆、红色镜头眼睛、厚重的肩甲、有关节的手部，并可见木偶操纵杆/细线。精灵双手捧着一个小杯子；机器人举起一只手，仿佛正在说话。桌上必须包含 4 个可见的食物和茶具：一个带有蓝色花纹的白色茶壶、精灵手中的一个小杯子、一盘糕点，以及茶壶下方的一块长方形布料或托盘。\n\n广播叠加布局：添加 5 个图形/文字区域：1) 左上角显示 {argument name=\"broadcast time\" default=\"7:32\"} 的数字时钟，使用白色大号描边数字；2) 时钟下方是一张小型羊皮纸天气卡片，带有日文「人形の国」和「きょうの天気」以及红色太阳图标；3) 右上角是色彩鲜艳的节目 Logo，显示 {argument name=\"program logo\" default=\"ぬくもり キッズシアター\"}，带有花朵和圆润俏皮的字体；4) 左下角是一个大型木制招牌标题，装饰有花朵和藤蔓，写着「エルフィと機械の花畑」及副标题「〜やさしさがつなぐ未来〜」；5) 右下角是一个木制“下一集”方框，写着「▶つぎのおはなし」和「『とべない小鳥と風の魔法』」。\n\n底部附加文字：在画面最底部，添加白色日文标语 {argument name=\"tagline\" default=\"やさしい心は、どんな未来も変えていける。\"}。在右下角底部边缘上方，添加赞助商文字「＜提供＞」、「木のおもちゃ工房」和「ひだまりの森」，并配以小花装饰。\n\n视觉风格：超精细的定格动画木偶戏与奇幻微缩摄影相结合，温暖的琥珀色室内光，怀旧的 NHK 风格儿童晨间节目，精致的 gpt-image-2 真实感，触感真实的木材、布料、金属和纸张纹理。保持所有木偶细线清晰可见且纤细。窗户周围使用柔和的辉光，小屋内呈现温馨的阴影。\n\n约束条件：使用 2 个坐着的角色，5 个广播图形/文字区域，以及 4 个如上所述的桌上物品。保持场景温馨柔和，除了描述的虚构电视图形外，不要添加额外的 Logo，不要出现现代电器，不要有水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23673/01.jpg","partial":false},{"id":10164,"c":"ThinkAI / 漫画 / 故事板","t":"Kai 工业泰坦项目","p":"目标：为以 {argument name=\"character name\" default=\"Kai\"} 为主角的动作奇幻蒸汽朋克序列创建一个黑暗电影级项目/联系表，延续上一个最终画面且不重置：保持相同的风暴炼油厂环境、相同的光照、相同的角色位置和服装连贯性。\n\n画布：宽屏 16:9 项目表，约 1200×675，黑色背景，带有细黑色装订线。将 12 个宽屏面板精确排列为 4 列 3 行的网格。每个面板上方为电影画面，下方为黑色标题条，配有小型紧凑的白色大写字体，包括编号镜头标题和两行简短描述。\n\n视觉风格：粗砺的高细节概念艺术，黑暗柴油朋克/蒸汽朋克工业奇幻，充满灰烬的天空，棕黑色金属色调，橙色能量电池光芒，闪电般的能量弧，烟雾、灰尘、火花，废弃的炼油厂塔楼，巨大的机械，坍塌的平台，戏剧性的低调光影，动态摄像机角度，电影项目呈现。\n\n主角细节：Kai 是一位留着尖刺发型的年轻男性战士，穿着破旧的层叠战术服装：深色斗篷、绑带、皮甲、金属护手、工具腰带，随风飘动的围巾或外套下摆，脸上沾满煤烟和污垢，表情坚毅。他携带或激活了一个带有橙色核心能量的发光圆柱形能量电池。在所有面板中保持其形象一致。\n\n项目布局和文本内容：包含 12 个离散面板，并带有以下标签和可见描述：\n\n01. 延续 - 最终画面定格\nKai 站在炼油厂塔顶，R 型能量电池已激活。\n风暴云聚集。风势增强。\n\n02. Kai 特写\n能量电池发出更亮的光芒。\n表面出现裂纹。压力符号亮起。\n\n03. 极度微距\n机械接缝打开。\n能量泄漏。电弧跳动。\n\n04. 环境广角\n远处的炼油厂塔楼逐一激活。\n工业灯光在地平线上点亮。\n\n05. 低角度\n巨大的烟囱喷发，压力阀释放蒸汽。\n古老的机械苏醒。\n\n06. 中景镜头\nKai 抵御冲击波。\n外套和绑带剧烈飘动。\n\n07. 动态镜头\nKai 脚下的平台开始坍塌。\n金属裂缝蔓延。\n\n08. 英雄之跃\nKai 从坍塌的塔楼跳下。\n宏大的比例。身后是工业城市。\n\n09. 跟随镜头\nKai 落在移动的起重机臂上。\n碎片穿过画面坠落。\n\n10. 广角揭示\n地面喷发。\n一个巨大的工业打捞自动机出现。\n\n11. 极广角\nKai 显得非常渺小。\n自动机耸立在炼油厂废墟之上。\n\n12. 最终标志性镜头\nKai 举起气动切割机。\n能量电池的能量流经武器。\n泰坦完全苏醒。\n沙尘暴吞没了炼油厂城市。\n\n镜头特定意象：面板 1 展示了 Kai 在高处圆形栏杆上的背影，俯瞰广阔的工业荒原，手中拿着一个小小的橙色发光圆柱体。面板 2 是他戴着手套的手拿着发光能量电池靠近脸部的特写，一个柔和模糊的垂直矩形遮挡了部分面部区域。面板 3 是金属机器表面的极度特写，上面标有巨大的 R 字样，带有橙色发光的裂纹和电弧。面板 4 展示了广阔的炼油厂天际线，许多塔楼亮起。面板 5 使用低角度拍摄喷出蒸汽和火焰的烟囱。面板 6 展示了 Kai 在碎片飞溅中抵御猛烈冲击。面板 7 展示了坍塌的钢制平台和断裂梁架中渺小的 Kai。面板 8 展示了 Kai 在半空中跳跃，周围是破碎的碎片。面板 9 跟踪他蹲在起重机臂上，周围是链条和坠落的瓦砾。面板 10 揭示了一个巨大的圆形机械自动机头部或躯干从尘土中升起，橙色核心发光。面板 11 是 Kai 在桥上面对高耸自动机的极广角剪影。面板 12 是英雄般的结局，Kai 站在前景，橙色能量通过他举起的武器发光，身后是巨大的机器和炼油厂的混乱。\n\n约束条件：使用 12 个面板，使用列出的标题，不添加额外面板，无徽标或水印。在整个过程中保持角色、环境、风暴光影、橙色能量主题和黑色项目标题条的一致性。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23698/01.jpg","partial":false},{"id":10165,"c":"ThinkAI / 漫画 / 故事板","t":"梦幻天空之城艺术演变三联画","p":"目标：创作一幅宽幅横向三联画，展示同一奇幻天空王国场景在三个渐进艺术阶段的渲染效果，如同从草图到成品插画的概念艺术演变过程。\n\n画布：超宽 3 面板图像，比例约为 2:1，精确划分为 3 个相等的垂直面板，面板边缘外无可见边框。\n\n布局：每个面板均以戏剧性的低角度倾斜视角展示相同的构图：一位年轻的奇幻骑士站在下方的石桥或阶梯前景中，面向观众，身披或被一件在风中向左飘动的淡薄荷色长斗篷环绕。骑士身后是一座悬浮在明亮蓝天中的宏伟浮空城堡城市，缆绳、石柱、废墟、绿植和云朵营造出强烈的深度感和动感线条。\n\n面板数量及描述：使用精确的 3 个面板。面板 1（左）：松散的粗略概念草图，带有淡蓝色天空底色、可见的辅助线、潦草的黑色铅笔笔触、未完成的建筑、运动轨迹和极简的柔和色彩。面板 2（中）：干净的动漫风格彩色插画，具有强烈的墨线勾勒、赛璐珞风格的盔甲、饱和的蓝天、蓬松的云朵、绿色露台、石桥细节以及远处的浮空城堡。面板 3（右）：高度精细的最终奇幻插画，带有闪烁的阳光、密集的建筑细节、鲜艳的蓝天、明亮的白云、郁郁葱葱的藤蔓和树木、发光的高光、油画质感的渲染以及电影级的清晰度。\n\n主体细节：前景角色为 {argument name=\"character type\" default=\"一位年轻的金发奇幻骑士\"}，身穿带有皮革绑带、靴子和手套的华丽金银盔甲，披着一件巨大的飘逸淡薄荷白色斗篷。面部可以柔和简化或遮挡，但身体应以英雄姿态面向前方，斗篷在场景中戏剧性地扫过。确保角色在所有 3 个面板中位置保持一致：下部中央前景，右侧面板中略大，服装和姿势相同。\n\n环境细节：场景为 {argument name=\"fantasy location\" default=\"云端之上的浮空城堡城市\"}。包括悬浮的石台、雕刻的柱子、桥栏杆、横跨天空的悬挂缆绳或绳索、古代废墟碎片、草地、常春藤、树木和大量白云。背景中的城堡应高耸、华丽、垂直且明亮，塔楼和露台向上堆叠。\n\n视觉风格：日式奇幻动漫概念艺术，动态视角，风吹动感，冒险氛围，明亮的天空色调。主色调为 {argument name=\"main color palette\" default=\"天蓝色、云白色、淡薄荷色、石灰色、金色和清新绿色\"}。右侧面板应具有魔法感并面向镜头，带有闪烁的高光和精致的细节，而左侧面板则保持明显的未完成感。\n\n约束条件：无标题，无 Logo，无水印，无文字覆盖。保持同一场景的 3 个垂直阶段。强调从粗略草图到干净配色再到最终精美奇幻关键艺术的演变过程。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23680/01.jpg","partial":false},{"id":10166,"c":"ThinkAI / 漫画 / 故事板","t":"蒸汽朋克风格：双手持旧照片","p":"以 REFERENCE_0 作为构图和摄像机位置的参考，将草图转化为电影质感的蒸汽朋克场景：前景中两只黄铜机械手以参考图所示的角度和位置，持有一张磨损的棕褐色旧照片。外部场景设定在复古火车车厢内，配有深色皮革座椅、温暖的木质装饰、左侧窗户以及充满氛围感的琥珀色灯光。照片内部展示发条修理店前的古董街道场景：包含 2 个主要主体，分别为一名面部模糊/被遮挡的跪地成年发明家，以及站在其身旁的一个小型圆体机器人。添加旧照片细节，包括折痕、磨损的边角、泛黄的边缘以及褪色的单色棕色调。保持整体外观的写实感、电影感、细节丰富且富有怀旧气息，照片外部采用浅景深效果。可自定义细节：{argument name=\"outer setting\" default=\"复古火车车厢\"}, {argument name=\"photo subject setting\" default=\"发条修理店街道\"}, {argument name=\"main human role\" default=\"成年发明家\"}, {argument name=\"companion character\" default=\"小型圆体机器人\"}, {argument name=\"color mood\" default=\"温暖的蒸汽朋克棕褐色\"}。约束条件：保留双手框住倾斜矩形照片的参考构图；包含 2 只可见的机械手持 1 张照片；照片内包含 2 个主要人物；避免出现现代物品、简洁的数字 UI 或除商店招牌以外的额外文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23671/01.jpg","partial":false},{"id":10167,"c":"ThinkAI / 漫画 / 故事板","t":"烛光下的皇家舞会情侣","p":"创建一个电影级超精细的奇幻舞会场景，主题为 {argument name=\"theme\" default=\"舞会\"}：一对皇室情侣在富丽堂皇的烛光宫殿舞池中央挽手站立，全身像。女子身穿闪烁的银灰色刺绣舞裙，裙摆宽大及地，长袖修身，领口低调优雅，佩戴精致珠宝，身后拖着飘逸的斗篷式裙摆；她金色的卷发盘成精致的发髻。男子身材高大，留着黑色长卷发，身穿华丽的白色礼仪军装，配有金色刺绣、金链、勋章、高领、修身长裤、白色长靴，肩披白色斗篷，腰间佩戴装饰性长剑。他们的面部被简洁的浅棕色长方形面具遮挡，没有任何五官特征。周围环绕着 8 位清晰可见的背景宾客，他们身着奢华的深色金属质感礼服和宫廷服饰，可见的面部同样被长方形面具遮挡。舞厅宏伟壮观，呈现巴洛克风格，拥有高耸的镀金墙壁、蓝金相间的帷幔、装裱的肖像画、水晶吊灯、众多闪烁的蜡烛，以及倒映着情侣和烛光的黑白相间大理石地面。采用温暖的金色光影、深邃的阴影、丰富的纹理、写实的织物刺绣、闪耀的珠饰、电影级的景深效果、对称构图、竖向肖像画幅，以及高级时装历史奇幻写实风格。避免出现现代物品、可读文字、标志或水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23676/01.jpg","partial":false},{"id":10168,"c":"ThinkAI / 漫画 / 故事板","t":"好莱坞间谍惊悚片角色项目","p":"一个具有电影感的好莱坞 {argument name=\"genre\" default=\"spy-thriller\"} 角色项目，主角是一位时尚的 {argument name=\"character\" default=\"male protagonist\"}，留着精致的修剪胡须，身着定制奢华西装，配备精英特工装备。场景设定在 {argument name=\"locations\" default=\"伦敦屋顶、巴黎街道、摩纳哥赌场和私人飞机\"}。包含全身角色转面图，并配有展现决心、细微伤疤和电影级自信的特写肖像。奢华间谍美学，写实的服装细节拆解，大片级动作电影呈现。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23586/01.jpg","partial":false},{"id":10169,"c":"ThinkAI / 漫画 / 故事板","t":"写实真人版 Rikku 肖像","p":"写实真人风格的 {argument name=\"character\" default=\"《最终幻想 X》中的 Rikku\"}，一位年轻女性，留着 {argument name=\"hair color\" default=\"金色\"} 头发，扎着凌乱的高马尾，编有发辫并装饰着珠子，拥有绿色眼睛，身穿黄橙色无袖上衣、绿色短裤，佩戴带有小包的工具腰带。她正向前伸出手，手中拿着一个带有金色细节的发光蓝色机械球体。动态动作姿势，头发和围巾带有动态模糊效果，魔法粒子和发光的蓝色能量在她周围盘旋。明亮的白色背景，漂浮着机械零件。左侧有优雅的金色文字","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23627/01.jpg","partial":false},{"id":10170,"c":"ThinkAI / 漫画 / 故事板","t":"Kiki 动漫角色设定集","p":"目标：为 {argument name=\"character name\" default=\"KIKI\"} 创建一份超详细的动漫角色设计表 / 官方参考项目，她是一位拥有梦幻探险家主题的可爱 Y2K 水手风女孩。\n\n画布：宽幅 16:9 横向角色设定表，采用暖米白色纸张背景，整洁的杂志参考排版，细海军蓝分割线，零星点缀着微小的粉色星星涂鸦。采用精致的日系动漫插画风格，柔和的配色，清晰的线条，柔和的赛璐珞阴影，高度细致的配饰，以及专业的角色设定集呈现方式。\n\n主角：一位 16 岁的开朗女孩，拥有 {argument name=\"hair color\" default=\"深海军蓝\"} 的长而蓬松的卷发，闪烁的紫色大眼睛，桃粉色肌肤，表情俏皮好奇。她的标志性造型包括：巨大的粉色星星发夹、粉色丝带蝴蝶结、星星耳环、叠戴项链（含月亮吊坠）、覆盖着可爱贴纸和涂鸦的超大号米色水手夹克、带有大粉色蝴蝶结的紫色水手领上衣、紫色短款背带裙/短裤、挂饰链条、膝盖绷带、厚底马卡龙色运动鞋、蓬松的堆堆袜，以及一个亮粉色猫咪造型斜挎包。\n\n排版与具体元素：在最左侧，放置一个巨大的海军蓝标题，内容为 {argument name=\"character name\" default=\"KIKI\"}。下方包含三个文本块：角色：梦想家 / 探险家；年龄：16；性格：好奇、俏皮、有点笨拙、充满好奇心。添加一个“视觉特征”板块，列出：星星发夹、超大号水手夹克、月亮吊坠、猫咪包。中左侧应展示一张 Kiki 的全身主视觉姿势，她面带微笑，手指轻触脸颊，穿着全套服装并背着猫咪包。在中上部，展示四个较小的全身三视图，分别标注为 FRONT（正面）、SIDE（侧面）、BACK（背面）和 3/4 VIEW（四分之三侧面）。在右上角，展示一张 Kiki 的大头半身像，表情惊讶或沉思，旁边用粉色手写体标注引语 {argument name=\"quote\" default=\"The stars are closer than you think.\"}。\n\n表情：在左下角，包含四个 2x2 排列的小型方形表情头像，每个头像展示 Kiki 的头部和肩部，呈现不同情绪：开朗张嘴笑、眨眼俏皮笑、柔和好奇、害羞惊讶。该区域标注为 EXPRESSIONS。\n\n剪影与配色方案：在下中位置，包含一个 SILHOUETTES（剪影）区域，展示三个深海军蓝全身剪影：直立正面姿势、行走侧面姿势、以及背着猫咪包的俏皮姿势。旁边包含一个 COLOR PALETTE（配色方案）区域，由 3x3 网格排列的九个椭圆形色块组成：粉色、薰衣草紫、紫色、长春花蓝、桃奶油色、浅桃色、深海军蓝、紫玫瑰色和珊瑚粉。\n\n细节研究：在右下中心位置，创建一个 DETAIL STUDIES（细节研究）栏，包含五个裁剪面板和说明：HAIR（头发），柔和蓬松的卷发及碎发；STAR CLIP（星星发夹），标志性配饰；JACKET PATCHES（夹克贴片），贴纸、徽章和涂鸦的集合；CAT BAG（猫咪包），旧但心爱，装载着她的宝藏；SHOES（鞋子），厚底、舒适，因探险而略有磨损。\n\n道具与配饰：在最右侧，创建一个 PROPS & ACCESSORIES（道具与配饰）区域，包含七个物品：带翅膀的星星魔杖笔、粉色毛绒猫咪、一本贴满贴纸的笔记本、一支蓝色小笔、一个粉色星星粉饼盒、粉色猫咪斜挎包，以及一个带有月亮/星星/猫咪图案的挂件。\n\n约束：保持项目整体协调、信息密集且易于阅读。主要使用海军蓝、薰衣草紫、粉色、米色和桃色调。保留所有可见的英文标题。无额外字符，无水印，无照片级真实感，无 3D 渲染。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23697/01.jpg","partial":false},{"id":10171,"c":"ThinkAI / 漫画 / 故事板","t":"可爱风咖啡馆与旅行插画","p":"一幅迷人的手绘可爱风插画，描绘了两位好友坐在温馨的咖啡馆里，手里拿着包装着品牌纸的现烤糕点。其中一个女孩眨眼微笑，另一个戴着圆框眼镜，表情可爱而惊讶。桌子呈柔和的色调，上面放着绿色饮品、笔记本电脑、鲜花和装饰性涂鸦。周围环绕着俏皮的手绘元素，包括爱心、星星、云朵、叶子、花朵、漩涡和五彩纸屑。柔和温暖的配色方案，奇趣的童书风格，平涂水粉质感，干净的轮廓线，可爱的角色设计，温馨的友谊氛围，细节丰富的涂鸦边框，现代韩系文具插画美学，明亮的白色背景，竖构图，充满活力且欢快。一幅可爱的故事书风格插画，描绘了一位年轻女性站在两座巨大的兔子雕像之间，背景是一家色彩缤纷的东亚传统店面。温暖的橙色木质建筑，带有亚洲文字的装饰招牌，温馨的街头店铺氛围。周围环绕着俏皮的花卉涂鸦、爱心、星星、叶子、云朵以及边框周围奇趣的手绘装饰。柔和的水粉画质感，鲜艳的橙色和青色配色方案，可爱风角色设计，旅行日记美学，儿童绘本插画，迷人的城市景观，质感笔触，温馨梦幻的氛围，细节丰富的装饰性边框，干净的白色背景，竖构图，充满欢乐与艺术感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23641/01.jpg","partial":false},{"id":10172,"c":"ThinkAI / 漫画 / 故事板","t":"翡翠动漫战士主视觉图","p":"创作一张具有戏剧张力的竖版动漫奇幻主视觉图，主角为 {argument name=\"character name\" default=\"Hotaru\"}，一位强大的年轻女战士，全身像，身处夜晚废墟般的未来城市中。她拥有极长的 {argument name=\"hair color\" default=\"silver-white\"} 飘逸长发，在风暴中向外飞舞，体态健美优雅，身着华丽的白、青、金三色魔法战斗服，配有不对称盔甲胸衣、多层短裙、深色过膝袜、带有青色水晶装饰的白色高跟靴、精致手套以及珠宝般的金属细节。她的面部应刻意用柔和的方形模糊或中性遮挡块遮盖，而画面其余部分保持高度细节。让她以低角度仰视视角摆出威严的双腿分开站姿，一只手臂向左伸展，仿佛正在释放力量，另一只手臂下垂并紧握拳头。在她身后，放置一个巨大的半透明水晶翅膀纹章或类似凤凰的盔甲光环，由锋利的翡翠色玻璃碎片组成，位于她头部和肩部中心。在角色周围环绕着咆哮的 {argument name=\"energy color\" default=\"霓虹翡翠绿\"} 魔法火焰流、闪电状粒子、火花以及形成身体周围漩涡的炽热等离子弧。背景是黑暗的后启示录科幻城市，有破碎的塔楼、废弃的脚手架、远处的剪影和反光的裂纹金属地面，所有物体均被强烈的绿色光线背光照射。采用电影级构图、高对比度、体积光、轮廓光、深邃阴影、漂浮余烬、动态效果、超精细动漫插画风格、光泽感奇幻盔甲渲染、锐利的线条、绘画感效果、3:4 竖版海报构图，史诗级规模，无文字，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23669/01.jpg","partial":false},{"id":10173,"c":"ThinkAI / 漫画 / 故事板","t":"电影级男性角色概念项目","p":"参考所提供的图像，创建一个高端电影级素描角色项目，展示一位 {argument name=\"subject\" default=\"留着短须、英俊且肌肉发达的光头男性\"}，并通过多幅写实插画和肖像研究展现其深邃的目光。\n\n该男子留着光头，下颌线硬朗，留有深色短须和八字胡，体格健壮，拥有宽阔的肩膀和线条分明的双臂。包含一系列情绪表达，包括严肃深邃的神情、轻微的冷笑、侧面视角、四分之三侧面视角、穿着 {argument name=\"clothing\" default=\"领口微敞且袖口卷起的白色衬衫、蓝色牛仔裤、黑色皮带\"} 的时尚姿势、放松自信的站姿，以及细腻的面部素描。像专业的角色设计项目一样，有机地排列在明亮的白色页面上。\n\n强烈的电影级光影，超细腻的混合素描技法，结合了写实渲染、铅笔素描、墨线勾勒和微妙的色彩点缀。奢华时尚概念艺术风格，高端角色项目呈现，布局简洁，包含多个面板和研究，具备专业插画品质。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23598/01.jpg","partial":false},{"id":10174,"c":"ThinkAI / 漫画 / 故事板","t":"童话木刻版画风格","p":"生成一张以输入图像的主体、动作和空间关系为中心的童话木刻版画风格图像。首先，从内容中提取大面积的低亮度或高对比度结构场，作为包裹主体的容器、路径、框架或密度层。主体被重绘为图形形状而非摄影细节，压缩成一到两个清晰的大色块，使用钝化的轮廓、略微夸张的比例以及少量关键边缘来保留身份、动作、功能和情感。最重要的信息仅出现在小面积的高饱和度色块中，集中在面部、姿态、路径、物体功能点、环境标记或叙事焦点上，并始终被深色结构或明亮的负形所抑制，使画面生动但不均匀。背景从输入内容的空间和意义中生长出来，像故事的外壳一样切割主体的边缘，形成遮挡、裁剪、吞没和局部暴露的结构叙事。色彩保持三层关系：大面积的深色结构色用于增加重量感和边界，适量的浅色或留白用于呼吸感，小面积的高饱和度情感色用于引导阅读路线和传递故事信号。色调随主题的情感温度而变化，但面积比例和明度顺序保持稳定。采用扁平的叙事视角，通过鸟瞰压缩、横向移动、前景构图、路径引导、尺度跳跃或边缘裁剪来组织阅读；空间呈现出绘本页面的扁平层级感。线条仅出现在功能、路径、边界、纹理和识别点处，保持稀疏、手绘且略带不精确的细线条。所有色块保持平涂，但边缘带有干擦、颗粒、留白、纸张纹理、喷点和轻微的套印错位感，如同通过丝网印刷和油画棒完成的手工图像。如果需要文字，让文字成为画面中的小标志、物体面板或边缘注释，字体圆润、粗细略有不均且密度较低，服从于图形结构。总体而言，保持低细节、高识别度的作者语言，深色场包裹明亮色彩信号，以及可爱叙事与厚重木刻版画风格的共存。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23630/01.jpg","partial":false},{"id":10175,"c":"ThinkAI / 漫画 / 故事板","t":"复古日本游戏杂志评测页面","p":"在生成开始时，用户输入四个游戏标题。如果留空，则会自动随机创建。\n\n【游戏 1】\n({argument name=\"game title 1\" default=\"游戏标题\"})\n\n【游戏 2】\n({argument name=\"game title 2\" default=\"游戏标题\"})\n\n【游戏 3】\n({argument name=\"game title 3\" default=\"游戏标题\"})\n\n【游戏 4】\n(游戏标题)\n\n后续的杂志内容将通过推断所输入标题的世界观、类型和游戏内容自动生成。\n\n---\n\n20 世纪 90 年代末至 21 世纪初日本游戏杂志中常见的交叉评测专题页面风格。\n\n单页纵向排版。\n\n信息密度极高的杂志布局。\n\n请勿使用真实的游戏公司、真实的游戏主机或真实的杂志名称。\n\n完全原创的虚构游戏评测专题。\n\n---\n\n同时展示四款游戏。\n\n为每款游戏自动生成以下内容：\n\n- 游戏标题 Logo\n- 类型\n- 游戏内容介绍\n- 宣传标语\n- 像素艺术截图\n- 游戏内风格的 UI 界面\n- 评测评论\n- 评分结果\n- 综合评价\n\n游戏画面通过推断标题内容进行创作。\n\n示例：\n\n机器人标题 -> 16 位机风格机甲动作游戏\n奇幻标题 -> 经典 RPG\n赛车标题 -> 高速赛车游戏\n恐怖标题 -> 探索冒险游戏\n射击标题 -> 纵向或横向卷轴 STG\n\n描绘为不同类型的游戏。\n\n截图需具备说服力，看起来就像实际游玩时的游戏画面。\n\n包含适合该类型的 UI，例如小地图、HP 条、分数显示和对话框。\n\n---\n\n四位评测人员：\n\n- 热血男性评测员\n- 冷静女性评测员\n- 资深编辑\n- 狂热游戏评论家\n\n每人配有头像插图。\n\n评测评论以对话气泡形式呈现。\n\n每款游戏的观点各不相同。\n\n---\n\n评分随机生成。\n\n从高度赞扬到严厉批评混合呈现。\n\n示例：\n\n“完成度极高”\n“虽有瑕疵但潜力十足”\n“适合特定受众”\n“创意有趣”\n“平衡性调整有难度”\n“相当犀利的作品”\n“让人难以理解”\n\n正面评价与尖锐评论并存。\n\n---\n\n总分为 40 分。\n\n四位评测员分别打分。\n\n示例：\n\n10 / 10 / 9 / 10\n8 / 7 / 8 / 6\n5 / 4 / 6 / 5\n2 / 1 / 3 / 2\n\n根据评价结果自动显示：\n\n- 白金殿堂\n- 黄金殿堂\n- 白银殿堂\n- 值得关注作品\n- 优秀作品\n- 值得称赞作品\n- 普通作品\n- 争议作品\n\n---\n\n页面还包括：\n\n- 关键看点\n- 优点\n- 缺点\n- 难度图表\n- 重玩价值等级\n- 画面评分\n- 音效评分\n- 游戏性评分\n- 编辑部评论\n- 攻略技巧\n- 小专栏\n\n---\n\n页面信息量极大。\n\n包含大量小标题。\n\n包含大量侧边栏。\n\n包含大量图表。\n\n包含大量图标。\n\n精美的装饰。\n\n复古印刷品的质感。\n\n略微泛黄的纸张。\n\n如同游戏攻略书或收藏级杂志专题页面的密度。\n\n一种越读越能发现更多信息的布局。\n\n完全原创的设计，看起来不像真实的游戏或真实的厂商。\n\n专业日本游戏杂志编辑排版，复古评测页面，像素艺术游戏截图，评测员头像，密集排版，评分图表，杂志印刷设计，高细节，地道的 20 世纪 90 年代末至 21 世纪初日本游戏文化，收藏级杂志专题，高度详细的编辑设计","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23645/01.jpg","partial":false},{"id":10176,"c":"ThinkAI / 漫画 / 故事板","t":"极简手绘墨水草图","p":"根据特定主题生成一张极简且稚拙的纸上手绘图像。首先，从完整的摄影信息中提取主题，并将其压缩为几条可辨识的颤动黑线、极简的轮廓以及少量关键符号，让大面积的纯净留白作为支撑。主体通过其外轮廓、姿态、孔洞、边缘、物体关系以及一两个手写标记来呈现；线条如同纸上的黑色墨水笔或粗铅笔，粗细不均，转折处有轻微的墨迹堆积，圆形带有手抖产生的偏差，长线条略有漂移，内部细节仅保留必要的短线。物体的复杂程度应降低至识别的临界点——少一笔则难以辨认，多一笔则过于精致。衣物、器皿、植物、建筑、食物、机器或抽象符号都被转化为白色表面、黑色边缘、松散的连接线以及最能说明其身份的小特征。如果出现人物，面部保持纸张的白色，仅使用点状眼睛、短鼻线和极简的表情；头发、胡须、衣褶、手脚被压缩为黑色的色块、断续的线条或松散的轮廓，使人物看起来像是一个记忆中的符号而非肖像。背景为纸张质感或浅色平铺区域，起到呼吸感、比例感和静谧观察的作用，上方和周围保留明显的留白；单个主体位于画面中部或下方，多元素内容则被压缩为低水平的横向关系带，由几条颤动的底线连接，保持上方的虚空与静谧。色彩服从于黑色线条和白色空间，白色或近白色背景占据最大面积；黑色线条具有结构权威性，低饱和度的浅色仅用于物理分组和情感温度，小面积的暖色或深色则作为语义强调；着色略显不均，边缘与轮廓略有错位，保留纸张的留白、纹理和手工涂抹感。如果出现文字，应看起来像是用同样的黑笔在物体表面书写的低精度标签或小笔记，字形不均、间距松散、略有错位，但仍可辨认；文字属于物体本身而非外部排版。整体作品在低完成度和高辨识度之间保持张力，如同精心保存的随手草图：空灵、轻盈、笨拙、易读，带有轻微的扫描纸张质感、墨迹残留、断线、重复笔触和不均匀的着色痕迹。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23632/01.png","partial":false},{"id":10177,"c":"ThinkAI / 漫画 / 故事板","t":"中世纪 RPG 角色卡","p":"请根据这些照片将我转化为一张官方角色卡。{argument name=\"style\" default=\"renaissance medieval\"}。你认为最符合我气质的风格。请基于照片中呈现的我的外貌、气场、个性和能量来进行创作。艺术作品应呈现出高级概念艺术 / 艺术画册页面的质感，包含多个分镜和层叠的视觉叙事。({argument name=\"eye color\" default=\"请输入眼睛颜色\"})","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23572/01.jpg","partial":false},{"id":10178,"c":"ThinkAI / 漫画 / 故事板","t":"暴风雨海盗漫画项目","p":"目标：为海盗游戏场景创建一个粗犷的黑白漫画项目页面，类似于扫描版漫画/图像小说的制作面板。\n\n画布：垂直漫画页面裁剪，仅限灰度，带有深色的工作区/背景和白色页面边框。在左上角添加一个小型的制作标签，内容为 {argument name=\"panel code\" default=\"A6 - 4\"}。主要可见面板占据了几乎整个画布，带有粗大的白色装订线，底部隐约可见两个较小面板的顶部边缘。\n\n主面板布局：暴风雨中被雨水冲刷的海盗船甲板。构图中心为一名高大的海盗船长，采用戏剧性的低角度姿势，展示从大腿向上的全身像，拳头向观众方向挥出。他的脸部被一个柔和的矩形灰色模糊/遮挡框遮住。他留着湿漉漉的长卷发，穿着一件带有许多纽扣的厚重黑色船长外套，内搭衬衫和腰带，腰间配有腰带、锁链、手枪或工具，衣物破旧且湿透。他身后是一群吵闹的船员，共 5 名可见：左侧中景处有 1 名正在大喊的海盗（部分被灰色模糊框遮挡），左下方有 1 名弓着身子的海盗（部分被灰色模糊框遮挡），船长后方偏右处有 1 名正在大喊的海盗，右侧附近有 1 名戴帽子的海盗，最右侧有 1 名留着胡子的海盗，正拿着一把燧发枪（躯干/脸部区域部分被灰色模糊框遮挡）。在右上角添加 1 只翅膀展开的鹦鹉或类似乌鸦的大鸟。包含船具、木梁、绳索、左侧的灯笼光、雨痕、海浪、闪电以及混乱的人群能量。\n\n文字与特效：包含 3 个对话气泡和 3 个音效字幕。对话气泡 1（左上）内容为“AWAY, ME SEA-DOGS! TO WRECKER’S REACH!!”。对话气泡 2（右中）内容为“AYE! TO THE HEARTSTONE!!!”。对话气泡 3 仅在底部裁剪面板中部分可见，内容以“YOU’D BETTER BE,”开头。音效 1（左侧，大号加粗倾斜字母）内容为“AAAYE!”。音效 2（右上，靠近闪电）内容为“HEARTSTONE!”。音效 3（靠近鸟）内容为“BRAWK!”。使用手写体漫画排版，白色对话气泡配黑色轮廓，加粗轮廓的音效，以及动态布局。\n\n视觉风格：高细节单色墨水插画，密集的交叉排线，湿润的光泽黑色，强烈的对比度，飞溅的白色高光，粗糙的雨线，电影级奇幻海盗动作，戏剧性的透视，厚重的质感，充满活力的漫画渲染，除灰度外无其他颜色。\n\n可自定义细节：海盗目的地可以是 {argument name=\"destination name\" default=\"Wrecker’s Reach\"}；魔法物品或战斗口号可以是 {argument name=\"relic name\" default=\"Heartstone\"}；船长的命令可以是 {argument name=\"captain command\" default=\"AWAY, ME SEA-DOGS! TO WRECKER’S REACH!!\"}；船员的回应可以是 {argument name=\"crew response\" default=\"AYE! TO THE HEARTSTONE!!!\"}。\n\n约束条件：将图像保持为单一的戏剧性漫画页面裁剪，保留 5 名可见船员加上中央船长和 1 只鸟，在角色上方保留 4 个柔和的灰色遮挡/占位矩形，保留粗大的白色漫画边框，除指定的标签、气泡和音效外，不要添加额外的可读文本。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23665/01.jpg","partial":false},{"id":10179,"c":"ThinkAI / 漫画 / 故事板","t":"匿名棒球运动员独自用餐","p":"创作一幅宽幅单格编辑类插画，背景为米白色纹理纸。画面右侧描绘一名成年韩国男性棒球运动员，盘腿坐在地板上，身体略微前倾，单手拿着一个三角饭团正在进食。他的面部必须经过刻意匿名处理，用一个边缘柔和的米色模糊矩形遮盖五官，头部其余部分可见短黑发和耳朵。他身穿一件鲜艳的宝蓝色职业棒球球衣，内搭深蓝色长袖，下穿黑色长裤，脚蹬蓝色运动鞋，佩戴手表；胸前印有类似“doyo”的大型白色队名，前襟下摆印有数字“1”，上胸部贴有黄色矩形赞助商补丁，左胸区域印有韩文赞助商字样，袖子上印有大型白色数字。在他左侧的地板上放置 2 个小物件：一个带有蓝色标签和蓝色瓶盖的直立透明塑料水瓶，以及一个白色小纸杯。采用松散的墨水轮廓、水彩和马克笔风格的阴影，以及微妙的灰色投影，营造出忧郁的体育漫画氛围。保持构图简洁，左侧留出大量空白，人物和物体后方仅有一条细细的地板线，画面中不包含其他人、多余道具，除球衣上的标识外不出现任何可读文字。球衣颜色可自定义为 {argument name=\"jersey color\" default=\"royal blue\"}，球衣号码为 {argument name=\"jersey number\" default=\"1\"}，面部匿名样式为 {argument name=\"face anonymization style\" default=\"soft-edged beige blur rectangle\"}，食物为 {argument name=\"food item\" default=\"triangular rice ball\"}，氛围为 {argument name=\"mood\" default=\"melancholic and lonely\"}。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23536/01.jpg","partial":false},{"id":10180,"c":"ThinkAI / 漫画 / 故事板","t":"日式漫画排版中的写实职场女性","p":"将超写实的全身肖像 {argument name=\"character description\" default=\"自信的年轻职场女性\"} 直接融入 {argument name=\"comic style\" default=\"日式漫画\"} 页面排版中。她出现在左侧高大的垂直主视觉分镜中，几乎占据了整个页面高度，并在视觉上与周围的叙事分镜紧密相连。她身着 {argument name=\"outfit\" default=\"利落的炭灰色风衣，内搭修身黑色高领衫和剪裁得体的阔腿裤，脚穿皮质短靴，手提结构感十足的公文包\"}。她的姿态时尚且自信，一只手轻轻整理风衣领口，另一只手提着包，身体微微侧转，一条腿向前迈出。\n\n在右侧，创作较小的黑白漫画分镜，展示她在东京的一天：火车站、办公桌、创意会议、咖啡小憩、雨中街道和屋顶天际线。让这位女性成为页面主角，仿佛这个写实人物真实存在于漫画故事中，而非置身事外。运用强烈的墨线、网点纸、对话框、动态线和电影感的分镜叙事。将写实主体自然地融入漫画叙事中，同时保持其更丰富的细节和视觉主导地位。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23492/01.jpg","partial":false},{"id":10181,"c":"ThinkAI / 漫画 / 故事板","t":"StoryBoard 提示词：\n创建一个超电影感的 16:9","p":"创建一个超电影感的 16:9 暗黑奇幻武士战斗 StoryBoard，包含 16 个分镜，采用粗犷的动态漫画草图风格，展现原始的作画（sakuga）张力、极具冲击力的未完成线条、极佳的动作可读性以及强烈的电影级构图。一位孤独的女浪人","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23498/01.jpg","partial":false},{"id":10182,"c":"ThinkAI / 漫画 / 故事板","t":"雪林树女","p":"创作一张黑暗奇幻动漫风格的全身肖像，描绘一位站在雪地冬季森林中的树人少女。主体是一位高挑的女性树精/赛博格风格角色，上半身轮廓为人形，但皮肤和肢体已转化为开裂的树皮、扭曲的根系和光秃的枝干。她拥有极长的飘逸 {argument name=\"hair color\" default=\"黑色\"} 头发，垂落至地面，并与树枝部分缠绕，面部模糊/隐约可见，散发出平静而阴森的气息。她的双臂高举，化作两根巨大的扭曲树枝，在头顶形成拱门，细枝上点缀着微小的红色浆果和积雪。她的双腿是覆盖着树皮的树干，末端是暴露在雪地上的根状足部。她身着残破的黑色校服风格服装：破损的黑色西装外套、白色衬衫、短百褶裙、大腿绑带，左大腿上系着一个战术小包。添加两个明确的配饰/物品：胸前别着一个长方形身份牌，上面显示数字 {argument name=\"badge number\" default=\"77\"}，右侧高举的树枝上挂着一张苍白的纸或信封。她头顶上方悬浮着一个小型的深色椭圆形光环或标志，上面印有红色文字 {argument name=\"halo text\" default=\"JIS\"}。背景是夜晚或黄昏时分茂密、寒冷的蓝灰色森林，背景中有深色的树干、飘落的雪花、积雪覆盖的地面、散落的岩石以及低矮树枝上稀疏的红色浆果。使用戏剧性的电影级光效、高细节、逼真的树皮纹理、精致的积雪堆积、富有情绪的景深、优雅的恐怖氛围、竖构图、居中全身取景，无额外角色，无血腥内容，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23505/01.jpg","partial":false},{"id":10183,"c":"ThinkAI / 漫画 / 故事板","t":"压抑天气诗人海报","p":"目标：创作一张关于压抑的夏季天气和诗人低落情绪的忧郁文学海报。\n\n画布：宽幅横向构图，比例约为 16:9，分为两个主要版块：左侧为绘画插图，约占宽度的 60%；右侧为黑色文本版块，约占宽度的 40%。在整个图像周围添加细深绿色边框。\n\n左侧插图：采用 19 世纪末表现主义象征主义 / 后印象派风格绘制，具有厚重的笔触纹理，色调为柔和的赭石色、橄榄色、蓝灰色和风暴黄色。描绘一个夜晚或傍晚的室内书房。一位疲惫的男诗人坐在木桌前，身穿深色西装和白衬衫，一手托着头，另一手拿着笔在书写。他的脸被一个平面的不透明棕色方块遮住。在他身后上方，描绘一个从潮湿空气中升起的幽灵般的女性缪斯或天气精灵；她的脸也被一个平面的不透明棕色方块遮住。在她的头部周围，展示一个风暴云形状，其中包含一个类似破碎大脑的形态和 3 道锯齿状的黄色闪电。在最左侧，放置一扇有 4 块大玻璃窗格的高窗；窗外是沉闷的城市景观和阴沉的天空。窗内侧栖息着 1 只黑色的乌鸦，喙部张开仿佛在鸣叫，一只爪子抬起指向玻璃。\n\n书桌物品：包含 6 件清晰可见的书桌物品：左下角 1 叠 3 本合上的书，诗人面前 1 张摊开的手写纸，1 张单独的散纸，中心前方 1 个黑色墨水瓶，右下角 1 个透明玻璃杯，以及诗人手中持有的 1 支笔。保持物品的绘画感和轻微的扭曲感。\n\n右侧版块：使用纯黑色背景。在顶部中心，放置 1 个淡色方形二维码图形。在其下方居中放置淡绿色、手写风格、略显不规则的衬线字体诗歌。诗歌文本必须完全如下：\n{argument name=\"poem text\" default=\"天气\\n压抑地炎热潮湿\\n降临\\n像一条沉重潮湿的毯子\\n压抑着诗人的灵魂\"}\n\n制作人员文本：在诗歌下方，添加较小的淡绿色手写风格制作人员名单，居中，内容为：\nAI 图像创作于\n{argument name=\"artist name\" default=\"Michael H. Lester\"}\n与\n{argument name=\"model credit\" default=\"GPT Image 2 Low on\\nNightcafestudio\"}\n合作\ntwitter: {argument name=\"twitter handle\" default=\"lmhlester\"}\n\n底部链接：在右侧版块底部，添加两行居中的淡绿色 URL：\n{argument name=\"bottom links\" default=\"https://creator.nightcafe.studio/?ru/mhlester\\nhttps://4-michael-lester.pixels.com/\"}\n\n风格约束：使图像感觉潮湿、压抑、忧郁且富有诗意。使用可见的笔触、深色轮廓和手工海报美学。保持右侧排版清晰但具有有机感。不要添加额外的角色、额外的鸟类、额外的闪电、额外的书桌物品或额外的文本。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23500/01.jpg","partial":false},{"id":10184,"c":"ThinkAI / 漫画 / 故事板","t":"儿童马克笔画风格","p":"以用户输入图像的具体主体内容为中心，将其重绘为一张横向白纸上的儿童马克笔手绘图。首先，从输入内容中提取最具辨识度的外轮廓、姿态方向、局部地标、功能组件及身份色彩，将复杂的细节压缩为几个清晰的大形状；主体不追求写实的比例或精确的结构，而是通过粗黑的手绘外轮廓、松散的内部结构线以及稚拙但可辨识的变形来呈现。构图重心置于画面中央或中下方，四周留出大面积干净的白纸空间，使主体看起来像是一个孩子在纸上精心绘制的符号化主角。使用有限的高饱和度马克笔色块：一种源自主体身份的强主色承载主体重量，一种辅助强色分割结构与动态，小面积亮色突出最重要的识别部位；黑色负责勾勒轮廓，而白纸同时作为背景、高光和负空间。所有色块必须带有粗糙的手绘痕迹，保留短促的干笔笔触、未填满的缝隙、轻微的溢色、颜色覆盖线条以及线色错位，避免写实的光影、细腻的渐变或精致的质感。背景保持为白纸状态，不构建完整环境；仅在主体的运动方向、视线及情绪压力周围，点缀稀疏的红、蓝、黑手绘速度线、波浪线、闪电状折线、云朵状线条、短竖线或感叹号，让背景承载空气、声音、速度和信息提示。输入图像中的复杂纹理、图案和小装饰全部转化为短线条、色块、负空间和儿童记忆符号；关键身份组件必须绘制清晰，而非必要部分则保持简略、倾斜且不对称。如果需要文字，仅使用简短的手写拟声词、感叹号或边缘标注，笔迹模仿用粗笔涂鸦的动作线，无需正式排版。整体完成度停留在清晰但不精细的阶段，画面应看起来像是一幅用粗黑色马克笔和高饱和度彩色笔在真实纸张上创作的儿童画，既能瞬间识别输入主体，又保留了因儿童手部控制力而产生的抖动、负空间、重叠涂抹和稚拙的偏差。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23484/01.jpg","partial":false},{"id":10185,"c":"ThinkAI / 漫画 / 故事板","t":"电影感速写风格角色项目","p":"高级电影感速写风格角色项目，通过多幅写实插画和肖像研究展示迷人的时尚模特。集合了 {argument name=\"styles\" default=\"优雅表情、侧面视角、奢华时尚姿态、抓拍瞬间\"}，以及在洁白页面上自然排列的细腻面部素描。绝美的双眸、无瑕的肌肤、时尚的发型、设计师服装、奢华配饰、精致的女性气质、高级时装概念艺术风格、超精细混合素描技法、写实美学插画，大师级品质。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23437/01.jpg","partial":false},{"id":10186,"c":"ThinkAI / 漫画 / 故事板","t":"熟睡的孩子与梦境生物","p":"创作一张梦幻般的电影感方形图像，画面中是一个在夜晚柔和的粉彩卧室里熟睡的孩子，周围环绕着可爱的小型奇幻梦境生物。孩子，{argument name=\"child age\" default=\"幼童\"}，侧卧在蓬松的枕头上，盖着淡雅的花卉毯子，露出深色的头发，脸部大部分朝向枕头，神态安详。采用温暖柔和的胶片质感，具有浅景深、柔和的颗粒感、轻微的暗角，以及来自小灯笼的舒适低照度光线。画面中需包含 8 个清晰可见的生物：1 个巨大的毛绒状白色尖刺生物从左侧枕头上方探出，有着亮黑色的眼睛；1 个带有两根触角的小型米色虫状生物坐在左侧枕头上；1 个毛茸茸的薄荷绿人形生物站在孩子附近，手里提着一个小小的发光灯笼；1 个长着小角的小型金色漂浮生物在孩子上方模糊的背景中悬浮；1 个长着半透明昆虫翅膀的棕色毛绒兔状生物坐在右侧枕头上；1 个淡蓝色圆滚滚的幽灵状生物在右侧背景中微笑；1 个从底部中心前景处看到的微小淡粉色兔子生物（背影）；以及 1 个坐在右下角、面向熟睡孩子的蓝绿色尖刺生物。卧室细节应进行柔焦处理：带图案的壁纸、相框、搁板和温馨的育儿室装饰。调色板：{argument name=\"color palette\" default=\"灰粉色、奶油色、薄荷绿、淡蓝色、暖琥珀色\"}。氛围：{argument name=\"mood\" default=\"美梦、温柔、异想天开、宁静\"}。风格：{argument name=\"visual style\" default=\"照片级写实的微缩奇幻生物与柔和的吉卜力工作室风格梦幻现实主义相结合\"}。相机：亲密的床边近景，1:1 方形构图，平视视角，35mm 镜头感，浅焦聚焦于熟睡的孩子和附近的生物。限制条件：无文字，无水印，无恐怖基调，无刺眼的强光，保持所有生物温柔且像玩具一样，拥有圆润的身体和明亮的眼睛。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23686/01.jpg","partial":false},{"id":10187,"c":"ThinkAI / 漫画 / 故事板","t":"哪吒火尖枪画面对比","p":"目标：创建一张宽幅并排对比图，展示同一位神话朋克战士的两种电影级生成效果，左侧为过度锐化的原始外观，右侧为更柔和、精致的电影质感。\n\n画布：超宽横向画幅，比例约为 2.7:1，精确分为 2 个等大的面板，中间有一条细长的垂直白色分割线。无标题，无标签，无水印。\n\n主体：在两个面板中，均展示 {argument name=\"character name\" default=\"哪吒\"} 作为一名凶猛的东亚年轻战士，留着黑色尖刺发型，身穿深红色与黑色的皮革金属盔甲，露出腰部，缠绕腕带，系着腰带，长长的红色丝带在他周围飘动。他的面部应被一个简单的方形模糊/马赛克块遮挡，与源图像保持一致。他双手紧握长枪或长棍，斜向观众方向刺出，并散发出超自然的火焰。\n\n场景：黑暗的古庙或神殿内部，配有雕花木质建筑、金色雕像、蜡烛、烟雾、磨损的地板和温暖的琥珀色火光。背景细节包括：左侧面板深处居中放置 1 座大型金色坐像，右侧面板后方放置 1 座金色守护神雕像。环境应呈现出东京风格 NEZHA 奇幻系列中神话动作场景的氛围。\n\n左侧面板：原始 GPT 风格输出效果。紧凑的腰部以上动作特写，战士从左向右倾斜，长枪横跨画面。红色魔法火焰从右上方的枪尖绽放。使图像呈现刻意的过度锐化和超高细节：光泽皮肤、油性高光、高微对比度、极其锋利的边缘、湿润感的盔甲、夸张的汗水、粗糙的纹理、CGI 质感的红色火焰，以及戏剧性但略显人工的 HDR 效果。\n\n右侧面板：同一场景的精致电影级最终效果。构图略宽，战士以更低的姿态蹲伏或冲刺，长枪从中心向右前方刺出，喷涌出橙色火焰。使用更柔和的镜头渲染、自然的动态模糊、更温暖的橙色火焰、减少皮肤光泽、降低塑料质感、增加大气雾感、浅景深、电影颗粒感、绘画般的写实感以及逼真的物理光影。使右侧面板明显比左侧更柔和、油腻感更少。\n\n视觉风格：暗黑奇幻动作电影，高预算真人概念艺术，温暖的琥珀色与深红色调，体积烟雾，神殿尘埃，余烬颗粒，动态丝带。这两个面板应清晰地对比同一 {argument name=\"scene concept\" default=\"神殿内哪吒火尖枪攻击\"} 的两种视觉处理方式：左侧为过度渲染的人工感，右侧为电影级的自然感。\n\n约束条件：包含精确 2 个面板，精确 1 条中心分割线，每个面板精确 1 名战士，每个面板精确 1 把长枪，每个面板精确 1 处可见的火焰攻击。避免出现文字、Logo、UI 元素、额外角色以及额外的分屏部分。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23499/01.jpg","partial":false},{"id":10188,"c":"ThinkAI / 漫画 / 故事板","t":"角色身份项目","p":"创建一个艺术化的 16:9 角色身份项目。\n\n主体：使用参考图像。名称：{argument name=\"character name\" default=\"Ruby\"}。进行色彩校正。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23497/01.jpg","partial":false},{"id":10189,"c":"ThinkAI / 漫画 / 故事板","t":"混合式照片漫画插画","p":"一张写实照片，主体为 {argument name=\"subject appearance\" default=\"一位自信地站在中央的年轻女性，身穿休闲装——白色运动鞋、橄榄色工装裤和米色连帽衫\"}。她带着温暖的微笑，直发扎成低马尾。背景是黑白墨水艺术风格的全页漫画分镜，分为多个面板，展示了她作为插画角色的不同场景：在开阔的高速公路上骑摩托车、在书桌前使用笔记本电脑和咖啡杯工作、走在繁忙的城市街道上，以及使用相机稳定器拍摄内容。每个面板都有醒目的漫画音效词，如“ZOOM!”、“CLICK!”、“BOOM!”、“LET'S GO!”，采用风格化的粗体排版，均为英文。对话气泡中散布着诸如“Dream Big!”、“Stay Focused!”和“Best Friends!”等英文短语。背景中充满了速度线、半调网点和戏剧性的漫画阴影。整体图像将写实摄影与漫画插画无缝融合，底部可见干净的白色摄影棚地面反射。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23298/01.jpg","partial":false},{"id":10190,"c":"ThinkAI / 漫画 / 故事板","t":"无面火系法师动漫场景","p":"创作一幅极具戏剧性的宽屏电影级动漫奇幻插画，描绘一位老法师正在施展火系魔法。法师留着飘逸的 {argument name=\"hair color\" default=\"银白色\"} 长发和浓密的胡须，身穿宽松的深黑色宽袖长袍。他的面部被一个位于正中央的暖棕色方形遮挡块刻意掩盖，遮住了五官，但露出了头发和胡须。构图上，让他略微偏向画面左侧，躯干朝向观众，一只手向前伸向右侧，手指张开，仿佛在操控巨大的法术；另一只手在左下方抬起，呈爪状。在画面右半部分，展示一个巨大的旋转 {argument name=\"magic element\" default=\"橙色火焰\"} 球或传送门，如同由旋转火焰组成的微型太阳，拥有明亮的黄色核心、熔岩般的橙色光环以及盘旋的火焰轨迹。在左下边缘附近添加第二个较小的可见火焰团。画面中必须包含两个显著的火团：右侧的巨大火球和左下方的较小火焰。背景为黑暗的烟雾洞穴或风暴虚空，带有炭灰色和黑色的笔触质感，被炽热的橙色轮廓光和零星的余烬照亮。风格：高质量绘画风动漫主视觉图，动态动作姿势，强对比度，电影级光影，充满活力的笔触，细腻的火焰动态，戏剧性的奇幻氛围，16:9 宽屏构图，无文字，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23510/01.jpg","partial":false},{"id":10191,"c":"ThinkAI / 漫画 / 故事板","t":"动漫寿司吧场景转换","p":"以 REFERENCE_0 为艺术基准，将场景从色彩斑斓的奇幻市场转换为温馨、细节丰富的日式寿司店内部，同时保留原有的精致绘本动漫水彩质感、密集的线条、柔和的灯光以及舒适的金色氛围。\n\n目标：将双人场景重新构图为亲密的寿司吧台时刻。\n\n主要变更：\n- 将市场摊位和漂浮的彩色气泡替换为传统的木质寿司吧台，配以悬挂的灯笼、餐具架、墙面卷轴、花纹瓷砖、暖帘以及在吧台后工作的厨师。\n- 保持 2 名动漫少女，但改变其角色与造型：\n  1. 左侧少女：一位 {argument name=\"left character role\" default=\"绿发寿司店服务员\"}，从吧台后探身向前，正在呈上食物。\n  2. 右侧少女：一位 {argument name=\"right character role\" default=\"长浅蓝发顾客\"}，身着优雅的冰蓝色和服式裙装坐在吧台前，注视着食物。\n- 将料理更改为 {argument name=\"cuisine type\" default=\"寿司\"}。添加一个小型木质托盘，上面摆放 5 件清晰可见的寿司：红金枪鱼握寿司、浅白鱼肉握寿司、黄玉子烧握寿司、三文鱼握寿司，以及一件带有橙色配料的海苔军舰寿司。\n- 添加桌面细节：一个蓝色花纹茶杯、一个小酱油碟、一个带有 3 个隔层的黑色长方形便当托盘，以及小型插画菜单卡。\n- 将背景中的员工和食客处理为柔和的陪衬人物，而非视觉焦点。\n- 对主要少女及背景人物应用 {argument name=\"face treatment\" default=\"覆盖可见面部的平整不透明米色矩形块\"}，仿佛面部区域被刻意遮挡。\n\n风格约束：保留高度精细的手绘水彩/彩色铅笔质感、明亮的暖色调灯光、装饰性图案密度、柔和的奇幻动漫氛围，以及类似 DALL-E-3 的怀旧插画品质。避免写实主义，避免现代极简主义，且不要添加额外的主要角色。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23513/01.jpg","partial":false},{"id":10192,"c":"ThinkAI / 漫画 / 故事板","t":"海边的狐耳动漫学生","p":"创作一幅色彩鲜艳、细节丰富的动漫插画，描绘两位十几岁的奇幻学院学生坐在陡峭海边小镇街道的户外石阶上，背景是明亮的夏日阳光。左侧角色是一位娇小的狐耳少女，拥有 {argument name=\"left character hair color\" default=\"长而飘逸的白色秀发，内侧带有鲜艳的红色挑染\"}，一对巨大的白色兽耳，内侧为粉色绒毛，身穿宽松的白色连帽衫，配有黑色抽绳、黑色百褶短裙、红色短袜以及厚底黑白运动鞋；她屈膝而坐，双手因惊讶而举起。右侧角色是一位身材修长的少年，留着 {argument name=\"right character hair color\" default=\"凌乱的白色短发，带有红色刘海\"}，身穿白色短袖校服衬衫，胸口和袖子上带有徽章贴布，系着松开的红格子领带，穿着黑色长裤、腰带、银色腰链，背着黑色双肩包，搭配红色短袜和同款厚底黑白运动鞋；他面对少女而坐，双手抬起，仿佛受到了惊吓。在两人的面部上方添加平整且不透明的淡粉色矩形遮挡块，总共 2 个。在两人之间添加 3 个红白相间的漫画感感叹号，以表现惊讶。在场景中散落 8 张手写纸张：左边缘可见 2 张，右上角漂浮 1 张，右上边缘附近 1 张，下部中央台阶 1 张，右边缘附近 1 张，右下台阶 2 张，并在右下台阶上放置 1 本打开的笔记本。背景：电影质感的蓝色海湾、远处的海岸线、沿山坡而下的城镇屋顶、电线杆和电线、投下阴影的茂密树木、左侧的红色标志牌以及右侧的建筑立面。采用动态视角，清晰的赛璐珞动漫渲染风格，饱和的蓝天与蓬松的云朵，强烈的轮廓光，细腻的衣物褶皱，随风飘动的发丝，充满趣味的校园奇幻氛围，超干净的线条，4:3 横向构图，无水印，无额外文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23514/01.jpg","partial":false},{"id":10193,"c":"ThinkAI / 漫画 / 故事板","t":"Sketchbook 角色研究项目","p":"优质的电影感 Sketchbook 角色项目，通过多幅写实插画和肖像研究，展现了一位当代帅气男性。在明亮的白色页面上，有机地排列着一系列情感表达、侧面视图、时尚姿势、放松时刻以及细腻的面部素描。拥有轮廓分明的下颌线、时尚的发型、精致的胡茬、考究的休闲装束，采用奢华时尚概念艺术风格，呈现出超高细节的混合素描技法。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23431/01.jpg","partial":false},{"id":10194,"c":"ThinkAI / 漫画 / 故事板","t":"复古动漫性别转换视觉图","p":"使用提供的图像作为原始角色的基础参考。制作一张高质量的动漫主视觉图，同时呈现原始角色及其性别转换后的版本。将原始角色放置在画面左侧，将性别转换后的角色放置在画面右侧。两者必须一眼就能被识别为同一个人。高精度保持面部特征、眼睛形状、面部比例、发型设计语言、发色、轮廓、习惯性表情、性格特征、视觉符号以及整体角色身份。性别转换后的版本不应仅仅是角色扮演或服装互换，而应基于“如果同一个人从出生起就是异性”这一自然解读进行设计。不要仅仅让他们穿上异性的衣服。在自然地重新设计服装以适应性别时，需保持原始设计的时尚风格、色彩方案、配饰、象征意义、职业、社会地位、世界观和设计理念。确保观众能瞬间理解他们是“同一个人的男女版本”。两个设计应具有强烈的视觉共性。[整体氛围] 20 世纪 90 年代末至 21 世纪初日本动漫杂志或宣传海报的氛围。一部虚构的性别转换题材浪漫喜剧动漫的官方主视觉图。欢乐的混乱感。轻松的骚动。浪漫喜剧式的距离感。喜剧节奏。不是严肃的科幻作品。不是严肃的平行世界故事。不是全球危机。优先营造一种仿佛发生了意外麻烦的有趣氛围。目标是创作出一张让观众觉得“这看起来肯定很有趣”的宣传视觉图。[角色表演] 描绘两个角色意外遇到自己异性自我的场景。他们应该意识到对方的存在并做出反应。情绪可以自由选择。例如：惊讶、困惑、不知所措、恼火、好奇、尴尬、竞争、自我厌恶、自我赞美、气愤、挑衅、不信任、警惕、奇怪的亲近感等。允许混合多种情绪。重点在于传达“看到自己性别转换后的样子”的幽默感。[构图] 不要使用固定构图。每次选择不同的场景布置。例如：面对面、背靠背、搭肩、争吵、怒视、互相指点、像照镜子一样盯着对方、摆出相同的姿势、摆出完全不同的姿势、观察对方、追逐、奔跑/追赶、意外碰撞、转换后立即产生的困惑、争夺同一物品、同时做出反应、检查对方的衣服、警惕地保持距离、因靠得太近而感到尴尬等。不要依赖对称构图。改变构图，使其每次看起来都像是不同动漫作品的宣传视觉图。[背景] 背景应自然地契合角色的世界观、职业、时代背景、类型、文化和设计语言。将背景设计为增强角色表现力的高质量动漫背景。如有必要，可以使用：学校、城市景观、商业街、奇幻世界、日式空间、魔法世界、赛博朋克城市、复古流行设计、游乐园、校园祭、舞台、抽象图形等。背景应自然地传达作品的类型。[艺术风格] 20 世纪 90 年代末至 21 世纪初的动漫杂志插画。复古流行动漫美学。赛璐珞动画风格。干净的线条。大胆的轮廓设计。生动欢乐的色彩设计。商业动漫官方宣传插画质量。像动漫片头曲画面一样充满动感。像杂志封面一样具有强烈的视觉吸引力。[禁止事项] 无 Logo。无标题文字。无说明文字。无水印。无对比表格布局。无设定集布局。无三视图。不要制作成角色对比图。不要制作成严肃的多元宇宙战争。不要制作成黑暗奇幻的末日战斗。不要让战斗或世界观解释喧宾夺主，掩盖性别转换本身的主题。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23487/01.jpg","partial":false},{"id":10195,"c":"ThinkAI / 漫画 / 故事板","t":"梦幻天空之镜插画","p":"参考图像为角色设计。请为参考图像中的 {argument name=\"character\" default=\"女孩\"} 绘制一幅日式唯美幻想风格插画。画面中心是一位保留了完整细节的可爱女孩。她站在如镜面般平滑的无尽水面中央。天空呈现出高饱和度的 {argument name=\"color scheme\" default=\"粉紫色与深蓝色\"} 混合色调，一颗耀眼的巨大蓝色流星划过天际。女孩处于逆光中，被流星和星空的边缘光细腻地勾勒出轮廓。下方的水面完美且对称地倒映出整个壮丽的星空。日式唯美幻想风格，高饱和度粉紫色冷暖色调，天空之镜般的倒影，空灵而宁静的梦幻氛围。{argument name=\"aspect ratio\" default=\"纵横比 9:16\"}，4K。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23313/01.jpg","partial":false},{"id":10196,"c":"ThinkAI / 漫画 / 故事板","t":"剪纸分层插画风格","p":"将此图像转换为 {argument name=\"art style\" default=\"柔和的手工剪纸分层插画风格\"}，灵感源自纸艺立体模型美学。使用圆润平滑的形状、简化可爱的角色比例以及极简的面部细节（豆豆眼、腮红），营造出温暖迷人的视觉效果。应用堆叠的纸张层，展现可见的深度、层与层之间微妙的阴影，以及类似激光切割卡纸的整洁边缘。\n\n在每个主要角色周围添加一层独特的白色外轮廓，类似于厚实的贴纸边框或白色剪纸衬底，将角色与背景清晰区分开来。这层白色部分应呈现出刻意的纸张质感，而非发光效果。使用 {argument name=\"color palette\" default=\"包含柔和蓝、绿及暖中性色的配色方案\"}，保持平衡与宁静。光线应柔和、均匀且漫射，在不产生强烈对比的情况下增强纸张的立体层次感。\n\n纹理应呈现哑光且触感真实的效果，如同厚实的艺术纸或手工泡沫板。整体氛围：{argument name=\"mood\" default=\"舒适、治愈、温和且充满童话感\"}，具有适合现代插画、儿童绘本或装饰艺术的俏皮而精致的手工质感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23279/01.jpg","partial":false}],"total":100,"page":1,"limit":36,"pages":3,"source":"prebuilt-bootstrap-category-full"},"ThinkAI / App / 网页设计":{"prompts":[{"id":10261,"c":"ThinkAI / App / 网页设计","t":"电商直播 UI 样机","p":"{\n  \"type\": \"直播 UI 样机\",\n  \"subject\": {\n    \"description\": \"{argument name=\\\"host name\\\" default=\\\"Elon Musk\\\"} 的肖像，面带微笑，身穿印有白色技术示意图的黑色 T 恤\",\n    \"background\": \"左侧显示带有 '{argument name=\\\"left background logo\\\" default=\\\"SPACEX\\\"}' 文字的屏幕，右侧显示红色的 '{argument name=\\\"right background logo\\\" default=\\\"Tesla T logo\\\"}' 和一辆深色汽车\"\n  },\n  \"ui_overlay\": {\n    \"top_header\": {\n      \"host_info\": \"头像，名称 '{argument name=\\\"host name\\\" default=\\\"Elon Musk\\\"}'，副标题 '55.6万本场点赞'，红色 '关注' 按钮\",\n      \"rank_badge\": \"带有 '全站第1名' 的金币图标\",\n      \"viewer_stats\": \"3 个顶部观众头像，显示 '12.3w'、'8.6w'、'5.7w'，总计 '68.7万'，'X' 关闭按钮\",\n      \"right_links\": \"'更多直播 >'，'礼物展馆 0/24'（带有蓝色 '经典' 标签）\"\n    },\n    \"mid_left_gifts\": {\n      \"count\": 2,\n      \"items\": [\n        \"头像 '科技爱好者'，'送小心心'，爱心图标 x 1314\",\n        \"头像 '星辰大海'，'送火箭'，火箭图标 x 666\"\n      ]\n    },\n    \"bottom_left_chat\": {\n      \"system_message\": \"37 级勋章 '宇宙漫游者 加入了直播间'\",\n      \"message_count\": 7,\n      \"messages\": [\n        \"小火箭: 马斯克！未来可期！🚀\",\n        \"future: 特斯拉Model 2什么时候出？\",\n        \"星空梦想家: SpaceX今年能上火星吗？\",\n        \"AI探索者: Neuralink进展如何？\",\n        \"帅气的网友: 马总好！\",\n        \"Mars: 第一次来你的直播，超激动！\",\n        \"用户123: 讲讲AI吧，会取代人类吗？\"\n      ]\n    },\n    \"bottom_right_product_card\": {\n      \"hot_tag\": \"橙色 '热卖 x 1888'\",\n      \"image\": \"Tesla Cybertruck\",\n      \"title\": \"{argument name=\\\"product name\\\" default=\\\"特斯拉Cybertruck 电动皮卡\\\"}\",\n      \"price\": \"{argument name=\\\"product price\\\" default=\\\"¥ 1,618,000\\\"}\",\n      \"button\": \"红色 '抢' 按钮\",\n      \"floating_animation\": \"半透明爱心沿右侧边缘向上浮动\"\n    },\n    \"bottom_bar\": {\n      \"input_field\": \"'说点什么...'\",\n      \"icons\": [\"笑脸\", \"三个点\", \"购物车\", \"礼物盒\", \"分享\"]\n    }\n  }\n}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/14036/01.jpg","partial":false},{"id":10262,"c":"ThinkAI / App / 网页设计","t":"日本儿童英语落地页首屏设计","p":"目标：为忙碌的职场妈妈设计的家庭英语课程创建一张垂直方向的日本落地页首屏（First-view）主图，右侧为温馨的亲子学习照片，左侧为醒目的销售文案。\n\n画布：垂直手机端落地页/首屏设计，675×1200 像素或 9:16 比例，奶油白色背景，柔和的粉彩配色，空间感通透，营造亲切的家庭氛围。\n\n视觉风格：简洁的日式网页广告设计，圆润的形状，手绘装饰元素，采用粉红、棕色、黄色、薄荷绿和天蓝色。将明亮的日常生活照片融入图形化的落地页布局中。排版需大字号、圆润且易读；重点词汇使用鲜艳的粉色强调。\n\n主图区域：右半部分展示一位日本妈妈和幼童坐在木桌旁进行家庭英语闪卡学习。妈妈穿着简单的奶油色衬衫坐在孩子身边；孩子穿着黄色条纹上衣，手里拿着一张写有“apple”的苹果插画卡片。桌子最右侧放置一台平板电脑，上面贴有可爱的贴纸，文字为“Let’s enjoy English!”。桌上摆放四张清晰可见的英语闪卡：1) 孩子手中的苹果卡，2) 猫咪卡，3) 小狗卡，4) 球类卡。用柔和的矩形肤色模糊处理两人的面部，但保留头发、衣服、手部和动作细节。背景包含植物、置物架、柔和的日光窗帘，右上角悬挂粉彩三角旗。\n\n页眉：左上角放置 Logo，包含一个小房子图标和品牌文字“おうち英語きっず”，其中“おうち”为粉色，“英語”为深棕色，“きっず”为蓝色。\n\n文本内容：左上方添加一个粉色虚线气泡，内含“忙しいママでも続けやすい”及一颗小爱心。左侧大标题：“1日10分、 おうちで英語が 好きになる。” 将“10”、“英語”和“好き”设为亮粉色，其余文字为深棕色，并在标题下方添加黄色笔触下划线。下方副标题：“30代ワーキングマザーのための 子どもおうち英語講座”。添加小字正文：“英語が苦手でも大丈夫。 動画・ワーク・声かけ例つきで、 親子で楽しく続けられます。”\n\n优势卡片：在下方中部一行内包含三个圆角功能卡片：1) 粉色时钟图标配“1回10分”，2) 绿色爱心图标配“ママの英語力不要”，3) 蓝色房子图标配“自宅でOK”。\n\nCTA（行动号召）：底部附近添加一个大的圆角亮粉色按钮，白色文字为“無料体験レッスンを見る”，右侧配有一个白色圆形箭头图标。下方添加一个小手机图标和文字“スマホでOK・今すぐチェック”，并配有粉色小感叹号。\n\n装饰：添加小爱心、闪光线条、星星、圆点，底部边缘采用扇形云朵状奶油色形状，右下角放置一个可爱的笑脸云朵图标。整体风格保持柔和、愉悦、值得信赖且注重转化率。\n\n可自定义细节：使用品牌名称 {argument name=\"brand name\" default=\"おうち英語きっず\"}，主标题 {argument name=\"main headline\" default=\"1日10分、おうちで英語が好きになる。\"}，目标受众行 {argument name=\"target audience\" default=\"30代ワーキングマザーのための 子どもおうち英語講座\"}，CTA 按钮文字 {argument name=\"CTA text\" default=\"無料体験レッスンを見る\"}，以及平板电脑贴纸短语 {argument name=\"tablet phrase\" default=\"Let’s enjoy English!\"}。\n\n约束条件：可见文字必须严格使用指定的日语文本，保持专业的落地页首屏布局，包含恰好三个优势卡片和四个闪卡，画面中不得出现其他人，无水印，无浏览器边框。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/236
