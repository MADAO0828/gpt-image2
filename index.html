81/01.jpg","partial":false},{"id":10263,"c":"ThinkAI / App / 网页设计","t":"水墨手稿风格表现力肖像","p":"使用上传的照片作为主要的人脸参考。保留参考图中人物的面部结构、肤色、胡须形状、鼻子、眼睛、表情、相似度和比例。\n\n创作一张具有戏剧性和强烈视觉冲击力的 {argument name=\"view angle\" default=\"侧面肖像\"}，采用 {argument name=\"art style\" default=\"表现力水墨素描与混合媒介插画风格\"}。人物应呈现出强烈、混乱且充满情感张力的状态，其面部和上半身覆盖着神秘的手写文字、抽象符号以及环绕面部轮廓的字形标记，暗示着内心的动荡与深层含义。\n\n让他穿着一件 {argument name=\"clothing\" default=\"深色抽象夹克\"}，由厚重的纹理笔触、锐利的线条、鲜艳的水墨点缀、细腻的钢笔细节、狂野的笔触、泼墨以及精准的涂抹感构成。视觉语言应呈现出原始、叛逆、大胆、实验性和编辑感，将精准的插画与概念艺术融为一体。\n\n使用 {argument name=\"background style\" default=\"苍白的古羊皮纸\"} 背景，带有细微的颗粒感、褪色的纸张纹理、精致的线条、墨渍，营造出古老手稿或被遗忘文档的质感。保持构图的高对比度、表现力、强烈感和艺术精准度。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23623/01.jpg","partial":false},{"id":10264,"c":"ThinkAI / App / 网页设计","t":"激光切割纸艺城市雕塑","p":"<papercraft_paradox> ^ / \\   <-- [ AI_INFER: 由纸张折叠而成的 {argument name=\"city\" default=\"[城市名称]\"} 最高摩天大楼 ] /   \\         /     \\        /_______\\         \\       / <-- [ 带有 AI_INFER 的纸质轨道：当地交通工具在倒置行驶 ]      \\     /          \\   / <-- [ AI_INFER: 从纸张上切割出的 {argument name=\"city\" default=\"[城市名称]\"} 桥梁与河流 ]        \\ /            v   </papercraft_paradox> 指令： 1. 渲染为物理的、激光切割的纸板和纸艺桌面雕塑。 2. {argument name=\"city\" default=\"[城市名称]\"} 的城市网格构成一个完美的、不可能实现的彭罗斯三角 (Penrose Triangle)。 3. 视觉错觉必须从摄像机的视角完美呈现。文字和网格线印在纸板边缘。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23575/01.jpg","partial":false},{"id":10265,"c":"ThinkAI / App / 网页设计","t":"富士山列车壁纸","p":"仅以 REFERENCE_0 作为电影级桌面壁纸的灵感来源，将海滨威尼斯街道场景替换为全新的日本日常旅行场景。创作一张 16:9 的超高清 4K 壁纸，画面背景需以 {argument name=\"destination landmark\" default=\"富士山\"} 为主，前景为一辆 {argument name=\"vehicle\" default=\"日本通勤列车\"} 正在穿过桥梁，时间设定在 {argument name=\"time of day\" default=\"温暖的黄金时刻日落\"}。画面中需包含 3 节清晰可见的连通车厢，行驶在长桥之上；桥下为河床，左侧为树木繁茂的山丘，地标山脚下有远处的城镇和层叠的山峦，天空清澈湛蓝，点缀着几朵柔和的云彩。请保留参考图真实的旅行摄影质感、温暖的电影级光影、自然的色彩分级、锐利的细节以及适合作为壁纸的构图，但请勿保留原图中的棕榈树、海滩、商店、汽车、道路或标识。画面中不得包含文字、Logo、作为主体的人物或水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23664/01.jpg","partial":false},{"id":10266,"c":"ThinkAI / App / 网页设计","t":"等距视角商务人士素材表","p":"目标：创建一张整洁的等距矢量插图，在同一画布上展示 21 个独立的商务人士姿势和办公微场景，如同可重复使用的角色素材集合。\n\n画布：宽幅 16:9 横向画布，浅灰色或灰白色背景，无边框，无标题文字，无标签，无水印。将主体排列为整齐的 3 行 7 列网格，保持充足的间距，并在每个角色或办公桌下方添加柔和的灰色椭圆形阴影。\n\n视觉风格：现代等距企业插图，半扁平矢量渲染，带有微妙的渐变和柔和的阴影，边缘清晰，比例写实但简化，氛围中性专业。使用 {argument name=\"background color\" default=\"very light gray\"}。角色穿着 {argument name=\"business outfit style\" default=\"白衬衫、深蓝色裙子或长裤、深色鞋子、男士佩戴简约领带\"}；女性留棕色束发，男性留棕色短发。使用白色、深蓝色、炭灰色、棕色木纹、灰色金属和黑色鞋子的克制配色方案。\n\n布局与精确场景数量：包含 21 个独立的插图，从左到右排列为三行，每行七个。\n\n顶行，7 个场景：1) 手持深色平板电脑或剪贴板站立的商务女性，2) 从背后看正在白板上写字的商务女性，3) 手持外带咖啡杯行走的商务女性，4) 站立并使用笔记本电脑的商务女性，5) 一手放在耳边仿佛在打电话的站立商务女性，6) 站立并在黑色剪贴板上写字的商务女性，7) 坐在木桌旁使用笔记本电脑的商务女性。\n\n中行，7 个场景：1) 手提黑色公文包站立的商务男性，2) 两位握手的商务男性，3) 一边行走一边阅读纸质文件的商务男性，4) 俯身在木桌上敲击笔记本电脑的商务男性，5) 坐在黑色办公椅上翘着二郎腿、一手托腮的商务男性，6) 站立并打电话的商务男性，7) 双手插兜、姿态随意的站立商务男性。\n\n底行，7 个场景：1) 手持平板电脑和触控笔匆忙奔跑的商务女性，2) 在高大的灰色办公架上放置或取回活页夹的商务男性，3) 双拳高举庆祝的商务男性，4) 坐在木桌边缘、手持外带咖啡的商务女性，5) 坐在木桌旁使用笔记本电脑的商务女性，6) 坐在深色休闲椅上、一手托腮思考的商务男性，7) 手持蓝色文件夹并打电话的商务女性。\n\n主体细节：保持所有人物为小型全身像，采用一致比例的 3/4 等距视角。办公桌为带有细灰色桌腿的简约棕色桌面；椅子为合适的深色办公椅；白板带有细灰色边框和支架；架子为灰色并带有可见的活页夹。强调办公姿势、沟通、会议、行走、思考和生产力。使用 {argument name=\"character hair color\" default=\"棕色\"} 和 {argument name=\"primary accent color\" default=\"深蓝色\"}。\n\n约束条件：图像中不得出现任何文字、Logo，拒绝照片级写实，避免夸张的卡通脸，除个人道具和阴影外，不包含背景环境。保持构图通透、间距均匀，适合作为商务演示素材。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23677/01.jpg","partial":false},{"id":10267,"c":"ThinkAI / App / 网页设计","t":"Y2K 星夜桌面","p":"创作一张 Y2K 未来主义 Windows 桌面重构图，将梵高《星夜》呈现为发光的赛博朋克操作系统截图。画布为 4:3 的桌面壁纸，采用深群青色、霓虹紫、电光蓝、青色和金色，以厚涂画笔笔触在天空中形成巨大的漩涡星云。保留《星夜》的构图：左下角前景中高耸的黑色柏树状尖塔、起伏的深色山丘、被改造成未来城市的发光村庄，以及倒映着紫蓝色霓虹灯光的河流或海湾。添加透明的玻璃拟态 Windows 2000/XP 风格 UI 叠加层，包含紫色铬合金质感、光晕、扫描线微光、像素字体和小型标题栏按钮。\n\n桌面布局：最左侧是一个垂直的半透明侧边栏，从上到下依次排列 8 个桌面图标，标签分别为：“my pc”、“internet”、“e-mail”、“msn”、“music”、“pictures”、“shop”、“explore”。在左上角放置一个标题栏，标签为“Starry_Night.vin”，菜单项包括“file”、“edit”、“view”、“tools”、“help”。底部放置一个发光的紫色任务栏，左侧带有圆形的“start”按钮，右侧为系统托盘，显示时间“02:37 AM”；在右下角附近包含一个回收站图标，标签为“recycle bin”。\n\n在右侧添加 3 个浮动窗口。窗口 1（右上）：一个标题为“now playing”的音乐播放器，包含一个小方形专辑缩略图、曲目文本“vincent’s dream”和“sleepy gogh”、五个空心星级评分框、时间戳“01:37 / 04:28”、进度条以及上一曲/暂停/下一曲控件。窗口 2（中右）：一个标题为“about: painting.exe”的信息面板，标题为“THE STARRY NIGHT”，列出“vincent van gogh”、“1889”、“oil on canvas”、“remixed in: 3000”、“resolution: 1024x1280”、“color mode: neon rgb”、“size: 1.37 mb”，底部文本为“status: timeless.”；在此面板右侧包含一个发光的线框地球图形，右下角有一个小爱心轮廓。窗口 3（下右）：一个标题为“untitled - notepad”的记事本窗口，菜单项包括“file”、“edit”、“format”、“view”、“help”，内容为“maybe the stars / are just windows / to other worlds. / / -vvg”。\n\n风格限制：使整张图像看起来像怀旧的 21 世纪初蒸汽波桌面界面与表现主义油画的融合；使用发光边缘、透明紫色面板、清晰易读的白色像素文本、柔和的 CRT 显示器光晕，避免使用现代扁平化设计。保持所有可见文本与指定内容完全一致，避免添加额外的窗口、角色、徽标或水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23503/01.jpg","partial":false},{"id":10268,"c":"ThinkAI / App / 网页设计","t":"Y2K 未来主义风格 Mona Lisa 桌面","p":"目标：创作一张达芬奇（Leonardo da Vinci）名作 Mona Lisa 的 Y2K 未来主义混搭作品，作为复古电脑桌面壁纸，将文艺复兴时期的肖像画与光泽感十足的赛博美学相结合。\n\n画布：4:3 横屏图像，1024×768 分辨率质感，全屏构图，在紫色科幻城市日落背景之上叠加半透明的 Windows 98 / 21 世纪初操作系统界面。\n\n主体：将 {argument name=\"character name\" default=\"Mona Lisa\"} 置于画面中心，从腰部以上构图，姿态模仿原作，双手交叠，带着平静而神秘的微笑，面部呈现柔和的晕涂法（sfumato）质感，留着深色波浪卷发。她头上架着反光铬合金太阳镜，戴着小发夹、吊坠耳环、金属轨道式颈圈，身穿薰衣草色拉链前开式未来感上衣，外罩一件带有光泽褶皱的透明虹彩塑料夹克。保留古典文艺复兴时期的面部质感，同时用 Y2K 赛博时尚对周围的一切进行现代化改造。\n\n背景：将托斯卡纳风景替换为黄昏时分梦幻般的未来主义滨水城市。使用高耸的针状摩天大楼、悬浮的环形结构、远处的发光塔、粉紫色云层、反光水面以及细小的蓝紫色灯光。色调为薰衣草紫、紫罗兰色、铬合金色、玫瑰金和电光蓝，带有柔和的辉光和轻微的 CRT 显示器颗粒感。\n\n桌面 UI 叠加层：使用带有紫色发光边框的半透明玻璃拟态（glassmorphism）窗口、像素字体、斜面按钮和细微的扫描线伪影。包含确切的 5 组可见界面：\n1. 左上角的绘图窗口，标题为“untitled - Paint”，菜单栏显示“File Edit View Image Colour Help”，侧边有垂直工具栏，底部有一排小色块；画布内显示未来主义天际线。\n2. 左侧中部的音乐播放器，标题为“now playing”，显示紫色 CD 图标，曲目文本为“back to renaissance”和“da vinci remix”，以及播放控制按钮。\n3. 左侧垂直启动栏，包含 6 个带标签的图标：“internet”、“e-mail”、“msn”、“music”、“shop”和“files”。\n4. 右上角的系统资料窗口，标题为“MONA.LISA”，带有线框头像图形和生物识别文本：“heartbeat: 88 bpm”、“mood: enigmatic”、“location: italy, 1503”、“remixed in the year 3000”以及“© da vinci.exe”。\n5. 右下角的记事本窗口，标题为“untitled - notepad”，菜单栏显示“File Edit Format View Help”，文本内容为诗句：“in a world / full of filters / be timeless / --M.L.”\n\n附加物体：在右侧放置一张铬合金桌子，上面摆放着一个反光玻璃球和一个星形铬合金装饰物，两者均符合 Y2K 未来主义风格。\n\n底部任务栏：在底部边缘添加一个横跨全屏的半透明紫色 Windows 风格任务栏，左侧带有星形“start”按钮，右侧显示时间“3:33 AM”。\n\n视觉风格：超精细数字绘画，融合文艺复兴写实主义、光泽塑料感、铬合金反光、全息紫色 UI、梦幻蒸汽波（vaporwave）灯光、复古未来主义 Y2K 赛博美学、柔和胶片颗粒、细微的像素/CRT 质感以及高光泽度。使图像看起来像是一幅运行在未来主义早期互联网桌面上的永恒古典大师肖像画。\n\n约束条件：保留标志性的 Mona Lisa 姿势和表情，确保所有文字清晰可辨，除列出的 5 组 UI 外不要添加额外的界面，避免使用现代扁平化 UI 设计，禁止添加水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23502/01.jpg","partial":false},{"id":10269,"c":"ThinkAI / App / 网页设计","t":"Y2K 未来主义《呐喊》桌面","p":"目标：创作一张超现实的 Y2K 未来主义 Windows XP 桌面重制版，以爱德华·蒙克的《呐喊》为背景，仿佛画作本身就是电脑壁纸，而操作系统界面则悬浮于其上。\n\n画布：4:3 桌面截图，1024×768 的质感，带有 20 世纪 90 年代末至 21 世纪初的亮面电脑 UI。主色调为霓虹紫、紫外光色、品红、电光蓝、黑铬色以及橙色落日高光。整体应呈现 CRT 显示器的光晕感、玻璃般的透明度、类似扫描线的柔和感以及赛博朋克风格的反射效果。\n\n背景壁纸：将 {argument name=\"painting subject\" default=\"爱德华·蒙克的《呐喊》\"} 重构为一个未来主义的霓虹港口场景。标志性的桥梁步道从左下角延伸至中心，湿润且具有镜面反射效果，带有明亮的紫色灯带。天空是充满表现主义色彩的漩涡，由发光的紫色、粉色、橙色和蓝色笔触构成，如同液态光纤轨迹。未来主义的城市天际线在水面另一侧升起，伴有发光的塔楼和倒影。左侧桥上有两个深色的人影。在左下方的中心前景处，加入那个身穿亮面黑铬长袍的呐喊人物，双手捂脸；面部区域被一个平面的暗紫色-灰色矩形块遮盖，如同刻意的审查或缺失的图像占位符。\n\n桌面外壳：在最左侧添加一列垂直图标，共 8 个桌面图标，每个图标都散发着紫蓝色光芒，并带有白色小写字母标签：1) my computer，2) internet，3) e-mail，4) msn，5) music，6) pictures，7) settings，8) help，底部附近还有一个标为 trash 的回收站图标。使用厚实的 Y2K 图标样式，并带有玻璃球效果。\n\n任务栏：在底部创建一个半透明的紫色 Windows XP 风格任务栏。最左侧是一个圆角的“开始”按钮，带有 Windows 徽标和标签 {argument name=\"start button text\" default=\"start\"}。最右侧的系统托盘中，包含微小的状态图标和显示为 {argument name=\"clock time\" default=\"11:11 PM\"} 的时钟。\n\n打开的窗口：包含 4 个悬浮的半透明紫色应用程序窗口，带有像素字体、斜面边框以及微小的最小化/最大化/关闭按钮。\n\n窗口 1，左上角：一个 Microsoft Paint 风格的窗口，标题为“untitled - Paint”。菜单栏显示“File  Edit  View  Image  Options  Help”，左侧有垂直工具栏，小画布上显示着霓虹港口天际线和漩涡天空的微缩版本，底部有一条包含多种紫色、粉色、蓝色和灰色色块的调色板。\n\n窗口 2，右上角：一个音乐播放器窗口，标题为“now playing”。显示霓虹城市网格的方形专辑封面，曲目信息为：“scream.wav”、“the angst mixtape”、“track 03”。添加波形可视化效果、进度时间“01:42 / 03:24”、进度条以及三个播放控制按钮：上一曲、暂停、下一曲。\n\n窗口 3，右侧中部：一个系统信息窗口，标题为“system.exe”。内部文本应显示：“THE SCREAM.EXE”、“artist: edvard munch”、“year: 1893”、“remixed in: 3000”、“resolution: 1024x1280”、“color mode: neon rgb”、“size: 1.42 mb”、“status: existential”。右侧包含一个发光的紫色线框骷髅/头部图形，底部有一个分段加载条。\n\n窗口 4，右下角：一个记事本窗口，标题为“untitled - notepad”。菜单栏显示“File  Edit  Format  View  Help”。正文文本精确显示为：“nothing is real”、“but the signal”、“and the scream”、空行、“-//user”。\n\n视觉风格：{argument name=\"style phrase\" default=\"Y2K 未来主义，赛博朋克蒸汽波，半透明 Windows XP 界面，霓虹表现主义油画质感\"}。使界面清晰易读，同时将其与绘画般的漩涡霓虹环境融为一体。使用强烈的亮面反射、紫色轮廓光、玻璃面板、像素化 UI 排版以及怀旧的早期互联网美学。\n\n约束条件：禁止使用现代扁平化设计，禁止出现照片级真实的人物，除指定的 4 个窗口外不得有额外窗口，除列出的图标和回收站外不得有额外桌面图标，禁止添加水印，确保所有可见 UI 文本的可读性。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23501/01.jpg","partial":false},{"id":10270,"c":"ThinkAI / App / 网页设计","t":"极简主义时尚编辑海报","p":"为 {argument name=\"brand name\" default=\"时尚品牌名称\"} 创建一张高端现代编辑品牌海报。\n主题：\n{argument name=\"theme\" default=\"编辑 / 时尚 / 生活方式主题\"}\n\n风格与艺术指导：\n当代极简主义编辑设计\n单色品牌美学\n简洁的奢华构图\n现代创意代理机构视觉识别\n柔和的摄影棚摄影风格\n超大抽象排版整合\n极简几何品牌设计\n高端生活方式广告美学\n斯堪的纳维亚风格的视觉简洁感\n现代艺术指导海报设计\n\n主体：\n一位时尚且写实的年轻女性，显眼地坐在设计师椅上\n与单色调相匹配的前卫时尚穿搭\n放松且自信的姿势\n当代编辑造型\n高端写实摄影棚摄影\n现代表现力时尚美学\n强烈的个性和视觉识别度\n主体和家具下方柔和的写实阴影\n大型设计师家具作为构图的一部分融入其中\n\n布局与构图：\n与参考设计完全相同的极简构图和视觉结构\n背景中占据主导地位的大型超大抽象字母“R”或排版形状\n主体非对称地放置在前景中\n宽敞的留白\n角落处极简的品牌细节\n排版与主体之间强烈的视觉平衡\n受编辑杂志启发的层级结构\n简洁的现代对齐方式\n极少的杂乱感和高度精致的间距\n\n文字与排版：\n超大几何排版\n极简品牌文字\n纤细的现代无衬线字体\n抽象字母形式整合\n小型编辑元数据文字\n奢华当代排版层级\n\n深度与光影：\n柔和的电影感摄影棚灯光\n柔和的单色阴影\n平滑的渐变光影\n高端编辑深度\n柔和的写实反射\n当代奢华氛围\n\n额外设计细节：\n极简颗粒质感\n简洁的现代渐变\n抽象几何品牌元素\n柔和的单色过渡\n设计师家具美学\n极简艺术海报氛围\n\n调色板：\n{argument name=\"color palette\" default=\"绿色\"}\n色调单色变化\n柔和的中性高光\n简洁的编辑对比度\n\n质量：\n超写实编辑摄影\n高端品牌海报\nBehance 品质的现代构图\n当代时尚广告品质\n与参考图完全相同的视觉识别和布局。与参考图像相同的人脸。\n8K 超高分辨率。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23470/01.jpg","partial":false},{"id":10271,"c":"ThinkAI / App / 网页设计","t":"AI 生成器界面中的 Minecraft 游戏画面","p":"目标：创建一个方形的深色 AI 图像生成网页界面截图，展示一张生成的 Minecraft 游戏截图。界面应呈现出用户输入了 {argument name=\"user prompt\" default=\"Generate a screenshot as if I'm playing Minecraft.\"} 后，下方显示渲染出的游戏图像的效果。\n\n画布：1:1 正方形图像，约 576 x 576 像素，深黑色背景，内容靠左上角对齐，右侧和底部留有大面积黑色空白。\n\n顶部 UI 布局：在最左上角显示白色提示词文本：“Generate a screenshot as if I'm playing Minecraft.”。下方显示一个蓝色的小标签“Model”，旁边带有垂直的三点菜单图标。再下方绘制一个宽大的深色圆角下拉栏，其中包含蓝色文本“Thinking”和一个向下的小箭头。UI 应具有深色模式下极简网页应用的感觉。\n\n生成的图像面板：在下拉栏下方，放置一个带有轻微圆角的大型方形 Minecraft 风格游戏截图。截图应为明亮的方块村庄场景的第一人称视角。\n\nMinecraft 场景细节：展示一个阳光明媚的白天村庄，蓝天上有 8 团清晰可见的白色方块云。左侧前景包含一个部分可见的木制与圆石房屋，配有木门、木板屋顶、圆石墙和点燃的火把。远景中心展示一座带有黄色发光窄窗的灰色石制教堂/塔楼。周围包括一个小村屋、一棵绿叶树、草方块、泥土路径和围栏农田。农田应包含金色的麦子、绿色作物、木围栏边界，以及村庄/农场区域周围 6 个清晰可见的带黄色火焰的火把柱。保持 Minecraft 的真实美学：立方体方块、像素化纹理、低分辨率游戏渲染，不要写实风格。\n\n第一人称 HUD 和装备：在左下角前景显示一面举起的盾牌。在右下角前景显示玩家手持铁剑。沿底部绘制 Minecraft HUD，包含 10 颗红心、10 个饥饿鸡腿、绿色的经验等级数字“18”以及 9 格快捷栏。快捷栏应从左到右显示这 9 个可见槽位：盾牌图标、铁剑、镐、斧头、铲子、空槽或暗槽、64 个方块堆叠、23 个火把/物品堆叠、17 个物品堆叠，如果空间允许，最右侧边缘显示水桶图标。使 HUD 略显像素化并符合游戏原貌。\n\n视觉风格：整张图片看起来应像是一个展示了生成式 Minecraft 游戏画面的浏览器端 AI 生成器的真实截图，而不是一张干净的独立渲染图。使用深色 UI 边框、清晰的小号文本，并将方块感的游戏截图嵌入其中。无水印，无额外标题，无 Logo。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23345/01.png","partial":false},{"id":10272,"c":"ThinkAI / App / 网页设计","t":"赛博朋克奇幻集换式卡牌 App","p":"目标：为一款名为 {argument name=\"app name\" default=\"CARDIFY\"} 的自定义集换式卡牌生成器创建一个暗黑未来风格的移动端 Web App 界面，展示一张已完成且准备最终确认的奇幻 TCG 卡牌。\n\n画布：垂直智能手机截图，720×1200 比例，黑色与炭灰色背景，配有细长的霓虹青色分割线和圆角边框。整体外观为高端赛博朋克 UI 与高细节奇幻卡牌艺术的结合。\n\n布局：顶部导航栏包含 3 个可见元素：左侧是一个大型的 CARDIFY 风格化 Logo，右上角附近是一个圆形的霓虹青色购物车图标，最右侧是一个霓虹青色的三横线汉堡菜单图标。下方是一个位于细青色圆角矩形面板内的居中卡牌预览。在卡牌预览下方，显示一行灰色等宽小字，内容为“Tap to flip card”。在底部，放置 3 个操作按钮：一个带有青色轮廓的大型矩形按钮，标注为“Finalize →”；一个带有黄色轮廓的小型方形按钮，带有扳手图标；以及一个带有紫色轮廓的小型方形按钮，带有下载图标。\n\n集换式卡牌设计：该卡牌为垂直方向的奇幻收藏卡，带有圆角、华丽的红金金属边框、发光的深红色高光，以及环绕边框的电紫色能量。顶部的卡牌标题栏以大型白色衬线字体显示 {argument name=\"card title\" default=\"The Moosk\"}。标题栏右侧有 3 个圆形的法力/类型图标：一个骷髅图标、一个红龙/漩涡图标和一个蓝色水滴图标。下方的类型栏以金色衬线字体显示 {argument name=\"type line\" default=\"Legendary Creature — Human Rogue\"}，右侧有一个小型的星形稀有度徽章。下方的风味描述框以斜体白色衬线字体显示 {argument name=\"flavor text\" default=\"He walks between worlds.\"}。右下角的攻防数值徽章以大型加粗白色数字显示 {argument name=\"power toughness\" default=\"5/4\"}。\n\n卡牌主图：一张极具戏剧性的动漫奇幻插画，描绘了一名孤独的男性盗贼背影，站在日落时分的岩石悬崖上。他留着深色短发，身穿深色盔甲，巨大的黑色破烂斗篷在风中向左飘动。他右手持有一把向下指的橙红色发光长剑。远处是发光的海平线，伴有巨大的落日、红紫色的云彩以及水边一座黑暗的奇幻尖塔城市。紫色闪电弧和魔法能量带环绕着角色和边框，红色火花散落在斗篷和前景中。使用极其细腻的数字绘画风格，高对比度，电影级光效，饱和的洋红色、紫罗兰色、深红色、橙色和金色。\n\n约束：保持屏幕为移动端 App 原型，而非独立的卡牌。使用 1 个卡牌预览，3 个顶部导航元素，3 个法力/类型图标，以及 3 个底部操作按钮。清晰保留所有可见的 UI 文字。不要添加额外的卡牌、弹窗、水印或不相关的界面面板。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23350/01.jpg","partial":false},{"id":10273,"c":"ThinkAI / App / 网页设计","t":"电影感线程归档搜索海报","p":"目标：创作一张电影感竖版科技海报，展示在开发者应用中通过内容和分支名称搜索历史对话线程的功能。\n\n画布：竖版 2:3 构图，深色高端编辑风格，深海军黑背景，带有细微的星尘感，一束温暖的金色光线从右上角射入。\n\n主标题：顶部居中，大号加粗中文标题 {argument name=\"headline text\" default=\"按内容与分支搜历史线程\"}。下方居中放置较小的金色副标题 {argument name=\"app version\" default=\"Codex App 26.527\"}。在副标题下方添加一条带有小菱形的装饰性分割线。\n\n主体：下半部分展示一个四分之三视角的旧式深色金属档案柜，其中一个抽屉向观众方向拉开。抽屉正面有一个黄铜标签牌，上面写着“THREAD ARCHIVE”，并配有一个弯曲的黄铜把手。柜体表面应呈现厚重、哑光、略带磨损的真实质感，并具有浅景深效果。\n\n抽屉内容：在打开的抽屉内，展示 4 张醒目的堆叠纸质线程卡片，每张卡片如同带有圆角的归档索引卡，采用暖象牙色纸张，左侧有一个小巧的深色聊天气泡图标。可见的卡片文字为：1) “导出功能支持哪些格式?”，分支标签为 “feature/export-csv”；2) “新版 API 兼容性讨论”，分支标签为 “refactor/api-v2”；3) “用户登录流程的边界情况”，分支标签为 “fix/login-edge”；4) 最前方的发光卡片 “如何优化加载性能?”，分支标签为 {argument name=\"featured branch tag\" default=\"feature/perf-opt\"}。最前方的卡片应发出最亮的光芒，仿佛已被搜索定位。\n\n悬浮 UI 元素：在抽屉右侧添加 2 个悬浮的搜索结果元素：一个发光的分支标签 “feature/perf-opt”，通过一条金色的虚线路径与最前方的卡片相连；以及一个带有三个点的小型轮廓聊天气泡。在抽屉内的每张卡片上各添加 1 个分支标签，样式为带有分支图标的细长圆角矩形。\n\n光影与氛围：在被选中的卡片和悬浮分支标签周围使用温暖的金色粒子轨迹和尘埃微粒，与冷色调的深色柜体形成对比。画面需充满氛围感、优雅、高端且略带魔幻色彩，将归档搜索功能可视化为光线寻找正确线程的过程。\n\n视觉风格：写实 3D 插画与精致产品营销海报设计相结合，电影级光效，柔和光晕，浅景深，清晰的排版，细微的颗粒感，无人物，无额外标志，无水印。保持所有文字清晰可读，除指定的标题、副标题、卡片文字、分支标签和抽屉标签外，避免添加任何额外标签。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23358/01.jpg","partial":false},{"id":10274,"c":"ThinkAI / App / 网页设计","t":"未来感 AI Windows 登录海报","p":"目标：创作一张高端未来科技海报，展示 AI Agent 使用 Windows 的场景，营造电影般的蓝黑色氛围和高级产品发布感。\n\n画布：垂直 2:3 构图，768×1152 风格，深海军蓝背景，带有柔和的体积光，左侧有模糊的窗影图案。场景位于底部光亮的黑色反射平台之上。\n\n文字内容：在顶部中心放置 2 行文字：大号加粗标题“{argument name=\"headline text\" default=\"Computer Use 登陆 Windows\"}”，其中“Computer Use”为白色，“登陆”为白色，“Windows”为淡冰蓝色；下方为较小的细体文字“{argument name=\"subtitle text\" default=\"Codex App 26.527\"}”，颜色为浅蓝灰色。使用简洁的现代无衬线字体，居中对齐，清晰锐利，无需其他文字。\n\n主体：一个透明的悬浮玻璃质感 Windows 风格应用面板，呈一定角度透视，悬浮在反射底座上方。面板具有圆角、斜面发光边缘、淡淡的磨砂玻璃表面，左上角有一个小的 Windows 标志。右上角添加一个标题栏，包含 3 个窗口控制按钮：最小化、最大化和关闭。\n\n界面细节：在玻璃面板内，展示一个极简的深色 UI，左侧边栏垂直堆叠 6 个图标：菜单、主页、文档、文件夹、网格和设置。内容区域左上方有淡淡的水平文本条，中间有一个大矩形，底部区域有程式化的键盘轮廓。保持 UI 半透明且低调。\n\n机械交互：展示 2 只铬合金机械手，从玻璃界面中圆形的闪光传送门中伸出。第 1 只手位于右上角内容区域，向前伸出并指向鼠标指针附近的明亮点击光晕。第 2 只手位于左下方，悬停在虚拟键盘上方并按下一个发光的按键。机械手应具有高度精细的抛光金属质感和关节细节，带有冷蓝色反射，传送门周围有微妙的动态光条。\n\n光影与风格：使用电影级轮廓光、冰青色光效、逼真的反射、景深、柔和的雾气以及高端科幻写实感。整体色调应为深海军蓝、炭灰、银铬色、磨砂玻璃和电青色。使画面优雅、富有氛围感且技术精良。\n\n约束：保持构图简洁且居中；包含 2 行文字、2 只机械手、6 个侧边栏图标和 3 个窗口控制按钮。除简单的 Windows 风格标志外，不要添加其他 Logo，不要添加额外的段落或水印，避免杂乱的 UI 文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23355/01.jpg","partial":false},{"id":10275,"c":"ThinkAI / App / 网页设计","t":"磨砂玻璃极简质感","p":"背景具有 {argument name=\"background color\" default=\"浅纯米色\"} 磨砂玻璃质感，呈现极简风格。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23327/01.jpg","partial":false},{"id":10276,"c":"ThinkAI / App / 网页设计","t":"ChatGPT 人像生成结果截图","p":"在白色界面上创建一个简洁的 ChatGPT 截图风格图像生成结果。在右上角放置一个圆角浅灰色提示词胶囊，其中包含中文文本 {argument name=\"prompt text\" default=\"一个女人\"}。主体内容是一个位于中心偏左的大型圆角矩形照片卡片，边角圆润。卡片内是一张 {argument name=\"subject\" default=\"a young woman\"} 的写实室内自拍风格半身像，她坐在或前倾于小型浴室或更衣室般的室内环境中。她留着蓬松的深棕色长发，露出肩膀，穿着白色罗纹细肩带吊带衫。光线温暖自然，背景为灰色墙壁，左侧有一个深色的垂直门框或柜子边缘。她的脸部被一个居中的垂直矩形棕色遮挡块完全覆盖，遮住了所有面部特征。在照片卡片的左下角，包含一个带有英文“Edit”标签的小型半透明深色圆角按钮。在照片卡片的右下角，包含一个小型半透明深色圆形分享/下载图标。在图像卡片下方，水平对齐显示四个小型界面控件：复制图标、点赞图标、点踩图标和三个点的更多图标。保持整体构图极简，留出充足的白色边距，无水印，无额外文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23212/01.png","partial":false},{"id":10277,"c":"ThinkAI / App / 网页设计","t":"磨砂玻璃质感作品集封面","p":"生成一张具有作品集封面质感的视觉作品，并聚焦于特定主题。核心主体不应完全展示，而是压缩在偏离中心轴的主要区域，沉浸在半透明的雾化表面与低饱和度背景场之间。主体的完整轮廓、次要细节及常规描述被压花玻璃颗粒、微小折射位移、乳白色雾化效果和低对比度模糊所吞没，仅在最能体现主题识别的位置留出一个干净、清晰的窄窗。该区域保留真实质感、较高对比度和必要的色彩，而其余部分则转化为暗调质感、柔化的轮廓、破碎的边缘以及被背景吞没的过渡。清晰的窄窗应如同从材质表面精准擦拭出的缝隙，尺寸克制但语义准确，作为观众进入主题的唯一强入口。背景源自主题的空间关系、材质属性、时间指向和情感温度，转化为大面积的低噪色场。上方或外部保留轻盈的空气感，一侧形成浅色呼吸区，主体所在区域则压入较低亮度。背景不承载常规场景叙事，而是发挥吞没边缘、承载白色文字以及营造距离感与记忆点的结构功能。色彩保持大面积低饱和度结构色、低亮度主色、少量集中真实色以及白色信息色之间的比例。色调随主题变化，而亮度层级、饱和度限制和局部色值保持稳定。画面采用三层结构：清晰、半清晰和失焦。清晰的窄窗负责主题识别，简短的粗体白色标题和数字保持半清晰且易读，主体的大部分、背景和底部微信息则进入雾化失焦状态。排版采用现代无衬线字体，白色或近白色。粗体标题简短厚重，看起来像是印在玻璃上并被表面轻微咬合。角落标识、边缘日期、序列号和底部微注形成元数据坐标系统，如作品编号、档案记录和制作参数，在不遮挡清晰窗口的前提下服务于阅读路径。整体表面保留可见的颗粒感压花玻璃触感，纹理密度随底层光影变化——暗部更致密，亮部更乳白，边缘带有精细折射和轻微位移。所有图像、物体和文字看起来仿佛被同一块材质压制而成。\n\n主题：{argument name=\"theme\" default=\"疯狂星期四肯德基\"}\n比例：{argument name=\"ratio\" default=\"9:10\"}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23197/01.jpg","partial":false},{"id":10278,"c":"ThinkAI / App / 网页设计","t":"GitHub README 古风社交动态","p":"目标：创建一个宽屏桌面截图，展示深色模式下的 GitHub 仓库 README 预览，呈现一个中国古代社交媒体动态 UI 的设计示例。\n\n画布：1200×612 像素横向截图，深蓝色 GitHub 界面，裁剪效果如同浏览器窗口，不显示浏览器地址栏。构图主体为大面积的深色 GitHub 背景，README 内容居中偏左。\n\nGitHub 页面布局：最上方显示 GitHub 文件面包屑导航和工具栏。包含 3 个面包屑/文件项：标记为“main”的分支选择器、仓库名称“GPT-Image2-Skill”以及文件名“README.zh.md”。下方左侧显示 3 个标签按钮：“Preview”、“Code”和“Blame”，随后是简短的元数据文本，内容约为“2865 lines (2093 loc) · 204 KB”。在工具栏右侧，包含 6 个小型 GitHub 操作按钮/图标，其中包括一个“Raw”按钮。保持 UI 清晰、深色且真实。\n\nREADME 内容：在深色页面上，在内容区域左上方放置一个简短的加粗白色中文标题：“宋代社交媒体动态”。在此标题下方及右侧，展示一个垂直的智能手机样式模拟图。\n\n手机模拟图主体：手机模拟图是一个以宋代为主题的社交媒体 App 界面，标题为 {argument name=\"app title\" default=\"宋朝朋友圈\"}。它具有温暖的深褐色背景、金色文字、羊皮纸纹理以及沉稳的历史美感。在手机屏幕顶部显示状态栏，包含 4 个可见状态元素：运营商文本“大宋移动 5G”、居中的纪年文本“元丰三年”、电量百分比“88%”以及电池图标。下方显示 3 个导航/标题元素：左侧返回箭头、居中的大标题“宋朝朋友圈”以及右侧相机图标。\n\n社交动态详情：仅展示 1 条动态。该动态左侧有 1 个方形头像，为宋代人物肖像，面部经过柔和模糊处理。头像右侧显示用户名 {argument name=\"username\" default=\"苏东坡 SuShi_Official\"}。下方包含中文动态文本：“刚到黄州，虽被贬但心情尚可。今日亲手做了东坡肉，味道绝佳。食谱见下图。” 将文本渲染为温暖的灰白色/金色书法 UI 字体。\n\n动态图片：在文本下方，展示 1 张大图片卡片，风格如同羊皮纸上的中国古画。画中描绘了一个淡青色盘子，盛放着一块色泽红亮的方形东坡肉，用深绿色草绳捆扎，浸在棕色酱汁中。图片卡片左侧包含竖排中国书法、一枚红色印章，背景上方有淡淡的水墨山水或枝叶细节。食物插画应具有绘画感，如同博物馆手稿与写实食物渲染的结合。\n\n互动区：在食物卡片下方，显示 1 行点赞信息，包含一个小红色圆形徽标图标，以及类似“黄庭坚、秦观、佛印 等 126 人觉得赞”的中文文本。下方开始显示 1 行可见评论，包含一个小头像和评论内容“王安石：呵呵”，在手机屏幕底部边缘处部分截断。\n\n视觉风格：整体截图应看起来像是一个包含生成式 UI 样本的真实 GitHub README 预览。使用深色 GitHub 配色、微妙的分隔线、细小的白灰色界面文字，并保持高对比度。嵌入的手机模拟图应呈现温暖、电影感、中国古风、羊皮纸与水墨风格，并带有柔和的暗角和逼真的阴影。\n\n约束：最终图像应保持为 GitHub 页面的截图，而非仅手机 UI。仅包含一个嵌入式手机模拟图、一条社交动态、一个头像、一张食物图片、一行点赞和一行可见评论。除指定的 GitHub 和 README 文本外，不要添加额外的面板、动态、水印或说明性标题。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23218/01.jpg","partial":false},{"id":10279,"c":"ThinkAI / App / 网页设计","t":"纽约大桥蓝调时刻壁纸","p":"以提供的纽约天际线参考图作为视觉和光影基础，创作一张 {argument name=\"resolution target\" default=\"4K 桌面壁纸\"}，采用 16:9 宽屏构图。将视角切换为以曼哈顿大桥为前景的滨水场景，清晰呈现其深色钢塔、悬索以及温暖的串灯。将原图中以帝国大厦为中心的天际线替换为背景中的下曼哈顿天际线，并在右侧突出显示世界贸易中心一号大楼。将氛围调整为 {argument name=\"time of day\" default=\"日落后的蓝调时刻\"}：深沉柔和的蓝灰色天空、闪烁的办公楼窗户、温暖的琥珀色桥灯，以及河面上柔和的倒影。添加平静的东河前景，呈现细微的涟漪、岸线轮廓以及增加深度的写实城市雾气。风格应为电影级写实、清晰、高细节，并针对壁纸用途进行精修，画面中不得包含人物、文字、标志或水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23228/01.jpg","partial":false},{"id":10280,"c":"ThinkAI / App / 网页设计","t":"史诗级垂直奇幻城堡壁纸","p":"史诗级垂直奇幻壁纸，云层中巨大的发光开口，绚丽的 {argument name=\"sky color\" default=\"蓝色\"} 天空，戏剧性的阳光射线，广阔的空中景观，云海之上漂浮悬崖上的几座宏伟的 {argument name=\"castle style\" default=\"英式中世纪\"} 城堡，孤立的城堡结构而非密集城市，石塔，哥特式城堡建筑，蜿蜒的小径，倾泻入云的瀑布，电影级规模，大气透视，超细节环境，深蓝与白色调，天体氛围，奇幻游戏海报美学，AAA 级关键艺术风格，高分辨率手机壁纸，3:4 纵横比，无文字，无 Logo","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23162/01.jpg","partial":false},{"id":10281,"c":"ThinkAI / App / 网页设计","t":"建筑蓝图与渲染图对比","p":"建筑可视化分割图，垂直 3:4 构图，上下两部分结构完美对齐。\n\n上半部分，{argument name=\"blueprint style\" default=\"深色奢华蓝图\"}：深海军蓝 / 炭蓝色背景，纤细的发光米金色线条，墙体带有轻微的 3D 挤压效果，简洁的现代无衬线字体标签，柔和的环境光。平面图显示 3 间卧室（左侧、右侧、右下角）、一个中央客厅、顶部中央的厨房和餐厅、2 间浴室、左侧连接的车库、前廊以及带露台的后院泳池。包含家具轮廓（床、沙发、餐桌）、门开启方向、窗户位置、动线以及精确的比例。\n\n下半部分，相同 {argument name=\"building type\" default=\"房屋\"} 的照片级逼真渲染图：现代单层设计，平层叠式屋顶，光滑的混凝土墙面搭配木质镶板，大面积玻璃窗。布局必须与蓝图完全一致，左侧车库，主入口与客厅对齐，后院泳池与蓝图占地面积匹配，窗户位置对应每个房间，卧室体块在外部正确位置可见。郊区环境，绿色草坪，极简景观，通往车库的整洁车道，以及配套的泳池露台。黄金时刻光照，柔和的自然光与逼真的阴影。略微抬高的正面视角，35mm 建筑镜头。\n\n硬性规则：蓝图与渲染图之间的房间位置必须完全一致，不得添加额外结构，所有门窗逻辑对齐，泳池大小和位置必须完全匹配。避免不匹配、幻想元素、不切实际的比例或杂乱的环境。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23050/01.jpg","partial":false},{"id":10282,"c":"ThinkAI / App / 网页设计","t":"四卡片 AI 灵感画廊","p":"目标：创建一个简洁的灵感画廊网页截图，展示 GPT 图像示例的双列瀑布流网格，包含四张清晰可见的大型圆角图像卡片，并配以极简的灰白色界面背景。\n\n画布：高垂直移动端风格截图，比例约为 3:4，白色至暖米色背景，窄边距，圆角卡片，卡片间距柔和。在最顶部，包含一个细长的浅米色胶囊状导航/页眉条，上面印有微小且模糊的大写文字“LIVE · LOVE · LICENSE”。\n\n布局：两列等宽卡片，由窄白色间距隔开。准确展示 4 张主要可见卡片：1) 左上角赛博朋克海报肖像，2) 右上角全息奇幻社交卡片场景，3) 左下角写意时尚素描肖像，4) 右下角 Q 版足球运动员形象。裁剪最底部，使第五张橙色卡片在折叠处下方隐约可见。\n\n卡片 1，左上角：一张垂直圆角海报，主体为 {argument name=\"character style\" default=\"一位留着长黑发的年轻街头时尚女性\"}，站在密集的日本赛博朋克拼贴墙前。使用巨大的红色笔触日式字体、分层贴纸、条形码、写有“DANGER”的警告标志、小标签、涂鸦青色喷漆痕迹，采用黑-红-米色调，呈现东京街头海报风格。人物身穿超大号浅色飞行员夹克，内搭黑色印花上衣和牛仔裤，配有链条，一只手臂举在头部附近。保持面部柔和模糊或遮挡。\n\n卡片 2，右上角：一个梦幻般的高调奇幻科技场景，采用桃色和金色光影。双手握着一张光亮的黑色智能手机风格社交资料卡。从卡片中升起一个发光的蓝白色全息图，主体为 {argument name=\"hologram subject\" default=\"一位身穿半透明浅蓝色长裙的优雅女性\"}，直立站立，伴有闪光、花瓣和光束。手机 UI 包含类似于“Algird”的个人资料名称、圆形头像缩略图、小图标和微小的不可读社交数据。浪漫的焦外成像、魔法粒子、半透明织物、电影级光效。\n\n卡片 3，左下角：白色背景的混合媒介时尚插画，主体为 {argument name=\"sketch subject\" default=\"一位穿着黑色蕾丝吊带和宽松粉色开衫的长发女性\"}。运用写意的石墨和水彩线条，凌乱的黑发，粉色和紫色点缀，人物周围有涂鸦。包含手写英文笔记：左侧写着“You got this.”，袖子上写着“LOVE”，右下角写着“Keep shining”，底部附近写着“for you”。添加小星星、爱心、墨迹飞溅和随意的速写标记。面部柔和模糊或不画五官。\n\n卡片 4，右下角：一个玩具般的 3D 漫画形象，主体为 {argument name=\"footballer\" default=\"克里斯蒂亚诺·罗纳尔多 (Cristiano Ronaldo)\"}，作为 Q 版运动员出现在无缝亮红色摄影棚背景中。他身穿黄色利雅得胜利队风格球衣，配有蓝色细节、队长袖标、7 号球衣、黄色球袜和银色球鞋。双臂交叉姿势，大头小身，姿态自信，呈现出光亮的收藏级人偶质感。面部柔和模糊或简化处理。\n\n视觉风格：明亮且经过精心策划的社交画廊美学，逼真的截图构图，圆角矩形缩略图，无重阴影，清晰的卡片边缘，高分辨率生成艺术展示。保持四种风格之间的对比：粗犷的海报拼贴、梦幻的全息照片、写意的时尚素描和光亮的 Q 版体育渲染图。\n\n约束：在可见网格中准确使用 4 张显眼的图像卡片。除微小的页眉文字外，不要在卡片外添加额外的说明文字。保持所有面部被遮挡、模糊或不具辨识度。避免使用水印，并避免使界面看起来像浏览器窗口截图。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23074/01.jpg","partial":false},{"id":10283,"c":"ThinkAI / App / 网页设计","t":"动漫夏日壁纸设备样机","p":"目标：创建一个简洁的宣传样机，展示在三款 Apple 风格设备上呈现的夏日动漫风格壁纸，适用于手机、平板和桌面壁纸广告。\n\n画布：1:1 正方形构图，采用柔和的浅灰色摄影棚背景，配有圆角白色展示卡片和细腻的阴影。\n\n布局：使用 3 款设备样机进行网格排列：顶部居中放置 1 台打开的笔记本电脑，左下角放置 1 台横屏平板电脑，右下角放置 1 台竖屏智能手机。每台设备显示相同的欢快壁纸艺术图，并根据屏幕比例进行适当裁剪。\n\n壁纸场景：怀旧手绘动漫风格的明亮日本郊区夏日街道，灵感源自 {argument name=\"anime inspiration\" default=\"蜡笔小新\"}。展示清澈湛蓝的天空和蓬松的白云、强烈的午后阳光、投下斑驳树影的绿叶树木、安静的住宅、瓷砖墙壁、蓝色金属大门、开花的灌木丛，以及向远处延伸的整洁社区道路。\n\n角色：壁纸中需包含 8 个走在街上的角色/吉祥物：1 位穿蓝色衬衫和米色裤子的高个子父亲、1 位抱着婴儿的母亲、1 个在母亲怀里的婴儿、1 个穿红衬衫和黄短裤的小男孩、1 只小白狗、1 个穿蓝色上衣且发型/帽子呈三角形的男孩、1 个穿粉色连衣裙的小女孩，以及 1 个穿绿衬衫的圆脸男孩。角色设计需保持可爱、简约、生动且适合家庭。\n\n设备屏幕细节：笔记本电脑显示类似 macOS 的桌面，顶部有细菜单栏，底部 Dock 栏包含 17 个彩色小应用图标。平板电脑显示锁屏界面，包含小锁图标、日期“7 月 15 日，星期二”、大号时间 {argument name=\"tablet time\" default=\"9:41\"}，左侧包含一个小天气组件。手机显示锁屏界面，包含日期“7 月 15 日，星期二”、大号时间 {argument name=\"phone time\" default=\"9:38\"}、顶部附近的小圆形组件以及底部的闪光灯/相机图标。\n\n视觉风格：高端 Apple 产品展示感，清晰逼真的硬件质感，亮面黑色边框，银色笔记本机身，柔和的环境光，色彩饱和的夏日高分辨率壁纸，适合社交媒体发布的精美构图。\n\n文字与自定义：设备外不使用任何标题文字。壁纸应呈现出 {argument name=\"season and mood\" default=\"阳光明媚的暑假\"} 的氛围。主天空颜色应为 {argument name=\"sky color\" default=\"明亮的青蓝色\"}。社区应呈现出 {argument name=\"setting\" default=\"安静的日本住宅街道\"} 的感觉。\n\n约束：保持构图简洁，严格遵守 3 台设备和 8 个壁纸角色的数量要求，避免水印，避免额外标题，壁纸内避免出现写实人脸，除锁屏时间外，所有可见 UI 文字均需保持细小且作为次要元素。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23115/01.jpg","partial":false},{"id":10284,"c":"ThinkAI / App / 网页设计","t":"现代极简室内设计展示","p":"现代极简高端住宅室内设计展示，超长细节页比例，平面图与 3D 效果图组合布局，开放式空间结构，客餐厅厨一体化设计，超大落地窗引入自然光，空间通透开阔，大面积留白，低饱和度高级灰、米白色与原木色配色，隐藏式灯带营造温馨氛围，精致软装，线条干净利落，极简且富有层次感，展厅级精细度，高端住宅设计方案，建筑杂志风格，高清，写实渲染，细节丰富，商业级视觉表现。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23019/01.jpg","partial":false},{"id":10285,"c":"ThinkAI / App / 网页设计","t":"赛博朋克 AI 创作者名片","p":"目标：为 {argument name=\"character name\" default=\"Retro Future Girl\"} 创建一张横版赛博朋克 AI 创作者名片，采用深色拉丝金属背景，点缀霓虹洋红色和青色，展现未来感动漫创作者身份。\n\n画布：宽幅横向名片，16:9 比例，黑色背景，带有微妙的横向拉丝钢纹理。在名片四周添加细窄的发光科幻边框，采用斜角剪裁设计，叠加电路风格的边线，左侧/顶部呈现洋红色光晕，右侧/底部呈现青色光晕。\n\n布局：分割式构图。左侧三分之二区域包含排版和社交 ID。右侧三分之一区域包含一个大型圆形头像徽章。头像圆环带有两个同心霓虹环，外圈为洋红色光晕，内圈为青色光晕，位于右边缘附近并垂直居中。\n\n文本内容：左侧需包含 4 行可见文本：1) 大标题“{argument name=\"character name\" default=\"Retro Future Girl\"}”，使用高挑优雅的衬线字体，带有金属粉色到青色的渐变及微妙的斜面效果；2) 较小的间距副标题“{argument name=\"creator role\" default=\"Creator\"}”，使用白色未来感无衬线字体；3) 洋红色标签“{argument name=\"social platform label\" default=\"X / Social ID\"}”；4) 白色等宽字体账号“{argument name=\"social handle\" default=\"@Retro_Future_Girl_666\"}”。在副标题下方和社交账号区域周围放置细窄的霓虹分割线，带有小的斜角端点和一个微小的洋红色圆点装饰。\n\n主体细节：在圆形头像内，展示 1 位肩部以上的动漫风格复古未来女孩。她留着鲜艳的粉色波波头，身穿赛博朋克机械盔甲，一只机械电子手抬至脸部附近，背景为带有青色光效的深色未来城市界面。在她的脸部中央覆盖 1 个哑光洋紫色的不透明方形块，对齐眼部和鼻部，作为刻意的头像隐私占位符。\n\n装饰元素：包含 2 组小型对角线霓虹阴影线，一组位于顶部边框中心附近，另一组位于底部边框中心附近，每组包含 5 条短斜线。使用细窄的青色和洋红色 HUD 线条、光泽边缘高光，营造出高级的金属全息质感。\n\n视觉风格：高对比度赛博朋克，简洁的创作者名片 / 数字名片设计，锐利的矢量风格排版，头像采用动漫插画，霓虹光效，金属质感，未来感 UI 边框。无需额外标志，无需二维码，除指定的 4 行文本外，不添加任何额外文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23101/01.jpg","partial":false},{"id":10286,"c":"ThinkAI / App / 网页设计","t":"赛博朋克风格 YouMind AI 创作者名片","p":"目标：为 {argument name=\"character name\" default=\"Machine Musk\"} 创建一张未来感赛博朋克风格的 AI 创作者名片，结合深色拉丝金属界面布局与霓虹洋红色和青色灯光。\n\n画布：横向 16:9 名片式构图，宽矩形卡片，圆角设计，斜面金属边框，角落带有微型螺丝细节，黑色拉丝铝材质，左侧带有青色发光点缀，右侧和底部边缘带有热粉色发光点缀。\n\n布局：将卡片分为两个主要区域。左侧 45% 为信息面板，包含 Logo、姓名、头衔和联系方式行。右侧 55% 为置于多边形斜框内的戏剧性动漫赛博朋克角色肖像。添加细长的霓虹电路线条、类 HUD 分隔符以及连接左侧联系行与右侧肖像框的几何面板。\n\n品牌与文字：在左上角放置一个铬合金 3D 徽标，形状为六边形霓虹青色与洋红色框架内的字母“M”。在其下方，设置醒目的风格化标题“{argument name=\"brand name\" default=\"Machine Musk\"}”，采用锐利的斜体科幻字体，“Machine”为金属白色，“Musk”为电光洋红色。在标题下方，放置间距适中的副标题“{argument name=\"title\" default=\"DARKHERO\"}”，使用白色大写字母。使用清晰易读的未来感无衬线字体。\n\n联系方式部分：在左下方包含 5 行水平联系方式，每行最左侧带有霓虹轮廓的六边形图标，右侧为白色联系文字。这 5 行分别为：1) 洋红色信封图标，内容为“{argument name=\"email\" default=\"hello@machinemusk.ai\"}”；2) 青色地球图标，内容为“www.machinemusk.ai”；3) 洋红色 Twitter 小鸟图标，内容为“@MachineMuskAI”；4) 青色 Discord 图标，内容为“discord.gg/machinemusk”；5) 洋红色 YouTube 播放图标，内容为“@MachineMuskAI”。每一行应位于一条带有青色和洋红色交替点缀的细长发光水平线上。\n\n角色细节：在右侧，展示一名动漫风格的未来赛博格或暗黑英雄，留着凌乱的白色短发，身穿白色高领装甲夹克，带有黑色机械组件、管道、电缆和光泽感机器人细节。角色佩戴着覆盖眼睛的大型白色 VR 面罩或赛博面具，带有黑色技术标记。角色背景为模糊的霓虹夜景城市，带有垂直招牌和蓝色、青色、紫色及粉色的焦外成像光斑。在角色面部中右侧和上半身添加一个大型不透明深板岩灰色遮挡块，覆盖面罩和胸部的大部分区域。\n\n视觉风格：高对比度光泽感科幻插画、赛博朋克动漫、高级创作者名片、金属斜面、霓虹轮廓光、玻璃质感反射、清晰的 UI 线条、电影级灯光、深色背景、饱和的洋红色和青色光芒。使最终图像看起来像一张精致的 GPT-image-2 创作者名片或数字名片样机。\n\n约束：保持所有文字清晰易读，使用准确的 5 行联系方式，保留深色金属赛博朋克色调，避免额外的 Logo 或水印，并保持专业的名片构图。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23100/01.jpg","partial":false},{"id":10287,"c":"ThinkAI / App / 网页设计","t":"赛博朋克熊猫创作者卡片","p":"目标：为街头文化创作者打造一张具有赛博朋克日本街机美学的炫酷横版 AI 创作者名片。\n\n画布：宽幅横向卡片，16:9 比例，黑色底色，圆角设计，配有厚实的亮面全息铬合金边框。使用高对比度的霓虹洋红色、青色、白色、黑色以及少量的黄色点缀。整张卡片应呈现出高端金属收藏卡或未来感创作者 ID 的质感。\n\n布局：左侧包含主要身份排版和社交信息；右侧包含角色插画。使用 4 个主要的文本区域：1 个左上角的小标题栏，文字为“STREET CULTURE CREATOR”；1 个巨大的金属质感日文展示名称，文字为“くまごろうちゃん”；1 个白色铬合金边框的角色标签，文字为“空手家”；以及 1 个左下角的社交 ID 框，带有洋红色标签“X / SOCIAL ID”和醒目的账号“@marry_666”。在主名称后方添加一个超大的深色涂鸦风格背景词，文字为“KUMAGORO”，并被前景的排版部分遮挡。\n\n主体细节：在右侧，绘制一名充满活力的动漫风格女性街头创作者，骑着一辆熊猫主题的摩托车/滑板车。她有着飘逸的亮粉色长发，红色的围巾向右飘动，身穿黄色无袖上衣，戴着黑色手套和大型耳机。她的面部被一个方形的隐私模糊/马赛克块遮挡。车辆前部造型为一个可爱的亮面熊猫头，带有黑色的熊猫眼圈、闪亮的机械镜头眼、铬合金高光和赛博朋克蓝色灯光。在模糊的面部区域上方添加一个小型熊猫耳朵头盔或熊猫吉祥物头部。\n\n图形元素：包含 6 种装饰性特征：主标题区域上方的霓虹洋红色涂鸦皇冠，青色手写涂鸦文字“PANDA POWER”，铬合金斜向赛车条纹，底部的黑白棋盘格图案，洋红色/青色/黄色的油漆飞溅笔触，以及右下角的漫画贴纸，以洋红色、青色、白色和黄色闪电风格书写“GO! FAST!”。\n\n视觉风格：超精细的 glossy gpt-image-2 插画，金属 3D 铬合金日文排版，全息反射，分层涂鸦纹理，动漫角色渲染，街头赛车能量，锐利的高光，镜头光晕，闪光，墨水飞溅，构图紧凑且易读。\n\n可自定义字段：使用创作者类别 {argument name=\"creator category\" default=\"STREET CULTURE CREATOR\"}，主要日文名称 {argument name=\"main name\" default=\"くまごろうちゃん\"}，角色标签 {argument name=\"role label\" default=\"空手家\"}，社交账号 {argument name=\"social handle\" default=\"@marry_666\"}，以及主题标语 {argument name=\"theme slogan\" default=\"PANDA POWER\"}。\n\n约束：保持所有可见文字清晰且拼写正确，保留四个主要文本区域，仅使用一个角色和一辆熊猫载具，保持面部被方形隐私模糊遮挡，不添加额外标志，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23099/01.jpg","partial":false},{"id":10288,"c":"ThinkAI / App / 网页设计","t":"Honey Bee 创作者卡片","p":"目标：为一位名为 {argument name=\"creator name\" default=\"Honey\"} 的蜜蜂主题创作者，创作一张充满未来感的 AI 创作者卡片 / 数字名片，融合奢华黑金属质感、热粉色霓虹线条以及温暖的蜂蜜琥珀色摄影风格。\n\n画布：横向圆角矩形卡片，16:9 比例，深黑色拉丝金属背景，带有细微的皮革/颗粒纹理，斜角边缘，细长的发光粉色边框线条，赛博朋克风格 UI 点缀，具有高端收藏级徽章的质感。\n\n布局：采用左右分割构图。左侧区域约占卡片的 52%，包含身份排版和个人资料字段。右侧区域约占 48%，包含一个大型多边形照片窗口，用于展示蜜蜂主题肖像。在卡片边缘添加细小的装饰性电路线条、点状标记、六边形图案、细括号以及发光的洋红色笔触。\n\n左侧区域详情：左上角放置一个包含简约蜜蜂符号的六边形图标，六边形下方带有轻微的滴蜜效果。下方放置以亮粉色渐变呈现的优雅衬线大字名称：{argument name=\"creator name\" default=\"Honey\"}。在最后一个字母附近添加一颗小闪星，并在名称下方添加流线型的装饰下划线。在名称下方，创建 3 个带有细霓虹粉轮廓和左侧小图标的标签信息栏：\n1. 标签 “TITLE”，值 “蜂蜜職人”。\n2. 标签 “X / SOCIAL ID”，值 {argument name=\"social id\" default=\"@Honey_daisuki_09\"}。\n3. 标签 “CATCHPHRASE”，值 {argument name=\"catchphrase\" default=\"蜂蜜は世界を救う\"}。\n字段值使用白色文本，标签使用小号大写粉色文本，并在栏位右端添加科技风格的分割刻度。\n\n右侧照片窗口：创建一个带有霓虹粉边框和琥珀色光晕的大型多边形裁剪框。框内展示一位年轻的蜜蜂 Cosplay 创作者，置身于温暖的蜂巢环境中：佩戴带有两根黑色触角的棕色毛绒蜜蜂帽，身着半透明昆虫翅膀，粉色头发，无袖棕色毛绒上衣，黄黑条纹短裙，以可爱的姿势前倾。背景应为带有蜂巢单元、滴落的蜂蜜、发光焦外成像和微距蜂巢细节的金色橙色调。面部需刻意遮盖，使用与生成示例相匹配的暖棕色居中方形隐私遮罩。\n\n徽章：在右下角照片框重叠处添加 1 个圆形认证印章。印章为黑色与热粉色配色，中心带有小蜜蜂图标，环绕文字清晰可见：“HONEY CERTIFIED” 和 “100% PURE”。\n\n视觉风格：高细节写实肖像与图形化赛博卡片设计相结合，带有亮面全息粉色高光、深色金属奢华材质、温暖的琥珀色灯光、锐利的 UI 线条，呈现高端 VTuber / 创作者名片美学。\n\n约束：仅限使用 1 张主肖像，1 个左上角蜜蜂六边形 Logo，3 个信息栏，以及 1 个认证印章。请勿添加额外人物、多余卡片、水印、二维码或无关文本。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23098/01.jpg","partial":false},{"id":10289,"c":"ThinkAI / App / 网页设计","t":"日系恋爱应用广告面板","p":"目标：为一款浪漫的 LINE 聊天分析应用制作三联式竖版日本应用推广图，采用柔和的粉色约会美学。\n\n画布：宽幅横向构图，包含 3 个并排的圆角长方形海报面板，每个面板呈现为智能手机广告卡片样式。背景使用梦幻般的日落城市景观，配以粉色云朵、虚化光斑、闪光点、漂浮的心形图案以及温暖的浪漫光晕。整体色调为淡粉色、珊瑚色、白色和柔桃色。\n\n面板 1：左侧面板介绍匹配度分析。顶部大号日文标题：「気になるあの人との 相性が わかる！」（了解与心仪之人的匹配度！），其中「相性」二字放大并使用亮粉色。下方小字说明：「LINEのトークを分析して、相性・会話の傾向・距離感をやさしく見える化するアプリ」（通过分析 LINE 对话，轻松可视化匹配度、对话倾向及距离感的应用）。左下方展示一对面部模糊的年轻情侣，右下方展示一台倾斜的智能手机，屏幕显示匹配度结果界面，包含大号“A”级评分、粉色雷达图、约 87 分的得分以及详细的分析卡片。在情侣上方添加一个粉色心形徽章，文字为「トークから ふたりの相性を 見える化」（从对话中可视化两人的匹配度）。左下方添加 4 张堆叠的功能卡片，配有图标和日文说明：1) Wi-Fi 图标「オフラインでも分析OK！」（离线也能分析！），2) 锁图标「プライバシー重視の安心・安全設計」（注重隐私的安心安全设计），3) LINE 聊天图标「LINEトークを読み込むだけ」（只需导入 LINE 对话），4) 机器人图标「AIがやさしく分析」（AI 贴心分析）。\n\n面板 2：中间面板聚焦于关系时间线。大号日文标题：「ふたりの思い出が、ひと目でわかる」（两人的回忆，一目了然），其中「ひと目でわかる」使用亮粉色。小字说明：「はじめての会話や通話、関係の変化を見る化」（将初次对话、通话及关系变化可视化）。居中放置一台正面的智能手机，显示应用界面，标题为「YUKAとの分析結果」（与 YUKA 的分析结果），配有粉色页眉和垂直时间线列表。包含 4 个漂浮的白色气泡标注，配有粉色图标：1) 心形图标「はじめてのトークがわかる」（了解初次对话），2) 聊天/电话图标「通話やメッセージの記録が見える」（查看通话及消息记录），3) 日历图标「思い出のタイムラインをチェック」（查看回忆时间线），4) 屏幕附近的小心形/闪光图标作为装饰。保持手机 UI 清晰且风格化，底部带有导航图标。\n\n面板 3：右侧面板聚焦于常用词汇。大号日文标题：「相手がよく使っている言葉が 見えてくる」（对方常用的词汇，清晰可见），其中「見えてくる」使用亮粉色。小字说明：「よく使うフレーズをまとめて見比べて、ふたりらしい言葉の傾向を見つけよう」（汇总并对比常用短语，发现属于两人的语言倾向）。居中放置一台正面的智能手机，显示粉白配色的关键词仪表盘，包含分组的胶囊标签以及用户与对方的对比栏。添加 4 个漂浮的白色气泡标注，配有粉色图标：1) 心形图标「相手のことが見えてくる」（更了解对方），2) 剪贴板图标「よく使う言葉をまとめてチェック」（汇总查看常用词），3) 双人图标「2人の共通フレーズもわかる」（了解两人的共同短语），4) 小心形气泡作为装饰点缀。\n\n视觉风格：精致的日系移动应用广告，可爱的浪漫 UI 设计，光泽感手机样机，圆角设计，柔和阴影，细微的闪光、心形和虚化效果。使用简洁的圆体日文字体；标题关键词使用亮粉色强调，其余文字为深炭灰色。情侣照片中的面部应进行模糊处理以保护隐私。\n\n限制：必须使用 3 个海报面板，3 台智能手机，第一个面板包含 4 张功能卡片，第二和第三个面板各包含 4 个漂浮标注。除日文文案中提及的 LINE 外，不得添加额外的面板、水印、二维码或品牌 Logo。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23108/01.jpg","partial":false},{"id":10290,"c":"ThinkAI / App / 网页设计","t":"四种主题派对消除游戏方案页","p":"目标：创建一份精美的日式提案风格创意页，用于一款玩家收集 3 个相同派进行消除的休闲手机游戏，标题为 {argument name=\"headline text\" default=\"パイを3つ集めて消す カジュアルゲーム 4テーマ案\"}。该页面应呈现为一份充满活力的游戏设计概念项目，包含可爱的 UI 样机和说明图表。\n\n画布：宽幅 16:9 演示页，暖奶油色背景，细圆角边框，点缀细小的闪光和甜点装饰。采用柔和的粉彩卡哇伊插画风格，边缘清晰如矢量图，带有微妙的阴影、光泽感游戏 UI 高光，且具有极高的可读性。\n\n布局：将画布精确划分为 4 个大型圆角主题面板，呈 2×2 网格排列。每个面板包含一个编号徽章、一个日文主题标题横幅、左侧的智能手机游戏样机，以及右侧的说明/示例卡片。底部添加一个长条，包含 4 条简短的功能说明和图标。\n\n主标题：在顶部中心位置，显示一个小派图标，后跟大标题。用粉色强调数字“4”，并在末尾添加一个小爱心。\n\n面板数量与主题：使用 4 个主题概念。\n1. 粉色甜点咖啡馆主题，标题为 {argument name=\"theme 1 title\" default=\"ストロベリースイーツカフェ\"}，包含草莓奶油蛋糕、浆果塔、鲜奶油、粉色托盘和可爱的兔子咖啡馆吉祥物。\n2. 黄色野餐主题，标题为 {argument name=\"theme 2 title\" default=\"アニマルピクニック\"}，包含红格子野餐布、柳条篮托盘、小动物朋友、水果派和阳光明媚的户外绿植。\n3. 绿色奇幻森林主题，标题为 {argument name=\"theme 3 title\" default=\"フェアリーフォレストベーカリー\"}，包含魔法森林面包店、蘑菇、灯笼、精灵般的角色、浆果派、木质托盘、藤蔓、叶子和温暖的微光。\n4. 蓝色海洋甜点主题，标题为 {argument name=\"theme 4 title\" default=\"オーシャンデザートパーティー\"}，包含水下粉彩风景、珊瑚、贝壳、海洋生物、贝壳状甜点和贝壳装饰的托盘。\n\n智能手机样机：4 个面板中的每一个都必须在左侧包含 1 个垂直手机屏幕，总共 4 部手机。每部手机显示一个可爱的类似三消的派收集游戏画面，顶部 HUD 显示“Lv.15”、分数“2,480”和一个暂停按钮。在每个游戏项目内，展示主题背景上的多个独立派，以及底部带有空槽的托盘/卡槽，并有一个白色手型光标正在点击或拖动一个派。包含一个小黄色箭头，指示向托盘移动的方向。\n\n说明卡片：在 4 个面板的每一个中，包含一张标题为“遊び方”的顶部说明卡，从左到右有 3 个图示步骤：点击一个派并将其放入卡槽，收集 3 个相同的派进行消除，如果卡槽满了则 GAME OVER。在其下方，包含 2 张较小的示例卡片：一张绿色/正面卡片，标签为“3つそろえて消える例”，展示 3 个相同的派消除并伴有闪光；一张红色/警告卡片，标签为“デッキがいっぱいの例”，展示一个满载的托盘和文字“GAME OVER”以及一个感叹号警告图标。\n\n底部长条：在底部添加 4 条功能说明，每条配有一个图标：手型图标配“かんたん操作 / タップだけのシンプル操作！”，灯泡图标配“3つそろえる爽快感！ / そろえるとパッと消えて気持ちいい♪”，爱心图标配“かわいいパイがいっぱい！ / 見ているだけで癒される4つの世界♪”，以及警告图标配“デッキが満杯になる前に / うまくそろえてハイスコアを目指そう！”。\n\n视觉约束：保持所有日文文本清晰易读，使用圆润友好的字体，保持一致的提案项目布局，避免写实风格，避免深色或粗犷的风格，避免额外的面板，避免额外的手机，且不要添加水印或徽标。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22919/01.jpg","partial":false},{"id":10291,"c":"ThinkAI / App / 网页设计","t":"雨中东京塔设备样机","p":"目标：为 {argument name=\"wallpaper subject\" default=\"东京雨夜中的东京塔\"} 创建一个精致的设备壁纸展示图，呈现为高端科技样机风格。\n\n画布：1:1 正方形构图，采用柔和的浅灰色摄影棚背景，配有三张带有细微阴影的圆角白色展示卡片。\n\n布局：展示 3 台设备：顶部卡片居中放置 1 台打开的大型笔记本电脑，左下角卡片放置 1 台平板电脑，右下角卡片放置 1 台智能手机。顶部卡片最宽，用于正面展示笔记本电脑；下方两张卡片较小，左右对齐且间距均匀。所有设备均应显示相同的壁纸图像。\n\n壁纸场景：电影质感的雨中东京夜景，视线沿湿润的林荫大道直视远处中心发着明亮橙光的东京塔。两侧是高耸的深色办公楼，点缀着明亮的窗户、路灯、红绿灯、汽车前灯，雨水浸润的道路上倒映着生动的红、橙、蓝光影。深蓝色的暴雨夜空，高对比度，写实摄影风格，对称的城市透视。\n\n设备细节：笔记本电脑为银色，黑色边框，顶部中心有小刘海，正面视角，可见纤薄底座。平板电脑为横屏模式，黑色圆角边框。智能手机为竖屏模式，黑色圆角边框，顶部带有药丸状灵动岛。\n\n屏幕叠加层：为 3 台设备添加逼真的锁屏 UI。笔记本电脑和平板电脑在 {argument name=\"lock screen time\" default=\"9:38\"} 的大号白色时间显示上方显示日期文本“5 月 20 日，星期二”。笔记本电脑右上角还有小型 Wi-Fi 和 100% 电量指示器，底部有纤细的白色主屏幕指示条。平板电脑左侧包含一个紧凑的天气小组件，显示圆形的“100”、“72°”、“多云”以及简短的预报文本。智能手机在大号时间上方显示“5 月 20 日，星期二”，并配有显示“100”和“72° 多云”的小型天气小组件、右侧的圆形小组件图标，以及底部的闪光灯和相机图标。\n\n视觉风格：极简的 Apple 风格产品展示，写实设备渲染，光面屏幕，柔和的环境光，边缘清晰，具有细微的景深感，无人物，无额外 Logo，无水印，背景整洁。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22944/01.jpg","partial":false},{"id":10292,"c":"ThinkAI / App / 网页设计","t":"水之呼吸装置壁纸样机","p":"目标：创建一个简洁的 Apple 风格设备壁纸展示，呈现以 {argument name=\"character name\" default=\"灶门炭治郎\"} 为主角的动漫风格水之呼吸场景，适用于手机、平板和桌面壁纸预览。\n\n画布：1:1 正方形宣传样机，背景为柔和的浅灰色，带有细腻的阴影。放置三张圆角白色展示卡片，排列成整齐的网格：上方一张大卡片，下方两张小卡片。\n\n布局：展示 3 个设备样机。1) 顶部：一个银色大笔记本电脑，居中放置在宽大的圆角白色卡片内，正面打开，带有窄黑色边框和顶部小刘海。2) 左下：一个横屏平板电脑，放置在圆角白色卡片内。3) 右下：一个竖屏智能手机，放置在圆角白色卡片内。保持宽敞的间距、柔和的投影以及高端简约的呈现方式。\n\n壁纸艺术：三块屏幕上显示相同的 {argument name=\"wallpaper scene\" default=\"雾气缭绕的河谷中的蓝色水漩涡\"}。场景展示了一位背对镜头的动漫剑士，身穿黑绿格纹羽织，站在没过脚踝的倒影水中，面对着巨大的螺旋水流隧道。运用戏剧性的水之呼吸能量：层叠的圆形蓝色波浪、水花、泡沫、喷雾以及漩涡中心明亮的淡色光芒。环境寒冷且多雾，伴有岩石河滩、深色石头、松树覆盖的悬崖、雾蒙蒙的山脉以及蓝白色的冬季色调。壁纸需具有绘画感、电影感、细节丰富且对比度高，无血腥内容，无额外角色。\n\n设备屏幕细节：添加细腻的 iOS/macOS 锁屏风格覆盖层。在每个设备上显示白色大号时间 {argument name=\"time\" default=\"9:38\"}。上方添加小号日期文本 {argument name=\"date text\" default=\"5 月 20 日，星期二\"}。笔记本电脑屏幕右上角包含 Wi-Fi 和电池图标，底部附近有细长的白色主屏幕指示条。平板电脑屏幕包含相同的大号时间，以及右侧的组件堆叠，精确显示 3 个组件：一个显示 100 的圆形电池组件、一个显示 72° 的天气组件，以及一个小型的日历/提醒风格组件。手机屏幕包含时间和日期、顶部附近的微弱组件，以及底部 2 个锁屏按钮：左侧手电筒和右侧相机。\n\n视觉风格：超简洁的产品样机、逼真的设备硬件、清晰的黑色玻璃边框、圆角设计、柔和的环境摄影棚灯光、浅阴影、高分辨率壁纸艺术、冷蓝色调、高端科技广告构图。\n\n约束：使用 3 个设备样机和 3 张白色卡片。不要添加任何徽标、水印、标题、中文字符或设备屏幕之外的额外宣传文字。保持角色相对于巨大的水漩涡较小，以使场景具有史诗感并适合作为壁纸。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22945/01.jpg","partial":false},{"id":10293,"c":"ThinkAI / App / 网页设计","t":"冬季篝火壁纸设备样机","p":"制作一个精致的产品样机，展示一张适配三种 Apple 风格设备的温馨冬季篝火壁纸。壁纸插画应采用可爱的日系蜡笔动漫风格，且不含任何 Logo：五名卡通小孩和一只小白狗在夜晚的雪松林中围坐在明亮的篝火旁，背景有飘落的雪花、深蓝色的树木，温暖的橙色火光照亮了角色和积雪，营造出柔和梦幻的冬季氛围。主角是一个穿着红色冬装毛衣、圆脸的孩子，站在火堆后方；周围环绕着四个朋友：左侧是一个深色刺猬头的孩子，左下方是一个穿棕色外套的孩子，右侧是一个穿粉色衣服的卷发孩子，右下方是一个戴绿色兜帽的孩子；小白狗在火堆前睡觉或蜷缩着。在浅灰色摄影棚背景下展示三台设备，每台设备均置于带有柔和阴影的圆角白色展示卡片中：上方居中放置一台大型笔记本电脑样机，左下方放置一台平板电脑样机，右下方放置一台智能手机样机。所有屏幕上均显示构图一致、裁剪得当的同一张壁纸。添加逼真的锁屏 UI 叠加层：大号时间 {argument name=\"time\" default=\"9:38\"}、日期 {argument name=\"date\" default=\"11 月 15 日，星期五\"}、小型状态图标以及精致的半透明小组件。平板电脑应在左上方包含一个半透明天气小组件，显示 {argument name=\"weather location\" default=\"库比蒂诺\"} 和 {argument name=\"temperature\" default=\"45°\"}；手机应在时间下方包含三个圆形小组件以及两个底部的锁屏小图标。采用干净、高端的 Apple 产品渲染效果，配备黑色边框、纤薄的设备框架、圆角设计、柔和的环境阴影、清晰的屏幕细节，以及适用于桌面、平板和手机背景的均衡壁纸预览布局。避免使用品牌 Logo、水印、额外文字或其他设备。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22933/01.jpg","partial":false},{"id":10294,"c":"ThinkAI / App / 网页设计","t":"蜡笔小新冬季设备壁纸样机","p":"目标：创建一个简洁的宣传设备样机，展示适配于笔记本电脑、平板电脑和手机屏幕的温馨 {argument name=\"wallpaper theme\" default=\"蜡笔小新冬季雪景\"} 壁纸。\n\n画布：1:1 正方形构图，柔和的浅灰色摄影棚背景，带有细微阴影的圆角白色展示卡片，高分辨率产品广告风格。\n\n布局：在平衡的网格中精确展示 3 台设备：顶部居中放置 1 台大型银色笔记本电脑，左下方放置 1 台黑色边框平板电脑，右下方放置 1 台黑色边框智能手机。每台设备都位于各自的圆角白色矩形卡片内。笔记本电脑卡片最宽；平板电脑和手机卡片较小，排列在其下方，中间留有窄缝。\n\n壁纸场景：柔和的水彩/动画风格冬季景观，包含雪林、淡雾天空、积雪的常青树、灌木丛和白雪皑皑的田野。场景应给人以温柔、怀旧和可爱的感觉，伴有飘落的雪花和冷色调的蓝白色。前景中从左到右精确包含 6 个卡通人物：1 名戴着深蓝色冬帽、穿着蓝色外套并手捧积雪的儿童，1 名穿着粉色冬装的小女孩，1 名位于中央、穿着红色毛衣和黄色短裤、举起双臂快乐奔跑的顽皮男孩，1 名穿着绿色服装的金发小童，1 名穿着黄色衬衫、在右侧行走的敦实儿童，以及 1 只在右中位置奔跑的小白狗。保持角色为俏皮的蜡笔小新动画风格，具有简单的圆润特征和生动的姿态。\n\n设备细节：笔记本电脑正面打开，带有窄黑色边框，屏幕顶部有居中刘海，可见银色键盘和触控板。平板电脑为横屏模式，带有厚黑色边框和圆角。智能手机为竖屏，带有药丸状灵动岛切口和纤细的黑色边框。\n\n锁屏叠加层：在设备上添加细微的半透明 iOS 风格锁屏 UI。时间 {argument name=\"lock screen time\" default=\"9:38\"} 使用白色或浅灰色醒目显示。日期 {argument name=\"lock screen date\" default=\"11 月 15 日，星期五\"} 显示在时间上方。在平板电脑上，左上角包含一个半透明的天气小组件块，显示 {argument name=\"weather text\" default=\"库比蒂诺 45° 晴\"} 以及下方的三个小圆形小组件图标。在手机上，时间下方包含三个小圆形小组件，底部附近有两个锁屏图标。保持所有 UI 文字柔和且半透明，以确保壁纸始终是焦点。\n\n视觉风格：高端 Apple 风格展示，逼真的设备样机光影，柔和阴影，圆角白色卡片，清晰的屏幕，温和的冬季色调，迷人的水彩背景，可爱的动画角色，无强烈对比。\n\n约束：精确使用 3 台设备和 6 个壁纸角色/动物。不要在设备屏幕外添加额外的角色、徽标、水印、标题或宣传文字。壁纸必须是明显相同的场景，并适配于桌面、平板和手机的裁剪比例。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22946/01.jpg","partial":false},{"id":10295,"c":"ThinkAI / App / 网页设计","t":"JRPG 幻想风格标题 Logo 启动画面","p":"创建一个宽幅 JRPG 幻想风格标题 Logo 启动画面，对象为 {argument name=\"character name\" default=\"Hatsune Miku\"}。画布：16:9 横向白色背景，简洁的高调呈现，无边框。主体构成：左侧居中放置巨大的华丽衬线幻想风格 Logo，文字为 {argument name=\"main title text\" default=\"HATSUNE MIKU\"}，分两行排列，“HATSUNE”在上，“MIKU”在下；使用金属青色到白色的渐变字体，带有 3D 斜角边缘、锐利的哥特式衬线、明亮的星光闪烁、纤细的金色轮廓以及微妙的投影。在 Logo 下方居中添加一行小型日语副标题 {argument name=\"subtitle text\" default=\"初音ミク\"}，两侧点缀微小的装饰性闪光。角色剪影：在右侧放置一个深青色的 Hatsune Miku 动漫偶像侧面剪影，面向左方，清晰展示 2 条向右下方大幅飘动的超长双马尾，并带有 2 个点缀着粉色和青色的长方形发饰。背景幻想元素：在 Logo 后方添加一个淡金色的圆形魔法纹章，带有类似罗盘的辐条，上方有一个高耸的矛状装饰；在右侧剪影后方添加远景深青色哥特式城堡天际线，带有多个尖塔。装饰元素：添加环绕在 Logo 和角色周围的半透明水蓝色笔触波浪，特别是左侧的一个大新月形笔触和右下方的几条丝带状头发/水流笔触；散布微小的星光、油漆溅射以及少量粉色花瓣状碎片。在主 Logo 右下方附近包含一个小的洋红色数字 {argument name=\"edition number\" default=\"01\"}。视觉风格：优雅的日式幻想 RPG 关键视觉图，聚焦 Logo 设计，清爽的矢量风格排版混合水彩溅射，明亮的青色和蓝绿色调搭配淡金色点缀，高细节，精美的游戏标题呈现。约束条件：仅使用一个角色剪影、一个两行主标题、一个日语副标题以及一个版本号；保持背景大部分为白色且整洁；无额外 Logo，无水印，无边框。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22840/01.jpg","partial":false},{"id":10296,"c":"ThinkAI / App / 网页设计","t":"社交媒体个人资料霓虹线条艺术","p":"创作一张极简主义彩虹霓虹线条艺术插画，描绘一个 {argument name=\"social media\" default=\"小红书\"} 应用程序界面 {argument name=\"subject\" default=\"女性个人资料页面\"}。使用纯白色背景上的干净、连续的彩色素描笔触，灵感源自现代剪影艺术。一位曲线优美的女性角色应以行走姿态自信地站在个人资料框外，突显优雅的身形。个人资料 UI 应包含圆形头像、用户名、认证徽章、粉丝数、简介文本、标签页和帖子预览。仅添加精细的彩色轮廓，无需实心填充，保持高端的未来感美学。构图超简洁，阴影极少，呈现艺术霓虹铅笔素描风格，现代社交媒体海报设计。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22710/01.jpg","partial":false}],"total":50,"page":1,"limit":36,"pages":2,"source":"prebuilt-bootstrap-category-full"}}}</script>
