的剪裁贴纸。图片中的主体被处理成Q版（chibi）风格的变形形象，具有粗重的黑色轮廓、鲜艳的平面色彩以及卡通化的姿势。右侧有竖排的日文文字“【右侧的评论】”，左侧有竖排的日文文字“【左侧的评论】”，底部边缘有文字“【下方的评论】”。**关键在于：必须使用一条连续的白色剪裁边框将所有元素完全包裹起来——包括图片和所有文字块——从而在纯白色背景上形成一个统一、便于裁剪的贴纸形状。**","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/009b1f0375/预览图-1.webp"},{"id":6,"c":"05_人物肖像与写实摄影","t":"双尺度女性在花园与客厅中的超现实场景","p":"[\n  {\n    \"scene_description\": \"一个超现实的电影场景，女演员 {\\\"actress\\\" \\\"Sydney Sweeney\\\"} 的两个版本以截然不同的比例出现在一个阳光明媚的现代客厅里。\",\n    \"giant_figure\": {\n      \"subject\": \"Sydney Sweeney\",\n      \"scale\": \"巨大\",\n      \"pose\": \"优雅地坐在天鹅绒沙发上，身体微微前倾，表情平静而沉思\",\n      \"attire\": {\n        \"top\": \"米色罗纹针织毛衣\",\n        \"bottom\": \"深色长裤或牛仔裤\"\n      },\n      \"appearance\": \"逼真的面部特征，柔和自然的妆容，金色波浪长发\",\n      \"lighting\": \"被温暖的定向窗光照亮，营造出柔和的电影感阴影\"\n    },\n    \"tiny_figure\": {\n      \"subject\": \"微缩版 Sydney Sweeney\",\n      \"scale\": \"几英寸高\",\n      \"placement\": \"站在巨大的 Sydney Sweeney 正前方的一张质朴木制咖啡桌上\",\n      \"pose\": \"好奇而敬畏地仰望着巨大的 Sydney Sweeney\",\n      \"attire\": \"与巨大的 Sydney Sweeney 相同的米色毛衣和深色长裤\"\n    },\n    \"environment_details\": {\n      \"room_style\": \"现代室内设计，营造出温暖舒适的氛围\",\n      \"furniture\": [\n        \"带有明显纹理的质朴木制咖啡桌\",\n        \"棕色天鹅绒或麂皮沙发\",\n        \"背景中的中世纪现代木制扶手椅\"\n      ],\n      \"decor\": [\n        \"堆叠的咖啡桌书籍\",\n        \"陶瓷杯\",\n        \"盆栽绿色植物\",\n        \"墙上的裱框艺术品\",\n        \"薄纱窗帘\"\n      ],\n      \"atmosphere\": \"阳光中可见漂浮的灰尘颗粒，体积光，暖色调\"\n    },\n    \"technical_specs\": {\n      \"camera_angle\": \"低角度拍摄，以强调比例差异\",\n      \"lens_effect\": \"浅景深，背景柔和模糊（散景），微缩人物具有微距感\",\n      \"style\": \"超现实摄影，8K 分辨率，HDR，魔幻现实主义\",\n      \"mood\": \"梦幻、超现实、艺术、宁静\"\n    }\n  },\n  {\n    \"scene_description\": \"一个超现实的户外花园场景，在黄金时段，Sydney Sweeney 的两个版本以不同的比例出现。\",\n    \"giant_figure\": {\n      \"subject\": \"Sydney Sweeney\",\n      \"scale\": \"巨大\",\n      \"pose\": \"坐在一个大藤椅里，对着微缩人物温暖地微笑\",\n      \"attire\": {\n        \"dress\": \"飘逸的碎花图案吊带长裙\",\n        \"accessory\": \"宽边草帽\"\n      },\n      \"appearance\": \"容光焕发的皮肤，金色波浪发，愉悦的表情\"\n    },\n    \"tiny_figure\": {\n      \"subject\": \"微缩版 Sydney Sweeney\",\n      \"scale\": \"微小\",\n      \"placement\": \"站在一张风化的木制花园桌上\",\n      \"pose\": \"回望着巨大的 Sydney Sweeney\",\n      \"attire\": \"与巨大的 Sydney Sweeney 相配的碎花图案长裙\"\n    },\n    \"environmen\"\n]","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00SmnL5vbk/预览图-1.webp"},{"id":7,"c":"01_建筑室内空间设计","t":"添加人物","p":"在图像中的[目标位置]增加,[XX]数量的人物，[XX]种族，[XX]年龄，[XX]行为","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00b0b31c26/预览图.webp"},{"id":8,"c":"05_人物肖像与写实摄影","t":"女生对着镜子自拍手机照片","p":"编辑这张照片，但不要改变她的面部特征。这是一张年轻、美丽、肤色白皙的女性的胸部以上特写照片。照片拍摄于夜晚的卧室，明亮的内置闪光灯照亮了她的脸部和头发，形成鲜明的亮点。她黑色的短发自然垂落，微微卷曲，脸上带着柔和的表情。闪光灯突出了昏暗的客厅背景。这张照片自然、真实、充满怀旧气息，让人想起20世纪90年代初的数码相机照片。强烈的闪光灯和屏幕的自然颗粒感使色彩略显暗淡。姿势：她穿着一件印有水冰月图案的白色宽松T恤，领子是蓝色的。她身体向前，脸部看向镜头，双手放在身体两侧，摆出一个持枪/射击的姿势。她的嘴唇可爱地抿着，一只眼睛闭着。主体在画面中显得很大。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00c4829f33/预览图.webp"},{"id":9,"c":"02_电商产品虚拟摄影","t":"玩具盒中的历史","p":"这是一张超写实的俯视照片，展示了一个放在米色纸板箱内的3D打印立体模型。箱盖由两个人手撑开。箱子内部呈现了一处[国家名称]的微型景观，其中包括标志性建筑、地形、建筑、河流、植被，以及众多细致入微的小人物。该立体模型充满了生动且符合地理特征的元素，所有细节都采用哑光3D打印技术制成，展现出明显的层次感。在箱盖顶部，用大型、色彩鲜艳的凸字形塑料字母印有“[国家名称]”这几个字，每个字母的颜色都不同。灯光温暖而富有电影感，突出了材质和阴影效果，营造出一种真实感与迷人氛围，仿佛观众正在打开这个国家的魔法般微缩版。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00d8187d7b/预览图-1.webp"},{"id":10,"c":"02_电商产品虚拟摄影","t":"玻璃盒内的图像可视化","p":"这张照片呈现的是一个[颜色]的3D[物体]，被放置在一个豪华的透明盒子中。从某个经过优化的侧面角度拍摄，以便更清晰地展示该3D物体的形状。盒子应该是白色的，设计精美，采用透明玻璃制成，边缘呈现出精致的锐利感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00d8755102/预览图.webp"},{"id":11,"c":"05_人物肖像与写实摄影","t":"户外咖啡馆白发美女涂口红自拍写真","p":"```json\n{\n  \"prompt\": \"户外咖啡馆美妆肖像，年轻女子留着 {\\\"hair color\\\" \\\"铂金色\\\"} 及肩波浪发，用涂抹棒涂抹红色唇彩，直视镜头，浅绿色蓝色眼睛，睫毛浓密纤长，身穿米色灰褐色罗纹针织露背上衣，自然妆容，眉毛精致，涂抹中的亮泽红唇，白皙瓷肌，坐在户外咖啡馆露台上，背景是木制桌椅，其他咖啡馆顾客模糊不清，欧洲街头咖啡馆场景，自然日光，抓拍美妆瞬间，特写肖像自拍风格，网红内容美学\",\n  \"negative_prompt\": \"室内工作室，刺眼灯光，深色头发，全身照，正式场合，夜晚\",\n  \"style\": \"抓拍美妆肖像，户外咖啡馆生活方式，网红内容，自然日光摄影\",\n  \"aspect_ratio\": \"3:4\",\n  \"camera\": {\n    \"type\": \"智能手机人像模式或无反相机\",\n    \"angle\": \"正视，视线水平，特写\",\n    \"framing\": \"特写肖像，脸部和上半身，浅景深\"\n  },\n  \"lighting\": {\n    \"type\": \"自然户外日光\",\n    \"quality\": \"柔和漫射自然光，脸部光线均匀\",\n    \"atmosphere\": \"明亮的白天户外咖啡馆场景\"\n  },\n  \"mood\": \"休闲，抓拍，以美妆为重点，生活方式，女性化\",\n  \"color_palette\": \"铂金色，米色灰褐色上衣，亮泽红唇，白皙肤色，木制咖啡馆家具，中性暖色调\",\n  \"subject_features\": {\n    \"hair\": \"铂金色，及肩，柔和波浪，中分，自然发质\",\n    \"skin\": \"白皙，瓷肌，自然无瑕\",\n    \"eyes\": \"浅绿色蓝色，大眼睛，直视镜头，浓密纤长睫毛，淡雅眼妆\",\n    \"lips\": \"亮泽红色，正在涂抹唇彩中，丰满唇形\",\n    \"eyebrows\": \"自然棕色，精心修饰的柔和眉弓\",\n    \"expression\": \"中性，专注于涂抹唇部，看向镜头\"\n  },\n  \"makeup\": {\n    \"eyes\": \"淡雅中性眼影，浓密纤长睫毛\",\n    \"lips\": \"正在涂抹的红色唇彩\",\n    \"base\": \"自然肤色，少量粉底\",\n    \"brows\": \"精致的自然棕色\"\n  },\n  \"wardrobe\": {\n    \"top\": \"米色灰褐色罗纹针织露背上衣，细肩带绕颈，有纹理的罗纹面料\"\n  },\n  \"props\": {\n    \"main\": \"带涂抹棒的唇彩，银色金属管，右手拿着涂抹到嘴唇上\"\n  },\n  \"pose\": {\n    \"action\": \"用涂抹棒涂抹唇彩到嘴唇上\",\n    \"hand\": \"右手拿着唇彩涂抹棒靠近嘴巴\",\n    \"gaze\": \"直视镜头\"\n  },\n  \"setting\": {\n    \"location\": \"欧洲街头户外咖啡馆露台\",\n    \"background\": \"木制咖啡馆桌椅，其他顾客就座，带大窗户的咖啡馆店面，城市街道\",\n    \"atmosphere\": \"休闲的白天咖啡馆场景，背景虚化效果\"\n  }\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00jKUw8thi/预览图.webp"},{"id":12,"c":"14_社交媒体营销","t":"框定完美：现代优雅的写照","p":"这是一幅超写实的个人肖像，被放置在一个超大的 Instagram 发布框中，这个框架占据了整个画面。上传的肖像应保持一致且没有任何变化。这个人的面部特征精致而轮廓分明，皮肤干净细腻，天生就极具魅力；他们的目光平静而充满吸引力地注视着观众，嘴唇微微放松、表情自然，展现出高级模特般的优雅气质。他们摆着一个现代、充满活力的姿势。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/010b0c13da/预览图.webp"},{"id":13,"c":"10_卡通漫画电影游戏","t":"像素游戏角色从电视中爬出","p":"一个像素化的电子游戏角色试图从电视屏幕爬到客厅里。一个真实的人类玩家正手忙脚乱地用控制器把角色推回屏幕。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/013ecde361/预览图.webp"},{"id":14,"c":"06_平面设计视觉传达","t":"赛亚人战士变身进化图谱","p":"制作一张详细的图表，展示“超级赛亚人式变身”的完整演变过程，使用一个原创的赛亚人战士形象，并描绘其从基础形态到神级变身的多个阶段。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/013fa28035/预览图.webp"},{"id":15,"c":"05_人物肖像与写实摄影","t":"电影质感时尚肖像：简约背景与现代穿搭","p":"请在不改变我面部特征的前提下，创作一幅时尚、现代的年轻男子肖像。这位男子拥有浓密的深色头发，穿着一件宽松的锈红色衬衫（纽扣解开），仅佩戴了一块手表和一只小耳环作为配饰。背景设计简洁、色调柔和，并采用轻微的模糊处理，以突出其前卫的现代时尚风格。他还戴着透明的太阳镜。整个画面采用电影般的灯光效果，细节极其丰富、质感逼真，整体呈现出精致且富有编辑感的视觉效果。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/015df06fa4/预览图.webp"},{"id":16,"c":"10_卡通漫画电影游戏","t":"和风猫耳少女站台写真","p":"一个站在日本火车站台上的角色，其光照效果与周围环境完美匹配，分辨率为2K。  \n在角色与背景的合成过程中，最容易产生不协调感的因素就是“光线不一致”。  \nNano Banana Pro能够自动将角色与背景的光照效果调整至一致，因此即使在像车站站台这样光线复杂的场景中，角色也能自然地融入背景中。  \n角色的阴影方向、强度、色温以及反射效果都得到了精确的把控，从而大大减少了后续","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0172060da7/预览图-1.webp"},{"id":17,"c":"09_故事分镜角色设定","t":"生成角色设定","p":"为我生成人物的角色设定（Character Design）\n比例设定（不同身高对比、头身比等）\n三视图（正面、侧面、背面）\n表情设定（Expression Sheet） → 就是你发的那种图\n动作设定（Pose Sheet） → 各种常见姿势\n服装设定（Costume Design）","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/018de79d35/预览图1.webp"},{"id":18,"c":"05_人物肖像与写实摄影","t":"圣诞贺卡设计模板","p":"这是一张精心设计的圣诞贺卡，画面忠实再现了这对夫妇戴着圣诞帽子的情景，下方印着“Happy Christmas 2025”（祝2025年圣诞快乐）的祝福语。整体风格温馨而传统，采用古典设计，营造出如同冬日仙境般的美好氛围。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/01AadT15Qb/预览图-1.webp"},{"id":19,"c":"10_卡通漫画电影游戏","t":"鬼族女性武士立绘","p":"一张精致的动漫插画，描绘了一位高挑的成年鬼族女性，呈现出冷静、优雅的全身肖像。她以四分之三侧面站立，双手交叠在竖立的长剑剑柄上。她拥有极长的直发，【银白色】 的发丝垂过膝盖；皮肤苍白，有着精灵般的尖耳、狭长的深红色双眼，额头上长着两只光滑弯曲的红色犄角。她的表情冷峻、疏离且略带忧郁。她身着 【带有黑红点缀的白色礼仪和服】：内层为修身的白色连衣裙式设计，领口深邃；配有黑色腰带和层叠的腰部装饰；外罩一件半透明的图案长袍，带有微妙的几何纹样；宽大的袖口内衬为红色，裙摆边缘装饰着烟熏状的暗色火焰图案。她的前臂覆盖着抛光的银色护甲，增添了战士的气息。那柄巨剑沉重且巨大，垂直插在她的身前，剑身和剑柄呈黑色，配有金属护手，剑刃中央流淌着鲜艳发光的红色火焰纹路。构图优雅且平衡，融合了日本传统美学与暗黑奇幻风格。背景为柔和的淡薰衣草灰装饰拼贴画，包含一个框住富士山与蜿蜒河流景观的圆形窗户、精致的花卉剪影与盛开的枝条、抽象的云纹、悬挂的流苏装饰、几何织物图案，以及右侧一个红色的太阳圆环。主色调采用柔和的白色、丁香紫、灰紫色、黑色和深红色。加入微妙的纸张纹理、干净的线条、柔和的赛璐珞阴影、细腻的高光以及华丽的高细节动漫风格。整体氛围宁静、高贵、神秘且略带不祥之感，宛如 【Oni Alter】 在奢华的日式奇幻关键视觉图中的形象。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/01BMaXRLcX/预览图.webp"},{"id":20,"c":"05_人物肖像与写实摄影","t":"火水交融的超现实女性肖像","p":"```json\n{\n  \"Objective\": \"创作一幅超现实电影感肖像，展现火焰与水之间史诗般的平衡\",\n  \"PersonaDetails\": {\n    \"Subject\": {\n      \"Type\": \"年轻女性\",\n      \"Pose\": \"正对前方，位于画面中央\",\n      \"Expression\": \"平静、专注、有力\",\n      \"Gaze\": \"与镜头直接眼神交流\",\n      \"Hair\": {\n        \"Style\": \"湿润，向后梳理\",\n        \"Details\": {\n          \"FireSide\": \"发丝上微妙的火焰光晕\",\n          \"WaterSide\": \"可见的水流和水滴\"\n        }\n      },\n      \"Skin\": \"超精细的自然皮肤纹理\"\n    }\n  },\n  \"Composition\": {\n    \"Framing\": \"完美居中的肖像\",\n    \"Symmetry\": \"面部中央精确的垂直分割\",\n    \"DepthOfField\": \"浅景深\",\n    \"Focus\": \"面部特征极度清晰\"\n  },\n  \"ElementalSplit\": {\n    \"LeftSide\": {\n      \"Element\": \"火焰\",\n      \"VisualEffects\": [\n        \"发光的橙色火焰\",\n        \"飞舞的余烬\",\n        \"火花\",\n        \"微妙的热扭曲\"\n      ],\n      \"Lighting\": \"温暖、戏剧性的橙色光照\"\n    },\n    \"RightSide\": {\n      \"Element\": \"水\",\n      \"VisualEffects\": [\n        \"空中凝固的冰蓝色水花\",\n        \"悬浮的水滴\",\n        \"细微的薄雾\"\n      ],\n      \"Lighting\": \"清冷、朦胧的蓝色光照\"\n    }\n  },\n  \"LightingAndAtmosphere\": {\n    \"LightingStyle\": \"电影级影棚光照\",\n    \"Contrast\": \"高对比度，强烈的冷暖分离\",\n    \"Background\": \"黑暗、富有氛围感、不突兀\",\n    \"Mood\": \"史诗、强烈、神话般\"\n  },\n  \"ArtDirection\": {\n    \"Style\": \"奇幻现实主义\",\n    \"RealismLevel\": \"超现实\",\n    \"ColorGrading\": \"电影级冷暖色彩对比\",\n    \"DetailQuality\": \"超精细的纹理和效果\"\n  },\n  \"PhotographyStyle\": {\n    \"Genre\": \"影棚级电影感肖像摄影\",\n    \"CameraLook\": \"高端专业质感\",\n    \"Resolution\": \"8K 超高分辨率\"\n  },\n  \"Theme\": {\n    \"Concept\": \"火焰与水之间的元素平衡\",\n    \"Symbolism\": \"控制、和谐、力量\"\n  },\n  \"NegativePrompt\": [\n    \"卡通\",\n    \"动漫\",\n    \"不均匀的面部分割\",\n    \"模糊的眼睛\",\n    \"平淡的光照\",\n    \"色彩过饱和\",\n    \"塑料皮肤\",\n    \"低细节\"\n  ],\n  \"ResponseFormat\": {\n    \"Type\": \"单张图片\",\n    \"Orientation\": \"肖像\",\n    \"AspectRatio\": \"2:3\"\n  }\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/01QgT5ED3O/预览图.webp"},{"id":21,"c":"05_人物肖像与写实摄影","t":"1990年代相机风格肖像","p":"﻿在不改变她原来的脸的情况下，用一台20世纪90年代风格的相机直接前闪拍摄一张瓷白色皮肤的美丽年轻女子的肖像。她凌乱的深棕色头发扎了起来，摆出一副平静而俏皮的微笑。她穿着一件现代的超大奶油色毛衣。背景是一堵深白色的墙，上面贴着美学杂志海报和贴纸，在昏暗的灯光下唤起舒适的卧室或私人房间的氛围。35mm镜头闪光灯营造出怀旧的光彩。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/01d9177c9f/预览图.webp"},{"id":22,"c":"15_表情包趣味拼图","t":"彩色卡通俏皮图标和徽标","p":"创作一幅以彩色卡通风格呈现的[FIREFOX]标志的2D数字插图，使用粗黑轮廓线进行绘制。该图标设计应采用活泼、明亮的单色（如粉色、蓝绿色、橙色、黄色和紫色），并以平面、大胆的手法呈现这些颜色。形状应略带夸张感，边缘呈圆形，并添加一些有趣的细节，例如星爆效果、条纹或闪光效果（如有必要）。整体风格保持简洁且具有手绘感，通过粗轮廓线突出形状的立体感。该插图适合矢量格式处理，背景颜色为白色，尺寸比例为正方形。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/01dfeea82b/预览图.webp"},{"id":23,"c":"07_艺术插画创意风格","t":"Ben 10 遇上 TMNT 完整漫画页面","p":"一整页漫画，将Ben 10带入TMNT宇宙，画面富有表现力，线条干净利落，色彩鲜明，仿佛直接出自官方联动漫画。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/01f640fac9/预览图.webp"},{"id":24,"c":"07_艺术插画创意风格","t":"儿童绘本风格角色插画","p":"“绘制一幅以 [Character] 为角色的图画，使用蜡笔在白纸上作画，风格要像儿童读物中的插画一样——简单、可爱且色彩丰富，同时添加 [两种闪亮的点缀颜色] 作为装饰，并确保画面细节丰富。”","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/020f985e31/预览图-1.webp"},{"id":25,"c":"13_特定场景环境生成","t":"金字塔与狮身人面像的原始风貌","p":"一张金字塔和狮身人面像的照片，但展示的是它们刚建成时的样子。狮身人面像的面孔非常完美。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0252aecf7f/预览图.webp"},{"id":26,"c":"05_人物肖像与写实摄影","t":"高级定制时装女性模特写真——自信优雅姿态","p":"{\n  \"图像生成\": {\n    \"质量\": \"超高分辨率、超逼真、细节丰富\",\n    \"面部与身体\": {\n      \"保持原样\": true,\n      \"参照匹配\": true,\n      \"描述\": \"女性的面部和身体轮廓必须与上传的图像完全一致。不得对身份、比例或面部结构进行任何修改。\",\n    },\n    \"模特\": {\n      \"描述\": \"一位迷人且自信的女性在摄影棚中摆姿势，表情优雅而引人注目。\",\n      \"姿势\": {\n        \"主要姿势\": \"一只手自信地放在臀部\",\n        \"辅助姿势\": \"另一只手轻轻调整领带\",\n        \"表情\": \"目光直视，优雅而自信\"\n      },\n      \"发型\": {\n        \"风格\": \"长发，颜色深沉，波浪卷曲，造型优雅\",\n        \"效果\": \"表面光滑、有光泽，具有高级时尚质感\"\n      },\n      \"服装\": {\n        \"类型\": \"单肩连体衣\",\n        \"图案\": \"醒目的抽象黑白图案\",\n        \"装饰元素\": \"柔和的粉色细节\",\n        \"特色\": [\n          \"肩部的领带装饰\",\n          \"环绕腰部的腰带\",\n          \"流畅的时尚剪裁\"\n        ]\n      }\n    },\n    \"环境\": {\n      \"背景\": \"纯黑色的简单摄影棚背景\",\n      \"场景\": \"专业时尚摄影棚\",\n      \"灯光\": {\n        \"类型\": \"专业摄影棚灯光\",\n        \"效果\": [\n          \"主体清晰可见\",\n          \"高光处理得当\",\n          \"阴影柔和且可控\",\n          \"具有编辑级对比度的光照\"\n        ]\n      }\n    },\n    \"美学风格\": {\n      \"风格\": \"高级时尚杂志风格\",\n      \"氛围\": \"自信、优雅、现代时尚\",\n      \"细节处理\": [\n        \"超清晰的纹理\",\n        \"织物细节高度还原\",\n        \"皮肤和头发的光线处理精准\",\n        \"精致且专业的摄影棚呈现效果\"\n      ]\n    }\n  }\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/027154e3f4/预览图.webp"},{"id":27,"c":"05_人物肖像与写实摄影","t":"雨滴与倒影——一幅单色肖像画","p":"{\n  \"描述\": \"一张引人注目的黑白特写肖像，描绘了一位站在雨中的女性。\",\n  \"主体\": {\n    \"性别\": \"女性\",\n    \"姿势\": \"侧身站立，面向左侧\",\n    \"表情\": \"平静而沉思\",\n    \"细节\": {\n      \"头发\": \"长而卷曲，被雨水打湿，垂在身前\",\n      \"皮肤\": \"被雨水浸湿，可见雨滴的痕迹\",\n      \"妆容\": \"自然淡妆，睫毛明显突出\",\n      \"着装\": \"无袖上衣（仅略微可见）\"\n    }\n  },\n  \"环境\": {\n    \"天气\": \"背景中可见降雨\",\n    \"光线\": \"柔和而富有氛围的方向性光线，营造出柔和的高光和阴影\",\n    \"色调\": \"深色调、电影风格的单色画面\"\n  },\n  \"构图\": {\n    \"拍摄类型\": \"特写肖像\",\n    \"对焦\": \"将焦点清晰地集中在女性的脸上\",\n    \"背景\": \"背景模糊，颜色较深，具有明显的散景效果\"\n  },\n  \"氛围\": \"戏剧性、富有情感、充满内省\"\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0279899b04/预览图.webp"},{"id":28,"c":"12_手工玩具微缩手办","t":"动作人偶_1","p":"制作一个写着 [“AI Evangelist - Kris”] 的动作人偶，并包含 [咖啡、乌龟、笔记本电脑、手机和耳机] 。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/02b3059baf/预览图1.webp"},{"id":29,"c":"05_人物肖像与写实摄影","t":"Casual Dreamy Selfie Powerpuff Girls Tee & Cozy Pillows","p":"{\n  \"image_generation\": {\n    \"face\": {\n      \"preserve_original\": true,\n      \"reference_match\": true,\n      \"description\": \"保持女性的面部特征与参考图片完全一致，不改变她的身份、面部结构或比例。\"\n    },\n    \"photo_style\": {\n      \"type\": \"随意的、充满趣味的iPhone自拍\",\n      \"perspective\": \"夸张的俯视式广角视角\",\n      \"ratio\": \"1080 x 1350\",\n      \"mood\": \"亲密的、自然的、梦幻的、温暖的\",\n      \"lighting\": \"柔和的自然室内阳光，带有淡淡的阴影\"\n    },\n    \"subject\": {\n      \"pose\": \"靠在质地柔软的白色枕头上，直视镜头\",\n      \"expression\": \"放松且充满梦幻感，长而浓密的睫毛，脸颊泛着红晕\",\n      \"hair\": {\n        \"style\": \"随意的发髻\",\n        \"description\": \"松散的发型，有些自然卷曲的头发\"\n      },\n      \"clothing\": {\n        \"top\": {\n          \"type\": \"合身的短袖T恤\",\n          \"color\": \"奶油白\",\n          \"details\": \"T恤中央印有鲜艳的卡通风格的《飞天小女警》图案\"\n        },\n        \"bottom\": {\n          \"type\": \"休闲短裤\",\n          \"color\": \"浅米色\",\n          \"details\": \"面料柔软，穿着舒适\"\n        }\n      },\n      \"hands\": {\n        \"position\": \"一只手臂自然地搭在头旁，呈现出随意、有趣的姿势\"\n      }\n    },\n    \"environment\": {\n      \"setting\": \"柔软的白色枕头营造出舒适、亲密的背景\",\n      \"lighting_effects\": [\n        \"柔和的自然室内阳光\",\n        \"淡淡的阴影突出了面料和头发的质感\"\n      ]\n    },\n    \"aesthetic\": {\n      \"style\": \"自然的社交媒体自拍\",\n      \"features\": [\n        \"对面部特征略有广角效果的强调\",\n        \"温暖的个人风格\",\n        \"质感的真实感\"\n      ]\n    }\n  }\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/02da0dc726/预览图.webp"},{"id":30,"c":"06_平面设计视觉传达","t":"AI生成日系社交媒体公告图","p":"阅读附图中描绘的主题，生成多角度镜头，并创建四个场景，以 2x2 网格划分。\n重新混合并以动态姿势进行编辑。\n主体：\n  - 人物的特写肖像。\n  - 直视镜头，表情略显紧张或尴尬。\n  - 胸部略微裸露，露出部分锁骨和乳沟。\n  - 巨大的黑色日文文本（哥特体或粗体）居中覆盖整个图像，遮挡了大部分面部和身体。这段文本是社交媒体帖子风格的公告，以“ご報告”（报告/公告）开头。公告文本由 AI 自动生成。\n风格：\n  - 社交媒体帖子的平面设计。\n  - 超高分辨率数字肖像，应用了强烈的平滑滤镜。\n  - 后期制作中故意降低饱和度和对比度，作为强调文本的背景。\n  - 高调且充满奇幻氛围。\n构图：\n  - 垂直肖像（高方向）。\n  - 特写半身照。女性面部的上半部分（额头）略有裁剪。\n  - 主体居中，文本占据中心位置。\n  - 背景因浅景深（散景）而完全模糊。\n  - 文本与图像垂直对齐。\n光照：\n  - 使用均匀且非常柔和的前置光（环形灯或柔光箱）。\n  - 几乎没有阴影，光线平坦。\n  - 整体非常明亮（高调）的色调。\n  - 色温为中性至略冷的白光。\n色彩：\n  - 极简调色板，主要由白色、浅灰色和文本的黑色组成。\n  - 女性的肤色和唇色非常苍白，饱和度极低。\n  - 整体而言，接近单色的配色方案。\n技术规格：\n  - 数码照片。\n  - 宽高比：4:5 或 3:4 移动肖像格式。\n  - 强烈的柔焦效果和发光风格滤镜（发光）。\n  - 重现叠加的日文文本（包括字体大小、行距和位置）。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/02ssJ9jWIW/预览图.webp"},{"id":31,"c":"09_故事分镜角色设定","t":"漫威风格营销英雄角色设定","p":"如果将我比作一个 【漫威角色】，我会是什么样的角色？请生成一张图片，并创作一段带有详细解释的酷炫描述。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/02y1gc7cb9/预览图.webp"},{"id":32,"c":"11_图像编辑与修复增强","t":"咖啡机设计草图转成品","p":"要求：将这个草图转化为最终可批量生产的产品。采用工作室级别的照明效果；使用注塑工艺制造光滑的白色塑料外壳；手柄采用抛光橡木材质；配备不锈钢滴水盘。保持草图中的比例关系不变，但需将线条优化为完美的几何曲线。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/031f2f6829/预览图.webp"},{"id":33,"c":"13_特定场景环境生成","t":"血月下的浪漫晚餐","p":"**创作要求：**  \n描绘一个夜晚的浪漫餐厅场景，采用单色深红色的灯光效果，并营造出浓厚的立体感雾气氛围。画面构图对称：一对情侣坐在小桌子旁，彼此牵手。女方披着低发髻，身着紧身连衣裙，双腿交叠，穿着高跟鞋；男方则身着西装。桌子上放着一根燃烧的蜡烛和两个葡萄酒杯。背景为从地面到天花板的高大玻璃窗，窗外是迷雾笼罩的城市天际线、稀疏的建筑灯光，以及右上角的一轮满月。房间左右两侧摆放着室内盆栽棕榈树，边桌上点着蜡烛；两侧墙壁上装有温暖的壁灯","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/032474da4a/预览图-1.webp"},{"id":34,"c":"05_人物肖像与写实摄影","t":"红发少女复古苏式居室内景","p":"{\n  \"标签\": \"苏联风格的健康女孩坐在地毯上\",\n  \"标签词\": [\n    \"健身女孩\",\n    \"红发\",\n    \"后苏联时期\",\n    \"室内装饰\",\n    \"地毯与墙壁的搭配\",\n    \"电影摄影\",\n    \"自然光\",\n    \"24毫米镜头\",\n    \"坐姿\"\n  ],\n  \"构图风格\": 1,\n  \"风格特征\": [\n    \"苏联复古风格\",\n    \"颗粒感强的电影摄影效果\",\n    \"自然光效果\",\n    \"纪实风格\"\n  ],\n  \"主题描述\": \"一位20岁的健康女孩，皮肤白皙，身材匀称，坐在地毯上；她的长发自然卷曲，部分垂在脸上；眼神柔和，目光投向镜头；表情放松，嘴角微微上扬，眉头舒展；穿着橙红色的棉质运动短裤和淡蓝绿色的条纹上衣；赤脚，双腿弯曲舒适地放在地上，双臂随意搭在大腿或地毯上；妆容简单：仅使用淡色遮瑕膏，没有明显的眼线，腮红颜色自然\"\n  ],\n  \"服装与配饰\": [\n    \"橙红色运动短裤\",\n    \"淡蓝绿色条纹上衣\",\n    \"带有小太阳形状吊坠的细银链\",\n    \"深绿色的发带，用于固定松散的头发\",\n    \"赤脚\"\n  ],\n  \"拍摄姿势\": \"女孩坐在房间中央的地毯上，双腿自然弯曲或交叉，微微抬头看向镜头（镜头高度与眼睛齐平），呈现出柔和的低角度视角；姿势放松，背部略微弓起，肩膀下垂\"\n  \"场景中的物品\": \n    \"复古风格的落地扇，金属框架有褪色痕迹，放置在靠近墙壁的位置\",\n    \"深绿色的天鹅绒扶手椅，带有木质装饰\",\n    \"陶瓷茶杯，边缘镀金，放在有磨损痕迹的茶几上\",\n    \"圆形模拟时钟，玻璃表面有裂纹\"\n  ],\n  \"背景环境\": \"后苏联时期的房间风格：墙壁上铺着大块的酒红色装饰地毯，窗户处挂着深绿色的窗帘；木质书架摆放着书籍和小雕像；镜子带有氧化痕迹的镀金边框；梳妆台下方露出电线\"\n  \"房间内的其他物品\": \n    \"背景墙上铺着酒红色的花卉图案地毯\",\n    \"与地毯颜色相匹配的深红色几何图案地毯\",\n    \"涂了清漆的木质衣柜，把手为黄铜材质\",\n    \"镜框有氧化痕迹的苏联风格镜子\",\n \"天花板呈奶油色，角落处有轻微褪色\",\n    \"白色木质门，门把手为古铜色\",\n    \"下垂的窗帘杆，挂着深绿色的天鹅绒窗帘\",\n    \"角落里的落地式衣架\"\n  ],\n  \"色彩限制\": \n  \"房间装饰以酒红色、棕色和深绿色为主\",\n  \"天花板和门可以保持白色\",\n  \"服装颜色以柔和但相互协调的色调为主\"\n  \", \n  \"光线设置\": \"光线来自左侧窗户的自然光，整个场景弥漫着柔和的背景光；家具和人体轮廓投下自然阴影；头发和手臂上有淡淡的高光\"\n  \"相机参数\": \n  \"镜头类型\": \"24毫米广角镜头\",\n  \"景深效果\": \"中等偏浅\",\n  \"拍摄角度\": \"与眼睛平视\",\n  \"视角效果\": \"女孩看起来像是在向上看镜头\",\n  \"对焦方式\": \"主体面部清晰对焦，背景部分逐渐模糊\"\n  \", \n  \"最终呈现效果\": \"照片效果具有写实感，采用低颗粒度的电影质感，色彩饱和度较低，带有轻微的暖色调；整体风格类似20世纪80年代的纪实电影照片，给人一种柔和的纸质质感\"\n  \"整体氛围\": \"宁静、内省、充满自然气息，同时展现出一种低调的自信\"\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0337d96d51/预览图.webp"},{"id":35,"c":"03_创意广告品牌设计","t":"昆仑煮雪香薰静物海报","p":"为这两个香薰产品设计产品海报。两个香薰放在一起的超近景特写，质感清晰。米色背景，周围棕色透明轻纱，蕨类植物，沉香枯木，两支铃兰。4K超清画面质感。静物摄影，昏暗氛围，光线追踪。海报上方文案标题：\"昆仑煮雪\"，极细文字。页面下方小字：\"沉香|铃兰|草本\"。艺术签角标：\"观夏|to summer\"。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/03401c9264/预览图.webp"}],"total":10311,"page":1,"limit":36,"pages":287,"source":"prebuilt-bootstrap"},"categoryFiles":{"01_建筑室内空间设计":"categories/category-001.json","05_人物肖像与写实摄影":"categories/category-002.json","06_平面设计视觉传达":"categories/category-003.json","03_创意广告品牌设计":"categories/category-004.json","10_卡通漫画电影游戏":"categories/category-005.json","02_电商产品虚拟摄影":"categories/category-006.json","14_社交媒体营销":"categories/category-007.json","09_故事分镜角色设定":"categories/category-008.json","15_表情包趣味拼图":"categories/category-009.json","07_艺术插画创意风格":"categories/category-010.json","13_特定场景环境生成":"categories/category-011.json","12_手工玩具微缩手办":"categories/category-012.json","11_图像编辑与修复增强":"categories/category-013.json","04_创意脑洞特效合成":"categories/category-014.json","08_图像分析信息拆解":"categories/category-015.json","ThinkAI / 个人资料 / 头像":"categories/category-016.json","ThinkAI / 社交媒体帖子":"categories/category-017.json","ThinkAI / 信息图 / 教育视觉图":"categories/category-018.json","ThinkAI / YouTube 缩略图":"categories/category-019.json","ThinkAI / 漫画 / 故事板":"categories/category-020.json","ThinkAI / App / 网页设计":"categories/category-021.json"},"categoryCounts":{"01_建筑室内空间设计":414,"05_人物肖像与写实摄影":2607,"06_平面设计视觉传达":1464,"03_创意广告品牌设计":682,"10_卡通漫画电影游戏":633,"02_电商产品虚拟摄影":306,"14_社交媒体营销":241,"09_故事分镜角色设定":535,"15_表情包趣味拼图":171,"07_艺术插画创意风格":517,"13_特定场景环境生成":303,"12_手工玩具微缩手办":530,"11_图像编辑与修复增强":124,"04_创意脑洞特效合成":1048,"08_图像分析信息拆解":236,"ThinkAI / 个人资料 / 头像":100,"ThinkAI / 社交媒体帖子":100,"ThinkAI / 信息图 / 教育视觉图":100,"ThinkAI / YouTube 缩略图":50,"ThinkAI / 漫画 / 故事板":100,"ThinkAI / App / 网页设计":50},"categoryPreviewPages":{"01_建筑室内空间设计":{"prompts":[{"id":1,"c":"01_建筑室内空间设计","t":"季节变换 - 秋季","p":"请将该图片的季节变为秋季，叶子金黄色","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/002154d2cb/预览图.webp","partial":false},{"id":7,"c":"01_建筑室内空间设计","t":"添加人物","p":"在图像中的[目标位置]增加,[XX]数量的人物，[XX]种族，[XX]年龄，[XX]行为","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00b0b31c26/预览图.webp","partial":false},{"id":42,"c":"01_建筑室内空间设计","t":"方案概念阶段：灵感转化","p":"设计约束原则：建筑设计仅允许从主体元素的形态、色彩、质感、色调、比例及行为特征中获取灵感，严禁复制其面部、头部或任何具体具象形态。\n任务输出要求（共三部分）\n概念性体量演变草图（BIG 风格）\n内容需清晰展示建筑主体如何从主题元素的特征中演变生成，过程步骤需有明确标注。\n表达语言：全程使用中文。\n完整详尽的建筑实施方案\n设计理念标题：需精准概括设计核心。\n真实照片效果渲染图：以该主体元素为灵感，设计一栋具备真实功能性的建筑。图中必须融入人类活动场景、清晰的流通路径以及可信的现场环境。\n展板规格：采用结构化、竞赛级布局，高级排版，呈现国际风格。版面以元素为主题背景，信息密度高。\n多角度建筑效果图展示\n提供3-4 个不同角度的建筑效果图，全面展示设计形态。\n最终版面排版规范\n比例：3:4 竖版构图。\n底板颜色：纯白色。\n布局结构：顶部效果图区域占版面1/3，为横图格式。\n内容密度：下方信息区承载高浓度的各类分析图及详细注解。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/03tME58fk8/预览图.webp","partial":false},{"id":43,"c":"01_建筑室内空间设计","t":"建筑分析图通用模板","p":"将这张图片变成作品集风格的建筑分析图，轴测图视角，在白色模型的基础上增加一些半透明的高亮颜色，比如红色、橙色等，用于表达重点设计区域，以及添加一些引出文字标注","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/040a97b572/预览图.webp","partial":false},{"id":44,"c":"01_建筑室内空间设计","t":"上海城市天气插画","p":"呈现一个45度俯视角的垂直（9:16）等轴测微型3D卡通场景，突出显示画面中央的标志性地标，以展示精确细腻的建模效果。  \n该场景采用了柔和、精致的纹理和真实的PBR材质，并配以自然生动的照明及阴影效果。天气元素被巧妙地融入城市建筑中，形成了城市景观与大气状况之间的动态互动，营造出沉浸式的氛围。  \n构图简洁统一，采用极简主义美学风格，背景颜色均匀且饱满，以突出主要元素。整体视觉效果清新自然。  \n在画面顶部中央放置一个显眼的天气图标，下方显示日期（极小字幕）和温度范围（中等字幕），城市名称（大字号）则位于天气图标正上方。天气信息没有背景，可与建筑物轻微重叠。  \n文字应与所选城市的官方语言相匹配。  \n渲染前请获取指定城市的当前天气信息。  \n城市名称：【上海】","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/043a229169/预览图-1.webp","partial":false},{"id":56,"c":"01_建筑室内空间设计","t":"景观设计分析","p":"生成上传景观设计的等距视图，清晰地分为四个独立图层：（1）包含家具的硬质景观元素，（2）硬质铺装及结构表面，（3）地被植物，如草地、土壤或水体，（4）树木及大型植被。每个图层应视觉清晰、标注明确，并附说明其功能、材料和类型。将图层排列成干净、可用于展示的组合，便于理解空间组织、材料层级及生态或设计关系，同时保持设计的原始布局和比例。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/05323a228f/预览图.webp","partial":false},{"id":58,"c":"01_建筑室内空间设计","t":"建筑多角度一致性图片生成","p":"根据我上传的图片，生成一个 3x3 的建筑可视化网格，只生成拼图，不用添加文字，【1:1】图像比例。\n固定的建筑、同样的周边环境。\n镜头拍摄顺序：\n第1行：左侧建筑鸟瞰、正面建筑鸟瞰、右侧建筑鸟瞰\n第2行：左侧人视点两点透视、正面人视点两点透视、右侧人视点两点透视\n第3行：局部细节1、局部细节2、局部细节3（3处细节需要从不同维度展示）","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0549dcc29f/预览图.webp","partial":false},{"id":60,"c":"01_建筑室内空间设计","t":"平面图渲染（需传参考图）","p":"让图1参考和学习图2中的颜色风格与元素，保持图1平面图内容不变，以插画风格来呈现效果。点缀浅绿色的树木植物，为整个画面添加柔和的投影，使其成为一张生动而立体的彩色图纸","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0574b6bc61/预览图.webp","partial":false},{"id":68,"c":"01_建筑室内空间设计","t":"建筑拼贴风效果图","p":"按照图1的风格，对图2进行风格转换，同时确保图2的结构保持不变。采用OMA拼贴风格进行建筑可视化处理，呈现出一种后数字时代的审美效果。前景描绘了一个热闹繁忙的户外市场，市场上有白色和红色的遮阳篷摊位；数百个形态各异、栩栩如生的人影正在行走和购物。灰色的沥青地面上画着明亮的黄色有机形状。远处有一个巨大的抽象红色球体。天空呈现出淡淡的纹理、轻微的颗粒感和噪点效果，采用复古的色彩渐变，并采用平光效果，融合了线条绘画和照片拼贴的技法。请确保图1中的结构元素保持不变。--分辨率：4:3 --风格转换强度：250","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/06ac476892/预览图.webp","partial":false},{"id":82,"c":"01_建筑室内空间设计","t":"家装室内设计渲染图通用","p":"{\n  \"camera\": \"Canon EOS R5 24mm f*\",\n  \"environment\": {\n    \"lighting\": \"日景\",\n    \"sunlight\": \"无太阳光线\",\n    \"time\": \"17:00\",\n    \"atmosphere\": \"干净\",\n    \"materials\": {\n      \"wall_color\": \"RGB(245, 245, 245)\",\n      \"ceiling_color\": \"RGB(245, 243, 245)\",\n      \"ceiling_texture\": \"艺术肌理涂料\"\n    },\n    \"cabinet_same_color\": true\n  },\n  \"constraints\": [\n    \"保持颜色不变\",\n    \"不能改变原图结构 不能改变原设计结构\",\n    \"比例不变\",\n    \"材质不变\"\n  ],\n  \"人物\": \"一位，人物动态模糊\",\n  \"环境光\": \"外景进入的柔和自然明亮天光，光线明亮细腻有层次。光线遵循真实的光照逻辑，使得空间中的材质与光发生真实的漫反射。镜头后方有自然光照。\",\n  \"光影品质\": \"电影级布光，柔和漫反射，真实阴影层次，高动态光影\",\n  \"画面表现\": \"光照均匀充足，写实室内摄影，质感通透，细节丰富，室内灯光打开，暖光，电影级后期调色。\",\n  \"摄影参数\": {\n    \"光圈\": \"f/8\",\n    \"快门\": \"1s\",\n    \"拍摄技术\": \"高动态范围（HDR）拍摄，包围曝光，确保暗部不失真、亮部不过曝。\",\n    \"分辨率\": \"超高分辨率（8K）\"\n  }\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/07ev37mobg/预览图1.webp","partial":false},{"id":85,"c":"01_建筑室内空间设计","t":"中式景观庭院清晨渲染效果图","p":"{\n  \"项目名称\": \"su截图转写实摄影- 新中式庭院\",\n  \"核心约束\": {\n    \"几何保真度\": \"严格保持原始SU场景结构、物体位置和几何形状，严禁改变空间布局。\",\n    \"转换逻辑\": \"将基础SU模型面转换为高精度、符合物理规律的真实材质（PBR）。\",\n    \"图像比例\": \"保持和原图相同的比例。\"\n  },\n  \"场景与光效\": {\n    \"设计风格\": \"新中式庭院\",\n    \"地点\": \"中国成都\",\n    \"时间\": \"早上8点\",\n    \"植被和道路\": \"自然衔接\",\n    \"配景\": \"在廊架下和庭院里加几个长曝光人物，植物局部区域加淡淡的水雾。\",\n    \"环境光\": \"柔和自然天光，光线细腻有层次。\",\n    \"光影品质\": \"电影级布光，柔和漫反射，真实阴影层次，高动态光影对比。\"\n  },\n  \"摄影参数\": {\n    \"相机型号\": \"胶片相机\",\n    \"光圈\": \"f1.2\",\n    \"快门\": \"1s\"\n  },\n  \"渲染精度\": {\n    \"后期调色\": \"电影级后期调色。\"\n  },\n  \"画面表现\": {\n    \"构图与景深\": \"中间为焦点，景深效果明显。\",\n    \"质感与细节\": \"质感通透，细节丰富，专业摄影质感。\",\n    \"植物表现\": \"植物变得真实细腻，植物局部柔和高光，枝叶疏密不均。\",\n    \"自然光影\": \"清晨的自然光，树冠过滤形成漫射光，地面投射光影。\",\n    \"雾气效果\": \"雾气散射光线，少量雾气，光线可透过叶片形成斑驳光影。\",\n    \"后期调色\": \"电影后期调色。\"\n  }\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/07nK43wUir/预览图.webp","partial":false},{"id":90,"c":"01_建筑室内空间设计","t":"世界博物馆微缩景观系列","p":"博物馆微缩景观提示词：\n呈现一个精致绝伦的微缩3D卡通风格场景，博物馆名称为{用户输入：博物馆名称}，采用清晰的45°俯视角。\n核心建筑：\n将该博物馆最最具辨识度的标志性建筑置于画面正中央（例如：卢浮宫的玻璃金字塔、大英博物馆的希腊复兴式正立面、冬宫的巴洛克宫殿外观）。建筑风格必须鲜明且高度忠实于真实博物馆","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/08b51ccea3/预览图.webp","partial":false},{"id":135,"c":"01_建筑室内空间设计","t":"建成项目实拍照片精修美化拯救废片","p":"原图修复，园林景观竣工照片，必须保持原图主要内容不变，按要求优化。\n1、地上落叶,回头前面和绿篱上的木条全部去除，绿篱效果修复参考图2。\n2、检查画面瑕疵并修复，修复画面的透视问题，修复画面模糊、曝光过渡、逆光等问题，整体清晰图修复。\n3、整体色彩、光影、环境氛围优化参考图2，4、画面整体氛围效果参考图3。\n5、前景雕塑哑光拉丝香槟金金属材质质感增强，表面平整无凹凸不平；景观石头是黑山石，黝黑发亮有白色纹理，参考图4，照片前面的黑色碎石和片岩同样黝黑的效果，不要灰蒙蒙的，参考图4中的碎石。\n6、整体清晨的蓝光时刻，有薄雾，潮湿露水湿润了植物、石头、地面和雕塑，地上没有水。\n7、初夏天时节，修复部分植物没有叶子的问题，不要浓密的树冠效果，要透气，要空气感，雕塑后面这棵红枫保持红叶不变；\n8、廊架为哑光香槟金色，廊架的墙面为浅米色石材，不改变廊架的样子和结构。\n着重聚焦画面氛围和材质质感、纹理的表现，国际摄影大师水准，真实照片效果，光影自然真实，电影胶片质感，画面逻辑检查、修复，超高清修复，合理化逻辑自洽。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0P7fWklVhL/预览图1.webp","partial":false},{"id":174,"c":"01_建筑室内空间设计","t":"总图分析-风环境及重要设施分析","p":"视线分析\n角色： 您现在是一位专业的建筑分析图和城市规划制图大师。\n目标： 在提供的黑白CAD场地平面图（image_0.png）上，创建一个详细且专业的建筑视线分析图。\n核心指令：\n基础层： 必须保持原始的 image_0.png CAD场地平面图（包括等高线、现有树木、道路、景观元素、建筑体量、指北针和比例尺）作为清晰、灰度的背景。不要改变或遮挡这些基本信息。\n叠加层（视线分析）： 使用精确的矢量图形技术，添加一层新的、彩色的视线分析。\n视点（Viewpoints）： 在以下关键位置定义并标记矢量视点符号（例如，一个带有微型雷达或眼睛的圆圈）：\n入口道路处\n较低阶梯平台的边缘\n景观池塘的西侧\n最高建筑体量的屋顶观景台\n视线锥（Sight Cones）： 从每个视点延伸出扇形的矢量视线锥。\n使用一种鲜艳的专业分析颜色（例如，青色 #00CED1）表示主要的清晰视野。\n使用另一种对比鲜明的专业分析颜色（例如，品红色 #FF00FF）表示受阻的视野。\n视野分析：\n使用彩色矢量线条。\n实线表示清晰的视线路径。\n虚线表示视线如何被树木、地形或建筑体量截断。\n对完全被遮挡的区域使用微妙的、浅灰色的矢量图案（例如，交叉阴影线或点阵图）进行填充。\n技术注释（Technical Annotations）： 添加干净、现代字体的技术注释和文本框。示例：\n“视点1：入口轴线视角” (VIEWP_1: ENTRANCE AXIS)\n“视点4：全景屋顶视角” (VIEWP_4: PANORAMIC ROOF VIEW)\n“障碍：现有树冠” (OBSTRUCTION: EXISTING TREE CANOPY)\n“由建筑体量引起的视野遮挡” (VIEW OBSCURED BY BUILDING VOLUMES)\n“最佳景观视线” (OPTIMAL SIGHTLINE TOWARDS POND)\n为某些视点添加角度注释（例如：“135° 水平视野”）。\n图例侧边栏（Legend Side-Panel）： 在图像的右侧，添加一个干净、矩形的矢量图例框。图例应包括：\n视点符号\n主要视线（青色实线）\n次要/受阻视线（品红色虚线）\n视野锥（半透明青色扇形）\n被遮挡区域填充图案\n技术注释标签示例\n风格与美学： 保持整体风格非常干净、精确、具有信息图表感。只使用2-3种鲜艳的分析颜色作为点缀，与灰度背景形成鲜明对比。确保所有线条都是清晰的矢量线条，没有模糊感。保留原始的指北针和比例尺。所有标注均为中文禁止英文。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0b6f179ab4/预览图.webp","partial":false},{"id":179,"c":"01_建筑室内空间设计","t":"家具拆解说明书","p":"以一张图纸详细展示这个【餐边柜】的详细做法以及安装说明书，包括各个角度的写实渲染图、立面图、结构拆解图、所有的配料清单，所有文字标注采用中文。所有内容以简洁美观优雅的方式排列在一张图像中，图像比例4：3。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0bac88659c/预览图.webp","partial":false},{"id":204,"c":"01_建筑室内空间设计","t":"建筑手绘人视点转鸟瞰实景","p":"根据这张线框图，生成低空规划鸟瞰实景照片，照片能看到整个区域的全貌和周边的环境。不改变用地形状。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0d6a2a4f54/预览图.webp","partial":false},{"id":226,"c":"01_建筑室内空间设计","t":"构筑物设计（需参考图）","p":"现在我要做一个构筑物，请将图2的材料迁移到图1上，保证图一的结构不变","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0eec2ce149/预览图.webp","partial":false},{"id":227,"c":"01_建筑室内空间设计","t":"室内设计材质解析物料板极简风","p":"以室内效果图为核心视觉(占画面30%)，制作室内设计材质解析物料板;黑色肌理褶皱纸张为底，效果图四周错落排布空间同款材质样板、定制配色色卡，用米白色纸胶带模拟粘贴固定效果。材质样板配简约中英文标签注解，效果图旁以贴纸形式陈列家具陈设单品;侧边搭配同色系白卡纸涂色色卡统一色调。整体INS极简高级风，低饱和柔和配色，超写实细腻材质肌理，构图规整协调，质感精致专业，适用于室内设计方案汇报展示。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0eit04lbfz/预览图.webp","partial":false},{"id":229,"c":"01_建筑室内空间设计","t":"建筑分析图-功能分析1","p":"将图片转换为等距轴测Ambient Occlusion模型图。图片背景为纯白色、道路为淡灰色并散布灰色风格化小人、建筑根据功能分区填充纯色的彩色颜色且轮廓使用黑色加粗线条描边，将场景中复杂的图面内容进行简化","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0f00bebe54/预览图.webp","partial":false},{"id":231,"c":"01_建筑室内空间设计","t":"建筑蓝图转换","p":"请将上传的建筑效果图转换为专业、标准的建筑蓝图。画面整体应为白底蓝图，使用精细、连续的蓝色线条进行勾勒。采用标准的建筑平面图或立面图的制图规范，画面主体由不同粗细和类型的蓝色线条构成。最终效果应模拟图纸打印或晒蓝的质感，可以是纯白底蓝色线条，也可以是带有轻微纸张纹理的浅蓝底白色线条（即传统的“蓝晒图”效果）。线条必须清晰、准确，无模糊或断线。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0f15830463/预览图.webp","partial":false},{"id":264,"c":"01_建筑室内空间设计","t":"白模线稿风效果图","p":"图生图，100%锁定原图SU建筑视角、透视、建筑体量、台阶形体结构、场地边界布局完全不变，建筑竞赛白模线稿插画风 【1.风格基调定性 Style & Vibe Definition】 建筑竞赛专业CAD线稿白模插画，精细均匀黑色实线轮廓，白模留白为主、局部浅灰薄填，图解化竞赛分析效果图；杜绝写实材质、写实光影、照片渲染，干净极简专业展板画风。 【2.背景画布与天空环境 Canvas & Sky Environment】 天空整面平铺纯色浅薄荷青绿色；画面中上部设置一块巨型实心暖橘红正圆落日；搭配轮廓干净的留白白色云朵，天空散落多组细小黑色飞鸟剪影，无渐变云层、无杂色。 【3.空间层次构图 Spatial Composition Layering】 完全保留原始SU布局：建筑轮廓、台阶层级高差、平台范围、原有树木栽植点位固定不变；仅替换树木造型，不改动建筑与场地边界尺寸。 【4.光影与氛围 (Lighting, Color & Atmosphere)】 全图无任何落地写实阴影，仅依靠少量浅灰区分体块层次；画面干净理性，专业建筑设计竞赛素雅氛围。 【5.建筑主体】 建筑墙体大面积纯白留白，局部体块浅灰色薄填；全部门窗、竖向格栅、楼板分割用精细黑色细实线勾勒，无玻璃/石材写实质感。 【6.场地表现（核心两处修改：树木样式+台阶取消大面积填色）】 ①台阶&平台：**台阶、步道整体大面积纯白留白，取消大面积蓝灰色实体填充；仅在台阶结构边缘用细暖红色线条勾边强化边界，仅极小局部浅灰点缀**； ②绿化植被：所有原有树木全部更换为「单黑线勾勒枝干树冠、内部全空白不填色」的线稿树形，统一简约分叉树枝造型，全树无任何色块填充； ③人物：平台行人统一实心暖橘红色剪影，无五官细节、无服饰刻画； ④景观小品：石墙、护栏、景观构件全黑细轮廓+主体留白。 【7.色彩方案 (Color Palette)】 固定5色：纯白、浅灰、浅薄荷青（天空）、暖橘红（太阳+人物+边界细红线）、蓝灰色（仅极少量细节点缀，台阶不用大面积蓝灰），禁用多余色彩。 【8.装饰元素 (Decorative Elements)】 天空：橘红大圆太阳、留白白色云朵、零散小黑飞鸟； 场地：仅台阶边缘少量细红线作为装饰，无多余色块装饰； 【补充规范】 全图禁止出现任何水印、英文字、标注、边框、logo、配图、箭头符号，只保留纯建筑线稿效果图。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0nn0gw9n3o/预览图.webp","partial":false},{"id":266,"c":"01_建筑室内空间设计","t":"体积光薄雾鸟瞰图","p":"```json\n{\n  \"metadata\": {\n    \"image_category\": \"3D渲染(CGI)\",\n    \"mood_atmosphere\": \"自然共生、静谧治愈、未来感、生态宜居、史诗感\"\n  },\n  \"domain_specific_analysis\": {\n    \"cgi_3d_attributes\": {\n      \"rendering_style\": \"PBR写实渲染\",\n      \"materials_and_shading\": \"全局光照(Global Illumination)，精准模拟清晨薄雾中的自然天光与丁达尔效应；材质包含高透反光玻璃幕墙、光滑混凝土/金属外立面、真实植被纹理的屋顶绿化、带自然反射的水体、自然纹理的石材步道，雾气效果真实细腻，光影层次丰富\"\n    }\n  },\n  \"visual_elements\": {\n    \"color_palette\": [\"深墨绿（山林）\", \"浅灰/米白（建筑外立面）\", \"暖黄（室内灯光）\", \"浅灰蓝（天空/雾气）\", \"水蓝（水系）\", \"草绿（草坪）\"],\n    \"lighting\": \"清晨薄雾中的自然天光，丁达尔效应明显，阳光穿透雾气形成光束；建筑内部暖黄色人造光与环境冷调天光形成冷暖对比，阴影柔和，雾气增强空间氛围感\",\n    \"composition\": \"鸟瞰航拍视角，中心对称式构图，建筑围绕中央草坪与水系呈环形布局；以蜿蜒步道、建筑曲线为引导线汇聚视觉中心，三分法布局，山林环绕建筑，空间纵深感极强\"\n  },\n  \"content_and_subjects\": [\n    {\n      \"type\": \"建筑\",\n      \"detailed_description\": \"多栋流线型/有机曲线型多层建筑，外立面为浅灰/米白搭配大面积玻璃幕墙，屋顶做大面积绿化（绿色屋顶），建筑内部透出暖黄色灯光，造型舒展，与自然环境融合\",\n      \"attributes\": {\n        \"material_or_texture\": \"玻璃（高透反光）、混凝土/金属（光滑质感）、绿植（真实植被纹理）\",\n        \"action_or_expression\": \"静态建筑\",\n        \"clothing_or_accessories\": \"\"\n      }\n    },\n    {\n      \"type\": \"景观\",\n      \"detailed_description\": \"中央大型阶梯式草坪、蜿蜒的水系（溪流+镜面水池）、蜿蜒的人行步道与空中连廊，串联各栋建筑\",\n      \"attributes\": {\n        \"material_or_texture\": \"草坪（鲜活绿植）、水体（真实水面反射）、石材/混凝土步道（自然纹理）\",\n        \"action_or_expression\": \"静态\",\n        \"clothing_or_accessories\": \"\"\n      }\n    },\n    {\n      \"type\": \"人物\",\n      \"detailed_description\": \"步道、草坪、连廊上的小型人物，呈现散步、休憩、活动的状态\",\n      \"attributes\": {\n        \"material_or_texture\": \"人物模型\",\n        \"action_or_expression\": \"活动、行走、休憩\",\n        \"clothing_or_accessories\": \"日常休闲服饰\"\n      }\n    },\n    {\n      \"type\": \"植被\",\n      \"detailed_description\": \"环绕建筑的茂密山林、建筑周边的乔木、屋顶绿化，植被层次丰富，绿意盎然\",\n      \"attributes\": {\n        \"material_or_texture\": \"真实植被纹理\",\n        \"action_or_expression\": \"静态\",\n        \"clothing_or_accessories\": \"\"\n      }\n    },\n    {\n      \"type\": \"小型建筑\",\n      \"detailed_description\": \"左上角的小型附属建筑，造型简约，玻璃立面\",\n      \"attributes\": {\n        \"material_or_texture\": \"玻璃、混凝土\",\n        \"action_or_expression\": \"静态\",\n        \"clothing_or_accessories\": \"\"\n      }\n    }\n  ],\n  \"environment_and_space\": {\n    \"setting_and_weather\": \"山林中的生态型园区（康养/办公/教育类），清晨薄雾天气，阳光穿透雾气，空气湿润通透\",\n    \"spatial_relationships\": \"空间层次分明：前景为下方的山林、步道与建筑局部；中景为核心建筑群、中央草坪、水系与步道，是视觉焦点；背景为茂密的山林与弥漫的雾气，营造深远的空间感，建筑完全融入自然山林环境，有机共生\"\n  },\n  \"text_data\": {\n    \"extracted_text\": [\"小红书\"]\n  },\n  \"global_summary\": \"这是一张高质量的生态型园区3D鸟瞰写实渲染效果图，清晨薄雾中，多栋流线型有机建筑环绕中央阶梯式草坪与蜿蜒水系，屋顶绿化与周边山林自然融合，暖黄色室内灯光点亮建筑，丁达尔效应的阳光穿透雾气，营造出自然共生、静谧治愈的未来感生态宜居氛围，完美展现了建筑与山水、植被有机结合的高端生态园区设计理念。\"\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0odsZrMmiO/预览图.webp","partial":false},{"id":283,"c":"01_建筑室内空间设计","t":"原型提取分析","p":"【图面主题变量：类型学与原型提取分析 / Typology and Prototype Extraction；研究对象变量：建筑体块、功能布局或空间原型；分类变量：排布方式、适用类型和基本形态。】\n生成一张 1:1 方形类型学矩阵分析图，图像语言为中英双语，整体为白底高密度小卡片网格。画面由 7 列左右、6 行左右的均匀小卡片组成，每张卡片都有浅灰细边框，卡片上半部放置一个极简白模轴测小体块或场地原型，右上角放置一个黑色抽象平面符号，如实心方块、L 形、四宫格、条形、空心框、点阵。卡片下方有两三行小号中文说明，例如“操作方式”“适用建筑”“单体建筑 / 网格式 / 行列式”等，可配英文小字。所有小模型使用白、浅灰、黑的线稿和柔和投影，图面没有大标题，重点是整齐的分类目录感。构图必须严格网格化，卡片间距一致，信息重复但不混乱，形成建筑类型学样本库。避免彩色背景、复杂渲染、照片、粗线和装饰图案；必须保持“小卡片矩阵 + 轴测白模 + 黑色抽象符号 + 说明文字”的图面逻辑。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0vj1afl6zs/预览图.webp","partial":false},{"id":286,"c":"01_建筑室内空间设计","t":"建筑设计竞赛风格展板","p":"A1竖版大学生建筑竞赛展板，主标题《复合邻境：疫情视角下社区的弹性化设计》，副标题“Flexible design of community from the perspective of epidemic situation”。 版式结构： 1. 顶部标题区：主标题使用黑体粗体大字，醒目突出；副标题及英文使用黑体细体字，搭配疫情相关背景小图，奠定主题基调。 2. 上半部分：    - 左侧：全球疫情背景数据图、时间轴、疫情影像资料，红/灰色调的信息图表，清晰标注数据与年份。    - 中间：社区尺度现状分析总平面图，黑白线稿配红色流线与步行圈标注，N字指北针，比例尺清晰。    - 右侧：问题提出与设计理念文字框，图标化的“安全、共享、活力、生态”设计核心。 3. 中部分析区：    - 问题导向模块：空间资源闲置、文化活动缺失、活动方式变化三类现状问题，黑白线稿示意图，红/灰色标注。    - 空间策略场景串联：多场景社区公共空间效果图，现代写实风格，灰白主色调配红色点缀，展示从社区公共空间到共享庭院的完整流线。    - 弹性功能单元模块：疫情前/疫情中/疫情后功能对比，线稿与小效果图结合，展示社区空间的多用途弹性转换。 4. 下半部分：    - 设施与街区策略：模块化设施分析、街区流线分析、韧性策略三层体系，线稿与轴测图结合，红色高亮强调。    - 分区策略与总平面图：社区轴测鸟瞰图，彩色体块标注不同功能分区，河流与道路清晰呈现，搭配图例说明。    - 空间资源配置饼状图与场景展示：底部为社区弹性空间场景效果图，展现无入口区、就医界面、人文交流等日常场景，灰白主色调，红色点缀，人物活动细节丰富。 整体风格：白底+灰/红/黑三色专业配色，现代学术竞赛排版，信息层级清晰，文字标注规范，线稿、信息图表与写实效果图结合，整体干净、严谨、饱满，充满人文关怀与学术竞赛质感，8K分辨率，细节锐利。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0w8uki0csv/预览图.webp","partial":false},{"id":305,"c":"01_建筑室内空间设计","t":"体块分析图","p":"基于这张图片，生成建筑设计从基础体块到最终体量的演变过程，以几何简形+箭头标签分步展示【步骤1234】，保持比例一致、无纹理、清晰连贯。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1103c25dba/预览图.webp","partial":false},{"id":343,"c":"01_建筑室内空间设计","t":"武当山居新中式住宅设计图","p":"一套详细的建筑设计蓝图，位于中国武当山山腰的一栋双层住宅。总建筑面积1600平方英尺（约148平方米）。包含一层平面图、二层平面图和前后立面图。布局设计为三间卧室。建筑风格为新中式，结合了传统武当山道教建筑元素与现代山地住宅特色：坡屋顶，青瓦，深色木构架梁柱，以及当地石材基座。图纸上带有尺寸标注线和建筑符号，专业建筑绘图风格，蓝底白线图。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/138b5f1e3f/预览图.webp","partial":false},{"id":376,"c":"01_建筑室内空间设计","t":"城市地标信息图","p":"制作一张[Xxx地标]的城市鸟瞰角度的信息图，结合地标的真实照片与白色技术注释和图解叠加。在图片左下角的手绘方框中写上建筑名称。叠加复杂白色技术标注，展示关键结构数据、重要测量、材料数量、细部做法，剖面图、平面图以及显著的建筑或工程特征。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1645844e7a/预览图.webp","partial":false},{"id":409,"c":"01_建筑室内空间设计","t":"毛坯房通过指令装修为新家","p":"将这张毛坯房室内照片改造成现代设计风格室内场景，保留原始空间结构关系，消除毛坯粗糙感，中性色为主调，平整墙面+简约瓷砖地面，配简约沙发、餐桌、柜体，搭浅窗帘、绿植与柔和细腻的灯光，布局符合空间尺度，具有高度的室内设计审美，画面呈现令人惊叹的细节写实感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/18f7ff8519/预览图.webp","partial":false},{"id":411,"c":"01_建筑室内空间设计","t":"现代别墅蓝图与效果图对比","p":"{\"type\":\"分割式建筑可视化\",\"objective\":\"创建一个 3:4 的垂直建筑可视化图像，采用精确的 50/50 水平分割：上半部分为精准的豪华俯视蓝图，下半部分为与蓝图布局完全一致的写实风格现代单层住宅渲染图。确保所有封闭房间均有平屋顶覆盖，且建筑实体与平面图一一对应。\",\"aspect_ratio\":\"3:4\",\"composition\":{\"layout\":\"两个堆叠面板，精确的 50/50 垂直分割\",\"top_half\":\"真实的俯视正投影建筑蓝图\",\"bottom_half\":\"同一住宅的正面高位写实外观渲染图\",\"alignment\":\"建筑体量、车库、门廊、右侧翼、后部泳池平台及房间布局必须与蓝图精确匹配\"},\"top_section\":{\"style\":\"深海军炭灰色背景上的深色豪华建筑蓝图\",\"linework\":\"纤细且带有微光的米色和金色技术线条，包含清晰的墙体轮廓、开门方向、窗户、家具符号、管道装置、橱柜、楼梯、露台板、草坪和泳池轮廓\",\"labels\":{\"count\":10,\"items\":[\"车库\",\"洗衣房\",\"厨房/餐厅\",\"客厅\",\"前门廊\",\"次卧\",\"主卧套房\",\"露台\",\"泳池\",\"草坪\"]},\"layout_details\":\"左前方为大车库，车库上方为洗衣房，上方中心为带岛台和吧台椅的厨房/餐厅，中央为带沙发符号的客厅，下方中部为居中的前门廊，右上翼为次卧，右下翼为带床位符号的主卧套房，卧室之间设有浴室和走廊，右上方为后露台，露台内嵌矩形泳池，最右侧为草坪区域\",\"visual_mood\":\"精准、高端、柔和微光、极简无衬线字体标注\"},\"bottom_section\":{\"render_style\":\"写实风格现代住宅建筑，黄金时刻日光，清晰的商业建筑可视化\",\"house\":\"单层现代住宅，采用互锁式平屋顶、白色和奶油色石墙、温暖的垂直木质装饰、黑色边框落地玻璃、左侧大型深色车库门、内凹式居中前入口和门廊、右侧卧室翼，所有房间均有屋顶\",\"site\":\"通往车库的浅灰色铺路石前车道、通往门廊的笔直踏脚石步道、修剪整齐的绿草坪、低矮灌木、前景人行道、带围栏的后院、右侧后方可见矩形游泳池和木质露台\",\"camera\":\"正面高位四分之三视角，略微向下俯视，广角，住宅居中\",\"lighting\":\"柔和的日落或清晨光线，长而柔和的阴影，玻璃和泳池水面的逼真反射\",\"materials\":\"光滑的白色灰泥、浅色石灰岩或混凝土饰面、深色金属饰条、木质檐底板和板条、浅灰色平屋顶膜、清澈的蓝色泳池水\"},\"constraints\":[\"仅限单层\",\"所有封闭房间上方不得缺失屋顶\",\"底部渲染图必须保留车库在左、门廊居中、客厅居中、主卧在右、次卧在右上、后露台及泳池的布局\",\"不得有额外楼层、不匹配的侧翼或无屋顶的室内房间\",\"使上下两部分视觉上清晰，并以鲜明的水平边界分隔\"],\"customization\":{\"architectural style\":\"{argument name=\\\"architectural style\\\" default=\\\"现代单层豪华住宅\\\"}\",\"blueprint background\":\"{argument name=\\\"blueprint background\\\" default=\\\"深海军炭灰色\\\"}\",\"blueprint line color\":\"{argument name=\\\"blueprint line color\\\" default=\\\"微光米金色\\\"}\",\"exterior wall material\":\"{argument name=\\\"exterior wall material\\\" default=\\\"白色灰泥和浅色石材\\\"}\",\"time of day\":\"{argument name=\\\"time of day\\\" default=\\\"黄金时刻\\\"}\"}}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/18mc476agp/预览图.webp","partial":false},{"id":422,"c":"01_建筑室内空间设计","t":"商业综合体渲染","p":"图幅不变，建筑不变，空间关系不变。一张现代建筑摄影，城市生活写实照片，活跃的商业氛围，自然主义设计，极简主义景观设计。\n金属板面上知名品牌店招，如M STAND，peet's，喜茶，gaga等，极简风格。\n商业外摆（前景侧面，远景），遮阳伞，可移动植物，如盆栽等。\n主色调：混凝土灰（建筑、地面），金属银（ROBBi 月光太空兔雕塑，店招，栏杆，吊顶），清新嫩绿（树叶），点缀色：暖黄光（灯光）。\n漫射自然光，柔和阴影，均匀环境光，微弱装饰性点光源，通透感。前景框景(利用植物枝叶),纵深分层(前景植物、中景广场、远景店面),水平线条重复(楼层栏杆)。\n焦点:中景人群（充满商业氛围，人物配景丰富，且包含儿童、青少年与宠物）与金属雕塑（ROBBi 月光太空兔，长耳造型 + 球形面罩（镜面反光）+ 机甲质感的身体，最好是直接落地），与金属雕塑打卡拍照的人。\n特效:前景景深虚化,金属镜面反射，真实纹理细节。高调摄影，洁净后期。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/19nJpnfJkh/预览图.webp","partial":false},{"id":485,"c":"01_建筑室内空间设计","t":"室内光线氛围-晴天日光","p":"对该图片室内场景的灯光进行设计，晴天日光氛围","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1ccfebedf1/预览图.webp","partial":false},{"id":494,"c":"01_建筑室内空间设计","t":"建筑草模生成效果图","p":"根据这张草图，生成规划建筑的低空鸟瞰照片。该建筑为玻璃幕墙办公楼。角度保持不变，周围的城市环境和绿地被添加进来，以实现照片般逼真的纹理。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1dd79e68c6/预览图.webp","partial":false},{"id":497,"c":"01_建筑室内空间设计","t":"建筑室内热环境分析","p":"请对图片中平面图进行室内四季热环境分析，用四种不同颜色代表四季热环境分析，2行2列，并且在下面加入文字及分析图，要求汉字必须正确，并且保持平面图结构内容完全一致。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1e0c877653/预览图.webp","partial":false},{"id":502,"c":"01_建筑室内空间设计","t":"手绘分析图生成","p":"以这张图片作为基础，在图片上叠加一个图层，用白色手绘笔触绘制这个【建筑】相关的一些分析图、平面图、立面图、剖面图等信息，使其视觉元素丰富，看起来像是真人手绘上去的一样。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1e62a4bc58/预览图.webp","partial":false},{"id":546,"c":"01_建筑室内空间设计","t":"黄昏城市屋顶露台建筑可视化","p":"意图：建筑可视化效果。背景：黄昏时的城市天际线，带有柔和的雾气。前景：花坛、座椅和串灯。主体元素：带有木质甲板的屋顶花园露台。细节处理：采用逼真的材质表现，营造温暖的环境光效果，不包含任何标志或商标，也没有水印。拍摄设备：35毫米胶片相机，采用四分之三视角，拍摄角度与眼睛水平齐平。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1lHG7PLgRY/预览图.webp","partial":false},{"id":552,"c":"01_建筑室内空间设计","t":"室内效果图-盛夏慵懒的晌午","p":"完美还原盛夏午后三点那种蝉鸣阵阵、阳光炽热的氛围感。画面要体现出室内外的强烈温差感。光线性质： 强烈的、带有方向性的硬光从大窗户倾泻而下。阳光在地板上形成边缘清晰、亮度极高的光斑。 室内非直射区域并不黑暗，而是被地板和墙面反射的二次自然光均匀带亮，光线通透且富有层次，真实模拟人眼在强光下的视觉补偿。阳光呈现出一种微温的明白色（明亮白橙），窗外的天空是饱和度极高的深蔚蓝色。室内阴影处则呈现自然的深色，而非生硬的黑色。 窗户有百叶窗或纱窗，阳光会在沙发或墙面上投下极度写实的条纹或网格阴影. 在光束中可以捕捉到极细微的浮尘，增加空间的厚度感。木质家具在阳光直射下呈现出温润的质感，皮质沙发的纹理在侧光下清晰可见。茶几上可能放着一杯盛有冰块的水，杯壁带着晶莹的冷凝水珠，与窗外的酷热形成鲜明的视觉对比。透过窗户，室外景色极其明亮，植物的绿色被阳光照得发亮（高饱和、高亮度）。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1msjf0ebqk/预览图.webp","partial":false}],"total":414,"page":1,"limit":36,"pages":12,"source":"prebuilt-bootstrap-category-full"},"05_人物肖像与写实摄影":{"prompts":[{"id":1,"c":"05_人物肖像与写实摄影","t":"夜泊豪车旁的甜酷女孩","p":"一、画面设定\n1 画面类型：真实人像。\n2 风格倾向：抖音风格审美。\n3 画质要求：高质量清晰成片。\n二、人物基础特征\n1 人物身份：年轻亚洲女性。\n2 面部结构：完全保留原始脸型与五官，不做修改。\n3 头发质感：直发，发质顺滑有光泽。\n4 发色：黑色。\n5 发长：长发。\n三、妆容与造型细节\n1 妆容风格：抖音风格妆容。\n2 眼妆特点：强调大眼效果与纤长睫毛。\n3 面颊状态：面颊带有红润气色。\n4 指甲造型：指甲偏长，涂深黑色指甲油。\n四、服装与配饰\n1 眼镜：细银色金属框眼镜。\n2 上衣：黑色抹胸式上衣，搭配一根肩带。\n3","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0031cc233f/预览图.webp","partial":false},{"id":4,"c":"05_人物肖像与写实摄影","t":"金色光影下的深邃肖像","p":"这是一张男性的特写照片，充满戏剧性。他的目光柔和而坚定，直视着镜头。他留着一截短短的胡茬。光线设计十分讲究：一束金黄色或温暖的光线直接照射在他的额头上，照亮了他的双眼和脸部中央，同时在脸部边缘形成了深色的阴影。背景呈现出柔和、温暖且模糊的金色调光芒。整个拍摄场景宛如电影中的影棚效果。这张照片分辨率极高，具有超现实的画面质感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/006a06b527/预览图-1.webp","partial":false},{"id":6,"c":"05_人物肖像与写实摄影","t":"双尺度女性在花园与客厅中的超现实场景","p":"[\n  {\n    \"scene_description\": \"一个超现实的电影场景，女演员 {\\\"actress\\\" \\\"Sydney Sweeney\\\"} 的两个版本以截然不同的比例出现在一个阳光明媚的现代客厅里。\",\n    \"giant_figure\": {\n      \"subject\": \"Sydney Sweeney\",\n      \"scale\": \"巨大\",\n      \"pose\": \"优雅地坐在天鹅绒沙发上，身体微微前倾，表情平静而沉思\",\n      \"attire\": {\n        \"top\": \"米色罗纹针织毛衣\",\n        \"bottom\": \"深色长裤或牛仔裤\"\n      },\n      \"appearance\": \"逼真的面部特征，柔和自然的妆容，金色波浪长发\",\n      \"lighting\": \"被温暖的定向窗光照亮，营造出柔和的电影感阴影\"\n    },\n    \"tiny_figure\": {\n      \"subject\": \"微缩版 Sydney Sweeney\",\n      \"scale\": \"几英寸高\",\n      \"placement\": \"站在巨大的 Sydney Sweeney 正前方的一张质朴木制咖啡桌上\",\n      \"pose\": \"好奇而敬畏地仰望着巨大的 Sydney Sweeney\",\n      \"attire\": \"与巨大的 Sydney Sweeney 相同的米色毛衣和深色长裤\"\n    },\n    \"environment_details\": {\n      \"room_style\": \"现代室内设计，营造出温暖舒适的氛围\",\n      \"furniture\": [\n        \"带有明显纹理的质朴木制咖啡桌\",\n        \"棕色天鹅绒或麂皮沙发\",\n        \"背景中的中世纪现代木制扶手椅\"\n      ],\n      \"decor\": [\n        \"堆叠的咖啡桌书籍\",\n        \"陶瓷杯\",\n        \"盆栽绿色植物\",\n        \"墙上的裱框艺术品\",\n        \"薄纱窗帘\"\n      ],\n      \"atmosphere\": \"阳光中可见漂浮的灰尘颗粒，体积光，暖色调\"\n    },\n    \"technical_specs\": {\n      \"camera_angle\": \"低角度拍摄，以强调比例差异\",\n      \"lens_effect\": \"浅景深，背景柔和模糊（散景），微缩人物具有微距感\",\n      \"style\": \"超现实摄影，8K 分辨率，HDR，魔幻现实主义\",\n      \"mood\": \"梦幻、超现实、艺术、宁静\"\n    }\n  },\n  {\n    \"scene_description\": \"一个超现实的户外花园场景，在黄金时段，Sydney Sweeney 的两个版本以不同的比例出现。\",\n    \"giant_figure\": {\n      \"subject\": \"Sydney Sweeney\",\n      \"scale\": \"巨大\",\n      \"pose\": \"坐在一个大藤椅里，对着微缩人物温暖地微笑\",\n      \"attire\": {\n        \"dress\": \"飘逸的碎花图案吊带长裙\",\n        \"accessory\": \"宽边草帽\"\n      },\n      \"appearance\": \"容光焕发的皮肤，金色波浪发，愉悦的表情\"\n    },\n    \"tiny_figure\": {\n      \"subject\": \"微缩版 Sydney Sweeney\",\n      \"scale\": \"微小\",\n      \"placement\": \"站在一张风化的木制花园桌上\",\n      \"pose\": \"回望着巨大的 Sydney Sweeney\",\n      \"attire\": \"与巨大的 Sydney Sweeney 相配的碎花图案长裙\"\n    },\n    \"environmen\"\n]","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00SmnL5vbk/预览图-1.webp","partial":false},{"id":8,"c":"05_人物肖像与写实摄影","t":"女生对着镜子自拍手机照片","p":"编辑这张照片，但不要改变她的面部特征。这是一张年轻、美丽、肤色白皙的女性的胸部以上特写照片。照片拍摄于夜晚的卧室，明亮的内置闪光灯照亮了她的脸部和头发，形成鲜明的亮点。她黑色的短发自然垂落，微微卷曲，脸上带着柔和的表情。闪光灯突出了昏暗的客厅背景。这张照片自然、真实、充满怀旧气息，让人想起20世纪90年代初的数码相机照片。强烈的闪光灯和屏幕的自然颗粒感使色彩略显暗淡。姿势：她穿着一件印有水冰月图案的白色宽松T恤，领子是蓝色的。她身体向前，脸部看向镜头，双手放在身体两侧，摆出一个持枪/射击的姿势。她的嘴唇可爱地抿着，一只眼睛闭着。主体在画面中显得很大。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00c4829f33/预览图.webp","partial":false},{"id":11,"c":"05_人物肖像与写实摄影","t":"户外咖啡馆白发美女涂口红自拍写真","p":"```json\n{\n  \"prompt\": \"户外咖啡馆美妆肖像，年轻女子留着 {\\\"hair color\\\" \\\"铂金色\\\"} 及肩波浪发，用涂抹棒涂抹红色唇彩，直视镜头，浅绿色蓝色眼睛，睫毛浓密纤长，身穿米色灰褐色罗纹针织露背上衣，自然妆容，眉毛精致，涂抹中的亮泽红唇，白皙瓷肌，坐在户外咖啡馆露台上，背景是木制桌椅，其他咖啡馆顾客模糊不清，欧洲街头咖啡馆场景，自然日光，抓拍美妆瞬间，特写肖像自拍风格，网红内容美学\",\n  \"negative_prompt\": \"室内工作室，刺眼灯光，深色头发，全身照，正式场合，夜晚\",\n  \"style\": \"抓拍美妆肖像，户外咖啡馆生活方式，网红内容，自然日光摄影\",\n  \"aspect_ratio\": \"3:4\",\n  \"camera\": {\n    \"type\": \"智能手机人像模式或无反相机\",\n    \"angle\": \"正视，视线水平，特写\",\n    \"framing\": \"特写肖像，脸部和上半身，浅景深\"\n  },\n  \"lighting\": {\n    \"type\": \"自然户外日光\",\n    \"quality\": \"柔和漫射自然光，脸部光线均匀\",\n    \"atmosphere\": \"明亮的白天户外咖啡馆场景\"\n  },\n  \"mood\": \"休闲，抓拍，以美妆为重点，生活方式，女性化\",\n  \"color_palette\": \"铂金色，米色灰褐色上衣，亮泽红唇，白皙肤色，木制咖啡馆家具，中性暖色调\",\n  \"subject_features\": {\n    \"hair\": \"铂金色，及肩，柔和波浪，中分，自然发质\",\n    \"skin\": \"白皙，瓷肌，自然无瑕\",\n    \"eyes\": \"浅绿色蓝色，大眼睛，直视镜头，浓密纤长睫毛，淡雅眼妆\",\n    \"lips\": \"亮泽红色，正在涂抹唇彩中，丰满唇形\",\n    \"eyebrows\": \"自然棕色，精心修饰的柔和眉弓\",\n    \"expression\": \"中性，专注于涂抹唇部，看向镜头\"\n  },\n  \"makeup\": {\n    \"eyes\": \"淡雅中性眼影，浓密纤长睫毛\",\n    \"lips\": \"正在涂抹的红色唇彩\",\n    \"base\": \"自然肤色，少量粉底\",\n    \"brows\": \"精致的自然棕色\"\n  },\n  \"wardrobe\": {\n    \"top\": \"米色灰褐色罗纹针织露背上衣，细肩带绕颈，有纹理的罗纹面料\"\n  },\n  \"props\": {\n    \"main\": \"带涂抹棒的唇彩，银色金属管，右手拿着涂抹到嘴唇上\"\n  },\n  \"pose\": {\n    \"action\": \"用涂抹棒涂抹唇彩到嘴唇上\",\n    \"hand\": \"右手拿着唇彩涂抹棒靠近嘴巴\",\n    \"gaze\": \"直视镜头\"\n  },\n  \"setting\": {\n    \"location\": \"欧洲街头户外咖啡馆露台\",\n    \"background\": \"木制咖啡馆桌椅，其他顾客就座，带大窗户的咖啡馆店面，城市街道\",\n    \"atmosphere\": \"休闲的白天咖啡馆场景，背景虚化效果\"\n  }\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00jKUw8thi/预览图.webp","partial":false},{"id":15,"c":"05_人物肖像与写实摄影","t":"电影质感时尚肖像：简约背景与现代穿搭","p":"请在不改变我面部特征的前提下，创作一幅时尚、现代的年轻男子肖像。这位男子拥有浓密的深色头发，穿着一件宽松的锈红色衬衫（纽扣解开），仅佩戴了一块手表和一只小耳环作为配饰。背景设计简洁、色调柔和，并采用轻微的模糊处理，以突出其前卫的现代时尚风格。他还戴着透明的太阳镜。整个画面采用电影般的灯光效果，细节极其丰富、质感逼真，整体呈现出精致且富有编辑感的视觉效果。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/015df06fa4/预览图.webp","partial":false},{"id":18,"c":"05_人物肖像与写实摄影","t":"圣诞贺卡设计模板","p":"这是一张精心设计的圣诞贺卡，画面忠实再现了这对夫妇戴着圣诞帽子的情景，下方印着“Hap id":47,"c":"05_人物肖像与写实摄影","t":"夜色中的静思时刻 🌆✨","p":"{\n  \"image\": {\n    \"subject\": {\n      \"description\": \"一位年轻女子，长着棕色的头发，在风中飘扬；照片是从侧面拍摄的。\",\n      \"clothing\": \"穿着一件紫色的针织毛衣和一条米色的百褶裙。\",\n      \"action\": \"双手握着一个杯子，望着窗外的景色。\"\n    },\n    \"setting\": {\n      \"location\": \"夜晚的阳台上。\",\n      \"background\": \"城市天际线有些模糊，建筑物和车辆发出的灯光形成了温暖的散景效果；一根温暖的彩灯串挂在玻璃栏杆上。\",\n      \"atmosphere\": \"充满沉思、宁静与平和的氛围。\"\n    },\n    \"style\": \"一张照片。\",\n    \"text\": {\n      \"content\": \"Shreya Yadav\",\n      \"location\": \"右下角\"\n    },\n    \"filename\": \"image_1.png\"\n  }\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/048e6c0a9e/预览图.webp","partial":false},{"id":53,"c":"05_人物肖像与写实摄影","t":"银发女子镜前自拍，灰毛衣牛仔裤，现代公寓氛围","p":"一张自然、现代的室内镜面自拍肖像，一位年轻女性身处时尚的现代公寓中。照片以中景到全身的长度拍摄，从略微倾斜的侧面角度，通过镜面反射呈现。她将智能手机举到肩膀附近自拍，头部轻轻转向镜子，脸上带着一丝微妙而自信的微笑，显得轻松而亲密。\n她的表情平静而自信，眼神放松，嘴角轻柔上扬，流露出毫不费力的自信。她肤色介于浅色到中等之间，带有自然纹理，脸颊上泛着淡淡的红晕，妆容极简——眉毛清晰，眼部略微修饰，唇部是自然的裸色调。她一头深棕色长发自然垂落，直发中带有一点自然的波浪，发际线靠近中央，柔顺地披在背部，几缕发丝轻柔地修饰着脸庞。\n她身穿一件 {\"clothing item\" \"短款浅灰色针织毛衣\"}，搭配高腰宽松蓝色牛仔裤，打造出休闲而修身的效果。她的姿态放松而自然，身体侧向一边，一侧肩膀略微抬起，更添真实的生活气息。\n背景是一个干净、现代的室内空间，铺设着温暖的木地板，深色木质护墙板，一扇门和电灯开关，以及一些微妙的细节，如一架钢琴和一扇大窗户，窗外是远处的城市天际线。背景保持柔和的虚化，以将注意力集中在主体上。\n光线温暖、自然且均匀柔和，照亮了她的脸部和身体，没有生硬的阴影，营造出一种舒适、有生活气息的氛围。色彩搭配融合了温暖的木色调、柔和的灰色、牛仔蓝和自然的肤色，呈现出一种平静、现代、美学平衡的视觉效果。\n整体氛围亲密、现代、时尚，毫不费力地散发着酷感——就像在家中捕捉到的一个安静的私人时刻。\n请使用上传的图片作为唯一且精确的面部参考。保持完全相同的面部特征、结构、比例和表情，不做任何改动。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0508YOAAYQ/预览图-1.webp","partial":false},{"id":64,"c":"05_人物肖像与写实摄影","t":"时尚男模楼梯写真预设","p":"25 岁亚洲男性的高角度时尚肖像，面部特征与参考照片中的男子相同，凌乱的发型框住脸庞，随意地靠在白色大理石楼梯上","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/05i96bTOf0/预览图.webp","partial":false},{"id":67,"c":"05_人物肖像与写实摄影","t":"黑西装绅士肖像","p":"以官方黑色西装造型打造自己的形象双子座艾纳米香蕉3 Pro{“提示”：“一个时尚男人的超现实黑白肖像。这个男人的面部特征与上传的图像完全一致，有波浪形的头发和浓密的胡子。他穿着一套全黑的服装，包括一件带缎面翻领的黑色西装外套、一件黑色衬衫和配套的黑色裤子。这个姿势应该是一个动态或富有表现力的新姿势，但不要微笑（中性或严肃的表情）。戏剧性的、高对比度的明暗对比灯光。黑暗的、电影般的舞台氛围背景。清晰的细节，优质的单色编辑风格。”，“风格”：“超现实主义，黑白，电影，高对比度，社论”，“主题”：“穿着全黑西装的时尚男士”，“相机”：“特写肖像，清晰聚焦”，“表情”：“中立或严肃，不笑”}图像比例3:4","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/06a48e1242/预览图.webp","partial":false},{"id":69,"c":"05_人物肖像与写实摄影","t":"慵懒少女镜中自拍四格拼图","p":"一张有凝聚力的4板美学照片拼贴，以2x2的网格排列，捕捉到同一个年轻女子在阳光普照的卧室里舒适亲密的镜子自拍照片。角色的一致性（同一张脸，凌乱的发髻，穿着超大米色针织毛衣和短裤）和灯光的一致性必须在所有框架中都是完美的：1.左上角面板（高角度自拍）：一张特写高角度镜子自拍，她站在镜子旁边，向下倾斜手机。她睁大眼睛看着屏幕，表情很可爱。这个角度突出了她的脸和毛衣领口的质感。2.右上图（床肖像）：一张亲密的照片，她仰卧在床上，头沉在蓬松的白色枕头里。她正在床边的衣柜镜子里捕捉自己的倒影。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/06add216da/预览图.webp","partial":false},{"id":70,"c":"05_人物肖像与写实摄影","t":"“热带优雅”——一种宁静中的时尚宣言","p":"{\n  \"prompt\": \"一位令人惊叹的女性，她的面部、身材和发型与提供的参考图片完全一致，她优雅地摆姿势，置身于一个豪华且光线明亮的室内环境中。周围的环境配有大窗户，可以欣赏到茂密的热带植被。她穿着一件黑色露肩比基尼上衣，上衣的肩带呈交叉状；搭配了一条黑色透明波点纱笼，纱笼系在她的腰间，略微露出了她的腿部。\",\n  \"style\": \"写实风格的高端时尚摄影，采用柔和的自然光。\",\n  \"constraints\": {\n    \"face_consistency\": \"100%\",\n    \"figure_consistency\": \"100%\",\n    \"hair_consistency\": \"100%\",\n    \"setting\": \"豪华、光线明亮的室内环境，大窗户，茂密的热带植被景观\",\n    \"attire\": \"黑色露肩比基尼上衣（肩带交叉设计），黑色透明波点纱笼（系在腰间）\"\n  },\n  \"signature\": \"Shreya Yadav\"\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/06e6b5affc/预览图.webp","partial":false},{"id":81,"c":"05_人物肖像与写实摄影","t":"电影感高时尚女性驾驶山间公路摄影","p":"{\n“提示”：“黄昏时分，一位时尚优雅的女士驾驶着豪华轿车行驶在蜿蜒的山路上，这是一幅极具电影质感的高级时尚肖像。她戴着深色太阳镜，身着黑色套装，外搭一件质感丰富的皮草大衣，长长的波浪卷发随风飘扬。画面采用忧郁的金棕色调，柔和的自然光透过暴风雨般的云层洒下，浅景深和路面的动态模糊营造出一种神秘而强烈的氛围。画面细节丰富，高度逼真，采用 8K 分辨率、电影级光影和时尚大片风格。”\n签名：Shreya Yadav\n“风格”：“电影化的高级时装、杂志大片、超写实主义”，\n“质量”：“8K，超高清细节，戏剧性光照”，\n“元素”：{\n“场景”：“黄昏时分蜿蜒的山路”，\n主题：时尚优雅的女士\n“衣橱”： “深黑色套装、质感丰富的皮草大衣、深色太阳镜”\n“光线”：“柔和的自然光，金棕色调，暴风雨云层”，\n“效果”：“路面运动模糊，浅景深”\n}\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/07e6a281d7/预览图.webp","partial":false},{"id":88,"c":"05_人物肖像与写实摄影","t":"动漫转真人Coser","p":"生成一个女孩cosplay这张插画的照片，背景设置在Comiket","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/08593c29f7/预览图1.webp","partial":false},{"id":96,"c":"05_人物肖像与写实摄影","t":"三联情绪写真自动生成","p":"使用同一张人物图片，让模型生成三张不同的画面（上/中/下），  \n展示不同情绪和不同的拍摄角度，但仍然是同一个人。  \n✍️ 使用提示：  \n“使用额外的图片作为基础素材；  \n不要改变人物的脸部、发型、服装或身体比例；  \n生成一个水平三分屏的构图（上/中/下）。”  \n🔼 上层面：  \n仅拍摄眼睛和嘴巴的特写；  \n情绪：含泪、哽咽、微微哭泣。  \n⏺","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0934a9e40d/预览图.webp","partial":false},{"id":99,"c":"05_人物肖像与写实摄影","t":"90年代电影质感的逼真香港复古肖像照","p":"具有90年代电影质感的逼真香港复古肖像照。\n以图[0]为面部参考。半身像。人物倚靠在贴满报纸的墙上，目光柔和而忧郁。身穿饰有珍珠和亮片的露脐抹胸上衣，搭配宽松的高腰松紧裤，典型的90年代街头风格。头发凌乱，几缕发丝垂落在脸颊。妆容精致，唇部光泽，肌肤水润。狭窄的香港房间，墙壁上贴满了泛黄的旧粤语报纸。\n签名：Shreya Yadav","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/098b5ade91/预览图.webp","partial":false},{"id":100,"c":"05_人物肖像与写实摄影","t":"高端商务肖像生成：现代奢华办公室中的时尚男士","p":"{\n  \"目标\": \"根据用户提供的参考图像，生成一张8K超真实、细节丰富的电影级肖像照片。\",\n  \"场景描述\": {\n    \"环境\": {\n      \"场景设定\": \"现代豪华办公室内部\",\n      \"道具\": {\n        \"桌子\": \"优雅的木质桌子\",\n        \"笔记本电脑\": \"放在桌子上的时尚现代笔记本电脑\",\n        \"植物\": \"为营造美观效果而摆放的简约高档室内植物\"\n      },\n      \"氛围\": \"高端、电影化、企业风格\",\n      \"灯光\": {\n        \"类型\": \"电影级专业灯光效果\",\n        \"效果\": [\n          \"大幅提升画面清晰度\",\n          \"柔和可控的高光效果\",\n          \"主体与背景的鲜明对比\"\n        ]\n      }\n    },\n    \"主体\": {\n      \"面部特征\": \"保持与参考图像一致\",\n      \"类型\": \"时尚的男性\",\n      \"姿势\": {\n        \"姿态\": \"随意靠在木质桌子上\",\n        \"表情\": \"自信、沉稳，带有奢华杂志风格的气质\"\n      },\n      \"外貌特征\": {\n        \"配饰\": [\n          \"蓝色太阳镜\"\n        ]\n      }\n    }\n  }\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0997d03b92/预览图.webp","partial":false},{"id":102,"c":"05_人物肖像与写实摄影","t":"雪景中时尚女性全身写真","p":"Photorealistic full-body portrait of a young stylish woman standing in a snowy winter landscape. She is wearing a monochromatic all-black outfit consisting of a premium ribbed knit sweater, fitted black trousers, and a long black cashmere scarf draped elegantly around her neck. She is wearing dark, oversized square-frame designer sunglasses and has long, dark hair blowing slightly in the wind. She is standing with a confident, relaxed posture with hands in her pockets. The background features a soft-focus, shallow depth of field (bokeh) view of a frozen lake and tall pine trees heavily covered in white snow. Soft, diffuse, cool winter lighting. High definition, 8k resolution, cinematic photography style.","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/09ZoayzrNZ/预览图.webp","partial":false},{"id":103,"c":"05_人物肖像与写实摄影","t":"年轻女性的时尚自拍肖像","p":"“一张惊艳年轻女性的全身时尚肖像。她身着黑色缎面迷你吊带裙，垂褶领口和细吊带设计，搭配黑色细带高跟鞋。她留着长长的波浪卷发，齐刘海，妆容精致优雅。整体氛围充满魅力，尽显奢华。”, “姿势”: { “描述”: “拍摄对象侧坐在宽阔的浅色木质台阶上。她的左腿搭在右膝上，清晰地展示了细高跟凉鞋。她的右手（拿着一部深色智能手机）举到脸旁，正积极地进行高角度自拍。她直视着手机摄像头。”, “关键词”: [\"坐姿\", \"交叉双腿\", \"自拍姿势\", \"优雅姿态\", \"手持手机\"] }, “场景”: { “环境”: “现代简约的豪华家居内饰。背景是宽阔对称的……”由浅色木材（例如枫木或橡木）制成的楼梯，踏板由暖色调的线性 LED 灯单独背光照明。透明玻璃栏杆由黑色金属柱固定，将拍摄对象框入其中。\", \"美学\": \"建筑风格，现代设计，线条简洁。\" }, \"相机\": \"拍摄类型\": \"全身肖像照\", \"角度\": \"略微低角度（仰视）以突出她的身高和楼梯的结构。\", \"镜头\": \"85mm 定焦镜头\", \"景深\": \"浅景深，拍摄对象清晰对焦，背景元素（栏杆、远处台阶）略微柔化。\", \"构图\": \"拍摄对象完美地位于画面中心。\" }, \"照明\": { \"主光\": \"来自左前方的柔和漫射影棚灯（柔光箱），为她的脸部和肌肤提供柔和的光线。\", \"辅助光\": \"戏剧性的暖色调（3000K）线性底光，直接嵌入木质楼梯踏板，营造出勾勒背景的水平光晕。\", \"阴影\": \"中等对比度，清晰的阴影，同时保留了黑色连衣裙的细节。\", \"曝光\": \"曝光完美，突出了缎面材质的光泽。\" }, \"style_and_quality\": { \"style\": \"时尚大片 | 电影写实 | 私密\", \"details\": [\"高保真缎面质感\", \"玻璃栏杆上的倒影\", \"精心修饰的红色指甲\", \"无瑕肌肤纹理\"], \"quality\": [\"8K分辨率\", \"杰作\", \"超细节\", \"照片级写实\"] }","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/09d84fe5f3/预览图.webp","partial":false},{"id":111,"c":"05_人物肖像与写实摄影","t":"高角度自拍真实感人像与黑猫场景","p":"```json\n{\n  \"intent\": {\n    \"image_type\": \"自拍\",\n    \"era_preset\": \"现代标准\",\n    \"notes\": \"通过定义光线与材料的相互作用以及传感器故障模式，最大限度地提高物理真实感。\"\n  },\n  \"subjects\": {\n    \"count\": 1,\n    \"primary\": {\n      \"type\": \"人物\",\n      \"age_range\": \"20-25\",\n      \"gender_presentation\": \"女性\",\n      \"region_target\": \"未指定\",\n      \"expression\": \"中性，向上看\",\n 全身时尚大片肖像，营造出现代都市夜景中的奢华生活方式氛围。\",\n\"Subject\": \"一位时尚的年轻女性，身材优雅且富有运动感\",\n\"Hair\": \"乌黑亮丽的长直发，完美顺滑有光泽，别在耳后\",\n\"Makeup\": \"高端时尚妆容，犀利的猫眼眼线，{\\\"lipstick color\\\" \\\"大胆的哑光红唇\\\"}\",\n\"Expression\": \"沉着、自信，目光锐利地直视镜头\",\n\"Eyewear\": \"鼻梁上架着一副黑色大镜框设计师墨镜\"\n},\n\"Pose_and_Body_Language\": {\n\"Position\": \"优雅地斜倚在一辆豪华跑车的抛光侧面\",\n\"Hand_Action\": \"一只手轻触车顶，另一只手拿着一个设计师手拿包\",\n\"Posture\": \"放松但充满掌控力，一条腿略微交叉在另一条腿上\"\n}\n},\n\"Environment_and_Lighting\": {\n\"Setting\": \"夜晚的高端都市街道，湿润的路面反射着城市灯光\",\n\"Lighting\": \"电影般的青色和橙色氛围灯光，远处霓虹灯的柔和散景，锐利的轮廓光勾勒出她的身形\"\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0O1B9eTe4b/预览图.webp","partial":false}],"total":2607,"page":1,"limit":36,"pages":73,"source":"prebuilt-bootstrap-category-full"},"06_平面设计视觉传达":{"prompts":[{"id":2,"c":"06_平面设计视觉传达","t":"图片的8种初始草图","p":"创建 8 个不同的初始草图，最终形成这个角色。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/00482726df/预览图.webp","partial":false},{"id":14,"c":"06_平面设计视觉传达","t":"赛亚人战士变身进化图谱","p":"制作一张详细的图表，展示“超级赛亚人式变身”的完整演变过程，使用一个原创的赛亚人战士形象，并描绘其从基础形态到神级变身的多个阶段。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/013fa28035/预览图.webp","partial":false},{"id":30,"c":"06_平面设计视觉传达","t":"AI生成日系社交媒体公告图","p":"阅读附图中描绘的主题，生成多角度镜头，并创建四个场景，以 2x2 网格划分。\n重新混合并以动态姿势进行编辑。\n主体：\n  - 人物的特写肖像。\n  - 直视镜头，表情略显紧张或尴尬。\n  - 胸部略微裸露，露出部分锁骨和乳沟。\n  - 巨大的黑色日文文本（哥特体或粗体）居中覆盖整个图像，遮挡了大部分面部和身体。这段文本是社交媒体帖子风格的公告，以“ご報告”（报告/公告）开头。公告文本由 AI 自动生成。\n风格：\n  - 社交媒体帖子的平面设计。\n  - 超高分辨率数字肖像，应用了强烈的平滑滤镜。\n  - 后期制作中故意降低饱和度和对比度，作为强调文本的背景。\n  - 高调且充满奇幻氛围。\n构图：\n  - 垂直肖像（高方向）。\n  - 特写半身照。女性面部的上半部分（额头）略有裁剪。\n  - 主体居中，文本占据中心位置。\n  - 背景因浅景深（散景）而完全模糊。\n  - 文本与图像垂直对齐。\n光照：\n  - 使用均匀且非常柔和的前置光（环形灯或柔光箱）。\n  - 几乎没有阴影，光线平坦。\n  - 整体非常明亮（高调）的色调。\n  - 色温为中性至略冷的白光。\n色彩：\n  - 极简调色板，主要由白色、浅灰色和文本的黑色组成。\n  - 女性的肤色和唇色非常苍白，饱和度极低。\n  - 整体而言，接近单色的配色方案。\n技术规格：\n  - 数码照片。\n  - 宽高比：4:5 或 3:4 移动肖像格式。\n  - 强烈的柔焦效果和发光风格滤镜（发光）。\n  - 重现叠加的日文文本（包括字体大小、行距和位置）。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/02ssJ9jWIW/预览图.webp","partial":false},{"id":52,"c":"06_平面设计视觉传达","t":"电影角色与场景设定图","p":"{\n  \"type\": \"综合电影制作设计文档\",\n  \"style\": \"真人电影摄影风格，高细节，日本电影宣传物料\",\n  \"theme\": \"{argument name=\\\"cinematic vibe\\\" default=\\\"感人的日落剧情片\\\"}\",\n  \"layout\": {\n    \"top_section\": {\n      \"type\": \"电影海报\",\n      \"title\": \"{argument name=\\\"movie title\\\" default=\\\"虹の橋の約束\\\"}\",\n      \"subtitle\": \"NIJINO HASHI NO YAKUSOKU\",\n      \"release_date\": \"11 月 7 日 周五 上映\",\n      \"visuals\": \"大型电影蒙太奇，画面包含 {argument name=\\\"male character description\\\" default=\\\"留着凌乱深色短发的年轻日本男性\\\"} 向左望去，肩上趴着一只 {argument name=\\\"animal companion\\\" default=\\\"橘色虎斑猫\\\"}，背景是 {argument name=\\\"female character description\\\" default=\\\"留着棕色齐肩发的年轻日本女性\\\"}，衬托在带有彩虹的日落城市景观中。\",\n      \"film_strip\": {\n        \"count\": 5,\n        \"description\": \"水平排列的电影剧照，展示了角色与猫在不同场景中的画面\"\n      }\n    },\n    \"middle_left_section\": {\n      \"type\": \"女性角色参考\",\n      \"label\": \"藤木ハル\",\n      \"full_body_turnaround\": { \"count\": 4, \"poses\": [\"正面\", \"侧面 (左)\", \"背面\", \"3/4 侧面\"], \"outfit\": \"米色长款开衫，棕色上衣，棕色阔腿裤\" },\n      \"facial_expressions\": { \"count\": 3 },\n      \"details\": { \"count\": 3, \"description\": \"手部、领口和头发的特写\" },\n      \"footwear\": { \"count\": 3, \"description\": \"棕色平底鞋的多个角度\" },\n      \"silhouette\": { \"count\": 2 },\n      \"color_palette\": { \"count\": 5, \"description\": \"色卡\" }\n    },\n    \"middle_right_section\": {\n      \"type\": \"男性角色参考\",\n      \"label\": \"瀬川 凛\",\n      \"full_body_turnaround\": { \"count\": 4, \"poses\": [\"正面\", \"侧面 (左)\", \"背面\", \"3/4 侧面\"], \"outfit\": \"深灰色夹克，白色衬衫，深色长裤\" },\n      \"facial_expressions\": { \"count\": 3 },\n      \"details\": { \"count\": 3, \"description\": \"手部、领口和头发的特写\" },\n      \"footwear\": { \"count\": 3, \"description\": \"黑色运动鞋的多个角度\" },\n      \"silhouette\": { \"count\": 2 }\n    },\n    \"bottom_left_section\": {\n      \"type\": \"动物参考\",\n      \"label\": \" 色把手。桌面前景包含 7 件精细的工艺物件：1 卷金丝、1 个扁平的景泰蓝花卉奖章、1 个钥匙形状的金色饰品、1 支精细的金属工艺笔或触针，以及 4 个分别盛有蓝色、绿色、绿松石色和白/金色珐琅粉末的小碗。背景融入淡雅的水墨山水、远处的凉亭、柔和的莲花线条画以及漂浮的祥云纹样。采用精致的博物馆课程美学，将写实的产品渲染与细腻的中国插画相结合，配色采用和谐的奶油色、深海军蓝、绿松石色与金属金，排版清晰，负空间平衡，呈现出高端教育类 PPT 标题幻灯片的构图。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/07ju4q2edi/预览图.webp","partial":false},{"id":86,"c":"06_平面设计视觉传达","t":"哥特暗黑风VTuber标志设计","p":"{\n  \"type\": \"VTuber Logo 设计概念\",\n  \"theme\": \"{argument name=\\\"main theme\\\" default=\\\"哥特暗黑奇幻\\\"}\",\n  \"background\": \"{argument name=\\\"background color\\\" default=\\\"纯黑\\\"}\",\n  \"layout\": \"包含 6 个不同 Logo 设计的 2x3 网格\",\n  \"logos\": [\n    {\n      \"position\": \"左上\",\n      \"main_text\": \"{argument name=\\\"logo 1 main text\\\" default=\\\"魔界のメシア\\\"}\",\n      \"sub_text\": [\"魔界の観測者\", \"MAKAI NO KANSOKUSHA\"],\n      \"colors\": [\"紫色\", \"银色\"],\n      \"motifs\": [\"角\", \"发光的紫色眼睛\", \"蝙蝠翅膀\"]\n    },\n    {\n      \"position\": \"中上\",\n      \"main_text\": \"{argument name=\\\"logo 2 main text\\\" default=\\\"深淵プレシア\\\"}\",\n      \"sub_text\": [\"Shinen Lucia\", \"魔界の断罪者\"],\n      \"colors\": [\"红色\", \"黑色\", \"金色\"],\n      \"motifs\": [\"锁链\", \"恶魔尖刺\", \"发光的红色符文\"]\n    },\n    {\n      \"position\": \"右上\",\n      \"main_text\": \"{argument name=\\\"logo 3 main text\\\" default=\\\"夢喰いメフィ\\\"}\",\n      \"sub_text\": [\"まかいのゆめくい\"],\n      \"colors\": [\"粉色\", \"紫色\"],\n      \"motifs\": [\"带皇冠的骷髅\", \"蝙蝠翅膀\", \"闪光效果\"]\n    },\n    {\n      \"position\": \"左下\",\n      \"main_text\": \"苍影カナタ\",\n      \"sub_text\": [\"魔界の影诗人\", \"- AOKAGE KANATA -\"],\n      \"colors\": [\"蓝色\", \"银色\"],\n      \"motifs\": [\"巨大的中央眼睛\", \"银色蝙蝠翅膀\", \"哥特式建筑\"]\n    },\n    {\n      \"position\": \"中下\",\n      \"main_text\": \"黄昏ベリアル\",\n      \"sub_text\": [\"Tasogare Belial\", \"魔界の王子\"],\n      \"colors\": [\"金色\", \"紫色\"],\n      \"motifs\": [\"皇冠\", \"蝙蝠翅膀\", \"悬挂的宝石\"]\n    },\n    {\n      \"position\": \"右下\",\n      \"main_text\": \"祸胧シオン\",\n },{"id":127,"c":"06_平面设计视觉传达","t":"鲁迅朝花夕拾插画","p":"根据鲁迅的“【朝花夕拾】”内容生成一张图片。背景应体现“【朝花夕拾】”的艺术意境，并可使用蒙版。前景应包含位于画面左侧或右侧的 【鲁迅】 全身肖像。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0LzcEqQQYI/预览图.webp","partial":false},{"id":128,"c":"06_平面设计视觉传达","t":"《上帝之城》复古书籍封面设计","p":"一款极简、优雅的复古书籍封面设计，采用暖象牙色纹理纸张，适用于 【La Ciudad de Dios】。将书名置于顶部中央，使用大型古典衬线字体，深海军蓝色，字间距考究，富有文学气息。在书名正下方放置 1 枚八角星，金色。在中上部，绘制一座漂浮在云端的圣洁城池，采用精致的金色线条艺术：一座对称的神圣之城，包含 1 座中央圆顶大教堂、多座簇拥的塔楼、尖顶、城墙和城门，四周环绕着柔和的云朵，背后散发出向外扩散的放射状太阳光芒。从天国的中央城门处，向下投射 1 道垂直的细长金光柱，直达封面下半部分。在底部三分之一处，用细腻的蓝灰色墨水线条描绘一幅古罗马大地景观：水平排列 5 处主要建筑遗迹和纪念碑，包括左侧的长拱廊、左中部的古典立柱神庙、中间的圆顶建筑、右中部的钟楼及周边遗迹，以及最右侧类似斗兽场的废墟，外加右侧前景中一根断裂的柱鼓和零星的灌木与地面纹理。保持构图空灵、对称且引人深思，在天与地之间留出充足的负空间。将作者名 【SAN AGUSTÍN DE HIPONA】 居中置于底部，使用间距适中的小型大写衬线字体，深海军蓝色。全图仅包含 3 处可见文本元素：书名、作者名，无副标题。配色仅限象牙白、金色和深海军蓝，呈现出精准的雕版线条感以及神圣、永恒、古典的神学氛围。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0M6x4HoZjl/预览图.webp","partial":false},{"id":143,"c":"06_平面设计视觉传达","t":"AI提示词最佳实践分析","p":"请创建一份演示文稿，总结收集到的提示词指南中的趋势，以及大型语言模型（LLM）、图像生成模型和视频生成模型在提示词最佳实践方面的差异。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0Slm2BCJX2/预览图-1.webp","partial":false},{"id":147,"c":"06_平面设计视觉传达","t":"LUVIN舒缓保湿精华高端广告","p":"一张高端美妆广告，特写镜头展示了一位年轻美丽的亚洲女性，她拥有无瑕、水润、透亮的肌肤。她将下巴轻柔地靠在交叉于洁净白色平面上的双手和手臂上。她表情宁静柔和，直视镜头。在前景中，靠近她手部的平面上放置着一个磨砂玻璃材质的护肤精华瓶，配有银色按压泵头。瓶身上印有简洁、极简风格的品牌名称“【LUVIN】”和产品名称“【CALMING MOISTURE SERUM】”。图像左侧有优雅、极简的韩文排版。主标题为“【오늘, 피부는 스스로 빛난다】”，上方和下方配有较小的辅助文字。左下角显示了品牌名称“【LUVIN】”。背景为柔和、无缝的米白色摄影棚背景。光线柔和、均匀且极具修饰感，突显了她肌肤的自然光泽，并在玻璃瓶上形成了柔和的倒影。白色平面上，瓶子旁边可见一滴晶莹剔透的精华液。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0VPSeUjjKW/预览图.webp","partial":false},{"id":150,"c":"06_平面设计视觉传达","t":"家蝇的生命周期与惊人复眼","p":"展示具有惊人复眼的 【家蝇】 的生命周期","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0Z1rSQBtTJ/预览图.webp","partial":false},{"id":187,"c":"06_平面设计视觉传达","t":"多角度展示粉发少女穿搭","p":"将摄像机视角切换到后方，让她继续看着河流，然后切换到对面的摄像机视角。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0c18zAXVLr/预览图.webp","partial":false},{"id":200,"c":"06_平面设计视觉传达","t":"王羲之体书法临摹字帖","p":"生成一张【字体】书法临摹字帖","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0d03nvafec/预览图.webp","partial":false},{"id":220,"c":"06_平面设计视觉传达","t":"海贼王水墨风格角色海报","p":"每张海报均采用上下层级结构：头部、面部轮廓、面具或人物外轮廓作为大型视觉主体，构成高辨识度的剪影主形；中下部则以完整人物作为第二主体，呈现稳定的站姿或轻微动态，构成画面的视觉核心。在大轮廓内部及周围运用双重曝光和拼贴叙事构图，将多重场景、图像、人物关系、辅助元素及环境层级融合在云雾、水墨与留白之中。左右两侧配以呼应的场景，营造故事张力和空间变化。通过贯穿画面的线索将主角、内部拼贴与上方的大轮廓串联，增强整体感与视觉引导。整体画面保留大面积留白，边缘辅以墨渍与虚化处理，营造出东方美学中的虚实关系与呼吸感。整体风格统一、高级且克制，强调层次感、叙事性、视觉冲击力及系列海报语言。尺寸：9:16。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0e7xjonpv6/预览图-1.webp","partial":false},{"id":228,"c":"06_平面设计视觉传达","t":"哈佛毕业史诗叙事海报","p":"基于我的肖像自动生成一张具有收藏价值的史诗叙事海报（毕业照：以我侧脸的巨大轮廓作为外框，内部自动生长出最契合主题（校园 + 毕业）的完整世界观、标志性场景、人物关系、象征性图标、关键建筑、生物、道具及氛围。整体风格为高端的轮廓填充式叙事合成，带有双重曝光联想，但更倾向于电影海报与梦幻水彩插画风格的融合。柔和的大气透视、轻微的雾化过渡、纸张纹理、边缘留白与笔触、大面积负空间、克制且高级的排版，静谧、宏大、神圣、怀旧、诗意且具有传奇色彩。风格、色彩、场景和材质均根据主题自动适配；所有元素必须与主题紧密绑定，一眼可辨，拒绝杂乱、拒绝生硬拼贴、拒绝模板化背景、拒绝廉价的奇幻素材。如有文字，请使用英文。我的学校是 【学校名称】。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0esu6xhyzj/预览图.webp","partial":false},{"id":238,"c":"06_平面设计视觉传达","t":"手写笔记笔记本","p":"业余摄影：一本摊开的笔记本平放，上面用黑色圆珠笔写满了手写笔记。字迹随意且略显潦草，像是个人笔记，有自然的瑕疵、划掉的词语、带下划线的标题。从稍高的角度拍摄，窗户透进自然日光，无闪光灯。随意的桌面场景，使用iPhone拍摄。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0f94c6lgty/预览图.webp","partial":false},{"id":239,"c":"06_平面设计视觉传达","t":"ReZero蕾姆与菜月昴拥抱海报","p":"一张动漫宣传海报，描绘了 【一位留着浅蓝色短发、身穿黑白女仆装的年轻女性】 与 【一位留着黑色短发、身穿黑白橙三色运动夹克的年轻男性】 之间温柔拥抱的场景。她闭着双眼，平静地靠在他的胸前，而他正深情地低头注视着她，手臂环绕着她。背景是柔和、模糊的粉色樱花，伴有斑驳的阳光。左上角文字为“【Re:ZERO - Starting Life in Another World -】”的标志。左侧中间的手写文字为“【你就是我的英雄，昴…… ♡】”。右下角优雅的文字为“【超越死亡的羁绊。】”，下方标注“TV 动画现正热播中！”。高质量官方动漫艺术风格。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0fRIGyzOAE/预览图.webp","partial":false},{"id":243,"c":"06_平面设计视觉传达","t":"解锁几何学的奥秘：毕达哥拉斯的探索之旅","p":"生成一张教室黑板的图片，上面逐步展示了勾股定理的证明过程。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0ffc2ac00a/预览图.webp","partial":false},{"id":252,"c":"06_平面设计视觉传达","t":"高端时尚杂志封面生成","p":"{\n  \"style\": \"高端时尚编辑风格，奢华杂志封面\",\n  \"subject\": {\n    \"type\": \"年轻美国女性\",\n    \"appearance\": {\n      \"hair\": \"【黑色长发，柔和波浪卷】\",\n      \"skin\": \"光滑、透亮，自然光泽\",\n      \"expression\": \"俏皮嘟嘴，视线微侧\",\n      \"makeup\": \"极简精致妆容，水光感唇妆，淡雅腮红\"\n    },\n    \"outfit\": \"【红色缎面露肩短款上衣，搭配同色系高腰裙】\",\n    \"accessories\": \"小型金色圆环耳饰，精致项链配红色心形吊坠\"\n  },\n  \"composition\": {\n    \"framing\": \"半身肖像，居中构图\",\n    \"pose\": \"站姿，双手持物\",\n    \"left_hand\": \"贴有“Cherry Sparkling Soda”标签的红色液体玻璃瓶\",\n    \"right_hand\": \"用牛皮纸和丝带包裹的鲜红玫瑰花束\",\n    \"background\": \"干净的白色摄影棚背景\",\n    \"layout\": \"杂志封面排版，留有充足的负空间用于文字排版\"\n  },\n  \"typography\": {\n    \"masthead\": \"【ALLURE】\",\n    \"masthead_style\": \"大型衬线字体，粗体，红色，顶部居中\",\n    \"subtext\": [\n      \"时尚与生活方式杂志\",\n      \"2024 年夏季刊\"\n    ],\n    \"cover_lines\": [\n      \"全新视角\",\n      \"美好即将来临\",\n      \"自信是你最好的配饰\",\n      \"甜蜜时光\",\n      \"100% 好心情\"\n    ],\n    \"style\": \"简洁的编辑排版，所有文字均为红色，现代时尚杂志布局\"\n  },\n  \"lighting\": {\n    \"type\": \"摄影棚灯光\",\n    \"quality\": \"柔和漫射光\",\n    \"direction\": \"正面补光，带有轻微侧面高光\",\n    \"effect\": \"均匀的肤色，细腻的阴影，丝滑面料的高光质感\"\n  },\n  \"color_palette\": {\n    \"primary\": [\"红色\", \"白色\"],\n    \"accents\": [\"金色\", \"绿色\"],\n    \"mood\": \"大胆、清新、自信、浪漫\"\n  },\n  \"details\": {\n    \"props\": \"带标签的玻璃瓶，写实的玫瑰花束\",\n    \"textures\": \"丝绸质感，玻璃反光，自然的皮肤细节\",\n    \"finish\": \"超写实，焦点清晰，高分辨率\"\n  },\n  \"camera\": {\n    \"type\": \"单反相机\",\n    \"lens\": \"85mm 人像镜头\",\n    \"aperture\": \"f/2.8\",\n    \"depth_of_field\": \"浅景深\",\n    \"focus\": \"面部与产品焦点清晰\"\n  },\n  \"aspect_ratio\": \"2:3\",\n  \"quality\": \"8k，超精细，专业编辑级质感\"\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0ilgqxq5ml/预览图.webp","partial":false},{"id":254,"c":"06_平面设计视觉传达","t":"汉代曲裾深衣文化图鉴","p":"{\"type\": \"comprehensive cultural infographic and visual guide\", \"subj :false}],"total":1464,"page":1,"limit":36,"pages":41,"source":"prebuilt-bootstrap-category-full"},"03_创意广告品牌设计":{"prompts":[{"id":3,"c":"03_创意广告品牌设计","t":"素皮磁吸手机壳艺术海报","p":"为这款米色皮革手机壳设计产品海报。手机壳侧立放置的超近景特写，清晰展现素皮细腻纹理与橙色金属镜头圈的撞色质感，背部吸附同色系磁吸卡包。米色背景，周围缭绕棕色透明轻纱，搭配几株蕨类植物、沉香枯木与两支铃兰作为前景点缀。4K超清画面质感。静物摄影，昏暗氛围，光线追踪，高级柔光。海报上方文案标题：\"AATTT STUDIO\"，极细衬线字体。页面下方小字：\"素皮 | 磁吸 | 极简\"。艺术签角标：\"AATTT | Design\"。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/005a22116e/预览图.webp","partial":false},{"id":35,"c":"03_创意广告品牌设计","t":"昆仑煮雪香薰静物海报","p":"为这两个香薰产品设计产品海报。两个香薰放在一起的超近景特写，质感清晰。米色背景，周围棕色透明轻纱，蕨类植物，沉香枯木，两支铃兰。4K超清画面质感。静物摄影，昏暗氛围，光线追踪。海报上方文案标题：\"昆仑煮雪\"，极细文字。页面下方小字：\"沉香|铃兰|草本\"。艺术签角标：\"观夏|to summer\"。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/03401c9264/预览图.webp","partial":false},{"id":40,"c":"03_创意广告品牌设计","t":"国家文化主题棋盘艺术","p":"一张高度逼真的传统棋盘垂直照片，从上方看，背景是受 [COUNTRY] 艺术遗产启发的纹理表面。棋盘上有复杂的图案和国家图案，棋盘上用优雅的金色书法写着“[COUNTRY]”字样。所有的棋子都离开了棋盘，围绕着棋盘排列在织物上——有些侧躺着，有些直立着——仿佛等待着被放置。每件作品在形状、装饰和质地上都经过独特的重新构想，反映了 [COUNTRY] 的建筑、文化符号和调色板。丰富的素材、柔和的定向光、电影般的阴影、超详细的编辑静物风格、对称的自上而下的取景、9：16 格式。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/03c950ef23/预览图.webp","partial":false},{"id":63,"c":"03_创意广告品牌设计","t":"Four Loko恶搞广告海报","p":"高冲击力恶搞电商信息图，针对“{argument name=\"product\" default=\"Four Loko”}”麦芽饮料。前景：一只粗糙、饱经风霜的手的特写，手持一罐高挑、色彩鲜艳的{argument name=\"product\" default=\"Four Loko”}朝向镜头。罐身微凉，可见冷凝水珠，口味设计张扬混乱。手与罐身带有轻微微距镜头模糊以增加景深，但罐身仍清晰可辨，作为主角产品。中央主体：中景处，一个滑稽、邋遢的{argument name=\"subject\" default=\"流浪汉模样男子”}随意坐在城市小巷的牛奶箱上。他胡茬满面，头发凌乱，穿着多层旧衣，咧嘴大笑，毫不在意。他看起来混乱却莫名有魅力，像是糟糕决定的意外之王。他摆出自信生活广告模特的姿势，自豪地展示罐身。背景与光线：一个荒谬精致的广告风格背景，混合肮脏的城市小巷环境。柔焦城市纹理，远处有垃圾桶形状、涂鸦痕迹和散落的杂物。加入戏剧性的影棚灯光、柔光、彩虹棱镜光晕和微妙漏光，让整体看起来过于高端，与主体形成反差。背景中艺术性地漂浮着几个模糊的{argument name=\"product\" default=\"Four Loko”}罐身，增添荒诞感。字体与布局（粗体无衬线字体，白色与霓虹色点缀）：顶部中央（背景）：巨大粗体文字“{argument name=\"brand name\" default=\"FOUR LOKO”}”位于主体后方。右上角：粗体文字“糟糕点子的香槟”。左中部：“高级混乱与零自控”。右中部：大号粗体“23”，配文字“盎司的糟糕决定”。右下角：大号粗体“1”，配文字“罐毁掉明天”。底部附近可选小号标注文字：“现在附带更多后悔”。风格：超精细、8K恶搞商业摄影，罐身锐利对焦，浅景深，鲜艳俗艳色调，干净广告构图，夸张高端产品广告美学，精致品牌与邋遢主体间的趣味视觉对比。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/05fmk2frzf/预览图.webp","partial":false},{"id":74,"c":"03_创意广告品牌设计","t":"乐事薯片跳入芝士池的趣味广告视觉","p":"垂直零食广告视觉，带有俏皮的拟人化风格。顶部是金黄色的乐事薯片，排列成整齐的垂直队列，每片薯片都像跳水运动员一样摆出跳水姿势，有的略微前倾，有的微微倾斜，暗示着跳水前的准备和专注。薯片下方，浓稠的融化芝士向下流淌，光泽诱人，富有弹性，在底部形成一个丰盛的芝士熔岩池。几片薯片在半空中凝固，摆出干净利落的跳水姿势，向下倾斜，如同同步跳水运动员，捕捉到精确的入水前瞬间。暖黄色和芝士橙色渐变背景，影棚广告灯光，柔和的高光，精致的阴影。强烈的中心轴构图，清晰的视觉层次。极简图形布局，趣味又不失高级感的商业美食摄影美学，超精细纹理，超现实，8K 分辨率。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/06t2aEw7HP/预览图.webp","partial":false},{"id":93,"c":"03_创意广告品牌设计","t":"小米17 Pro高端手机广告海报","p":"超写实高端智能手机广告，主角是一位 20 出头、肤色白皙、五官立体且自信的年轻女性，佩戴着时髦的黑色猫眼太阳镜。她留着浓密的长辫子，发色为 【柔和的薰衣草紫】，与产品主题相呼应。画面采用动态的低角度电影感构图，她身体微微扭转，将一部 【Xiaomi 17 Pro】 智能手机伸向镜头，形成强烈的视觉冲击，手机占据前景主体。手机采用哑光金属薰衣草紫色机身，外观极简，边角圆润，配有大型矩形摄像头模组。模组左侧包含两个大尺寸镜头，右侧为圆形副屏，显示极简的紫色渐变时钟 UI，摄像头旁印有 Leica 标识，配有简洁的闪光灯条，底部有精致的品牌 Logo。服装：修身长袖短款上衣，色调为柔和的薰衣草紫，搭配高腰灰橄榄色工装裤，展现现代科技时尚美学。背景：从浅灰到柔和薰衣草紫的极简渐变，背景中带有模糊处理的大型字体以增加深度。灯光：柔和的影棚灯光，色调中性偏冷，皮肤光泽细腻，手机边缘有受控的高光，镜头和屏幕上有通透的反射，阴影极少，呈现高端产品摄影风格。构图：低角度拍摄以营造力量感，主体位于画面左侧，手机占据右侧前景，留出充足的负空间用于品牌展示。未来感 UI 覆盖层：纤细的白色/紫色线条和节点指向产品特性，配有悬浮标签：“Leica Camera System”（徕卡影像系统）、“Secondary Display Integration”（副屏集成）、“Ultra-Slim Premium Design”（超薄高端设计）。左下角设有毛玻璃效果面板，列出：“Flagship Performance”（旗舰性能）、“Advanced AI Imaging”（先进 AI 影像）、“Fast Charging”（快速充电）、“Next-Gen AI”（下一代 AI）。顶部角落文字：“Xiaomi 17 Pro”，采用简洁现代的无衬线字体。风格：高端旗舰智能手机广告，未来感，极简，优雅。画质：8K，超精细，焦点清晰，HDR，电影级商业摄影，纹理真实。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/08fepxm1g0/预览图.webp","partial":false},{"id":95,"c":"03_创意广告品牌设计","t":"时尚杂志封面设计","p":"一位美丽的女子身穿粉色旗袍，头戴精致的花饰，秀发中点缀着色彩缤纷的花朵，颈间装饰着优雅的白色蕾丝领子。她的一只手轻托着几只大型蝴蝶。整体拍摄风格呈现高清细节质感，类似时尚杂志封面设计，照片上方中央位置标有文字「FASHION DESIGN」。画面背景采用简约的纯浅灰色，以突出人物主体。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/092d7f8f11/预览图.webp","partial":false},{"id":117,"c":"03_创意广告品牌设计","t":"2x2网格日本数字广告模板","p":"{\n  \"type\": \"2x2 日式数
