雅的女性，宛如冰雪法师或麒麟灵感的战士。画面采用全身四分之三背影视角，她头部微微偏转，伫立在充满柔和粉色樱花的明亮雪山景观中。她拥有 【极浅的冰蓝色】 头发，发丝极长且浓密，随风飘逸，层次分明，带有柔和的刘海、卷曲的发梢以及头顶一撮俏皮的呆毛。头部两侧耸立着两个带有细微红色纹饰的深色弯曲角状装饰。她的面部被一块淡薰衣草灰色的扁平矩形模糊块遮挡。她身着华丽的奇幻紧身衣和礼服，配色包含黑色、白色、长春花色和蓝宝石色，并饰有金色花丝盔甲细节：黑色贴身胸甲、分离式半透明钟形袖、带有蓝色水晶羽毛袖口、露背的白蓝上衣、带有发光蓝色宝石核心的精致金色腰甲、带有金色几何装饰的透明黑色连裤袜、层叠的半透明蓝色布料，以及腰部和侧面腰带上悬挂的 3 个清晰可见的红色流苏装饰。她的右臂伸展，手戴手套，掌心悬浮着一个发光的半透明蓝色水球，内部有类似阴阳流动的漩涡。她周围环绕着卷曲的水流弧线和冰冷的能量丝带。背景是梦幻般的空灵高山场景，右侧有一座遥远的塔楼，云雾缭绕的雪峰、挂霜的树木、闪烁的氛围、飘落的花瓣，以及点缀在前景和左上角的淡粉色花簇。采用柔和的背光、虹彩高光、精致的动漫渲染、细腻的渐变、清晰的装饰性服装细节、魔法奇幻氛围、冷蓝色与薰衣草色调搭配粉色点缀，竖向构图，无文字，无额外角色。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/06qslklt40/预览图.webp","partial":false},{"id":87,"c":"07_艺术插画创意风格","t":"角色关系图","p":"【日式恋爱模拟游戏】角色关系图。包含角色名称、关系箭头、好感度、冲突点。【剧情喜剧风格】。共7个角色。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0843475edd/预览图1.webp","partial":false},{"id":92,"c":"07_艺术插画创意风格","t":"现代芝加哥河滨清明上河图风格手卷","p":"这是一幅气势恢宏、细节丰富的中国传统水墨彩绘手卷，绘制在古老的绢本上，完美地模仿了张择端《清明上河图》的艺术风格、笔法和散点透视法。\n中心场景：俯瞰熙熙攘攘的现代芝加哥河滨。画面焦点是巨大的钢结构开启桥（杜萨布尔桥/密歇根大道桥），桥上车水马龙，无数汽车、黄色出租车和芝加哥交通管理局（CTA）公交车川流不息，所有景象均以精准的传统笔触描绘而成。\n环境细节：下方芝加哥河上穿梭着现代风格的游船、水上出租车和皮划艇。河岸两侧林立着风格复古的芝加哥摩天大楼（类似箭牌大厦和论坛报大厦），这些建筑以传统的“画”技法绘制而成。远处可见高架铁路，一列“L”型列车正在行驶。\n人类活动：河滨步道和桥边的人行道上挤满了数百个身着现代休闲服饰的小人。他们有的在慢跑，有的在用智能手机拍照，有的在街头小吃摊（热狗摊）前排队，有的在遛狗。整个场景细节丰富，略显杂乱，并以柔和的复古大地色调呈现。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/08f89edfd1/预览图.webp","partial":false},{"id":101,"c":"07_艺术插画创意风格","t":"中二角色波普海报生成器","p":"图片特点包括：粗犷的线条、广角视角、带有UI元素的血条、涂鸦风格的文字、以及充满爆炸感的背景元素。  \n“生成一张极具视觉冲击力和潮流感的【波普艺术风格动漫插画（Pop-Art Anime Illustration）】。画面主角为‘{角色}’，整体风格参考《女神异闻录5 Persona 5》及街头涂鸦的设计元素，","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/099cd26e05/预览图-1.webp","partial":false},{"id":123,"c":"07_艺术插画创意风格","t":"吉卜力风格插画：unyo303的奇幻工作室场景","p":"请广泛收集关于“{\"person name\" \"unyo303\"}”这个人的国内外信息。根据这些信息，推断此人的性格、背景和世界观，并以吉卜力工作室的绘画风格，创作一个适合在社交媒体上使用的方形图标图像。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0K8fFlFQe6/预览图.webp","partial":false},{"id":131,"c":"07_艺术插画创意风格","t":"迪士尼家庭冒险漫画","p":"请参考这些图片，制作一张 【MANGA】 风格的图片，内容是 【我和我的妻子以及我们的儿子】 的 【迪士尼之旅】","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0Nly6jdIH6/预览图.webp","partial":false},{"id":184,"c":"07_艺术插画创意风格","t":"梦幻少女窗边赏花","p":"一幅梦幻般的浪漫插画，描绘了一位年轻女性从敞开的小屋窗户向外探出，完美突显了室外阳光明媚的花园与室内舒适房间之间的对比。她双肘靠在白色窗台上，双手托腮，位于构图中心，面部被姿势和头发遮住。她留着一头非常长的浅棕色波浪卷发，发间点缀着几朵小白花，身穿一件柔和的复古奶油米色碎花裙，配有泡泡袖和精致的蕾丝花边。窗户为白色木质双开窗，向外敞开，两侧挂着轻薄的蕾丝窗帘，随风轻轻飘动。外墙为白色砖墙或灰泥墙，爬满了藤蔓，窗户顶部和两侧环绕着许多小白花。在室外前景中，展现一个郁郁葱葱的春日花园，包含 5 种花卉组合：淡粉色郁金香、奶油白色郁金香、带有黄色花心的白色小雏菊、柔和的薰衣草花穗，以及层叠的淡粉色花园玫瑰或牡丹，底部边缘隐约可见一道矮小的白色栅栏。透过窗户，清晰呈现室内空间：一个温暖、光线柔和的破旧别致风格房间，色调为柔和的米色，墙上挂着植物标本画，木质柜子或架子上摆放着花瓶和鲜花，背景中悬挂着一盏精致的小吊灯。采用柔和的晨光，藤蔓在墙壁和窗台上投下柔和的阴影，色调为轻盈的粉彩，呈现高度细腻的绘画感动漫写实风格，营造出空灵的花卉幻想意境、宁静而怀旧的氛围，采用竖构图。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0bwgklqpnd/预览图.webp","partial":false},{"id":198,"c":"07_艺术插画创意风格","t":"将照片转换为粗犷手绘涂鸦风格","p":"Using REFERENCE_0 as the subject and pose reference, transform the photo into an intentionally crude hand-drawn digital doodle, like a simple MS Paint/cartoon trace made with thick uneven black lines, flat colors, minimal shading, and a plain white background. Preserve the same upper-body framing, twin braided pigtail pose with both hands holding the braids, black sleeveless top, burgundy choker with small silver charm, arm tattoo, pink nails, and the seven visible white loop hair accessories: top-left loop, forehead loop, right-top loop, and four loops down the right braid. Replace the obscured face with a playful cartoon face: oversized angular wraparound sunglasses, closed smiling eyes, open mouth, and tongue sticking out. Remove the concrete wall and street background completely. Make the result look deliberately imperfect, loose, funny, and hand-drawn rather than polished.","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0cqqh7fc94/预览图.webp","partial":false},{"id":203,"c":"07_艺术插画创意风格","t":"四格漫画 (相对论)","p":"制作一页色彩丰富的漫画，来解释相对论的内容。同时加入一些幽默元素。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0d2951d634/预览图.webp","partial":false},{"id":271,"c":"07_艺术插画创意风格","t":"秦王骑虎游八极剑光照空天自碧","p":"一幅极具戏剧性的竖构图中国水墨奇幻画作，绘制于暖米色宣纸上，将宏大的书法与英雄人物场景融为一体。画面右侧，一位身着华丽深色长袍与层叠黑色铠甲的古代孤勇武士骑在一只大老虎背上，立于嶙峋峭壁边缘，两者均以四分之三背面视角呈现，面向左侧的开阔景观。武士披着斗篷，长长的飘带在风中飞舞，他垂直举起一把直剑，剑身化作一道璀璨的金白色光柱，直冲入浓密的风暴云层中。老虎体格健硕、神态逼真且警觉，细节丰富，带有醒目的斑纹、白色毛发点缀，以及带有精致金色装饰的礼仪布饰与马具。天空中弥漫着烟灰色水墨云雾，晕染柔和，发光的剑束周围散布着金色斑点。左下方，朦胧的山水景观向远处的群山、河流、细小的树丛延伸，并以淡灰色水墨渲染出层叠的大气雾霭。在构图的左半部分，包含 2 列巨大的竖排表现力极强的黑色书法，笔触粗犷且不规则，占据了大部分高度；在旁边增加 1 列较窄的竖排小字书法，并总共添加 4 枚红色印章，其中 2 枚小印章靠近较小的题字，1 枚印章靠近右上边缘，1 枚双层红色印章位于左下角。强调留白与浓墨之间的强烈对比、文人画美学、挥洒的笔触气韵、史诗般的武侠气势，以及带有克制金属金高光的现代奇幻质感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0qsjuwdvjv/预览图.webp","partial":false},{"id":274,"c":"07_艺术插画创意风格","t":"马耳他复古旅游海报-2","p":"一张复古旅行海报插画，主题为 【MALTA】，副标题 【MEDITERRANEAN PARADISE】 居中置于顶部附近。画面构图为从前景弯曲的海滨公路望向阳光明媚的地中海沿岸城市，采用纹理丰富的复古海报风格绘制，呈现出温暖的奶油色石质建筑、饱和的绿松石色大海，以及点缀着柔和白云的蔚蓝天空。左侧，密集的历史石灰岩建筑群沿山坡向上延伸，包括色彩鲜艳的封闭式木质阳台、一座带有红陶屋顶的大型圆顶教堂以及一座细长的教堂尖塔。在前景的公路上，放置一辆 20 世纪中叶的经典白色轿车，从后侧方视角呈现，正沿弯道行驶，车牌为深色，文字为 【MTA 1964】。公路右侧边缘沿海港设有一道低矮的石质防波堤。海湾内包含 4 艘船：近处和中景处各有一艘色彩斑斓的马耳他 Luzzu 渔船，远处还有 2 艘较小的船只。天空中飞翔着 4 只白色的海鸥。画面四周点缀着繁茂的三角梅枝叶，鲜艳的洋红色花朵在右上角和右下角拱起，左上角有茂密的树枝；左下角前景处设有一株尖刺状的龙舌兰植物。海湾对岸的远景展现了一座在阳光下泛着淡光的城市沿地平线延伸。采用 20 世纪 50 年代至 60 年代的怀旧旅游海报美学，运用绘画笔触、清晰的构图、浪漫的旅行氛围，以及优雅的排版，主标题采用大型奶油色衬线大写字母，副标题采用较小的深色无衬线大写字母。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0rFB06YD4G/预览图.webp","partial":false},{"id":290,"c":"07_艺术插画创意风格","t":"音乐App循环模式概念海报","p":"{\"type\":\"音乐 App 概念海报\",\"brand\":\"受 Spotify 启发的优质 UI 概念\",\"theme\":\"未来感霓虹绿配黑色，将循环聆听变为一种庆典\",\"poster\":{\"background\":\"深黑色背景，带有微妙的宇宙纹理、微弱的粒子效果，以及手机后方放射出的同心发光绿色波纹环\",\"aspect_ratio\":\"纵向 9:16\",\"style\":\"高端产品展示，流畅的 App 改版样机，戏剧性的光晕，清晰的排版，精致的 UI，高端科技广告\"},\"headline\":{\"kicker\":\"{argument name=\\\"concept label\\\" default=\\\"概念 3\\\"}\",\"title\":\"{argument name=\\\"headline text\\\" default=\\\"LOOP MODE 体验\\\"}\",\"subtitle\":\"{arg 着柔和的光芒。森林充满神秘感，点缀着参天大树、扭曲的树干、漂浮的光粒子以及生物发光的植物和蘑菇。轻雾在空间中飘荡，营造出深邃而神秘的氛围。透过树木过滤的阳光与魔法光芒交织，营造出一个梦幻般的世界。相机采用动态构图，追随 Q 版天使，描绘其在空中滑翔的姿态。表现出运动模糊以体现速度感、气流以及扇动翅膀的轨迹。光线柔和且梦幻，色调以绿色、蓝色和金色为主。光粒子和体积光充盈着整个空间。超高清，电影级，深邃构图，俯瞰视角，卓越的艺术作品。无文字，无 Logo，不要过于写实（保持动漫表现力）。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0y8w0rnxe3/预览图.webp","partial":false},{"id":303,"c":"07_艺术插画创意风格","t":"电力设施艺术插画","p":"写实主义, 电影镜头, 一位美丽的年轻女子, 留着长长的 {\"hair color\" \"brown\"} 头发, 穿着一件 {\"clothing color\" \"black\"} {\"clothing type\" \"turtleneck sweater\"}, 坐在一间 {\"cafe type\" \"cozy\"} 咖啡馆里, 柔和的光线, 焦外虚化, 景深, 高画质, 8k, 细节丰富, 专业摄影, {\"camera type\" \"Canon EOS R5\"}, {\"lens\" \"85mm\"}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/10j4gCvfO7/预览图.webp","partial":false},{"id":304,"c":"07_艺术插画创意风格","t":"白板马克笔艺术","p":"﻿用略微褪色的绿色马克笔在玻璃白板上画一张流浪汉宫本武藏祈祷的照片","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/110302601a/预览图.webp","partial":false},{"id":323,"c":"07_艺术插画创意风格","t":"光辉的肖像——光与细节的完美融合","p":"这是一幅高度详细的8K数字插图，描绘的是一个人的特写镜头（与眼睛平行的视角），人物正面朝向观众，背景为纯白色。画面构图居中，主要展示了人物的上半身。人物的头发浓密、颜色较深且呈卷曲状，每一缕头发都清晰可见，整体呈现出一种时尚而略带凌乱的美感。他们佩戴着一副黑色镜框的眼镜。整体视觉风格以灰度色调为皮肤基调，搭配一件深色条纹T恤；同时，画面中还融入了多种鲜艳的色彩（红色、橙色、黄色、绿色、蓝色和紫色），这些色彩仿佛被绘制或投射在人物的面部、颈部和肩部上。这种风格化的、具有电影质感的灯光效果营造出了强烈的对比度，突出了人物的轮廓，并通过鲜明的色彩与精细的纹理呈现出了独特的视觉效果。人物的眼睛呈现出红棕色的色调。整幅作品线条清晰、结构严谨，尤其是在头发和眼镜的细节处理上非常精致，从而打造出一幅视觉冲击力强的现代肖像画，巧妙融合了单色与霓虹色彩的元素。该图片中的面部图像仅供参考使用。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1276e8b518/预览图.webp","partial":false},{"id":327,"c":"07_艺术插画创意风格","t":"马耳他复古旅游海报","p":"一张复古旅行海报插画，主题为 【马耳他】，设计风格参考 20 世纪中叶的地中海旅游广告，具有优雅的绘画写实感和轻微的印刷海报颗粒质感。在顶部中央，放置大号标题 【MALTA】，使用超大号奶油色衬线大写字母；下方紧邻副标题 【MEDITERRANEAN PARADISE】，使用较小的深海军蓝无衬线大写字母。画面展示瓦莱塔阳光明媚的沿海公路，沿着石质海滨蜿蜒，视角略高于并位于一辆经典的 1960 年代白色轿车后方，轿车正驶离画面，位于左下角前景；车牌显示为 【MTA 1964】。在港口对面，描绘爬满山坡的暖蜂蜜色石灰岩建筑，包括 1 座大型圆顶教堂、1 座高耸狭窄的教堂尖塔、成排的历史联排别墅（带有多个色彩鲜艳的封闭式木制阳台），以及延伸至对岸的远方城墙。在海湾中，包含 3 艘色彩鲜艳（蓝、黄、红、绿）的传统马耳他渔船，以及远处 2 艘微小的白色帆船。在明亮的绿松石色天空中，加入 4 只飞翔的白色海鸥，并点缀柔软的白云。整个构图由深色枝叶茂密的树木和从顶部及右侧边缘拱起的繁茂亮洋红色三角梅框架，右下角也有更多花朵，在场景周围形成郁郁葱葱的边框。在海滨建筑群中加入一棵棕榈树，并在左下角前景处放置一株尖刺状的龙舌兰植物。运用温暖的金色阳光、饱和的海岸色彩、浪漫的度假海报构图、清晰易读的排版，营造出一种怀旧且理想化的地中海氛围。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/12L7f1EN1Z/预览图.webp","partial":false},{"id":349,"c":"07_艺术插画创意风格","t":"日本风拼贴肖像插画","p":"一幅风格化的半身至七分身日本女性肖像，灵感源自 【Non, Nōnen Rena】，人物居中，正对镜头，表情沉稳从容，双手在腰间轻轻交叠。她留着中等长度的乌黑秀发，发丝层次柔和，向后梳理，头顶略显蓬松，肤色白皙。她身着奢华的深红色丝绒礼服，配有夸张的大荷叶边领口，胸前饰有精致的垂直蕾丝边，袖口亦有蕾丝装饰，尽显浪漫的复古优雅。以油画质感的精致编辑插画风格呈现，要求解剖结构真实，阴影柔和，织物纹理丰富，丝绒质感带有细腻的高光。背景采用以日本为主题的手工撕纸拼贴画，由靛蓝、青色、鼠尾草绿、奶油色和金箔色调的层叠纹理纸构成。背景中需包含 5 个清晰可见的鸟居剪影，右侧及右下方分布 3 个宝塔剪影，并将手绘竹叶融入多层纸张中。拼贴画应呈现出精湛的工艺感，边缘不规则撕裂，纸张相互叠加，并点缀装饰性金色元素。垂直构图，人物占据画面主体，背景作为文化底蕴深厚的优雅衬托。无文字，无边框，无多余物体，呈现精致的博物馆海报美学。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/13faksgkae/预览图.webp","partial":false},{"id":366,"c":"07_艺术插画创意风格","t":"黑白红抽象故障艺术肖像","p":"主体：一位英俊的 【男士】 的锐利高对比度侧脸肖像，拥有轮廓分明的下颌线、短胡茬，以及向上梳理的 【蓬松且富有质感的深色头发】。\n风格与构图：写实摄影与抽象数字故障艺术的融合。主体以鲜明的黑白风格呈现，背景为简洁的极简主义白色。\n调色板：严格的单色（深黑与亮白），并带有强烈的 【深红色】 活力点缀。\n图形元素：> * 故障效果：后脑勺和下半身溶解为抽象的几何碎片、像素排序以及“故障感”的红色笔触。\n质感：粗粝的墨水洗涤质感和做旧的数字叠加层，营造出一种现代黑色电影或赛博朋克编辑风格。\n光影与技术参数：> * 光影：强烈的侧光（明暗对照法），在面部形成深邃阴影以突出骨骼结构。\n细节：超写实的皮肤纹理，可见单根发丝，具有高颗粒感的胶片美学。\n构图：竖向比例，特写侧脸镜头。\n纵横比为 9:16","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1557l71lat/预览图-1.webp","partial":false},{"id":393,"c":"07_艺术插画创意风格","t":"黑白进化图","p":"生成 进化的行进 图，极简黑白风格，从最早的猿猴逐渐进化为人再进化为最后的 香蕉","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/17aa746f07/预览图1.webp","partial":false},{"id":402,"c":"07_艺术插画创意风格","t":"浮世绘未来都市图","p":"这是一幅日本江户时期的浮世绘木版画。整幅作品给人一种超现实的感觉，仿佛是葛饰北斋和广重喜重等大师们的合作成果，他们通过古老的视角重新诠释了现代科技。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/181b584aa3/预览图.webp","partial":false},{"id":410,"c":"07_艺术插画创意风格","t":"将猫重绘为拙劣MS画图风格","p":"一张刻意粗糙的手绘数字草图，主体为 【虎斑猫】，居中放置在纯白色背景上，看起来像是用电脑鼠标在基础绘图程序中绘制的。正面坐姿，构图对称，头部较大，身体简化，闭着眼睛微笑，有着小小的粉色三角形鼻子、小巧的黑色嘴巴、长长的灰色胡须、粉色的内耳，额头、脸颊、胸部、腿部和侧面带有橙色虎斑条纹。使用金橙色的细而不匀的轮廓线，线条抖动且摇晃，毛发纹理凌乱涂鸦，比例不完美，充满业余涂鸦的随意感。图像应看起来既可爱又笨拙，如同随意的鼠标手写艺术，画面中包含 1 只猫、2 只耳朵、2 只闭着的眼睛、1 个鼻子、1 张嘴和 6 根可见的胡须。极简构图，无道具，无阴影，无背景，干净的白色画布，简单的平涂色彩，充满俏皮而笨拙的魅力。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/18h6wuupjs/预览图.webp","partial":false},{"id":447,"c":"07_艺术插画创意风格","t":"水彩风格印度女性肖像插画生成","p":"```json\n{\n  \"prompt\": \"使用上传的参考图片，**100% 保留**女性的**面部特征、身份、年龄、肤色和表情**。不要改变面部结构。创作一幅**风格化的数字水彩插画**，面部特征柔和逼真，眼神富有表现力，与参考图片完全一致。黑色头发松散地向后扎起，自然的发丝垂落在脸庞周围。她身穿一件**红色传统服饰**，带有精致的金色细节和雅致的传统珠宝。硕大的**红色芙蓉花和茂盛的绿叶**环绕着她的头部和肩部，通过水彩晕染和泼墨般的飞溅效果，自然地融入背景。构图略微倾斜，营造出梦幻般的诗意氛围。水彩纹理下可见精细的素描线条，柔和的颜料扩散，手绘插画美学，优雅且富有艺术感，高细节，杰作品质。\",\n  \"negative_prompt\": \"模糊，低质量，变形，多余肢体，解剖结构错误，水印，文字叠加，动漫，卡通，过曝，欠曝，丑陋的脸，糟糕的手，面部改变，身份改变，刺眼的光线，塑料皮肤，照片级真实感渲染\",\n  \"parameters\": {\n    \"steps\": 50,\n    \"cfg_scale\": 7.5,\n    \"sampler\": \"Euler a or DPM++ 2M Karras\",\n    \"strength\": 0.55,\n    \"noise\": 0.3,\n    \"width\": 832,\n    \"height\": 1216,\n    \"aspect_ratio\": \"2:3\"\n  },\n  \"usage_instructions\": \"在 img2img 或参考模式下上传您的图片。将强度保持在 0.5–0.6 之间，以在应用水彩插画风格的同时**100% 匹配面部**。仅在您希望姿势或背景有细微变化时，才略微增加强度。\"\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1Tr96HVLee/预览图.webp","partial":false},{"id":464,"c":"07_艺术插画创意风格","t":"希罗尼穆斯·博斯与现代科技力量的碰撞：一部由人工智能创作的超现实主义作品","p":"前几天，在摆弄 Nano Banana Pro 的时候，我突然想到了希罗尼穆斯·博斯（Hieronymus Bosch）。于是我产生了兴趣，让 Gemini 根据这个主题生成一个文本到图像的指令：“以希罗尼穆斯·博斯的风格创作一个文本到图像的指令，主题是世界上最有权势的人物——政治家、艺术家、科技巨头，总之就是那些正在塑造世界的人。”\n我实际上就只输入了这些内容。结果生成出来的图像非常奇怪。之后我又做了一些调整，但最终的图像依然令人难以理解，尤其是那个手持整个世界的“爬行动物人”的形象。（没错，AI 显然受到了《人间乐园》（The Garden of Earthly Delights）这部作品的启发。）","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1ab78d02fb/预览图.webp","partial":false},{"id":498,"c":"07_艺术插画创意风格","t":"苗条女生手持花朵插画","p":"生成一张 【苗条女孩】 的极简主义插画，线条干净利落，局部点缀鲜艳色彩，留白充足，构图精致，现代编辑风格，优雅且简约。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1e38v2fp9b/预览图.webp","partial":false},{"id":514,"c":"07_艺术插画创意风格","t":"科技巨头木刻风格壁纸","p":"一张带有横向四联分屏布局和粗黑边框的桌面壁纸。它展示了半身肖像，采用高对比度的 【木刻版画】 风格，运用粗线条和交叉排线，传达出自信且精英的氛围。从左至右依次为：背景为纹理橙色的 【马云】；背景为纹理红色的身着西装的 【埃隆·马斯克】；背景为纹理蓝色的身着黑色衬衫的 【马克·扎克伯格】；以及背景为纹理绿色、戴眼镜穿西装的 【马化腾】。人物主体以单色米色调呈现，与每个分屏鲜艳的背景形成强烈对比。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1eeXxvASco/预览图.webp","partial":false},{"id":526,"c":"07_艺术插画创意风格","t":"生成多风格无缝纺织图案","p":"以{style}风格的传统手法，创作一种高质量且可重复使用的纺织图案。这种图案在并排使用时能够再次被利用（即具有重复使用的特性）。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1feCBOXurc/预览图.webp","partial":false},{"id":547,"c":"07_艺术插画创意风格","t":"复古波普风四格漫画","p":"一个采用大胆复古周日连环画 / 1980 年代波普艺术风格的 4 格漫画，具有粗黑轮廓线、半色调纹理、鲜艳饱和的色彩（亮粉色、青色、黄色、蓝绿色）以及动态漫画字体。主角：一位时尚的年轻女性，留着 【波浪状薄荷绿】 头发，戴着超大号黑色太阳镜，穿着 【粉色波点抹胸上衣】。自信的表情，光泽感双唇，戏剧性的光影。次要角色：一个可爱的 Q 版企鹅装扮角色（深蓝色身体、白色肚皮、黄色喙帽），有着闪亮的大眼睛，身形娇小，充满顽皮淘气的氛围。第 1 格（特写，大胆开场）：女性的放大肖像，头发微微飘动。明亮的漫画爆炸背景。文字：“风根本吹不掉我的墨镜！”对话气泡：“来吧，微风。”第 2 格（海滩混乱开始）：强风中的海滩场景——棕榈树弯曲，帽子、毛巾和饮料被吹飞。女性自信地站着。企鹅角色出现在一旁。文本框：“海滩日！”对话气泡：“哈！想得美，风。”小企鹅文字：“嘎！”第 3 格（风力增强）：更强的阵风——垃圾桶倾倒，海鸥在空中，碎片飞舞。女性依然镇定，头发戏剧性地飘动。企鹅顽皮地大笑。文本框：“更强了！”对话气泡：“就这？” / 企鹅：“嘿嘿！”第 4 格（最终笑点）：揭示一个戴着太阳镜的大型电风扇正在戏剧性地吹风。女性感到惊讶。企鹅自豪地站在风扇旁边。文本框：“终极 BOSS。”对话气泡：“等等……不！”大型漫画文字：“你被吹跑了！”底部标题：“尊重风扇。”","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1lfq7in2kc/预览图.webp","partial":false},{"id":573,"c":"07_艺术插画创意风格","t":"东方幻想女性空灵肖像","p":"东方奇幻风格 【female】，半身肖像，侧身回眸，气质空灵优雅，柔美神圣，五官精致，眼帘微垂，冷白细腻的肌肤，淡橘粉色妆容，点缀金色高光。\n长发飘逸，发丝间融入了彩色花朵与光点（红色、蓝色、橙色、紫色）；头发具有流动感与空气感。\n身着半透明丝绸长裙与披肩，材质轻盈透亮，织物随风飘动，表面带有鎏金纹理与闪烁颗粒。\n整体光影为暖金色背光，强轮廓光，明显的体积光，漂浮的光点，柔和光晕，营造出梦幻般的氛围。\n背景简洁，带有浅色渐变，呈现出微光与粒子特效；整体氛围空灵、梦幻且神圣。\n风格：高端 CG 插画，超精细，电影级光影，柔光渲染，8K 细节，ArtStation 热门风格。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1v4GAKI9nC/预览图.webp","partial":false},{"id":608,"c":"07_艺术插画创意风格","t":"儿童涂鸦风格线稿上色","p":"我上传的图画书看起来就像是一个五岁小孩画的。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/212c8580e4/预览图1.webp","partial":false},{"id":615,"c":"07_艺术插画创意风格","t":"将史蒂夫·乔布斯的人生历程融入中土世界的冒险故事中……","p":"请为[乔布斯]创建一个有趣的职业生涯地图，使用[《指环王》]的主题。地图中应包含相关的隐喻或象征，将这位名人的职业经历与所选主题联系起来，使整个职业生涯地图看起来既连贯又有意义。提供中英文版本，确保所有文字清晰易读。\n乔布斯的一生就像一部史诗：在车库里创业、被驱逐、流亡、归来，最终改变了世界。这种起伏与张力，用中土世界的框架来呈现，竟然出人意料地非常契合。\n每个人心中都有一座中土世界，而真正的冒险从来不是征服已知的事物，而是怀着敬畏之心，踏入未知的迷雾之中。\n“保持饥饿，保持愚蠢。”（Stay hungry, stay foolish.）","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/218edd6a90/预览图.webp","partial":false},{"id":617,"c":"07_艺术插画创意风格","t":"水彩风格美国州地图","p":"绘制一张标注了所有美国州名及其缩写的完整美国地图（采用水彩风格并配以创意插图）。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/21c1b1bd50/预览图.webp","partial":false}],"total":517,"page":1,"limit":36,"pages":15,"source":"prebuilt-bootstrap-category-full"},"13_特定场景环境生成":{"prompts":[{"id":25,"c":"13_特定场景环境生成","t":"金字塔与狮身人面像的原始风貌","p":"一张金字塔和狮身人面像的照片，但展示的是它们刚建成时的样子。狮身人面像的面孔非常完美。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0252aecf7f/预览图.webp","partial":false},{"id":33,"c":"13_特定场景环境生成","t":"血月下的浪漫晚餐","p":"**创作要求：**  \n描绘一个夜晚的浪漫餐厅场景，采用单色深红色的灯光效果，并营造出浓厚的立体感雾气氛围。画面构图对称：一对情侣坐在小桌子旁，彼此牵手。女方披着低发髻，身着紧身连衣裙，双腿交叠，穿着高跟鞋；男方则身着西装。桌子上放着一根燃烧的蜡烛和两个葡萄酒杯。背景为从地面到天花板的高大玻璃窗，窗外是迷雾笼罩的城市天际线、稀疏的建筑灯光，以及右上角的一轮满月。房间左右两侧摆放着室内盆栽棕榈树，边桌上点着蜡烛；两侧墙壁上装有温暖的壁灯","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/032474da4a/预览图-1.webp","partial":false},{"id":36,"c":"13_特定场景环境生成","t":"恐龙现身东京都厅大楼前","p":"让这只恐龙出现在新宿的东京都厅前。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/03803be92e/预览图-1.webp","partial":false},{"id":113,"c":"13_特定场景环境生成","t":"2020年代高中校园生活","p":"由 【2020 年代初】 的 【高中】 拍摄的业余抓拍照片，呈现 【iPhone 审美】。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0Dq2AJ4Nxd/预览图.webp","partial":false},{"id":139,"c":"13_特定场景环境生成","t":"高定时尚人像拼贴写真","p":"创作一张逼真的高端时尚影棚照片拼贴画，画面中是同一位女性摆出六到八个不同姿势。请务必以提供的面部图像为精确参考（保持相同的面部结构、眼睛、鼻子、嘴唇、肤色和整体身份）。\n这位女性身材苗条优雅，比例自然，肤色白皙至浅色，脸型精致呈椭圆形，五官柔和而立体，眼睛大而富有表现力，嘴唇纤薄，表情平静自信。她的头发是黑色长发，梳成凌乱的发髻，几缕发丝自然地垂落在脸庞周围。\n服装：一件紧身黑色无肩带迷你连衣裙，搭配黑色透明过膝袜，尖头细高跟黑色高跟鞋，以及一件黑色正装西装外套，在不同姿势中以不同方式穿着（完全穿上、披在一侧肩上、挂在一只手臂上，或随意搭在手臂上）。配饰包括一条细黑色颈链。\n拼贴画中包含的姿势：\n正面站立全身照，表情中性，西装外套搭在手臂上。\n背面站立照，头部转向镜头，西装外套穿在肩上，双腿伸直。\n蹲姿或半蹲姿，一条腿向前，目光锐利地看向镜头。\n坐在黑色椅子上的姿势，双腿交叉，西装外套滑落一侧肩部，表情优雅沉着。\n低坐姿，双膝弯曲，身体略微前倾，西装外套仅穿在一只手臂上。\n半身肖像，面向镜头，双肩放松，呈现干净的时尚杂志风格。\n环境：干净的白色无缝影棚背景，柔和的高调照明。一个大型柔光箱放置在前方并略微偏向一侧，在身体下方形成柔和的阴影。均匀的光线清晰展现面料纹理、皮肤细节和鞋子的光泽。\n摄影风格：高端时尚杂志风格，专业影棚摄影，超高清，锐利对焦，自然皮肤纹理，逼真阴影，无镜头畸变，准确的解剖结构和比例。\n构图：垂直时尚拼贴布局，图像间距均匀。\n宽高比：9:16。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0R5vX22IIF/预览图.webp","partial":false},{"id":160,"c":"13_特定场景环境生成","t":"末日最后便利店","p":"广角镜头拍摄荒凉的废土世界，沙漠中央伫立着一家破败但依然营业的便利店。阳光刺眼，尘土飞扬。便利店破碎的玻璃门上贴着一张巨大的、泛黄的告示，上面用红笔醒目地写着：“全人类最后一家便利店，不收瓶盖只收黄金”。屋顶的广告牌虽然生锈，但依稀可见一行大字：“再苦不能苦肚子，再穷不能穷教育”。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0ac002dfff/预览图.webp","partial":false},{"id":164,"c":"13_特定场景环境生成","t":"复旦百年时空交融图","p":"**场景描述：**  \n一个水平分割的电影级镜头，展现了同一场景在两个截然不同年代的无缝融合：画面左侧是【年代A】（大约100年前），右侧是【年代B】（现代）。  \n**画面左侧（【年代A】）：**  \n呈现与当时历史相匹配的建筑、室内设计、材料、交通工具和道具。所有细节都清晰地反映了那个特定的历史时期。人物的穿着完全符合【年代A】的风格，包括发型、配饰以及手中的典型物品（如书籍、雨伞","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0ae468eda2/预览图.webp","partial":false},{"id":235,"c":"13_特定场景环境生成","t":"海边人物换衣","p":"将输入图像中人物的服装替换为参考图像中显示的目标服装。保持人物的姿势、面部表情、背景和整体真实感不变。让新服装看起来自然、合身，并与光线和阴影保持一致。不要改变人物的身份或环境——只改变衣服","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0f602e18d8/预览图1.webp","partial":false},{"id":242,"c":"13_特定场景环境生成","t":"地球达人秀","p":"这是一张21:9超高清（8K）宽屏摄影作品，以电影般的视听效果呈现了虚构电视节目《Earth Got Talent》令人激动人心的总决赛场景。拍摄地点是夜间座无虚席的拉斯维加斯式巨型竞技场：舞台地面呈光泽的黑色且具有高度反射性；背景则是一块巨大的弧形LED屏幕，上面显示着闪耀的“EARTH GOT TALENT”字样，同时配合一个引人入胜的、高度写实的CGI动画效果，模拟了一个旋转中的地球。\n**灯光与氛围：**  \n现场采用专业的动态舞台照明 sistem。纯白色的聚光灯突出了主要人物；各种饱和色彩（红宝石红、蓝宝石蓝和鲜艳的金色）的光束穿透淡淡的光雾，为空间增添层次感；金色纸屑从天花板持续飘落下来。\n**人物构图：**  \n- **主持人（舞台中央）**：金正恩自信地站在一个闪闪发光的水晶颁奖台上，身着他标志性的黑色 Mao 套装（突出了毛料的质感），配以精致且闪闪发光的奖章。他面带笑容，手持镀金麦克风，正向选手们做出夸张的手势。  \n- **评委们（舞台左侧）**：他们坐在一条长而光滑的桃花心木评审桌旁，桌面上配备了内置照明设备、名牌以及大型金色按钮。  \n- **唐纳德·特朗普（最左侧）**：身穿深蓝色西装，系着鲜艳的红色丝质领带，身体前倾，面带阴沉的表情，手悬在红色的大按钮上方。  \n- **弗拉基米尔·普京（中间）**：身着黑色羊绒高领毛衣和合身的深色西装，双臂交叉，嘴角挂着冷峻而 calculating 的微笑，注视着舞台。  \n- **习近平（右侧）**：他穿着笔挺的黑色 Mao 套装，坐姿端正，双手合十，面带平静而神秘的笑容。  \n- **选手（正中央）**：埃隆·马斯克自信地站在指定位置，沐浴在强烈的聚光灯下。他穿着实用的黑色 SpaceX 皮夹克和黑色裤子，对着评委们露出微笑，一只手拿着特斯拉 Cybertruck 的迷你模型，另一只手展示着一个微微闪烁的 Neuralink 脑芯片（可清晰看到内部电路结构）。\n**技术规格：**  \n该照片采用专业电影摄像机（如 Arri Alexa LF）拍摄，使用85毫米定焦镜头（f/2.8光圈）进行拍摄。这样的设置营造出了浅景深效果，使得背景中的庞大观众群呈现出柔和的散景效果。画面具有极致的写实感：面部特征和皮肤质纹理俱佳，色彩处理富有戏剧性，阴影深邃而高光鲜艳。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0fb02bd82b/预览图.webp","partial":false},{"id":247,"c":"13_特定场景环境生成","t":"复古胶片风格泳池全景图","p":"创作一张 3:1 宽画幅电影感照片，拍摄午后强烈的阳光下宁静的户外游泳池，视角略高，斜向俯瞰泳池边缘。构图极简且富有氛围感：右半部分是深青蓝色的静止池水，左下角是方形灰色石砖铺成的甲板，浅奶油色的泳池压顶从左下方向右上角斜向延伸。一个不锈钢 U 型泳池梯带有两个拱形扶手，位于中心附近，固定在阳光照射的边缘并延伸至水中。强烈的几何阴影切割着甲板，大面积的冷蓝色阴影占据左侧，温暖的金色阳光照亮了池沿和上层甲板。在顶部边缘附近的池水中加入一条狭窄的天空或墙壁倒影，呈现柔和的胶片颗粒感、略微褪色的色彩、细腻的模糊效果以及怀旧的模拟摄影质感。使用 【3:1 panoramic】、【deep teal blue】、【harsh golden late-afternoon sunlight】、【square gray stone tiles】 以及 【soft vintage film photograph】。画面中无人，无文字，无杂物，展现宁静的建筑风格泳池场景。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0hdyo4syjb/预览图.webp","partial":false},{"id":268,"c":"13_特定场景环境生成","t":"旅行博客欧洲街头咖啡头图","p":"用途：旅行博客的页眉图片。  \n背景：一条狭窄的欧洲街道，街道空无一人，没有车辆停放。  \n前景：咖啡馆的桌子和椅子，投下柔和的阴影。  \n主体元素：最近一张桌子上的一个咖啡杯，可以看到咖啡杯上升起的蒸汽。  \n细节处理：运用“黄金时刻”的光线效果，采用温暖的色彩调色；图片中不含任何标志、商标或水印。  \n相机参数：35毫米胶片相机，拍摄角度与眼睛水平齐平，景深较浅。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0prLFjIXYM/预览图.webp","partial":false},{"id":344,"c":"13_特定场景环境生成","t":"冰箱惊现怪物，男子逃亡血战","p":"“创作一个电影级的恐怖片片段，内容是关于一个男人在这个房间里发现了一个怪物。”","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1396a70377/预览图-1.webp","partial":false},{"id":360,"c":"13_特定场景环境生成","t":"AI换装生成超清人像","p":"在不改变人物外貌的情况下，根据附件中的图片制作一幅8K分辨率的超高逼真肖像：一位美丽的年轻印度女性，沙漏型身材，白皙的肌肤，长而卷曲的棕色头发。她穿着一件粉色连衣裙，站立着，双手交叉，表情充满诱惑感。佩戴金色手镯和耳环。背景为卧室：白色镶板门、反射着床面的黑色镜子以及一盆绿色植物。采用柔和的自然光色调，营造出真实、自然的感觉，风格类似于时尚博主拍摄的内容。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/14bfddbc98/预览图-1.webp","partial":false},{"id":365,"c":"13_特定场景环境生成","t":"给定坐标处发生重大事件","p":"请根据以下坐标创建一张重大事件的图片：41°43′32″N 49°56′49″W。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/154f3150ae/预览图.webp","partial":false},{"id":387,"c":"13_特定场景环境生成","t":"东京双时空交汇街景","p":"东京城市的横屏分割画面，完美融合了两个时代：左侧是20世纪20年代的景象，右侧是现代风貌。两者在画面中央自然过渡，通过过渡性元素以及来自不同时代的人们的互动来展现这种融合。  \n**主题：** “20世纪20年代与现代并存的东京城市，以及跨越时代的人际互动”  \n**环境特征：**  \n- **左侧**：木质町屋、瓦屋顶、狭窄的小巷、人力车、复古有轨电车和纸灯笼，构成典型的东京传统风貌。  \n- **右侧**：玻璃与钢铁构成的摩天大楼、霓虹灯照亮的商店橱窗","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/173b096653/预览图.webp","partial":false},{"id":388,"c":"13_特定场景环境生成","t":"火星宇航员眺望荒漠","p":"一个电影级的广角镜头，画面中一名孤独的宇航员站在岩石边缘背对镜头，眺望着火星般行星上广阔的红色沙漠平原。宇航员位于画面中下部，身穿写实的白色 EVA 宇航服，带有精致的灰色镶板、生命维持背包、厚重的靴子和深色手套；由于是背影，看不到头盔正面。景观广阔而荒凉，覆盖着铁锈红色的尘土、散落的石块和低矮的岩层；左侧前景为崎岖的悬崖边缘，中景散布着岩石丘陵，远处的地平线上延伸着朦胧的山脉。采用柔和的暖桃色和赤陶色调，带有稀薄的大气雾霾，午后柔和的阳光在宇航员脚后投下长长的影子。氛围孤独、充满敬畏感且富有探索性，如同科幻电影中关于首次接触外星世界的开场画面。写实风格，高细节，超广角构图，自然的电影级色彩分级，史诗感，极简主义，无建筑，无车辆，无文字，无 HUD，无其他人。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/173s0l3m6a/预览图.webp","partial":false},{"id":390,"c":"13_特定场景环境生成","t":"名人版披头士 Abbey Road 跨街照","p":"[知名人物名单] 像披头士乐队《Abbey Road》专辑封面照片中的那样穿过人行横道。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1770cf122e/预览图.webp","partial":false},{"id":413,"c":"13_特定场景环境生成","t":"服装超写实虚拟试穿","p":"使用图像1（服装）和图像2（模特），创建一张模特穿着服装的超现实全身时尚照片。关键的合身细节：[T恤/夹克]必须自然地披在模特身上，符合他们的姿势，并产生逼真的褶皱和皱纹。高保真保存：以极高的精度保存原始织物纹理、颜色和图像1中的任何徽标。无缝集成：通过完美匹配环境光照、色温和阴影方向，将服装融入图像2中。摄影风格：干净的电子商务画册，用佳能EOS R5拍摄，使用50mm f/1.8镜头，打造自然、专业的外观。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/191739a6cc/预览图.webp","partial":false},{"id":419,"c":"13_特定场景环境生成","t":"当创新遇上艺术——Gemini 3.0正式发布","p":"将图像融合在一起，调整产品的视角和光照效果，使产品能够与背景融为一体。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/19aabbaaeb/预览图.webp","partial":false},{"id":461,"c":"13_特定场景环境生成","t":"跨时空对话的视觉奇观","p":"1. 当孔子遇见马克思时，两人互相致敬、互相学习。\n2. 年轻时的父亲与年轻时的自己握手言和，彼此达成理解。\n3. 古猿人与现代都市人之间的世界相互连接，都对对方充满好奇。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1a803e047f/预览图-1.webp","partial":false},{"id":469,"c":"13_特定场景环境生成","t":"时空穿越的上海记忆","p":"来个历史变迁版本😄\n一个民国时期上海卷发少女，穿着深色上衣和长裙，站在1920年代铺满鹅卵石的淮海路街道上，背景是老式汽车和复古建筑，色调怀旧。她低头凝视着地上的水洼。水洼的倒影展现了一个惊人的时空穿越场景：倒影中不仅是她90岁苍老的面容，背景更变成了现代上海繁华的陆家嘴天际线（包括东方明珠、上海中心大厦等摩天大楼）。倒影中映照着日落时分金色的现代都市光影，与现实中灰暗复古的街道形成强烈的古今对比，电影质感，超写实主义。 --ar 4:3","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1alWQWoxZI/预览图.webp","partial":false},{"id":483,"c":"13_特定场景环境生成","t":"“和谐共处，庆祝2025年世界和平”","p":"每个人都在记录这个特别的时刻，共同庆祝“2025年世界和平”。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1c9047f001/预览图.webp","partial":false},{"id":499,"c":"13_特定场景环境生成","t":"阿里的遗产：历史中最具决定性的“一拳”","p":"穆罕默德·阿里，由Prime赞助","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1e3b19bfc9/预览图.webp","partial":false},{"id":528,"c":"13_特定场景环境生成","t":"太空站博物馆艺术修复","p":"宏伟空间站博物馆内的电影级科幻场景。右前景：一名身穿深色连体服的男子正在画架上修复一幅大型 【古典风景】 油画。左前景：一座用金属丝固定的大理石半身像。广阔的多层圆形内部空间融合了古典建筑风格。5 幅装裱好的画作和 4 件包裹好的文物在失重状态下漂浮。巨大的拱形窗户展示出外太空和一颗 【类地行星】。尘埃弥漫的耶稣光穿过窗户射入。右上角悬挂着一条深色横幅，上面写着：“【美的记忆长存，请悉心呵护。博物馆倡议 SOL 4127】”。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1g1oVGky0D/预览图.webp","partial":false},{"id":609,"c":"13_特定场景环境生成","t":"物理学家在吊床上喝着 SPA 饮品放松身心","p":"一位物理学家躺在吊床上，手边放着一杯饮料和一份 S.P.A. 画面中只露出他没穿鞋的双腿，以及树木和植被。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/212fac0227/预览图.webp","partial":false},{"id":638,"c":"13_特定场景环境生成","t":"办公室猫咪互动绘图预设","p":"Nano Banana Pro プロンプト集\n「画像から絵コンテを作る」\nプロンプトはこちら↓\nアップロードされた画像を基に、物語の核心となるシーンの連続的な白黒の絵コンテを作成してください。\n各フレームでは以下の要素を詳細に描写し、物語の感情的な流れと緊張感を表現してください：\n4コマほど\n映画的な構図とアングル: クローズアップ、ロングショット、ローアングル、視点ショット（POV）などを使い分け、キャラクターの心理や状況を強調する。\n具体的なカメラワーク: パン、ティルト、ドリー、ズームなどの動きを指示し、動的な視覚効果を加える。\n重要な瞬間と転換点: 物語が動く決定的なアクションや、シーンが劇的に切り替わるポイントを視覚的に際立たせる。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/23429a0a8d/预览图-1.webp","partial":false},{"id":673,"c":"13_特定场景环境生成","t":"将城市照片编辑成有越南骑行者的雨景","p":"编辑一下，让它看起来像在下雨。\n下雨时，越南人会穿雨衣骑摩托车。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/25bea2a071/预览图-1.webp","partial":false},{"id":718,"c":"13_特定场景环境生成","t":"生成2008年中国小镇网吧旧照","p":"生成一张 【2008】 年中国 【小镇网吧】 的老照片，右下角带有时间标记。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/29rNVi3RQJ/预览图.webp","partial":false},{"id":723,"c":"13_特定场景环境生成","t":"大象骑在棕色马背上","p":"一张写实风格的照片，描绘了一只 【小象】 坐在 【棕色马】 的背上，像人类一样骑着它。马匹装备齐全，配有皮质马鞍和缰绳。小象的前腿搁在马鞍桥附近，后腿垂在马身两侧。马匹静静地站在 【乡村的土路上】。背景两侧是郁郁葱葱的树木和灌木丛，远处右侧可见一根木制电线杆。光线自然且阴天，赋予了场景逼真的日常摄影美感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/2BDgpazXiE/预览图.webp","partial":false},{"id":775,"c":"13_特定场景环境生成","t":"真人电影片场泄露照片","p":"生成 BOP 恶魔猎人真人电影片场泄露照片","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/2aedd262db/预览图.webp","partial":false},{"id":789,"c":"13_特定场景环境生成","t":"根据参考照片和草图绘制的动作场景","p":"使用该男子的照片，仿佛他正从建筑物边缘滑落，而该女子正在伸手，精确匹配草图的姿势和构图，以NYC作为场景的风格参考。一张高质量的 20 世纪 90 年代动作照片。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/2c1690321b/预览图-1.webp","partial":false},{"id":793,"c":"13_特定场景环境生成","t":"根据地图箭头生成地面视角图片","p":"画出红色箭头看到的内容\n/\n从红色圆圈沿箭头方向画出真实世界的视角","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/2c90fdf241/预览图1.webp","partial":false},{"id":826,"c":"13_特定场景环境生成","t":"午夜阳光下的双生世界","p":"一个提示是想象一个故事的倒置宇宙——上面的标志性场景，下面的相反领域翻转了180°，合并成一个连续的形式。相同的角色，不同的情感状态。象征性的物体在各个领域回荡，暗示着丢失或找到了什么。告诉它哪个故事值得它的平行世界。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/2/2f49dee31f/预览图-1.webp","partial":false},{"id":890,"c":"13_特定场景环境生成","t":"跨视角图像生成","p":"将照片转换为俯视角度并标记摄影师的位置","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/3/307de63475/预览图1.webp","partial":false},{"id":900,"c":"13_特定场景环境生成","t":"霓虹夜漂移：粉色跑车与钩针","p":"{“project_manifest”：{“id”：“SCENE_TOKY_NEON_02”，“标题”：“霓虹夜漂流：粉色Coupe&钩针”，“render_profile”：{“方面比率”：“9:16”，“resolution_target”：“2160x3840”，“engine_style”：“照片现实主义_动画”}},“scene_graph”：{“environment_node 密集，支撑元素向外排列。将布局安排成一个紧凑、分层、相互连接的区域，自然地填满平台，没有空隙。确保整个环境清晰地呈现为一个小型手工桌面收藏模型，具有微缩比例的建筑和压缩的模型世界比例，而非真实尺寸的建筑。\n风格：\n将摄像机稳定地放置在产品展示距离，以便整个收藏级立体模型清晰可见，并留有舒适的边距，避免近距离电影式裁剪或环境透视镜头。渲染为一个高级风格化的 3D 收藏级微缩立体模型，置于一个完全可见、居中的独立展示底座上，从略微抬高的 3/4 桌面角度呈现，背景为干净的中性工作室渐变。保持收藏品手办比例和整洁的展示效果。\n所有元素应呈现为由光滑哑光陶瓷、彩绘树脂或风格化聚合物雕刻而成，具有圆润的边缘、简化的几何形状和略微夸张的玩具般比例。保持表面干净且有意风格化。避免指纹、粗糙的手工纹理、工作室场景、微距摄影景深或逼真的粘土瑕疵。\n使用柔和专业的摄影棚产品照明：柔和的全局照明、温暖的主光、柔和的环境反弹光、受控的阴影和可选的温暖室内窗户光。\n将任何水或半透明材料渲染为浇筑的透明树脂，具有光滑的透明度、微妙的反射、柔和的内部深度和略厚的风格化边缘。\n包含小的环境细节，但保持所有元素具有凝聚力、简化和雕塑感。优先考虑干净的风格化建模而非逼真的纹理细节。\n结束","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0Zp5T9JEeI/预览图.webp","partial":false},{"id":155,"c":"12_手工玩具微缩手办","t":"Q版名著场景微缩模型_1","p":"注意：中括号内文字可以替换成你想生成的中文场景，比如：\n- 孙悟空大闹天宫\n- 哪吒闹海\n- 武松打虎\n- 黛玉葬花\n- 孙悟空三打白骨精\n- 关云长过五关斩六将\n提示词：\n微型立体场景呈现，运用移轴摄影的技法，呈现出Q版【孙悟空大闹天宫】场景","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0a2513a0ce/预览图-1.webp","partial":false},{"id":157,"c":"12_手工玩具微缩手办","t":"定制木雕肖像笔筒摆件","p":"“产品描述”：“这款高级豪华桌面配件设计采用了实心木质桌面，配有与之相匹配的木制笔架，制作过程中注重细节的精雕细琢。桌面部分镶嵌着一幅高度逼真的3D雕刻肖像——这幅肖像描绘的是……（具体人物或对象未在原文本中提供）。”","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0aAIgZwyNV/预览图.webp","partial":false},{"id":159,"c":"12_手工玩具微缩手办","t":"咖啡杯中的“微型巴黎”","p":"关于 Nano Banana Pro 的描述：一个白色陶瓷咖啡杯放置在光滑的灰色表面上，其内部被改造成了巴黎的微缩模型。杯子里装的不是液体，而是一条条细致入微的街道、带有灰色屋顶的奥斯曼风格建筑、两旁种满树木的大道，以及带有遮阳篷的小咖啡馆。在杯子的中心矗立着一座按比例缩小的埃菲尔铁塔，它由复杂的金属格栅构成，高耸在圆形广场和绿草覆盖的公园之上，公园里还有微小的行人。几座桥梁横跨着一条类似塞纳河的细小河流，河面上漂浮着微型船只。整个场景采用自上而下的视角呈现，杯子边缘有轻微的景深模糊效果，而埃菲尔铁塔作为焦点则被清晰地突显出来。柔和的日光投下逼真的阴影，城市中的各种纹理——鹅卵石铺成的街道、玻璃窗和绿植——都显得极其细致，营造出一种仿佛整个巴黎都被封存在这个杯子中的错觉。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0aae5cb55a/预览图.webp","partial":false},{"id":168,"c":"12_手工玩具微缩手办","t":"科学发现瞬间的微型实验室雕塑","p":"角色：\n科学史学家兼动力雕塑工程师\n输入：\n科学发现：{argument name=\"scientific discovery\" default=\"{{DISCOVERY}}\"}\n主要科学家：{argument name=\"scientist name\" default=\"{{SCIENTIST_NAME}}\"}\n年份：{{YEAR}}\n实验室地点：{{LOCATION}}\n阶段 1：概念分析\n确定 {{DISCOVERY}} 背后的标志性“尤里卡”时刻\n通过视觉线索简要暗示早期失败的尝试\n选择在此发现中使用的或象征性的关键物理设备（例如：望远镜、棱镜、显微镜、方程式、时钟、透镜）\n阶段 2：视觉呈现\n目标：\n一个 1x1 的单帧画面，展示一个正在运行的“实验室笔记本装置”，凝固在发现进行中。\n场景规则：\n基础：\n一张打开的、陈旧的实验室笔记本，放在木桌上。咖啡渍、手写方程式、粗略草图和页边笔记布满页面。\n机器：\n一个功能性的黄铜和玻璃装置直接从笔记本页面中升起。蒸汽朋克风格，但有科学依据。\n过程：\n该装置主动演示 {{DISCOVERY}}\n示例：光线弯曲、齿轮转动、粒子流动、环绕轨道、波浪振荡。\n科学家：\n一个微小而逼真的 {{SCIENTIST_NAME}} 小雕像，身着符合时代特征的实验室服装，手持钢笔正在做笔记。\n失败：\n笔记本附近散落着划掉的方程式、撕破的草图和揉皱的纸张。\n尤里卡：\n一个微妙的发光元素（LED、灯丝、光束、带电环），象征着突破性时刻。\n标签：\n以钢笔手写风格写在笔记本页面上：\n“{{SCIENTIST_NAME}} | {{DISCOVERY}} | {{YEAR}} | {{LOCATION}}”\n时代道具：\n符合时代特征的工具，例如计算尺、电报、黄铜指南针、玻璃管、本生灯、真空管或笔记本。\n风格与输出\n构图：单帧，主体居中，方形 1x1\n灯光：戏剧性侧光，暖色高光，深色阴影\n纹理：黄铜、玻璃、纸纤维、墨迹清晰可见\n摄影风格：工业科学摄影，电影级写实\n氛围：安静的强度，智力张力，发现的凝固瞬间\n质量：超细节，微距写实，浅景深","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0apOGmrNiT/预览图.webp","partial":false},{"id":194,"c":"12_手工玩具微缩手办","t":"微缩世界中的美食奇观","p":"```json\n{\n  \"collection_meta\": {\n    \"theme\": \"微型世界与宏观食物\",\n    \"style_preset\": \"微摄影/倾斜移位现实主义\",\n    \"aspect_ratio\": \"3:4\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"scene_01_chicken_construction\",\n      \"subject\": {\n        \"team\": \"微型建筑工人\",\n        \"action\": \"使用乐高风格的脚手架、绳索和滑轮搬运","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0cc1c4ef94/预览图-1.webp","partial":false},{"id":233,"c":"12_手工玩具微缩手办","t":"Funko Pop风格乙烯基公仔_1","p":"[角色名称] 的 Funko Pop 风格乙烯基公仔\n身着通常与 [角色] 相关联的标志性服装及配饰，其标志性风格与细节特征均自然呈现。\n姿势 / 表情\n站姿，抬头望向镜头\n表情：好奇中略带漫不经心\n相机与镜头\n相机直接置于正上方，距离极近\n超宽鱼眼镜头，营造极具张力的透视畸变效果\n柔和的圆角画框边缘\n光线与材质\n柔和的工作室灯光，搭配自然阴影\n公仔皮肤与头发采用亮面乙烯基材质质感\n服装材质细节突出（如绗缝、亮面、哑光等），具体依 [角色] 的服饰特点而定\n渲染风格\n高分辨率 3D 渲染\n简洁的中性背景（纯色或渐变色）\n极致清晰的收藏级玩具美学风格","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0f3749fe76/预览图.webp","partial":false},{"id":251,"c":"12_手工玩具微缩手办","t":"致敬人类伟大发明的微型展盒","p":"<说明>  \n输入A：一项改变世界的发明（可以是图片或发明名称）。  \n需要分析该发明的发明者、灵光乍现的瞬间、原型设计以及它对社会产生的影响。  \n可选输入B：一种设计风格参考（如专利局风格或发明者工作坊风格）；如果未提供，则选择“蒸汽朋克风格与现代博物馆风格的结合”。  \n**目标：**  \n制作一个木质展示盒，配备黄铜合页，盒内放置微型“首个原型”，周围摆放发明者 "strong\",\n \"photorealism\": false\n }\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0quLTsqxLC/预览图-1.webp","partial":false},{"id":299,"c":"12_手工玩具微缩手办","t":"可爱纸艺风格角色生成提示词","p":"用英文版创建引用的提示。关于开发图的部分是不必要的。我希望能够将输入图像变成可爱的纸艺作品，就像这张图片一样。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/10Ebh1V0NH/预览图.webp","partial":false},{"id":339,"c":"12_手工玩具微缩手办","t":"高光泽主体三格垂直特写摄影","p":"任务\n扮演一位世界级的时尚摄影师，拍摄一组具有决定性意义的时尚大片。为同一主体创作一组连贯的 3 幅垂直三联画（顶部、中部、底部堆叠）。该系列通过极致的接近度，纯粹利用摄影技术（无环境变化，无额外元素）来提升亲密感和强度，展现触觉上的超现实主义和内敛的动态力量。\n三联画构图\n（垂直堆叠 – 递增的特写强度）\n顶部画幅 – 存在感（强烈的主导性特写）\n动态的低 3/4 角度特写（相机位于主体下方，向上倾斜），营造出逼近、威严的尺度感。\n紧密裁剪：主体的主要焦点特征和锐利轮廓占据主导地位；一侧陷入深影。\n通过轻微的旋转倾斜和仅在远边缘高光处的微模糊来暗示微妙的运动——保持中心区域极其清晰。\n镜面光斑像湿漆一样掠过光泽表面，强调曲率和细微的材料缺陷。\n背景：纯高调白色，带有微弱的渐变衰减——所有画幅均相同，无环境提示。\n中部画幅 – 控制（动能结构扫掠）\n从侧面以倾斜角度进行微距拍摄，具有强烈的透视畸变。\n裁剪框住中心结构区域，关键元素偏离中心并被画框边缘部分切断。\n由于戏剧性的角度，高光对角线穿过轮廓分明的通道和脊线。\n景深极浅：最近的表面清晰锐利，较远的平面柔和模糊，以暗示速度和张力。\n相同的纯高调白色背景和精确的色调范围——变化仅通过相机角度和镜头距离实现。\n底部画幅 – 精髓（极致的图形细节）\n从一个激进的角度进行极致微距拍摄，唤起受控的摇摄效果。选择一个标志性细节，使其在保持图形纯净的同时，通过暗示的运动变得生动：\n一个从下方拍摄的突出或延伸的元素，强烈地缩短，伸向镜头，\n或一个以陡峭对角线拍摄的中心几何/功能特征，高光像运动轨迹一样螺旋上升，\n或一个从后面拍摄的锋利边缘或刀片状轮廓，捕捉到一条细如刀锋的镜面线。\n仅对次要的拖尾平面应用受控的方向模糊；保持主要的微纹理无可挑剔地清晰。\n构图如此紧密，以至于接近抽象：斜面边缘、微划痕、光泽积聚、微妙的材料应力痕迹、细微缺陷。\n无碎屑，无额外元素——保持相同的高调白色背景。\n造型与大胆选择（关键）\n主体：【任何具有精确轮廓和反光表面的高光泽雕塑形态】。\n无额外物体、人物、道具、文字或标志。\n所有能量和运动感完全来源于摄影技术：低/倾斜角度、透视缩短、浅景深、受控选择性模糊和高光流动。\n所有三幅画幅均采用相同的灯光设备——保持一致。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/132OwJ9l28/预览图.webp","partial":false},{"id":345,"c":"12_手工玩具微缩手办","t":"动物城微缩景观展示台","p":"一个 3D 微缩动物城（Zootopia）可视化场景，无人类模型，展示了七个艺术微缩舞台：被日出亲吻的熙熙攘攘的动物城街道，采摘胡萝卜的微小动物市民，昏暗的地下隧道中摆放整齐的农产品板条箱，温馨的城市咖啡馆聚会，以及空灵的薄雾弥漫的稀树草原氛围。每个层级都显示区域名称、人口百分比和设计成珍贵宝石般的《动物城公报》（Zootopia Gazette）品鉴笔记。背景营造出一种昂贵的市政厅环境，利用强烈的明暗对比照明营造出高级时尚的编辑氛围。使用哈苏 H6D-100c 相机，100mm f/2.2 镜头拍摄，景深极浅，散景精致。胡萝卜蛋糕搭配建议的全息显示若隐若现，包括白葡萄酒搭配手工奶酪，红葡萄酒搭配浓郁黑巧克力。色彩故事从浓郁的泥土色调和宝石色调（用于醇厚葡萄酒）过渡到冰绿色、银金色和香槟色调（用于清爽品种）。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_ terior\": \"Object-mimicking realistic shell\",\n      \"bite_mark\": \"Intricate details showing texture\"\n    },\n    \"composition\": {\n      \"angle\": \"Slightly overhead to emphasize contrast between shell and interior\",\n      \"lighting\": \"Soft, diffused lighting to enhance textures and cast subtle shadows\",\n      \"background\": \"Minimal and bright\"\n    },\n    \"artistic_style\": {\n      \"render_type\": \"Photorealistic\",\n      \"mood\": \"Whimsical undertones\",\n      \"aesthetic\": \"Visually convincing and appetizing\"\n    }\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1JqpDlhAGb/预览图-1.webp","partial":false},{"id":441,"c":"12_手工玩具微缩手办","t":"蓝帽雪人夜景写真","p":"```json\n{\n  \"subject\": \"经典三球雪人，雪质纹理感强\",\n  \"clothing\": \"{argument name=\\\"hat color\\\" default=\\\"Blue\\\"} 渔夫帽（尼龙质感），蓝色围巾（毛圈布质感）\",\n  \"face\": \"深色圆形石头眼睛，橙色胡萝卜鼻子\",\n  \"accessories\": \"配套的蓝色帽子和围巾套装\",\n  \"environment\": \"漆黑的星空，冰冷的地面，高对比度\",\n  \"lighting\": \"戏剧性的电影聚光灯，冷色调，突出纹理\",\n  \"camera\": \"全景，略低角度，锐利对焦\",\n  \"style\": \"3D 渲染风格，影棚摄影，极简主义，异想天开，超现实主义，8k 分辨率\"\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1QywWZwGgZ/预览图.webp","partial":false},{"id":443,"c":"12_手工玩具微缩手办","t":"女仆魔法少女手办展示图_1","p":"subject: >\n  角色设计、比例、面部特征、发型、服装细节和配色均忠实于参考图像 A。\n  该角色被塑造成一个高度精细、逼真的 PVC 手办。\n  雕塑风格和整体美学直接从参考图像中推断。\n  该手办以 1/7 比例收藏品的形式呈现。\ncomposition: >\n  模型推断的日语产品介绍布局。\n  纵向构图，宽高比为 3:4。\n  一个大型的完整手办主视觉图。\n  一个清晰定义的产品信息区域，包含所有文本元素。\n  产品名称标志和制造商名称标志各显示一次。\n  包含多个嵌入式特写面板。\n  每个嵌入式面板必须聚焦于手办的不同物理区域或特征。\n  任意两个嵌入式面板不得描绘相同的部分或相同的视觉特征。\n  嵌入式面板必须在视觉和概念上彼此区分。\naction: >\n  静态收藏手办姿势，无任何动作。\n  强调雕塑的准确性、比例和表面细节。\nlocation: >\n  为产品摄影推断的中性工作室环境。\n  极简、不分散注意力的背景。\nstyle: >\n  逼真的产品渲染和摄影风格。\n  艺术基调和氛围完全从参考图像中推断。\ncamera_lighting: >\n  为清晰展示收藏手办而推断的摄像机角度和光照。\n  逼真的工作室光照与 PVC 表面相互作用。\n  头发和服装上的光泽高光。\n  皮肤上的哑光效果。\n  锐利对焦，具有自然的景深。\n  手办下方有柔和的阴影，如同放置在平面上。\ncolors: >\n  基于参考图像的精确色彩再现。\n  推断的背景和图形元素以支持日语文本的可读性。\ntext: >\n  产品名称：\n  「{{product_name}}」\n  ※ 产品名称必须以标志形式显示且仅显示一次。\n  制造商名称：\n  「{{manufacturer_name}}」\n  ※ 制造商名称也必须以标志形式显示且仅显示一次。\n  比例：\n  1/7 比例手办\n  原型师：\n  {{manufacturer_name}}\n  价格：\n  根据手办的比例、雕塑密度和涂装表现推断的日元零售价。\n  尺寸：\n  根据角色体型和 1/7 比例设定推断的总高度（厘米）。\n  材质：\n  适合手办的材质","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1SQvMCNo7U/预览图-1.webp","partial":false},{"id":445,"c":"12_手工玩具微缩手办","t":"等距微缩世界剖面馆","p":"请根据 [主题] 创建一张适合系列化发布、高完成度且高信息密度的“等轴测微观世界档案”视觉地图。\n这不仅仅是一张普通的房间插画或简单的建筑图纸，而是一个结合了“等轴测视角 + 建筑剖面结构 + 多层功能空间 + 高密度主题道具 + 微缩模型感 + 游戏场景概念艺术感”的主题空间概览。图像应看起来像一个打开的微缩世界、商业模拟游戏场景、娃娃屋模型或世界观构建概念图，让观众一眼就能看清整体结构，同时又能反复观察其中的细微之处。\n[基本设置]\n主题：[主题，例如：昆虫研究所 / 未来生存基地 / 魔法药水工坊 / AI 自动化公司 / 植物工厂 / 儿童学习中心 / 太空补给站]\n空间名称 / 品牌名称：[品牌名称或空间名称，可留空]\n世界观方向：[现实 / 科幻 / 童话 / 魔法 / 后启示录 / 博物馆 / 实验室 / 商业模拟 / 校园 / 自然生态]\n建筑类型：[小屋 / 基地 / 工厂 / 实验室 / 店铺 / 博物馆 / 地下空间 / 宇宙飞船 / 多层工作室]\n核心功能：[该空间的主要用途，例如：研究、生产、展示、生活、培训、交易、学习、维护、种植]\n主色调：[主色调，例如：浅蓝、薄荷绿、奶油黄、粉色、橙绿色、紫蓝色、白蓝色科技感]\n辅助色：[辅助色，可留空]\n强调色：[强调色，可留空]\n长宽比：[1:1 / 3:4 / 4:5 / 9:16]\n信息密度：[中高 / 高 / 超高]\n整体氛围：[治愈、可爱、精准、童趣、科普、未来感、复古、清爽、探索感]\n如果某些字段未填写，请根据 [主题] 自动合理推导；请勿留白。所有内容必须围绕主题统一生成，避免无关元素。\n[视觉结构]\n采用清晰的等轴测视角 / 轴测视图，主体为一个打开的多层主题建筑或功能基地。观众可以同时看到建筑的正面、侧面、顶部和内部空间。整个建筑位于屏幕中心，占据大部分区域，背景环境适度淡化以突出主体。\n建筑内部需要划分为多个功能区，每个区域都有明确的用途，而不是随机堆砌装饰。可以包括：\n1. 主工作区 / 核心操作区\n2. 展示区 / 收藏区 / 标本区\n3. 研究区 / 实验室区 / 控制区\n4. 存储区 / 货架区 / 补给区\n5. 生活区 / 休息区 / 小型居住区\n6. 能源区 / 机器区 / 管道区\n7. 种植区 / 培育区 / 生态区\n8. 入口区 / 交通区 / 维护区\n9. 楼梯、平台、走廊、栏杆、梯子等空间连接结构\n通过楼梯、走廊、平台、管道、桥梁或电缆，在各个区域之间形成清晰的空间关系，使图像看起来像一个真实运作的微型系统。\n[道具与细节]\n根据 [主题] 生成大量相关道具，并将它们分布在不同的功能区。道具需要具体、可识别且与主题相关，而不是模糊的装饰。每个小物件都应像游戏资产一样清晰易读，具有可点击、可交互和可收集的感觉。\n道具类型可包括：\n- 主题设备：机器、仪器、工具、控制台、容器、屏幕、工作台\n- 生活用品：桌椅、书架、床、杯子、盒子、柜子、灯具\n- 展示物品：标本、模型、海报、招牌、玻璃柜、展示架\n- 连接结构：管道、电线、梯子、楼梯、传送带、滑轨、平台\n- 生态元素：植物、水箱、培养箱、土壤、树枝、岩石、标本\n- 角色元素：少量角色、动物、机器人或主题生物，以提供比例感和故事感\n道具数量应丰富但有序。所有道具都应服务于空间的功能和主题世界观。\n[风格要求]\n整体风格为清晰、可爱、精准的手绘卡通等轴测插画。线条干净，边缘略圆润，色彩明亮柔和，整体具有放松、治愈和探索的感觉。图像应具有商业模拟游戏、儿童科普绘本、微缩模型或概念艺术页面的感觉。\n避免过度写实、强烈的暗部光影、厚重的油画感和复杂的噪点。重点在于清晰、精致、有层次且高度易读。\n[色彩与光影]\n使用高亮度、中低饱和度的柔和配色方案。主色调统一，辅助色用于区分不同空间，强调色用于突出关键设备和小道具。线稿颜色不使用纯黑色，应使用深灰、蓝灰或棕灰等柔和的轮廓线。\n保持光影轻盈；不需要强烈的写实投影。通过色块、结构、线条和局部高光来构建层次。背景应使用浅色和低对比度处理，使主体建筑更加突出。\n[构图与阅读路径]\n主体居中或略微偏上，建筑采用多层剖面结构。视觉阅读路径应从整体建筑轮廓开始，进入各楼层的功能区，最后观察细节道具。视线可以通过楼梯、平台、走廊、管道和轨道等元素进行引导。\n整体图像应饱满但不拥挤，丰富但不杂乱。每个房间、平台和角落都应有内容，同时保持清晰的空间边界。\n[背景环境]\n背景可以根据主题包含减弱的外部环境，例如森林、城市、街道、地下岩层、实验园区、海底、太空、校园、工厂外景等。背景不应与主体竞争；建议使用浅色、低透明度和低对比度，以达到“主体清晰，背景后退”的效果。\n[最终效果]\n最终图像应看起来像一张完整的主题空间概念图，既有建筑剖面的结构感，又有游戏场景资产图的细节，并结合了微型娃娃屋的可爱探索感。它应适用于系列化视觉创作、IP 世界观展示、游戏场景设定、品牌空间概念图、科普内容封面或小红书 / Pinterest 风格的视觉帖。\n确保图像具有：\n1. 清晰的等轴测视角\n2. 清晰的建筑剖面结构\n3. 完整的多层功能区\n4. 丰富的道具和主题统一性\n5. 柔和明亮的色彩\n6. 干净清晰的线稿\n7. 减弱的背景，突出的主体\n8. 高信息密度但不杂乱\n9. 可探索、可操作、可观察的微型世界感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1TcvR0FZn1/预览图-1.webp","partial":false},{"id":489,"c":"12_手工玩具微缩手办","t":"雪夜中的可爱狸猫雪球_1","p":"1. 请保持附带图片中角色的原有特征，并让动画师使用默认的可爱角色姿势进行绘制。  \n2. 在角色的头上放一只小猫咪。  \n3. 将角色置于一个具有写实效果的雪球模型中，让梦幻般的雪花在戏剧性的夜晚中纷纷飘落。  \n4. 雪球模型放置在一个带有 LED 照明的木质桌子上；  \n5. 桌子稍微靠后一些，旁边放着一支蜡烛；  \n6. 在有些许雾气的窗户上，用类似手指书写的字体写下 “(ᐢ⓿ᴥ⓿ᐢ","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1d4262be11/预览图.webp","partial":false},{"id":490,"c":"12_手工玩具微缩手办","t":"Q版潮男盲盒人偶","p":"﻿将上传照片中的人物转换为可爱的3D Pop-Mart风格的盲盒角色。相似性：保持关键特征的可识别性：[头发颜色、眼镜、发型]。风格：C4D渲染、遮挡渲染、可爱的Q版、柔和的工作室照明、柔和的色彩。背景：简单、纯色的哑光背景（例如，柔和的蓝色）。细节：角色应该具有光滑的塑料玩具质感，表面有轻微的光泽。面向前方，友好的表情。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1d6309b1ba/预览图.webp","partial":false},{"id":504,"c":"12_手工玩具微缩手办","t":"品牌标志造型书架设计","p":"设计一张现代书架的照片，灵感来源于 [LOGO] 的形状。该书架由流畅、相互连接的曲线构成多个不同大小的收纳区，采用光滑的哑光黑色金属制成，书架内部的架子为木质材质。柔和温暖的 LED 灯光勾勒出内部的曲线轮廓。书架安装在色调中性的墙上，上面摆放着五颜六色的书籍、小型植物以及简约的艺术品。整体氛围充满创意、优雅，还带有一丝未来感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1e9e30c609/预览图.webp","partial":false},{"id":516,"c":"12_手工玩具微缩手办","t":"纸艺浮雕武士战士动态造型设计","p":"```json\n{\n  \"art_style_description\": {\n    \"type\": \"3D 衍纸艺术 / 卷纸艺术。\",\n    \"technique\": \"将彩色纸条卷曲、塑形并粘合在一起，形成精美的装饰图案。具有高度的触感纹理、体积深度和分层浮雕效果。\",\n    \"visual_aesthetic\": \"手工制作、精细、鲜艳、边缘清晰、物理渲染模拟。\"\n  },\n  \"subject_details\": {\n    \"character\": \"武士。\",\n    \"apparel\": {\n      \"armor\": \"完整的 大铠 (O-Yoroi) 盔甲，由紧密卷曲的纸圈和波浪形纸条构成。肩甲 (sode) 和胸甲饰有复杂的环状图案。\",\n      \"helmet\": \"华丽的 兜 (Kabuto) 头盔，带有金色纸质装饰和月牙形头饰。\",\n      \"weapon\": \"一把长武士刀，扛在肩上，刀刃由一根光滑的银色/白色纸条制成。\"\n    },\n    \"surrounding_elements\": \"烟雾和风的漩涡，由青色、橙色和奶油色的飘逸丝带状纸条表现。空中散落着小方块瓷砖（类似于骰子或麻将牌）。\"\n  },\n  \"exact_pose_anatomical\": {\n    \"stance\": \"动态动作姿势。武士扭动躯干，准备出击或处于动作进行中。\",\n    \"arms\": \"双手握住武士刀刀柄，举至右耳附近（八相构）。\",\n    \"flow\": \"构图遵循对角 S 形流动，丝带和盔甲板从右上到左下营造出动感。\"\n  },\n  \"colors_and_materials\": {\n    \"palette\": \"传统日式配色方案：深绯红色、青色/绿松石色、奶油色/米白色和金属金色点缀。\",\n    \"material_properties\": \"哑光纸质纹理，纸张纹理可见。纸条之间有细微的阴影，表明物理深度。\"\n  },\n  \"camera_technical_values\": {\n    \"viewpoint\": \"俯视平铺（具有 3D 深度感知）。\",\n    \"lens\": \"100mm 微距镜头（捕捉纸卷的微小细节，无失真）。\",\n    \"aperture\": \"f/11（大景深，使纸艺的所有层都保持清晰）。\",\n    \"shutter_speed\": \"不适用（静态主体）。\",\n    \"lighting\": \"柔和影室灯光（全局照明）。上方均匀的光线在纸卷内部投射出柔和的环境阴影，增强 3D 效果。\",\n    \"resolution\": \"8k，超高细节。\"\n  }\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1ejxhyS35D/预览图.webp","partial":false},{"id":518,"c":"12_手工玩具微缩手办","t":"周边展示货架","p":"移除这幅插画的背景，将其制作成类似手办的周边商品。\n图片：照片级写实\n地点：\n日本一家虚构的便利店的货架。可爱又流行的氛围与整齐摆放的插画周边商品相得益彰。店内空间梦幻般明亮，别具一格，营造出一个让粉丝们兴奋不已的特殊空间。\n人物：\n这些周边商品陈列在货架上。\n周边商品：\n屏幕中央摆放着两个约50厘米长的大型人偶（醒目展示）\n亚克力支架（原作变形版）\nQ版人偶（原作变形版）\n抱枕（大型印刷品，醒目展示）\n拼图（角色造型）\n文具（笔记本、笔、文件夹等，原作变形版）\n纸板（原作变形版）\n毛绒玩具（原作变形版）\n陈列方式：\n周边商品整齐地摆放在货架上，既保留了便利店的氛围，又充满了对角色的喜爱。这些商品的摆放方式让少女粉丝们忍不住想要拿起来。\n整体氛围：\n如梦似幻的周边商品销售空间。可爱与流行元素占据主导地位，虽然只是一家便利店，却被打造成“粉丝活动圣地”。\n分辨率：4K，4000像素：3000像素","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1f1d670888/预览图1.webp","partial":false},{"id":569,"c":"12_手工玩具微缩手办","t":"生成3D卡通足球明星","p":"一个高度风格化的 3D 卡通角色，形象为 【年轻的职业足球运动员】，以自信强健的姿态站立，双臂交叉，一只脚微微向前。他身穿现代风格的 【蓝红渐变色】 足球球衣，带有精致的图案，搭配配套的运动短裤、长款紧身袜和高级球鞋。角色拥有细腻的暖棕色皮肤，头部比例略大，呈现皮克斯风格，拥有大而富有表现力的眼睛、轮廓分明的眉毛以及带有金色挑染的短卷发。面部表情冷静自信，带着一丝浅笑。身体姿态展现出个性和统治力，身体微微侧倾。超精细的皮克斯级 3D 渲染，Octane 渲染，柔和的电影级摄影棚光效，带有边缘光晕，逼真的阴影，光泽的织物纹理以及高对比度的反射。背景为干净纯粹且充满活力的 【红色】，带有微妙的渐变和柔和的晕影效果。角色处于画面正中央，全身可见，浅景深，超高清 8K 分辨率，专业角色设计，动画电影风格。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1tts8q70qk/预览图-1.webp","partial":false},{"id":570,"c":"12_手工玩具微缩手办","t":"历史名人收藏级潮玩视觉设计","p":"2x2 网格，针对历史上 4 位著名科学家执行以下操作：为 【玩具 / 人偶 / 设计师物件】 设计一款收藏级发布视觉图，以完美的英雄视角呈现，并配有可替换配件、不同表情、包装设计、比例参考、贴纸细节、稀有度标识以及材质特写。该物件应呈现出奢华感，介于艺术玩具文化与高端产品品牌之间。配件布局：将 [ACCESSORY 1]、[ACCESSORY 2]、[ALT VERSION]、[PACKAGING FEATURE] 和 [LIMITED EDITION DETAIL] 精心排列在人偶周围。整体效果应令人向往、整洁且具有“开箱感”。视觉风格：潮流文化收藏品揭幕与高端电商发布活动的结合。干净、光泽、富有质感，兼具设计师玩具的精致感与昂贵的趣味性。构图指南：英雄人偶保持主体地位。配件应平衡且优雅地分布。包装应可见但不可喧宾夺主。整张图片应让收藏家产生立即截图的冲动。灯光与背景：柔和的商业灯光，带有微妙的镜面高光，背景为 【背景风格】，阴影清晰，色彩分离高级，细节超锐利，无水印。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1u5twkci0l/预览图.webp","partial":false},{"id":572,"c":"12_手工玩具微缩手办","t":"真人与卡通迷你版自我的超现实互动场景","p":"请使用附件照片作为女性面部的参考，创作一张图像。画面中是一位超写实的真人肖像（面部完全可见，自然肤质，逼真的头发，穿着休闲服），她正用手托着一个微型 3D 卡通版的自己，并以一种惊讶而略带玩味的表情看着它。这个微型卡通版与真人非常相似，但表情夸张滑稽，头部超大，四肢挥舞，具有流畅的 3D 风格化外观（而非玩偶状），穿着与真人相配的休闲服。背景深邃而富有戏剧性，带有电影般的灯光和景深，真人部分纹理超精细，3D 卡通微缩模型高度精细但风格写实，场景干净自然且富有喜剧感，8K 画质，有趣且具有迷因（meme）潜力。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1ukqXbyq6L/预览图.webp","partial":false},{"id":576,"c":"12_手工玩具微缩手办","t":"冬日列车上，真人与动画角色温馨共处的电影级合影","p":"高分辨率电影感照片，在一个舒适的木质火车车厢内，车窗宽大，窗外是白雪皑皑的山景，柔和的冬日阳光，自然采光，浅景深。\n主体：一位二十出头的优雅年轻女子，化着柔和的自然妆容，笑容温暖，长长的深色头发梳理整齐，身穿米色经典羊毛大衣、时尚针织围巾和修身长裤，姿态精致优雅，舒适地坐着。\n她坐在两个动画角色（一只聪明的狐狸和一只勇敢的兔子）旁边，它们表情友好，正亲密地互相拥抱，互动自然，真实人物与动画角色之间的阴影融合逼真，构图无缝，电影级渲染。\n相机风格：索尼 A7，50mm 镜头，逼真的皮肤纹理，柔和的色彩分级，清晰的细节，柔和的焦外虚化。\n氛围：舒适，电影感，暖心，冬季度假，精致专业的摄影。\n--ar 2:3 --v 6 --style cinematic --uplight","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1w4EXuDeSE/预览图-1.webp","partial":false}],"total":530,"page":1,"limit":36,"pages":15,"source":"prebuilt-bootstrap-category-full"},"11_图像编辑与修复增强":{"prompts":[{"id":32,"c":"11_图像编辑与修复增强","t":"咖啡机设计草图转成品","p":"要求：将这个草图转化为最终可批量生产的产品。采用工作室级别的照明效果；使用注塑工艺制造光滑的白色塑料外壳；手柄采用抛光橡木材质；配备不锈钢滴水盘。保持草图中的比例关系不变，但需将线条优化为完美的几何曲线。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/031f2f6829/预览图.webp","partial":false},{"id":45,"c":"11_图像编辑与修复增强","t":"VFX前后对比制作指南","p":"根据提供的提示（例如“在海上飞行的女性”这一场景），制作一个包含两张 VFX 对比图像的视频。  \n- 两张图片应通过中央的垂直线精确对齐显示。  \n**重要注意事项：**  \n- 出现的人物数量、性别以及外貌特征必须与提供的输入图片完全一致；不得随意增加或减少人物数量。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0450d65dd5/预览图.webp","partial":false},{"id":66,"c":"11_图像编辑与修复增强","t":"从拼图中提取图像并修复","p":"提取【第一行第二张】图片，并高清修复其画质","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/069410b703/预览图.webp","partial":false},{"id":105,"c":"11_图像编辑与修复增强","t":"提取图像至JSON格式提示","p":"提供一个详细且全面的 JSON 提示，描述准确复制原始图像所需的所有方面。  \n包括关于物体、服装、发型、复杂细节、配饰、摄影设备、环境、光线、风格、身体姿势以及任何其他相关元素的详细信息。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/09f97f39b6/预览图-1.webp","partial":false},{"id":106,"c":"11_图像编辑与修复增强","t":"拯救拍照手残党","p":"这张照片非常单调和平淡。来对其进行一下优化吧！提高对比度、增强色彩饱和度，并改善光照效果，让它看起来更生动、更有层次感。你还可以裁剪掉那些影响构图的部分，并去掉不必要的细节。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/09ff5f44cd/预览图-1.webp","partial":false},{"id":177,"c":"11_图像编辑与修复增强","t":"移除物品","p":"移除图片中的人物身上的卡其色围巾。让它所在的区域为干净的、连续的，其纹理、光影和颜色需与周围环境完全融合，不留任何痕迹。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0b9ac6a52b/预览图.webp","partial":false},{"id":192,"c":"11_图像编辑与修复增强","t":"老照片局部修复滤镜","p":"**技术细节：**  \n- `type`: 增强现实滤镜合成（Augmented Reality Filter Synthesis）  \n- `aspect_ratio`: 16:9  \n- **指令**: “注意：这是一个图像到图像的转换任务，而不是文本到图像的生成。必须严格保持原始图片（`{{UPLOADED_IMAGE_FILE}}`）的所有像素作为背景；不得基于描述生成新的画面。只有玻璃滤镜内的区域可以修改。”  \n- **全局限制**:  \n  - `source_fidelity`: 滤镜外的背景必须与原始图片完全一致（像素级匹配），不得调整、裁剪、缩放或重新构想背景内容。  \n  - `context_isolation`: 完全忽略之前的所有图片或讨论内容，仅关注当前上传的文件。  \n  - **修改范围**: 所有修改仅限玻璃滤镜内的区域。  \n- **动态分析模块**:  \n  - **步骤1：焦点提取**：确定当前图片中主体的坐标（面部/物体），以便放置滤镜。  \n  - **步骤2：滤镜参数设置**：根据主体特征确定滤镜的形状和修复风格。  \n- **系统提示逻辑**:  \n  - 整体效果呈现为第一人称视角，一只手将玻璃滤镜覆盖在原始图片上。  \n  - **图层定义**:  \n    - **背景图层**（不可修改）：显示原始图片，作为背景。  \n    - **前景手部图层**：现实感强的手部握住玻璃滤镜。  \n    - **滤镜效果图层**：仅对滤镜内的像素进行放大和着色处理。  \n\"style\": \"[HD_RESTORATION_STYLE]（4K分辨率，逼真的纹理，明亮的灯光）。\",\n\"contrast_lock\": \"边界非常清晰：线外为旧版本/模糊图像；线内为新版本/清晰图像。无渐变的色调过渡。\"","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0c895f95c6/预览图-1.webp","partial":false},{"id":202,"c":"11_图像编辑与修复增强","t":"分割对照样式照片","p":"一张卧室的照片，从中间分开，左边是 2018 年，右边是 1964 年，是同一个房间","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0d16d6219d/预览图1.webp","partial":false},{"id":206,"c":"11_图像编辑与修复增强","t":"提示词全局优化统一模板","p":"＃＃ 身份\n顶尖视觉翻译专家。兼具印刷大师的技术精准度和画廊策展人的创意直觉。风格直接自信，能够灵活适应用户的复杂需求。将限制转化为创意的催化剂。\n＃＃ 功能\n将冗长/抽象的图像描述转换为针对人工智能图像生成的优化提示。输出：单个逗号分隔的字符串，根据图像复杂度动态调整输出参数。\n## 复杂性预算\n得分 = (实体 × 1.5) + (关系 × 2) + (环境 × 1.2) + (叙事 × 1.8)\n| 评分 | 预算 | 类型 |\n|-------|--------|------|\n| 1-3 | 80-120 个字符 | 极简 |\n| 4-6 | 120-180 个字符 | 标准 |\n| 7-10人 | 180-250个字符 | 复杂 |\n| 11岁以上 | 250-400个字符 | 详细描述 |\n## 优先级堆栈（降序排列 - 压缩时从底部开始截断）\n1. 主体身份（神圣的）\n2. 媒介/风格（至关重要）\n3. 新颖性因素（高）\n4. 照明（重要）\n5. 组成（重要）\n6. 质地/材质（重要）\n7. 色彩搭配（有益的）\n8. 次要细节（可有可无）\n## 核心转型\n### 可视化具体化表\n摘要 | 视觉翻译 |\n|----------|-------------------|\n| 不祥之兆 | 低角度、拉长的阴影、暴风云、倾斜角度 |\n| 宁静 | 漫射光、静水、柔和色调、水平线条 |\n| 混乱 | 对角线、动态模糊、碎片化构图、高对比度 |\n| 怀旧 | 褪色的边缘、棕褐色调、柔焦、温暖的午后阳光 |\n| 神秘 | 明暗对比、模糊的轮廓、雾气、局部剪影 |\n| 空灵 | 背光、镜头光晕、柔和光晕、漂浮粒子 |\n| 紧张 | 紧凑的构图、浅景深、倾斜角度、压缩的空间 |\n| 强劲有力 | 低角度、轮廓光、强烈的垂直线条、中心构图 |\n| 忧郁 | 阴天光线，蓝灰色调，孤立的主体，雨后湿润的表面 |\n| 欢乐 | 高调光线、金色调、动态姿势、开放式构图 |\n### 技术词汇\n**摄影：** f/1.4-f/16 光圈，焦距范围 24mm-200mm，适用胶片：柯达彩色胶片/Portra 胶片/Tri-X 胶片/Velvia 胶片，布光方式：伦勃朗光/蝶形光/分割光/轮廓光\n**摄影：** 特写镜头/特写镜头/中景镜头/远景镜头/超远景镜头，俯拍/高角度/低角度镜头，2.39:1变形宽银幕格式，手持/跟踪拍摄\n**美术：** 厚涂、晕染、明暗对比、暗色主义、巴洛克/拉斐尔前派/印象派/表现主义参考\n**数字艺术：** 赛璐珞着色、照片合成、背景绘制、概念艺术惯例\n### 压缩技术\n- 复合修饰语：“雨后霓虹灯照耀下的街道”，而不是“被霓虹灯照耀的雨水打湿的街道”。\n- 行动简化：“步态缓慢，下雨”，而不是“在雨中缓慢行走”\n- 隐含特性：材料名称暗示了质地（黑曜石 = 光滑的黑色坚硬）\n## 淘汰规则\n**务必移除：**\n品质描述：精美、惊艳、卓越、杰作、一流品质\n- 模糊的放大词：非常、极其、高度、难以置信\n- 平台参考：ArtStation、Behance、Pinterest 上的热门作品\n分辨率标签：8K、4K、高清、超高清\n- 冗余细节标记：高度精细、专业\n**除非指定目标型号，否则移除：**\n渲染器参考：Octane、V-Ray、虚幻引擎\n- 技术流程：光线追踪、全局光照\n## 内容导航\n策略\n1. **语境解读：**历史/艺术/文献语境允许更广泛的解读。\n2. **象征意义：**事件的后果，人物的阴影，起因的反作用\n3. **艺术先例：** 敏感主题可参考戈雅/黑泽明/文艺复兴时期的艺术手法\n4. **暗示胜于直接描绘：** 暗示而不直接展示\n### 导航翻译\n| 问题 | 导航至 |\n|-------------|-------------|\n| 画面暴力 | 凝固的决定性瞬间、后果、环境破坏 |\n| 露骨内容 | 古典人物素描构图、巧妙的阴影运用、艺术化的裁剪 |\n| 血腥细节 | 撕裂的布料、干涸的污渍、包扎痕迹 |\n| 令人不安的画面 | 心理暗示、光影游戏、局部遮蔽 |\n### 硬性限制（返回错误）\n轻微性化\n- 真人私密影像\n- 具体伤害说明\n针对特定目标的骚扰内容\n回复：【无法处理：超出操作参数范围。请出于正当的艺术目的进行修改。】\n## 错误处理\n| 输入类型 | 响应 |\n|------------|----------|\n| 空 | 请求视觉内容描述 |\n| 纯粹抽象 | 要求提供视觉锚点：形状、环境、光线关联 |\n| 已优化 | 通过或略作改进并附说明 |\n| JSON 格式错误 | 尝试解析，状态假设 |\n| 含义模糊 | 提供主要解释 + 2 个备选解释 |\n| 篇幅过长 | 明确优先事项，注意压缩方面的权衡取舍 |\n## 示例\n**1. 复杂幻想**\n输入：“日落时分，一座摇摇欲坠的哥特式大教堂上，一条拥有黑曜石鳞片的雄伟远古巨龙，在戏剧性的橙紫色天空映衬下，呈现出史诗般的不祥氛围，极具电影质感，8K 分辨率，Octane 渲染，ArtStation 热门作品，杰作”\n输出：`残破哥特式尖塔上的黑曜石鳞片巨龙，日落风暴光，橙紫色天空，立体光束，广角低透视，浅景深，电影级色彩分级`\n**2. 简单肖像**\n输入：“美丽的年轻女子肖像，头发上戴着鲜花，细节非常丰富，杰作，令人惊艳的专业摄影作品”\n输出：年轻女子，透过深色头发看到的野花，伦勃朗式光线，85mm 压缩，浅景深\n**3. 抽象概念**\n输入：“时光流逝，记忆消退，怀念一去不复返的童年”\n输出：`褪色的宝丽来照片散落在布满灰尘的木地板上，废弃的童年卧室，午后的阳光透过蕾丝窗帘洒下，泛着棕褐色调，35毫米胶片颗粒感`\n**4. JSON 输入**\n```json\n{\"subject\":\"赛博朋克商人\",\"setting\":\"雨夜市\",\"mood\":\"孤独但充满希望\",\"details\":[\"霓虹灯\",\"蒸汽\",\"全息图\"]}\n```\n输出：`撑伞的孤零零的街头小贩，雨中的赛博朋克夜市，霓虹灯汉字倒映在湿漉漉的人行道上，全息广告，蒸汽升腾，冷蓝色霓虹灯中一盏温暖的灯笼，变形光晕`\n**5. 恐怖（导航式）**\n输入：“恐怖的人在黑暗森林中被怪物追逐，血腥暴力，极度恐怖”\n输出：`逃离扭曲森林的身影，追赶的细长怪异阴影，月光束，抓住树枝的轮廓，动态模糊，生物被树木遮蔽，倾斜角度`\n**6. 亲密场景（引导式）**\n输入：“烛光摇曳的卧室里，恋人们之间充满激情、艺术感十足的裸体浪漫场景”\n输出：`亲密的伴侣拥抱，烛光摇曳的卧室，温暖的明暗对比，缠绕的丝绸床单，艺术化的局部剪影，伦勃朗式的光影游戏，浪漫的艺术摄影`\n7. 动作战斗（导航式）\n输入：“武士之间激烈的剑斗，鲜血四溅，暴力残暴，尸体横陈”\n输出：`两名武士决斗中，刀剑相扣，樱花飘落，决定性瞬间定格，雨水浸透的袴，黑泽明高对比度黑白画面，刀刃上的动态模糊`\n**8. 超现实主义**\n输入：“受达利启发的梦境，融化的时钟，不可能的建筑，一个迷茫的人影在其中行走”\n输出：`达利梦境，不可能的建筑上融化的时钟，广袤的沙漠视角，孤独的小身影，长长的阴影，超现实主义的超锐利渲染，琥珀色和蓝色的对比`\n**9. 产品图**\n输入：“时尚智能手机悬浮渐变背景，光线反射，专业产品摄影，简洁现代”\n输出：`悬浮的智能手机，渐变蓝紫色背景，影棚边缘照明，表面反射，商业摄影，居中`\n**10. 角色卡**\n输入：“角色设计稿：女太空海盗船长，多种姿势表情，机械手臂，自信，动漫风格”\n输出：`女性太空海盗船长角色设定图，正面/侧面/背面姿势，表情研究，机械手臂细节，自信站姿，带盔甲的飞行服，动漫概念艺术，线条简洁，灰色背景`\n**11. 生物设计**\n输入：“前所未见的恐怖深海生物，会发光，有多只眼睛和触手，灵感来自鮟鱇鱼但更可怕，科学插图”\n输出：深海生物，不对称的多眼，生物发光诱饵，半透明触手团，垂钓者的下颚结构，科学插图，暗水，标本记录美学\n**12. 情感肖像**\n输入：“一位饱经沧桑的老者特写，皱纹深深，眼神慈祥却略带忧伤，自然光线，充满情感的纪实摄影”\n输出：`老年男性头像，饱经风霜的皮肤纹理，眼神慈祥但略微下垂，窗光，纪实肖像，皱纹细节清晰，浅景深`\n**13. 环境科幻**\n输入：“巨大的外星飞船内部，有机生长的建筑，生物发光照明，墙上的神秘舱体，身穿宇航服的渺小人类探险家”\n输出：`巨大的有机外星飞船内部，生长出的肋状建筑，生物发光的青色脉络，神秘的墙壁舱，作为比例尺的小型宇航服人类，大教堂般的垂直空间，吉格尔式的生物机械影响`\n**14. 水下**\n输入：“潜水员探索沉没的古希腊神庙，鱼儿在石柱间游弋，水面洒下光芒，神秘而美丽”\n输出：`潜水员探索沉没的希腊神庙，珊瑚覆盖的大理石柱，鱼群穿梭于废墟之间，水下鳐鱼，蓝绿色的深度梯度，颗粒散射`\n**15. 极简主义**\n输入：“单个红色几何图形漂浮在无限延伸的白色虚空中，阴影微妙，极简现代艺术”\n输出：红色几何图形，无限的白色虚空，微妙的阴影，极简主义构图，大片留白\n## 自信后缀\n- `[HIGH_CONF]` - 清晰输入，直接翻译\n- `[MED_CONF]` - 已做出的合理假设\n- `[LOW_CONF]` - 存在显著歧义\n- `[NAV_APPLIED]` - 使用的内容导航\n## 验证（内部）\n输出前验证：\n- 第一句话中的主语\n- 媒介明确/暗示\n- 在预算范围内\n不使用空话\n摘要翻译\n语法连贯\n## 文化参考\n| 术语 | 视觉翻译 |\n|------|-------------------|\n侘寂 | 风化的表面、不对称、不完美之美 |\n| 丹麦式舒适 | 温暖的室内光线、舒适的材质、温馨的氛围 |\n| 乡愁 | 空旷的空间，褪色的元素，距离的渴望 |\n## 输出规则\n1. 仅单个优化字符串\n2. 除非出现错误/歧义，否则不作解释。\n3. 逗号分隔的描述符\n4. 英文默认\n5. 相关情况下使用信心后缀","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0d9cc87ce1/预览图.webp","partial":false},{"id":211,"c":"11_图像编辑与修复增强","t":"自动修图","p":"这张照片很无聊很平淡。增强它！增加对比度，提升色彩，改善光线使其更丰富，你可以裁剪和删除影响构图的细节","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0ddc55aac2/预览图1.webp","partial":false},{"id":244,"c":"11_图像编辑与修复增强","t":"游戏百科风格页面中的树懒、金枪鱼与F-15J战斗机","p":"一只树懒、一条金枪鱼、一架 F-15J，风格为视频游戏维基网站的页面","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0fiYWBunsh/预览图-1.webp","partial":false},{"id":280,"c":"11_图像编辑与修复增强","t":"将3D模型角色调整为2D插画中的战斗姿态","p":"将第一张图片中的人物姿势改为第二张图片中的姿势","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0tpHpgqYDI/预览图-1.webp","partial":false},{"id":342,"c":"11_图像编辑与修复增强","t":"物品材质修复","p":"对照片中的物品进行高品质修复，去除划痕、灰尘、锈迹与凹痕，提升画面清晰度与材质纹理表现，同时保持原始光影、拍摄角度与图像构图不变。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/134249c2ed/预览图.webp","partial":false},{"id c/3/3f34e5d1a8/预览图1.webp","partial":false},{"id":1123,"c":"11_图像编辑与修复增强","t":"旧照片焕新颜","p":"提示请将我的旧照片编辑成1080 x 1920像素，具有美学和现代摄影外观，使其看起来真实并增强色彩。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/3/3fbddd979d/预览图-1.webp","partial":false},{"id":1287,"c":"11_图像编辑与修复增强","t":"去除图像水印","p":"去除图片中的所有水印","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/4/47ced8592f/预览图1.webp","partial":false},{"id":1389,"c":"11_图像编辑与修复增强","t":"超高保真图像修复","p":"对这张图片进行超高保真度的重制。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/4/4d5991021e/预览图-1.webp","partial":false},{"id":1426,"c":"11_图像编辑与修复增强","t":"提升人像皮肤真实质感","p":"将人物的第一张图片放大到与第二张图片相同的分辨率，并放大到足以看清皮肤纹理的程度。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/4/4gtFItjLse/预览图-1.webp","partial":false},{"id":1466,"c":"11_图像编辑与修复增强","t":"生成 Pixar 风格3D卡通头像","p":"根据上传图片中的人物，创建一个高质量的 3D 头像，使其面部表情开朗、富有表现力。角色应拥有温暖的笑容、明亮的眼睛和柔和的面部特征，给人以友善和亲切的感觉。以皮克斯（Pixar）风格进行渲染，采用平滑的纹理、微妙的皮肤阴影和略微夸张的比例，营造出可爱、动画化的外观。灯光应柔和均匀，营造出干净的影棚效果，并带有柔和的阴影以增加深度。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/4/4tuZA5Njtr/预览图.webp","partial":false},{"id":1478,"c":"11_图像编辑与修复增强","t":"3D模型UV展开图示","p":"展开图像中显示的 3D 模型的 UV。\n图像的大约三分之一应为参考视图，显示 3D 模型本身。其余区域应包含头部、身体和四肢的 UV 布局。展开 3D 模型的表面并将其展平为单个 0-1 二维 UV 空间。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/4/4xl2On221u/预览图.webp","partial":false},{"id":1510,"c":"11_图像编辑与修复增强","t":"老照片焕新现代肖像","p":"通过充满活力的更新颜色、平滑逼真的皮肤纹理和自然光照，转换为现代高质量的数字肖像。服装和背景应该升级为干净的","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/5/5238c1ab99/预览图-1.webp","partial":false},{"id":1578,"c":"11_图像编辑与修复增强","t":"徽州四季田园诗画卷","p":"生成图片，场景真实，渐变要自然而然的融入式渐变不要分割，【超现实主义时光流转艺术】徽州四季田园诗\n32:9超宽全景,展现皖南某徽州古村(宏村风格)的四季生活画卷。\n采用村口大樟树下平视角度,可见月沼、祠堂、马头墙、远山。\n━━━ 统一元素 ━━━\n- 标志性的南湖和画桥贯穿全图\n- 同一棵千年香樟树展示完整生命周期\n- 祠堂建筑固定,仅内部活动变化\n- 同一户三代人的年度生活轨迹\n━━━ 冬季:腊月年关 (0-20%)\n腊月廿八,村口杀年猪,炊烟袅袅,\n马头墙覆薄雪,白墙黑瓦对比强烈,\n南湖结薄冰,倒映天空,枯荷残枝,\n祠堂准备祭祖,村民贴春联,做冻米糖,\n孩子围火炉烤红薯,老人晒太阳唠家常,\n水墨画色调,徽墨重彩,传统民俗浓厚,宁静祥和。\n━━━ 冬春过渡:立春时节 (20-32%)\n- 20%: 除夕夜,祠堂祭祖,灯笼高挂\n- 24%: 正月舞龙灯,村民喜庆\n- 28%: 雨水节气,冰融水涨,油菜花苞显现\n- 32%: 春耕开始,农具准备\n━━━ 春季:清明谷雨 (32-45%)\n三月油菜花开如金色海洋,映衬白墙黑瓦,\n南湖水清,柳绿桃红,画桥上游人如织,\n村民采茶制茶,香气飘满村落,\n写生的美院学生支起画架,摄影师长枪短炮,\n祠堂举办春祭,古礼庄重,\n嫩绿金黄色调,诗情画意,春和景明,江南春天典型。\n━━━ 春夏过渡:芒种夏至 (45-57%)\n- 45%: 油菜收割,金色褪去\n- 50%: 插秧季节,水田如镜,倒映天光(中点农忙)\n- 54%: 梅雨季节,青石板路湿润,撑油纸伞的身影\n- 57%: 荷花初绽,夏意渐浓\n━━━ 夏季:小暑大暑 (57-70%)\n六月酷暑,南湖荷花盛开,清香远溢,\n村民在古树下乘凉,摇蒲扇,孩童湖中戏水,\n祠堂举办荷花诗会,文人雅集,\n晒秋场晾晒辣椒、笋干,色彩斑斓,\n傍晚纳凉,露天放映老电影,\n浓绿荷粉色调,生活气息浓郁,夏日慢时光。\n━━━ 夏秋过渡:处暑白露 (70-82%)\n- 70%: 荷花凋谢,莲蓬采摘\n- 75%: 晒秋更盛,屋顶晾晒作物如调色板\n- 80%: 香樟树叶渐黄,秋风起\n- 82%: 准备中秋,村口搭台唱戏\n━━━ 秋季:寒露霜降 (82-100%)\n九月晒秋盛景,屋顶晾晒玉米、柿子、辣椒,\n如上帝打翻的调色板,航拍必拍,\n香樟树金黄,落叶铺满石板路,\n南湖秋水澄澈如镜,倒映火红枫叶,\n祠堂举办丰收节,村民感恩祖先庇佑,\n中秋夜,月沼边赏月,一家团圆,\n金黄橙红色调,丰收喜悦,岁月静好,圆满祥和。\n━━━ 技术要求 ━━━\n- 徽派建筑精准:马头墙、天井、木雕细节考究\n- 农事节气对应:每个季节的农活符合真实物候\n- 民俗仪式还原:祭祖、舞龙、诗会的场面真实\n- 人物服饰考究:从棉袄→单衣→短袖→长衫的自然过渡\n- 水体镜像强化:南湖倒影是徽州特色,需精细渲染\n- 晒秋色彩爆炸:秋季屋顶农作物色彩是视觉高潮\n8K,32:9,纪实摄影+中国山水画美学,《舌尖上的中国》影像质感","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/5/573ce5234d/预览图.webp","partial":false},{"id":1589,"c":"11_图像编辑与修复增强","t":"图片变手机壁纸","p":"将图片转换为 iPhone 锁屏壁纸效果。手机时间（01:16）、日期（9 月 16 日，星期日）和状态栏详细信息（电池、信号等）叠加显示在图片上，底部显示手电筒和相机图标。原始图片经过调整，以适应加长的智能手机屏幕构图。手机放置在相同配色方案的背景上。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/5/57d696b645/预览图1.webp","partial":false},{"id":1663,"c":"11_图像编辑与修复增强","t":"日式餐厅招牌生成对比","p":"上面用传统书法写着“居酒屋 さくら”（居酒屋 樱花），  \n背景采用温暖的木质色调，  \n灯光柔和如 lantern（此处“lantern”可能指传统日式提灯），  \n画面质量极具写实感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/5/5b2ca725c8/预览图.webp","partial":false},{"id":1699,"c":"11_图像编辑与修复增强","t":"西游记主题海报提示词对比","p":"一张垂直的社交媒体对比海报，背景为黑色并带有细微的灰色网格，设计风格如同简洁的科技测评图。顶部有两个并排的大标题：左侧为亮黄色文字“GPT image 2”；右侧为白色文字“Nano Banana”。标题下方是两个间距较窄、并排摆放的高大海报样机，均采用米白色纸张风格。左侧样机展示了一张受《西游记》启发的传统中国水墨奇幻海报，左上方有巨大的竖排中文书法“西游记”，画面包含柔和的深褐色和灰色水墨山峦、悬崖、云雾、寺庙建筑，以及 4 个微小的人物剪影：2 个英雄人物位于中上部的岩架上，另有 2 个旅人位于场景下方；画面下部出现了一个旋转的发光云雾漩涡。右侧样机展示了一张更具图形感的超现实海报，画面构建在一个向左侧的人头剪影内，内部填充了包含宝塔、水流、小径、人物的中国奇幻景观，剪影内有竖排标题“西游记”；剪影以深海军蓝和黑色水墨绘制，周围环绕着奶油色纸张。两张海报的中间区域均覆盖有一个居中的垂直长方形模糊遮挡块，边缘柔和，呈灰米色。底部是一个带有细白边框的圆角黑色说明面板。其左上角附有一个亮黄色胶囊状标签，内含加粗黑色中文文字“提示词”。底部面板内是一段多行的加粗白色中文文字。文字内容应为：“西游记主题收藏版史诗海报，人物侧脸剪影中生长出完整世界观与经典场景。整体偏电影海报和梦幻水彩插画风，安静、宏大、神圣、怀旧，带纸张颗粒、轻雾感、飞白刷痕与高级留白。” 整体风格为精致的中文科技对比缩略图，高对比度，编辑排版，居中构图，4:5 竖屏比例。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/5/5ee6nKdnYA/预览图.webp","partial":false},{"id":1807,"c":"11_图像编辑与修复增强","t":"使用 Nano Banana Pro 编辑泳装更换效果","p":"将连体泳衣换成比基尼，并添加高跟鞋，同时保持相同的风格和背景。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/6/62957428bc/预览图-1.webp","partial":false},{"id":1833,"c":"11_图像编辑与修复增强","t":"老照片修复与高清重制","p":"以上传的照片为精确的面部参考，生成超写实的豪华 Portrait（100% 与原照片一致）。采用柔和的摄影棚灯光、清晰明亮的曝光效果、自然的皮肤质感、锐利的眼神以及逼真的头发细节。背景略微模糊，色彩设置具有电影质感。效果类似于全画幅单反相机拍摄，使用 85mm f/1.8 镜头，实现 8K 级别的清晰度；不进行面部调整，不会产生卡通化效果，也不会过度润色。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/6/6425dddcb1/预览图.webp","partial":false},{"id":1840,"c":"11_图像编辑与修复增强","t":"提取信息并放置透明图层","p":"提取 [武士] 并放置透明背景","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/6/64c25759ce/预览图1.webp","partial":false}],"total":124,"page":1,"limit":36,"pages":4,"source":"prebuilt-bootstrap-category-full"},"04_创意脑洞特效合成":{"prompts":[{"id":38,"c":"04_创意脑洞特效合成","t":"简单的输入中构思和创建有影响力的图像","p":"创作一幅关于糖尿病的超现实主义图像，以有力且引人注目的方式传达相关信息。首先规划并设计这个视觉概念及创意方向，然后将这个构想转化为照片，并添加恰当的文字说明。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/03b6deedf6/预览图.webp","partial":false},{"id":46,"c":"04_创意脑洞特效合成","t":"少年跃入漫画救少女","p":"超逼真的 8K 场景，以四分之三后背视角呈现：一位照片般逼真的年轻少年在温馨雅致的卧室里，英勇地向前跃入一本竖立在桌子上木制书架上的大型漫画书《修仙记》。\n关键方向——真人进入漫画世界：少年是从现实卧室跳进漫画书页的，而不是反过来。我们从他身后/侧面看到他向前跃进。他的移动方向是：现实世界→ 一→漫画世界（进入书页）。\n关键 - 深度入侵，且转化方向正确：\n他身体的前部（头部、面部、双臂、胸部、前腿）已经进入书页表面，并转化为漫画风格 = 黑白二维，粗线条勾勒轮廓，网点效果，扁平化的动漫美学。\n他身体的后半部分（后腿、臀部、背部、飘逸)","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/04780c57bc/预览图.webp","partial":false},{"id":50,"c":"04_创意脑洞特效合成","t":"移除汉堡的配料","p":"把汉堡里的所有配料都取出来，只留下上下两片面包。面包之间留出空隙，就像馅料还在里面一样。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/04bc2549d1/预览图1.webp","partial":false},{"id":57,"c":"04_创意脑洞特效合成","t":"巨猫出屏都市奇景","p":"🍌 纳米香蕉专业提示在标志性的城市LED显示屏上体验令人惊叹的无眼镜3D视觉效果——幻想和现实在城市的中心无缝融合。---提示---一个巨大的L形无眼镜3D LED屏幕，位于繁华的城市十字路口，以标志性的建筑风格设计，让人联想到东京的新宿或成都的太古里。屏幕上显示了一个迷人的裸眼3D动画，其中包含[场景描述]。人物和物体具有惊人的深度，似乎突破了屏幕的边界，向外延伸或在半空中生动地漂浮。在真实的日光条件下，这些元素将逼真的阴影投射到屏幕表面和周围的建筑物上。动画细节丰富，色彩鲜艳，与城市环境和头顶明亮的天空无缝融合。----场景描述：[一只可爱的巨型小猫开玩笑地用爪子抓过往的行人，它毛茸茸的爪子和好奇的脸逼真地延伸到屏幕周围的空间。]","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0535d9311d/预览图-1.webp","partial":false},{"id":59,"c":"04_创意脑洞特效合成","t":"一个字的无限反射","p":"一个 [PERSON] 在一个黑暗的房间里，“[WORD]”这个词的发光投影在墙壁和身体上无休止地重复。文本以高对比度的霓虹灯 [COLOR] 投影，包裹在对象的轮廓周围，营造出超现实的未来主义照明效果。背景和对象无缝混合到沉浸式文本环境中。照片级真实感、锐利的阴影和文本在曲线上弯曲的光线扭曲。具有深对比度、喜怒无常的赛博朋克美学的工作室照明。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0568b8b5f3/预览图-1.webp","partial":false},{"id":77,"c":"04_创意脑洞特效合成","t":"黑白食材演绎侦探电影场景","p":"使用黑色、白色和灰色的食品来制作三个长条形的盘子，分别表现经典侦探电影中的场景。[随机选取的元素包括：在雨中行走的侦探、致命女郎的剪影、审讯室、屋顶追逐戏、充满烟气的爵士俱乐部等。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/07382d63a3/预览图-1.webp","partial":false},{"id":98,"c":"04_创意脑洞特效合成","t":"将漫画人物融入你的真人照片","p":"一张东京拥挤地铁车厢的超写实照片。车厢里，一个疲惫的武士坐在一个二维黑白漫画人物上。人物线条干净利落，运用了交叉阴影技法。地铁车厢的灯光恰到好处地照射在二维画面上，在墨线处营造出逼真的高光。人物手中拿着一个真实的汽水罐，巧妙地将二维和三维世界融合在一起。4K分辨率，电影级构图。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/09704b67f6/预览图.webp","partial":false},{"id":104,"c":"04_创意脑洞特效合成","t":"寿司演绎武术招式","p":"一块长长的木板，上面展示着套路/招式动作，以渐进的寿司摆放形式呈现。[{\"martial art\" \"随机选择：空手道型、太极拳式、功夫套路、卡波耶拉序列、合气道技法等\"}] 每块寿司代表一个动作姿势，摆放方式展示了动作的流畅性，配菜表示能量方向，芥末则代表发力点。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/09eEgnjq0Z/预览图-1.webp","partial":false},{"id":108,"c":"04_创意脑洞特效合成","t":"墨染幻境，形神俱现","p":"{\"subject\" \"SUBJECT\"} 在牛奶般的水中，从旋转的墨迹中缓缓浮现。浓郁的黑色与浑浊的白色交织融合，柔和的扩散，流畅的动态，抽象却又可辨的形态。梦幻般的氛围，诗意的极简主义，微距摄影风格，细节丰富。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0A4f9npOIL/预览图-1.webp","partial":false},{"id":119,"c":"04_创意脑洞特效合成","t":"倒置人脸肖像摄影","p":"一个男人倒立着脸部的肖像照，嘴巴在顶部，鼻子倒置，眼睛在底部。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0IX9osx564/预览图.webp","partial":false},{"id":130,"c":"04_创意脑洞特效合成","t":"蛋班尼克微型厨房展示盒","p":"请为 {\"dish name\" \"eggs benedict\"} 执行以下操作：\n<instructions>\n输入 A 是一种著名菜肴（照片或菜肴名称）。\n分析该菜肴的起源国、发明者或公认的发明者、传统制法、文化意义和主要食材。\n可选输入 B 是风格参考（烹饪博物馆 / 精品包装）。如果缺失，请选择米其林星级摆盘美学与玩具包装的结合。\n目标：一个高级透明亚克力盒子，内含一个微型厨房场景，其中有发明该菜肴的人物雕像正在准备菜肴，周围环绕着像高端香料系列一样的食材隔间。\n规则：\n- 中央：微型厨房装置，厨师正在准备中\n- 10-15 个独立隔间，内含每种食材的微型版本\n- 包括该菜肴特有的微型烹饪工具\n- 添加一张显示菜肴发源地的微型“起源地图”\n- 包装使用该菜肴所属国家国旗的颜色或传统陶器的颜色\n- 标签上用英文和原产地语言标明菜肴名称，并显示其首次出现的日期\n输出：一张图片，4:5 精品美食摄影风格\n</instructions>","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0N43Ac348z/预览图.webp","partial":false},{"id":154,"c":"04_创意脑洞特效合成","t":"一个令人着迷的“自我多元宇宙”","p":"{\n  \"prompt\": \"这是一幅超写实的23岁女性的全身写真。她的发型与参考图片完全一致，化着自然妆容，目光严肃而直视镜头。她穿着一件白色和天蓝色的拼接连帽衫、黑色高腰裤（或黑色紧身裤/牛仔裤，以展现女性柔美身材），以及一双白色的彪马运动鞋。\",\n  \"style_and_pose\": \"她优雅地坐在一个洁白无瑕的平台上。\",\n  \"creative_concept\": \"有多个穿着相同服装的微型人物与她互动：一个站在她的头上，两个坐在她的肩膀上，一个坐在她的手掌中，一个爬上她的腿，还有三个在平台附近走动。所有微型人物都必须保持相同的严肃表情，并且与原人物一模一样。\",\n  \"lighting_and_environment\": \"背景为无缝的白色摄影棚，使用高端时尚灯光，画面细节丰富、极具写实感。\",\n  \"constraints\": \"面部特征必须与提供的参考图片完全一致；发型也必须与参考图片完全相同。\",\n  \"signature\": \"Shreya Yadav\"\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0a143bd433/预览图.webp","partial":false},{"id":161,"c":"04_创意脑洞特效合成","t":"全聚德烤鸭店微缩模型","p":"3D Q版迷你风格，一个充满奇趣的迷你 {品牌名称} 概念店，建筑外观设计灵感来自于该品牌最具代表性的产品或包装（例如巨大的 {该品牌核心产品，如：炸鸡桶/汉堡/甜甜圈/烤鸭} ）。\n建筑共两层，大大的玻璃窗清晰地展示出内部温馨而精致的设计：{品牌主色调} 的装饰风格、温暖的灯光以及忙碌的店员们 {与品牌匹配的穿着}。街道上有可爱的小人偶漫步或坐着，四周布置着长凳、街灯和植物盆栽，营造出迷人的城市一角。整体采用城市微缩景观风格，C4D渲染，盲盒玩具质感，细节丰富、逼真，画面光线柔和、呈现出午后的惬意感受。--ar 2:3\n品牌名称：星巴克咖啡","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0ac83d7984/预览图.webp","partial":false},{"id":169,"c":"04_创意脑洞特效合成","t":"都市上空巨大的涡旋冲破暴风云层","p":"在一座灯火璀璨的未来都市上空，巨大的螺旋状涡旋冲破暴风云层，显露出后方的蓝天 —— 这一视觉隐喻象征着通用人工智能突破当前局限的重重阻碍，抵达人类难以理解的清晰境界。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0b029d38d0/预览图.webp","partial":false},{"id":170,"c":"04_创意脑洞特效合成","t":"艺术家自画像摄影","p":"一张专业的电影照片（不是数字艺术或绘画）捕捉到了一位美丽的年轻女子，她的面部特征与上传的参考相同，艺术家在画架上画了自己的写实自画像。她在脸颊附近拿着一把细刷子，站在画布前，画布上有一幅鲜艳的水彩泼墨背景。她有一头棕色的长卷发，带有微妙的花香。她穿着一件紧身、低胸、有褶边的白色农民衬衫，突出了略微暴露的胸部。在温暖明亮的木制摄影棚拍摄。聚焦构图，景深，自然皮肤纹理，胶片纹理，超精细，8k，逼真，哈苏，杰作。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0b0779d15d/预览图-1.webp","partial":false},{"id":178,"c":"04_创意脑洞特效合成","t":"手绘彩铅风格家庭温馨插画创作","p":"请以上传图片作为参考。\n插画风格：手绘彩色铅笔插画，线条清晰，铅笔轮廓略带粗糙感，柔和的粉彩色调，亮度增加，色彩更明亮鲜艳，饱和度提升但保持自然，铅笔笔触和柔和的阴影纹理可见，温暖友好的基调，半卡通写实比例，面部特征简洁，点状眼睛，小小的微笑，扁平但细节丰富的着色，极少阴影，柔和高光，故事书插画感，温馨愉悦的氛围，鲜明而柔和的调色板，儿童读物/生活素描风格，高清晰度，无写实感，无照片纹理。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0bJE4E1QWY/预览图-1.webp","partial":false},{"id":182,"c":"04_创意脑洞特效合成","t":"近视者的课堂视角：眼镜中的数学与历史","p":"超近距离特写，眼镜边缘几乎贴近观看者的视线，占据了大部分视野。眼镜镜片内呈现出清晰的[VIEW]，展现了[VIEW]。背景虚化，增强了观看者仿佛正在凝视[VIEW]的印象。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0bf46753a9/预览图-1.webp","partial":false},{"id":185,"c":"04_创意脑洞特效合成","t":"地方美食地图","p":"4:3比例，制作一张中国地图，每个省都用该省最著名的食物来构成（各省看起来应该像是由食物组成的，而不是食物的图片）。仔细检查，确保每个省都正确无误","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0c059431a9/预览图.webp","partial":false},{"id":193,"c":"04_创意脑洞特效合成","t":"纳米香蕉帝国模拟器","p":"一款名为《Age of Nano Banana Pro》的电子游戏的截图","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0ca067364b/预览图.webp","partial":false},{"id":210,"c":"04_创意脑洞特效合成","t":"电脑头角色穿越魔法森林 por","p":"一个卡通风格的角色，它的头部是一个带着微笑的电脑显示屏；角色戴着手套和靴子，正愉快地跳过一个发光的蓝色圆形传送门，背景是一片郁郁葱葱的奇幻森林。森林里有很多大树、蘑菇、花朵、一条宁静的河流、漂浮的岛屿，以及布满星星的夜空（还有几颗月亮）。整个画面颜色明亮鲜艳，光影效果柔和，采用奇幻插画风格呈现。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0db9a01307/预览图.webp","partial":false},{"id":212,"c":"04_创意脑洞特效合成","t":"2025与2026的握手时刻","p":"{ \"prompt\": \"这是一张极具戏剧性的广角电影镜头：在黄昏时分，一名男子自信地站在繁忙的城市街道中央。他伸出手，与两只巨大的、发光的、半透明的数字手握手。左边的数字手从写着“2025”的标志中伸出，散发着温暖的金色光芒；右边的数字手从写着“2026”的标志中伸出，散发着冷峻的蓝光。男子穿着时尚休闲的服装：深色高领毛衣和西装外套。湿润的路面反射着霓虹灯、建筑物的灯光以及那些发光的数字手。画面具有极高的细节还原度，呈现出真实感强的电影效果，纹理极为清晰，氛围充满朦胧的暮色。\" }, \"style\": \"写实主义、电影风格、广角视角、超高细节\", \"lighting\": \"黄昏光线、霓虹反光、温暖与冷峻的色彩对比\", \"camera\": { \"angle\": \"广角\", \"perspective\": \"街道水平视角、具有戏剧性的深度感\" }, \"effects\": [ \"发光的数字手\", \"湿漉漉路面上霓虹灯的反光\", \"对比鲜明的金色与蓝色光线\" ], \"characters\": { \"man\": { \"position\": \"街道中央\", \"pose\": \"伸出手准备握手\", \"outfit\": \"深色高领毛衣和西装外套、时尚休闲风格\", \"expression\": \"自信\" } }, \"environment\": { \"setting\": \"黄昏时分的繁忙城市街道\", \"elements\": [ \"摩天大楼\", \"霓虹灯\", \"湿润且反光的路面\", \"车辆行驶产生的模糊效果\" ] } }","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0deeef9e50/预览图.webp","partial":false},{"id":219,"c":"04_创意脑洞特效合成","t":"幕后拍摄设置可视化","p":"生成一张逼真的图像，显示拍摄此场景时摄像机和灯光的放置位置，并标注所有出现的元素。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0e7ac9800f/预览图.webp","partial":false},{"id":223,"c":"04_创意脑洞特效合成","t":"半透明晶体效果","p":"一个 [SUBJECT] 渲染为带有斜边的半透明晶体形式，从内部微妙地发光。表面捕捉并反射环境光，在黑暗背景下在其轮廓上显示微弱的彩虹色","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0eb8d1712b/预览图-1.webp","partial":false},{"id":232,"c":"04_创意脑洞特效合成","t":"人民币微雕艺术特写","p":"{\n  \"prompt\": \"主题：真正的中国20元纸币（桂林风景图案）。\n【微观材料分析】：该物品的渲染必须完全符合的真实货币纸张的物理特性——使用哑光棉纤维纸，而非有光泽的硬纸板。\n【纸张工艺】：karst山景的图案被精细地切割并呈现出浮雕效果。\n- **关键厚度**：被切割出的纸张层必须显得极其薄（0.1毫米），脆弱且在光线照射下略微透明。边缘应显示出细微的纤维状撕裂痕迹，而不是整齐的厚切痕迹。\n- **印刷纹理**：山景并非纯色，而应由微小的雕刻线条（凹版印刷）和扭纹图案构成。油墨在纸张表面应呈现出轻微凸起的效果。\n【场景背景】：一只逼真的小竹筏漂浮在平整的印刷水域上。\n【比例参考】：一根具有明显皮肤质感的巨大人类手指按在纸币的边缘。与小竹筏相比，手指显得非常庞大，从而突显出物品的微缩比例。\n【摄影要求】：使用微距镜头，采用高对比度照明来展现纸张纤维的纹理。背景模糊，深度景深较小。\"\n}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0f3538c91b/预览图.webp","partial":false},{"id":245,"c":"04_创意脑洞特效合成","t":"微缩女郎橙汁杯上休闲写真","p":"一个逼真的场景：一名女子舒适地坐在一个巨大的橙汁杯盖上，杯子放在户外的路边。保持她姿势放松而俏皮。给她穿上 {\"top color\" \"黑色\"} 紧身衣、一条 {\"skirt color\" \"浅绿色\"} 短裙和一双配套的柔和色调鞋子。在杯子旁边放一个巨大的、有光泽的淡粉色手提包，配有金色链条肩带，这个包相对于娇小的女子来说非常大。在她旁边的地上放一副巨大的心形粉色太阳镜，这副眼镜相对于她来说也显得过大。透明玻璃杯中的橙汁应该看起来浓稠而纯净。柔和的自然日光。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0gImJXR8Tx/预览图.webp","partial":false},{"id":253,"c":"04_创意脑洞特效合成","t":"霓虹雨夜的奇幻自动售货机","p":"一张日本自动售货机在夜晚雨天街角发光的正面照片。每个发光的插槽都是一扇通往舒适公寓的小而独特的窗户，而不是汽水罐。插槽1有一只小猫睡在地毯上。插槽2有一个人在看书。插槽3有一个家庭吃晚饭。下面的按钮选择“生活”。赛博朋克氛围、潮湿的沥青反射、霓虹灯、错综复杂的故事细节、舒适的氛围。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0iwdxVL6hX/预览图.webp","partial":false},{"id":255,"c":"04_创意脑洞特效合成","t":"动态奔跑男性剪影，炫彩几何背景，光影交错，充满力量感。","p":"一位年轻女子，长着深色波浪长发，身穿飘逸的白色薄纱连衣裙，站在日落时分的岩石海滩上，呈现出美丽、超现实、电影般的全身肖像。金色的光线充满戏剧性，投下长长的阴影。海浪在她身后轻轻拍打。使用 50mm 镜头拍摄，f/1.4 光圈，8K 分辨率，高细节，电影颗粒感。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0jx09w6IHp/预览图.webp","partial":false},{"id":259,"c":"04_创意脑洞特效合成","t":"猫咪自拍做饭梗图","p":"创作一张超逼真的竖屏智能手机梗图，呈现出一种刻意为之的低端 Android 手机拍摄的瑕疵感：刺眼的厨房混合光线、轻微的运动模糊、噪点明显的阴影、压缩伪影、尴尬的倾斜构图以及近距离自拍视角。主体是一只黑白相间的家猫，直立在灶台旁，一只前爪伸向镜头，使爪子在前景中显得巨大且模糊，而猫脸保持清晰，表情严肃且冷漠，鼻子和嘴巴周围有一小块黑色斑点。为猫穿上两件清晰可见的服装：一件带有蕾丝花边和蝴蝶结细节的薰衣草色碎花居家裙，以及一顶装饰着彩色缎带蝴蝶结的同色系荷叶边睡帽。猫的另一只爪子拿着一把木勺，正在搅拌画面右侧的一个黑色平底锅，锅里有炒至褐色的食物、绿色香草和红辣椒碎，下方可见蓝色的燃气火焰。场景设定在一个狭窄、凌乱的家庭厨房中，墙壁有污渍，猫身后是一个挤满了调味瓶和酱料瓶的金属架，台面上放着搅拌机，挂着各种厨具，地面是磨损的瓷砖。在顶部中心添加 1 个梗图标题，使用带有粗黑描边的加粗白色字体，内容为 【POV : “Aku jadi Istrimu, Mas”】。让这张图片看起来像是一张真实的、偶然抓拍的做饭自拍，既滑稽又超现实，同时具备照片级的真实感，且没有任何精致的摄影棚灯光。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0kjev10frh/预览图.webp","partial":false},{"id":265,"c":"04_创意脑洞特效合成","t":"捕捉球队赛前氛围的顶级球场宣传图","p":"使用 Nano Banana PRO 模型制作的“大师级提示词”，可生成顶级竞技场宣传片。\n它不仅仅是在球场上放置一个标志；它能捕捉任何特许经营店赛前激动人心的能量。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0oQwEuS25N/预览图-1.webp","partial":false},{"id":267,"c":"04_创意脑洞特效合成","t":"红色背景下的巨型鞋履时尚大片","p":"超写实时尚大片拍摄，模特为留着短卷发、带有轻微胡茬的年轻男性，佩戴黄色矩形墨镜，身穿米色单色运动休闲装（宽松卫衣和慢跑裤），搭配厚底米白色运动鞋。\n构图：\n全身照，略微仰拍。模特双手插兜，随意地倚靠在身后垂直放置的超大号运动鞋上，仿佛将其作为一件雕塑艺术品。运动鞋细节极其丰富，采用现代厚底设计，质感柔和哑光，色调与服装相呼应。\n姿势与表情：\n姿态放松自信，身体微微后倾，一只脚轻微向前。表情冷静简约，直视镜头。\n背景：\n极简主义摄影棚，配有 【醒目且饱和的红色背景】，地面为光亮的反光材质，在模特和超大号运动鞋下方形成清晰的镜像倒影。\n灯光：\n柔和的漫射摄影棚灯光，带有细腻的高光和受控的阴影。光照均匀，呈现高端广告大片质感，无强烈对比。\n风格与美学：\n奢华街头风广告大片，超现实的比例对比（巨大物体与人物），构图简洁，留白有力，时尚摄影，超清晰对焦，自然的皮肤纹理，8K 分辨率。\n调色板：\n单色 【米色】 服装与鞋子，与鲜艳的红色背景形成对比，带来强烈的视觉冲击力。\n关键词：\n超现实时尚，超大物体，现代街头风，极简主义，反光地面，高端时尚广告，产品聚焦构图，电影感灯光","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0oqs1bq918/预览图.webp","partial":false},{"id":276,"c":"04_创意脑洞特效合成","t":"与巨幅明星海报互动街拍","p":"```json\n{\n  \"project_name\": \"{\\\"project name\\\" \\\"Pro_Billboard_Interactive_Lifestyle_v9\\\"}\",\n  \"usage_guide\": \"1. 填写 STAR_NAME、STAR_EXPRESSION、USER_POSE。2. 设置长宽比（例如，3:4）。3. 上传全身参考图。4. 此版本可在您和巨型海报之间创造一种休闲、有趣的互动。\",\n  \"prompts\": {\n    \"positive_prompt\": \"一张高端时尚杂志风格的照片，全身照，以 {\\\"aspect ratio\\\" \\\"3:4\\\"} 的比例拍摄。\\n\\n[空间逻辑 – 完美的景深]\\n一个真实的人物站在前景中，距离背景墙约 {\\\"distance\\\" \\\"50cm\\\"}（几十厘米）。没有接触墙壁。有可见的自然景深。柔和的阴影投射在后面的墙上，证明了物理上的分离。\\n\\n[主体 – 休闲与互动]\\n主体的服装、性别和年龄与上传的参考图片完美匹配。从头到脚全身可见，包括鞋子。\\n姿势与氛围：人物正在 {\\\"user pose\\\" \\\"指着广告牌，大声笑着，很兴奋\\\"}。姿势随意、不做作，以生活化为主（不是僵硬的证件照）。感觉就像一张有趣街拍，人物正在与背景中的名人互动。\\n\\n[背景 – 巨大的富有表现力的海报]\\n人物身后是一张巨大的、建筑大小的商业广告牌。它展示了 {\\\"star name\\\" \\\"Thomas Stanley Holland\\\"} 的巨幅肖像，表情为 {\\\"star expression\\\" \\\"迷人诱惑的微笑\\\"}。从肩膀以上可见，看起来巨大而气势磅礴。\\n\\n[纹理与材质真实感]\\n广告牌具有逼真的重型乙烯基或帆布纹理。可见细节：轻微的表面波纹、张力褶皱、不均匀的光线反射和微小折痕。它看起来像一个真实的物理物体，而不是光滑的屏幕。\\n\\n[光照]\\n柔和的阴天自然光，8k 分辨率，原始照片质量，锐利对焦。\",\n    \"negative_prompt\": \"僵硬的姿势，军人站姿，证件照，无聊的表情，接触墙壁，零距离，扁平的数字图像，完美光滑的纹理，光面屏幕，虚假海报，浮空的脚，缺少鞋子，裁剪，低分辨率，糟糕的解剖结构，改变服装，卡通，3D 渲染\"\n  }\n}\n```","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0sK9a4MsNE/预览图.webp","partial":false},{"id":289,"c":"04_创意脑洞特效合成","t":"人鱼咖啡车梦幻治愈风","p":"🧜‍♀️✨  人鱼主题的梦幻3D咖啡小屋，咖啡香甜，甜点治愈，给你童话般的惬意时光！☕️🍰\n整体画面采用细腻柔和且治愈的风格，以高解像度呈现。左侧主体是一辆以游戏用3D建模制作的卡通风格咖啡小推车，小车设计精巧可爱，主角则是一名充满梦幻气息的人鱼，造型生动活泼，色彩明亮温暖，营造出童话般的浪漫氛围。右侧四分之一的位置则以精致的排版布局呈现店铺招牌菜单，其中包括两款诱人的咖啡饮品和一款精美甜点的实拍图片与价格说明，整体布局兼具艺术感与实用性，给人一种温暖闲适、治愈人心的视觉享受。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0xj6CTJZky/预览图.webp","partial":false},{"id":298,"c":"04_创意脑洞特效合成","t":"“骑上巨型蜜蜂”——一场充满时尚与冒险的旅程","p":"“超写实的8K数码单反照片，拍摄对象为参考图片中的那个人，她骑在一只非常逼真的蜜蜂身上。确保拍摄对象与参考照片完全一致：相同的面部、姿势、表情、服装、发型和肤色。拍摄对象自然地坐在蜜蜂的胸部上，阴影和衣物的变形都符合实际情况。蜜蜂非常逼真，拥有金色的绒毛状胸部、琥珀黑色的条纹、细节丰富的翅膀（带有轻微的运动模糊效果）、具有反光功能的复眼以及细小的花粉颗粒。采用温暖的黄金时刻光线、电影风格的边缘光效果、浅景深、HDR技术、高对比度，以及真实感极强的纹理效果。拍摄对象穿着Gucci品牌的休闲装，手中握着蜜蜂。”\n“负面要求”：不允许对面部或身体进行任何修改；不得采用卡通风格；不得出现任何变形或不真实的解剖结构；不得添加任何文字或水印。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/10378cc4f2/预览图.webp","partial":false},{"id":300,"c":"04_创意脑洞特效合成","t":"镜碎幻影时尚肖像","p":"一幅电影般的特写肖像，描绘了指定女性，通过放置在她面前的碎裂镜子捕捉。使用 50mm 镜头，f/1.4 光圈，实现极致的焦外虚化效果，她的面部特征被镜子碎片多重化和扭曲，营造出超现实的万花筒效果。她的一只眼睛清晰对焦，目光锐利地直视镜头。霓虹粉色和青色灯光反射在玻璃上，增添了现代美学的光泽。整体氛围阴郁而未来感十足，充满时尚杂志的风格，以光泽的高光和柔和的电影感阴影为特点。微妙的数字颗粒和色彩分级将图像提升至梦幻而时尚的美学境界，使其非常适合前沿的广告宣传活动。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/10JMqyOjHO/预览图-1.webp","partial":false},{"id":308,"c":"04_创意脑洞特效合成","t":"霓虹灯线框","p":"[主体] 的霓虹灯线框可视化，以发光的 [color1] 和 [color2] 矢量线描摹。这个人物悬浮在数字虚空中，周围环绕着速度轨迹、运动模糊和不断变化的几何阴影，唤起了一种动能和未来主义的动力。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1130b75e9b/预览图-1.webp","partial":false},{"id":313,"c":"04_创意脑洞特效合成","t":"GTA5在线射击汽车场景","p":"创作一张《GTA 5》在线模式的画面，画面中有人正在射击一辆汽车","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/11a9d482b7/预览图.webp","partial":false}],"total":1048,"page":1,"limit":36,"pages":30,"source":"prebuilt-bootstrap-category-full"},"08_图像分析信息拆解":{"prompts":[{"id":49,"c":"08_图像分析信息拆解","t":"智能皮肤分析与个性化护肤方案生成","p":"你是一位专业的皮肤分析师和护肤专家。用户上传一张他们脸上的特写照片，并可能添加简短的注释（年龄、过敏、当前习惯、怀孕等）。仅使用您在图像和用户文本中看到的内容。1.仔细检查皮肤：光泽、毛孔、发红、瑕疵、斑点、质地、脱皮、细纹、黑眼圈等。2.确定主要皮肤类型：油性、干性、正常、混合性或敏感性。3.识别可见问题：痤疮/粉刺、黑头/白头、痤疮后痕迹、色素沉着过度、发红、毛孔粗大、质地不均、脱水、细纹、黑眼圈、浮肿等。响应格式（非常重要）您的答案必须是纯文本，结构如下：1.首先，写3-6行短句","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/04b55136bb/预览图-1.webp","partial":false},{"id":89,"c":"08_图像分析信息拆解","t":"老照片修复美化，提升色彩与质感，呈现现代摄影风格","p":"请将我的旧照片编辑成 1080 x 1920 像素，使其具有美观、现代的摄影风格，看起来真实自然，并增强色彩。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0878awoLMy/预览图-1.webp","partial":false},{"id":195,"c":"08_图像分析信息拆解","t":"白板绘心形公式图","p":"请在白板上把公式画成一个图表，将其放在公式的下方。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0cdc0b3515/预览图-1.webp","partial":false},{"id":197,"c":"08_图像分析信息拆解","t":"时间流逝对比展示","p":"显示 5 分钟前 / 1 小时后 / 10 小时后","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0cgvY0KcEB/预览图-1.webp","partial":false},{"id":221,"c":"08_图像分析信息拆解","t":"Cosmic Swagger：哈哈，高达的设计图终于公开了！","p":"风格独特的胸部面板，散发出温暖的光芒；  \n驾驶舱舱口处装有粗大的镀铬开关和旋转式旋钮；  \n背包式推进器采用复古的星际飞船风格设计，配有洋红色和青绿色的等离子喷口；  \n手臂上装有“Funk Cannon”武器（这是Captain HaHaa的标志性武器）；  \n腿部装有反射宇宙色彩的镀铬面板；  \n脚部稳定装置呈迷你悬浮滑橇形状；  \n附有10张标签，详细说明每个独特的设计特点：  \n- HaHaa标志天线（回旋镖形状）  \n- CRT式胸部显示面板  \n- Core-Funk功能模块  \n- 肩部护甲  \n- 光束剑收纳架（采用复古橙色护套）  \n- 宇宙风格Funk Cannon武器  \n- 星际推进器背包  \n- 腰部装饰性配件，上面刻有“你喜欢吗？”字样  \n- 膝盖滑动装置  \n- 悬浮滑橇式脚部稳定装置  \n设计风格：采用蓝绿色背景，线条轮廓带有海军蓝色调；技术细节部分采用文字标注方式进行说明。  \n相机视角：正面正视图，侧面插图。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0e94dd29a6/预览图.webp","partial":false},{"id":230,"c":"08_图像分析信息拆解","t":"未来主义时尚：VOUGE NEON 2099正式发布","p":"设计一本2099年的高端时尚杂志封面，名为《VOGUE NEON》。模特是一个性别模糊的人形生物，拥有能够发光的皮肤，穿着由可编程面料制成的服装，这种面料可以随时改变图案。背景是一个干净、光滑的白色工作室环境，其中漂浮着增强现实（AR）界面元素。使用简洁的字体设计、类似二维码的视觉元素以及极简的版式布局。还可以添加一些虚拟的条形码和具有未来感的标题。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0f038108ba/预览图.webp","partial":false},{"id":270,"c":"08_图像分析信息拆解","t":"产品精准爆炸视图与规格面板","p":"Render_Target = ( 3D_Accurate_Exploded_View_Of_【[product]】 * 1.3 ) + ( Minimal__Extremely_Accurate_Spec_Callout_And_Material_Breakdown_Panel * 1.4 ) + ( Soft_Gradient_Studio_Backdrop * 1.0 ) + ( Directional_Rim_Light_With_Soft_Fill * 1.0 ) - ( Floating_Neon_Rings_Or_Glowing_Orbs / 3.0 ) - ( Generic_Innovation_Sparks_Or_Circuit_Overlays / 2.5 ) - ( Cluttered_Desk_Props_Or_Watermarks / 2.0 )","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/0/0qqth7umqu/预览图.webp","partial":false},{"id":310,"c":"08_图像分析信息拆解","t":"真实世界的AR信息化","p":"你是一个基于位置的AR体验生成器。在这张图像中突出显示[兴趣点]并标注相关信息","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/119d053f38/预览图1.webp","partial":false},{"id":318,"c":"08_图像分析信息拆解","t":"Meta Quest 3结构解析海报","p":"创作一张简洁的高端日式科技信息图海报，用于 【Meta Quest 3】，画面中心为一个垂直堆叠的白色混合现实头显爆炸视图，悬浮在柔和的淡紫色至蓝色渐变背景中。顶部放置蓝色的 Meta 标志，随后是醒目的黑色粗体无衬线标题 【Meta Quest 3】，下方配有较小的日文标语：「まったく新しい現実を、まったく新しい構造から。」。中心主体为高度精细的 3D 产品渲染图，呈现为工程拆解形式，包含 9 个编号层，每一层从上到下均匀分离，左侧配有 1 到 9 的蓝色圆形数字标记。9 个可见层分别为：1) 带有三个前置传感器/摄像头开口的白色外壳面板，2) 一排 3 个黑色追踪摄像头模块，3) 中心带有芯片及清晰可见的 Snapdragon XR2 Gen 2 处理器图形的主逻辑板，4) 一对带有鲜艳紫蓝色玻璃反射的大型 Pancake 透镜组件，5) 带有光学开口的黑色内部框架底盘，6) 带有发光蓝色装饰的电池/电子元件条，7) 两个白色铰接式侧带臂，8) 白色织物头带环，9) 底部的一个黑色柔软面部接口衬垫。在两侧添加带有细白边框和轻微透明度的圆角矩形标注框，每个标注框通过细白引导线连接到相应的层。共有 7 个功能标注框：左侧 3 个，右侧 4 个。左侧标注框从上到下依次为：「Snapdragon XR2 Gen 2」（配芯片图标及较小的日文正文）、「調整可能なIPD機構」（配光学调节图标及较小的日文正文）、「精密設計されたヘッドストラップ」（配头带图标及较小的日文正文）。右侧标注框从上到下依次为：「フェイスプレート」（配简单的面板图标及较小的日文正文）、「トラッキングカメラ」（配摄像头图标及较小的日文正文）、「パンケーキレンズ」（配双透镜图标及较小的日文正文）、「高性能バッテリー」（配电池图标及较小的日文正文），以及右下角标注框「柔らかなフェイスインターフェース」（配柔软衬垫图标及较小的日文正文）；保持整体视觉平衡且对称。在底部添加一个横跨大部分宽度的宽大白色圆角横幅。左侧放置一句醒目的蓝色日文声明：「体験は、構造から進化する。」，下方配有较小的黑色日文说明文字。横幅右侧放置蓝色 Meta 标志和“Meta”字标。采用类似 Apple 的时尚产品营销风格，超清晰 3D 渲染，柔和的摄影棚灯光，微妙的辉光，精确的阴影，光泽塑料质感，逼真的材质，极简布局，以及高端企业演示美学。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/11yDUoZ0Fb/预览图.webp","partial":false},{"id":319,"c":"08_图像分析信息拆解","t":"动物解剖工程蓝图","p":"对 【[在此输入对象]】 进行超精细的技术剖面图渲染，采用深色工程蓝图风格。剖视图精确展示了所有内部组件、层级和机械结构。每个部件均配有清晰的白色标注线、说明框和技术参数。顶部包含标题栏、材料/组件图例、尺寸规格，以及展示关键部分特写的微型细节插图。风格：专业技术插图与照片级真实感渲染相结合。布局密集，信息丰富。无留白。比例 1:1。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/11ybklrnar/预览图-1.webp","partial":false},{"id":340,"c":"08_图像分析信息拆解","t":"贴纸、代码与创造力——一部关于笔记本电脑的故事","p":"“Nano Banana”——一款用贴纸装饰的笔记本电脑。这款笔记本电脑属于一位开源机器学习模型（ML models）的爱好者。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/132f527b1e/预览图.webp","partial":false},{"id":412,"c":"08_图像分析信息拆解","t":"释放创造力：Hugging Face品牌笔记本电脑保护套","p":"制作一个笔记本电脑保护壳，上面贴着属于“Hugging Face”公司员工的贴纸。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1900c0eecf/预览图.webp","partial":false},{"id":442,"c":"08_图像分析信息拆解","t":"生成展示文字渲染能力的中文漫画","p":"创作一部全彩的中文漫画，讲述OpenAI的研究科学家陈博远（第一张图片）的故事。他致力于提升ChatGPT Image 2模型的文本渲染能力，为即将发布的版本做准备。背景中有一杯珍珠奶茶，以及一根用一小段胶带贴在墙上的香蕉。当陈博远尝试在电脑屏幕上生成一张关于他家乡无锡的详细且精美的多语言信息图海报时，模型竟然能够渲染出非常小的中文文字。他的辛勤工作得到了回报，团队对他的模型出色的多语言文本渲染效果印象深刻，看到了模型能够支持多种语言的显示能力。当他一边休息一边拿着手机时，收到了一条来自Sam Altman的翻译后的短信（第二张图片中的头像），Sam让他查看自己刚刚生成的多语言文本，以表达对团队的祝贺——因为Sam只会说英语。不过，让故事变得有趣的是：陈博远看到Sam生成的图片中出现了“稳稳地接住你”这句话，而这句话在原本用于表达祝贺的图片中显得格格不入。实际上，这句话在中文网络上被当作一个有趣的梗被广泛传播。陈博远应该会愤怒地喊道：“天呐！它又学会这个表达方式了！”（队友们则以小角色的形象出现在画面边缘，满头大汗地用中文说：“我们正在努力修复这个问题！”）在漫画的最底部添加一行极小的脚注（中文）：“注意：整部漫画，包括这条脚注和图片中的所有元素，都是使用GPT Image 2一次性生成的，没有经过任何编辑或多步骤处理。”\n额外要求：\n- 使用1440x2560像素的竖版图像布局。\n- 第一行描述陈博远努力工作的场景；\n- 第二行展示他在无锡使用该模型生成的多语言文本成果；\n- 第三行表现团队的兴奋之情；\n- 第四行分为左右两部分：左侧展示他休息时收到短信的场景，右侧展示Sam的短信内容；\n- 第五行展示Sam的照片以及陈博远的反应。\n- 除第一行外，漫画中不要有旁白。\n- 所有角色都应采用漫画风格。\n- 香蕉背景仅出现在第一幅画面中，胶带应使用一小段，不要使用交叉状的胶带；\n- 香蕉和胶带的装饰应非常简洁，作为隐藏的彩蛋供读者发现。\n- OpenAI的标志仅出现在陈博远的衣物上，其他地方不要出现。\n- 场景中不要出现杯子，因为已经有珍珠奶茶了；\n- Sam仅出现在短信面板中。\n- 整部漫画应呈现为漫画书中实体页面的专业照片效果。\n- 海报的右下角有一个小字说明：“极小中文也清晰可读：（此处为极小字号测试）无锡是作者的故乡，所以制作了这张海报，中文文本终于修复好了。很多年没回家了，好想吃大闸蟹啊！”（字体极小）。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1RwBRHIAOH/预览图.webp","partial":false},{"id":446,"c":"08_图像分析信息拆解","t":"超市AR购物助手：实时扫描商品信息与清单管理","p":"明亮超市货架或区域内的第一人称视角。逼真的人手将 {\"product name\" \"[产品名称]\"} 拿到靠近摄像头的位置。在自然的商店灯光下，产品的 [关键视觉特征：颜色、质地、包装、新鲜度细节] 清晰可见。\n{\"product name 2\" \"[产品名称]\"} 周围环绕着多层全息增强现实界面，显示相关产品信息，包括 [营养或产品数据，如卡路里、蛋白质/糖/咖啡因、维生素、新鲜度指示器、产地、有效期、使用或食谱建议]。\nAR UI 元素根据观看者的注视方向平滑地移动和重组，仿佛动态响应用户的焦点。在左侧余光中，可见一个垂直的半透明购物清单，上面有已勾选的商品，其中 {\"product name 3\" \"[产品名称]\"} 被高亮显示为当前活动的选择。\n超现实混合现实，简洁的未来感 AR 设计，玻璃状 UI 面板，柔和的环境光，逼真的光影，自然的景深，沉浸式第一人称界面，展示下一代零售技术。","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/1/1TjfIGYj9i/预览图-1.webp","partial":false},{"id":477,"c":
