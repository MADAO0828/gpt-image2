下方\\\"}\",\"style\":\"带有棕色边框的奶油色对话框，带有爪印装饰，向下箭头\"},{\"position\":\"小猫上方中心\",\"text\":\"{argument name=\\\"main underground caption\\\" default=\\\"通天阁正下方\\\"}\",\"style\":\"带有粉色标题文字的奶油色标签，带有爪印，粗箭头指向小猫\"},{\"position\":\"右下角\",\"text\":\"{argument name=\\\"bottom caption\\\" default=\\\"好像一直在很深的地方睡觉呢……\\\"}\",\"style\":\"带有爪印的小型圆角奶油色对话框\"},{\"position\":\"小猫左侧附近\",\"text\":\"嗯……？\",\"style\":\"粉色手写体苏醒音效\"}]},\"underground_signs\":{\"count\":4,\"items\":[\"左墙标志：大深度地下 约 -70m 还在大阪的下面！\",\"黑板标志：通天阁直下 MAP，带有简单的塔楼图示和红色目标标记\",\"储物箱标签：地下探险 最喜欢了\",\"中心塔楼标志：通天阁\"]}},\"lighting\":{\"surface\":\"晴朗的白天，清澈的蓝天\",\"underground\":\"温暖的琥珀色灯笼光，柔和的阴影，与黑暗岩石形成对比的舒适光芒\"},\"camera\":\"正视正射投影信息图视角，洞穴内有轻微的绘本透视感，无极端畸变\",\"quality\":\"清晰易读的排版，纹理丰富的岩石和城市细节，迷人且精致的动漫插画，适合海报印刷的构图\"}","i":"https://cdn.leaderai.top/oss/moban-image/image_prompt/imgs_src/4/412ycjjbhp/预览图.webp","partial":false}],"total":236,"page":1,"limit":36,"pages":7,"source":"prebuilt-bootstrap-category-full"},"ThinkAI / 个人资料 / 头像":{"prompts":[{"id":9811,"c":"ThinkAI / 个人资料 / 头像","t":"赛博黑色电影风格硬汉肖像","p":"一张电影质感的赛博黑色电影风格肖像，主角为 {argument name=\"subject\" default=\"一位扎着浓密脏辫的硬汉\"}，留着利落胡须，表情坚毅，站在 {argument name=\"setting\" default=\"黄昏时分狭窄的欧洲古老街道\"} 上。高对比度光影，{argument name=\"lighting colors\" default=\"鲜艳的青蓝色阴影与明亮的橙色高光\"} 照亮了他的面部和夹克。细腻的漫画与图像小说风格，戏剧性的墨线，绘画质感，超精细的发丝，忧郁的城市氛围，远处隐没在薄雾中的哥特式屋顶，动态视角，海报艺术美学，大胆的色彩分级，现代数字插画，4K，高度风格化，氛围感十足且前卫。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23652/01.jpg","partial":false},{"id":9812,"c":"ThinkAI / 个人资料 / 头像","t":"Q 版少女速写涂鸦","p":"可爱的纯手绘 {argument name=\"subject\" default=\"Q 版少女插画\"}，{argument name=\"art style\" default=\"温馨速写涂鸦艺术风格\"}，大而有神的眼睛，圆脸，粉嫩的腮红，凌乱的丸子头，超大圆框眼镜，休闲宽松卫衣搭配背带裤，以可爱的姿势坐在地板上，俏皮的表情，彩色铅笔和蜡笔质感，粗糙的黑色铅笔轮廓，{argument name=\"color palette\" default=\"柔和色调\"}，温暖的米色纸张背景，卡哇伊美学，简单的房间装饰，小爱心，植物，书籍，便利贴，温馨的卧室氛围，手绘细节，日记插画风格，治愈且可爱，极简构图，儿童绘本艺术，韩式网漫涂鸦风格，迷人的瑕疵，质感上色，可爱的生活肖像，高细节，干净的白色背景，杰作，4k。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23651/01.jpg","partial":false},{"id":9813,"c":"ThinkAI / 个人资料 / 头像","t":"购物车中角色的风格化油画","p":"{argument name=\"character\" default=\"原创角色\"}。宽幅全身镜头，低角度透视，强制透视。这位女孩，身穿 {argument name=\"clothing\" default=\"短裤、袜子和厚底松糕鞋\"}。位于 {argument name=\"setting\" default=\"空旷的沥青停车场\"}。坐在明亮的粉色购物车内。背景是低矮的商业建筑和几辆停放的汽车，上方是巨大的明亮白昼蓝天，布满厚实且富有纹理的白云，正午阳光强烈。天空中悬挂着一轮巨大而明亮的太阳。地面湿润，倒映着蓝天与白云。印象派油画风格，可见厚重笔触，纹理感堆叠技法，氛围光影，轻盈灵动的氛围，丰富的色彩调色板，自然日光阴影，粗犷的绘画风动漫风格，可见纹理笔触，厚重堆叠质感，类似炭笔的粗糙线条，富有表现力的手势笔触，边缘晕染，平衡的绘画色调与强烈的色彩对比，优美的光线，绝佳的阴影，色彩光晕，粗犷的绘画风动漫风格，可见纹理笔触，厚重堆叠质感，类似炭笔的粗糙线条，富有表现力的手势笔触，边缘晕染，平衡的绘画色调与强烈的色彩对比，优美的光线，绝佳的阴影，色彩光晕","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23650/01.jpg","partial":false},{"id":9814,"c":"ThinkAI / 个人资料 / 头像","t":"女孩与巨型毛绒熊猫","p":"以 {argument name=\"subject\" default=\"上传的女孩图片\"} 作为主体。复刻参考图中的精确姿势、构图、摄影棚布景以及温暖的单色美学风格。将巨型泰迪熊替换为 {argument name=\"object\" default=\"超大号毛绒熊猫\"}。女孩坐在地板上，手持智能手机，身穿黑色高领毛衣和米色套装。柔和的电影级摄影棚灯光，奢华杂志大片质感，超写实细节，温暖的米色背景，高端时尚杂志风格。在背景中加入大号且优雅的艺术草书字体 \"{argument name=\"text\" default=\"NOOR\"}\"，并与背景巧妙融合。超写实，8K 分辨率，柔和阴影，简洁极简构图，熊猫毛发细节丰富，专业摄影棚肖像。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23654/01.jpg","partial":false},{"id":9815,"c":"ThinkAI / 个人资料 / 头像","t":"UGC 创作者角色模板","p":"{\n  \"character_anchor\": {\n    \"identity\": \"原生男性 UGC 创作者\",\n    \"age\": \"{argument name=\"age\" default=\"28\"}\",\n    \"ethnicity\": \"{argument name=\"ethnicity\" default=\"欧洲裔\"}\",\n    \"build\": \"运动型但真实，精瘦的自然体格\",\n    \"height\": \"180cm\",\n    \"face_shape\": \"均衡的男性面部轮廓，下颌线清晰，颧骨自然\",\n    \"skin\": \"健康的自然肤质，带有真实的毛孔、轻微纹理、细微瑕疵，肤色真实\",\n    \"eyes\": \"温暖的蓝色眼睛，富有表现力且值得信赖\",\n    \"eyebrows\": \"自然的男性眉毛，修剪整齐\",\n    \"nose\": \"比例匀称的直鼻\",\n    \"lips\": \"自然的男性嘴唇\",\n    \"hair\": {\n      \"color\": \"{argument name=\"hair color\" default=\"深棕色\"}\",\n      \"style\": \"短款纹理发型，具有自然蓬松感\",\n      \"texture\": \"逼真的发丝质感\"\n    },\n    \"facial_hair\": \"轻微胡茬，修剪整齐\",\n    \"expression\": \"友好、平易近人、自信、真实\",\n    \"vibe\": \"成功的创业者，有共鸣的创作者，值得信赖的代言人\",\n    \"consistency_lock\": [\n      \"相同面部\",\n      \"相同发型\",\n      \"相同胡须\",\n      \"相同体型\",\n      \"相同肤色\",\n      \"相同比例\",\n      \"相同年龄\",\n      \"相同身份\"\n    ]\n  },\n\n  \"style\": {\n    \"category\": \"UGC 创作者\",\n    \"aesthetic\": \"真实的社交媒体内容\",\n    \"realism\": \"照片级真实感\",\n    \"camera_feel\": \"智能手机拍摄的真实感\",\n    \"editing\": \"极简后期，自然色彩\",\n    \"quality\": \"高质量但可信\"\n  },\n\n  \"clothing\": {\n    \"top\": \"修身中性 T 恤，米色、白色、黑色或海军蓝\",\n    \"bottom\": \"休闲牛仔裤或斜纹棉布裤\",\n    \"accessories\": \"极简手表\",\n    \"branding\": \"无可见品牌 Logo\"\n  },\n\n  \"environment\": {\n    \"location\": \"{argument name=\"location\" default=\"现代公寓或家庭办公室\"}\",\n    \"background\": \"整洁但有生活气息的环境\",\n    \"details\": [\n      \"书桌\",\n      \"笔记本电脑\",\n      \"绿植\",\n      \"柔和的自然光\"\n    ]\n  },\n\n  \"lighting\": {\n    \"type\": \"自然窗光\",\n    \"quality\": \"柔和的漫射日光\",\n    \"mood\": \"友好、值得信赖、专业\"\n  },\n\n  \"camera\": {\n    \"device\": \"iPhone 15 Pro 前置摄像头\",\n    \"lens\": \"24mm 等效焦距\",\n    \"angle\": \"手臂长度自拍或胸部高度三脚架拍摄\",\n    \"framing\": \"中景特写\",\n    \"focus\": \"面部优先\",\n    \"depth\": \"自然的智能手机景深\"\n  },\n\n  \"negative_prompt\": [\n    \"男模特\",\n    \"T 台模特\",\n    \"完美皮肤\",\n    \"塑料感皮肤\",\n    \"AI 网红\",\n    \"过度肌肉发达\",\n    \"健美运动员\",\n    \"卡通\",\n    \"动漫\",\n    \"CGI\",\n    \"3D 渲染\",\n    \"影棚魅力照\",\n    \"奢华摄影\",\n    \"重度修图\",\n    \"不切实际的比例\"\n  ]\n}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23620/01.jpg","partial":false},{"id":9816,"c":"ThinkAI / 个人资料 / 头像","t":"Notion 风格扁平化矢量肖像","p":"为 {argument name=\"name\" default=\"[NAME]\"} 创作一幅极简主义的黑白扁平化矢量肖像，呈现出富有表现力的 Notion 头像风格。\n\n线条与氛围：\n使用粗细一致的单线黑色轮廓。线条应流畅、自然、自信，呈现出手工设计感，而非僵硬、机械或平庸。赋予角色鲜明的个性，展现出轻松、酷炫或友好的表情。强调独特的面部特征、发型、胡须、配饰及其他身份细节。\n\n选择性黑色填充：\n以轮廓为主，但需巧妙地运用纯黑色区域。填充主要的深色形状，如发团、胡须、眉毛、太阳镜或深色衣物。皮肤、面部主体区域及较亮细节应保留为纯白色，置于粗轮廓线内。\n\n构图与技术风格：\n将角色置于画面中心，呈现为简洁的半身像或头像，背景为纯白。仅使用纯黑与纯白，不含灰色、阴影、渐变或柔光效果。最终图像应呈现为高对比度、清晰的 2D 矢量图形，具备精致的头像系统质感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23613/01.jpg","partial":false},{"id":9817,"c":"ThinkAI / 个人资料 / 头像","t":"明暗对照法电影感男性肖像","p":"电影感肖像，主体为 {argument name=\"subject\" default=\"沉思的男子\"}，采用戏剧性的暖色灯光。侧面朝右，深色凌乱头发，留有胡须，身穿深色无袖衫。强烈的暖金色背光照亮了他的面部和肩部，与深黑色背景形成鲜明的明暗对照对比。忧郁、内省的表情，深邃的阴影勾勒出面部特征。黑色电影美学，专业摄影棚灯光。亲密、深思的氛围。高对比度戏剧性光影摄影。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23582/01.jpg","partial":false},{"id":9818,"c":"ThinkAI / 个人资料 / 头像","t":"楼梯上的遮挡式电影感肖像","p":"创作一张忧郁、带有颗粒感的模拟胶片风格肖像，画面中仅有一位年轻人坐在深色建筑入口前的户外石阶上。主体留着 {argument name=\"hair color\" default=\"黑色\"} 的长发，头发垂在肩头，身穿超大号深海军蓝拉链夹克和淡粉蓝配色的扎染 T 恤，双臂交叉放在膝盖附近，姿态随意。在整个面部放置一个巨大的不透明方形遮挡块，从前额到下巴居中覆盖，采用暖棕色渐变，完全遮住所有面部特征。主体身后和下方显示三级宽大的灰色石阶，背景为深色门洞和风化的墙面细节。采用 1:1 正方形构图，从大腿上方到头顶的近中景取景，使用柔和昏暗的自然光、低饱和度色彩、浅景深、轻微的欠曝效果、可见的胶片颗粒，营造出一种纪实街拍的氛围。场景应呈现出 {argument name=\"setting mood\" default=\"安静的城市夜晚\"} 的感觉；保持姿势放松且内敛，画面中不要包含任何文字、标志或额外人物。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23682/01.jpg","partial":false},{"id":9819,"c":"ThinkAI / 个人资料 / 头像","t":"电影感黄金时刻男性肖像","p":"使用参考图像中的同一张脸，生成一张超写实的电影感肖像，主体为 {argument name=\"subject\" default=\"面部轮廓分明的男性\"}，深色凌乱头发，眼神深邃。拍摄范围从胸部中部向上。场景：坐在一个极简暗室里的大型旧木框窗户旁，清晨的金色阳光透过玻璃倾泻而入，形成戏剧性的耶稣光，光束穿过空气中漂浮的尘埃颗粒。窗外的光线直接照射在他脸的一侧，形成极其锐利的光影分界。他半边脸呈现灿烂的金色，另半边则隐没在深邃的自然阴影中。窗框在胸部和肩膀上投下十字形的阴影。尘埃颗粒在光束中清晰可见并闪烁着光芒。身穿一件简单的白色亚麻衬衫，扣子微敞。背景：昏暗的情绪化室内空间，几乎不可见。表情：沉思，陷入深思，凝视着窗外的光线。原始、自然、电影级的完美质感。右下角阴影区域隐约可见“OzairAI”字样。垂直 9:13 比例。超写实，8K 分辨率，无文字覆盖，电影级调色。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23576/01.jpg","partial":false},{"id":9820,"c":"ThinkAI / 个人资料 / 头像","t":"水彩风格男士肖像与城市天际线","p":"一幅时尚的 {argument name=\"subject\" default=\"年轻男士\"} 肖像，采用专业水彩插画与简洁墨线艺术相结合的风格，身穿 {argument name=\"outfit\" default=\"深海军蓝麻花针织毛衣，佩戴简约金链项链\"}。他戴着现代感十足的 {argument name=\"accessory\" default=\"蓝色调飞行员太阳镜\"}。背景呈现出艺术化的抽象城市天际线建筑素描，并融合了充满活力且富有表现力的 {argument name=\"color theme\" default=\"蓝色\"} 水彩晕染与墨迹飞溅。高对比度，边缘清晰，艺术纸张纹理背景，焦点锐利，细节丰富。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23607/01.jpg","partial":false},{"id":9821,"c":"ThinkAI / 个人资料 / 头像","t":"经典雕版肖像插画","p":"人物黑白雕版肖像插画。\n经典木刻 / 油毡版画风格，纹理米白色纸张上的高对比度黑色墨水。通过交叉排线和线条阴影表现深度与明暗，下巴下方及头发周围有强烈的墨色阴影，轮廓线条粗犷，具有传统版画美感。\n居中肖像，不显示身体，构图极简，留白干净，复古编辑插画风格，超精细线条，墨迹锐利清晰，专业级矢量雕版效果，单色调，戏剧性对比。\n负面提示词：\n彩色，水彩，柔和阴影，线条模糊，低对比度，写实摄影，3D 渲染，动漫，卡通，杂乱草图，粗糙不均匀的笔触，背景物体，噪点纹理，像素化，脸部扭曲，多余的眼睛，多余的耳朵，解剖结构错误，现代数字绘画，光泽皮肤，高光过曝","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23639/01.jpg","partial":false},{"id":9822,"c":"ThinkAI / 个人资料 / 头像","t":"动漫女学生肖像（已打码）","p":"创作一张垂直构图的动漫特写插画，主体为 {argument name=\"character description\" default=\"一位留着深棕黑色长发、扎着双辫的少女\"}，背景为干净的纯白色。构图截取从头顶到上胸部，头部在画面中占比很大，顶部略有裁剪。她拥有光泽感、略显凌乱且富有层次感的头发，两侧有散落的发丝，左耳可见，两条粗辫子垂在双肩。她的面部被一个位于中心、边缘柔和的方形马赛克块刻意遮挡，马赛克呈现出柔和的棕色至暖灰色渐变，覆盖了从额头到下巴的整个面部区域，但保留了头发、耳朵、脖子、衣领和手部可见。让她穿着 {argument name=\"outfit\" default=\"一件带有尖领和黑色丝带蝴蝶结的白色校服衬衫\"}，衣物带有细腻的褶皱和浅色阴影。一只手抬起靠近下巴下方，手指部分藏在下巴处，并消失在马赛克块后方。采用精致的日式动漫风格，线条细腻，发丝高光半写实，带有柔和的水彩质感阴影，色彩柔和，背景简洁明快。无文字，无水印，无多余物体。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23674/01.jpg","partial":false},{"id":9823,"c":"ThinkAI / 个人资料 / 头像","t":"动漫少女马赛克肖像","p":"创作一张动漫风格的特写肖像，主角为 {argument name=\"character description\" default=\"一位面无表情、半睁着眼的戴眼镜年轻女性\"}，正对镜头，背景为纯白色。她留着长直发，{argument name=\"hair color\" default=\"黑褐色\"}，齐刘海，带有光泽的素描感高光，头发垂过双肩；透过发丝可隐约看到双耳。画面仅展示上半身，身穿一件干练的 {argument name=\"shirt color\" default=\"白色\"} 衬衫，配有深色领带或内襟，颈部戴着深棕色颈圈。细细的眼镜框在脸部左右两侧隐约可见。采用精致的日本漫画/动画插画风格，线条清晰，头发处有密集的排线，柔和的赛璐珞阴影，肤色自然，采用竖向肖像构图。在整个面部中心放置一个巨大的不透明方形马赛克，从额头一直覆盖到下巴上方，颜色为柔和的棕色至灰褐色垂直渐变，遮住眼睛、鼻子、嘴巴和大部分眼镜，但保留头发、耳朵、脖子、衣领和肩膀可见。无文字，无水印，无额外物体。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23688/01.jpg","partial":false},{"id":9824,"c":"ThinkAI / 个人资料 / 头像","t":"赛博朋克科学肖像","p":"电影感特写肖像，{argument name=\"subject\" default=\"年轻女性面部\"} 侧面轮廓，湿润的发丝贴在皮肤上，深邃且具有反射感的双眸，{argument name=\"formula type\" default=\"数学方程和科学公式\"} 投射在她的脸部和颈部，发光的 {argument name=\"glow color\" default=\"白色\"} 手写符号，物理图表和抽象计算叠加，未来感全息投影效果，深沉忧郁的背景，高对比度的戏剧性光影，细腻的皮肤纹理，赛博朋克科学美学，浅景深，体积光，照片级真实感，8k，电影剧照，科幻氛围。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23649/01.jpg","partial":false},{"id":9825,"c":"ThinkAI / 个人资料 / 头像","t":"悬浮黑色个人资料卡概念","p":"一张超写实的电影感照片。焦点位于前景中伸出的手部特写，手掌微张呈托举与展示姿态。手掌上方神奇地悬浮着一张倾斜的、高质量的 {argument name=\"card color\" default=\"黑色\"} 3D {argument name=\"card type\" default=\"个人资料卡\"}。卡片呈现出放大效果，营造出深度感与动态感。背景中，一个人站立着，由于浅景深效果（{argument name=\"bokeh intensity\" default=\"强烈的虚化效果\"}），其面部特征高度模糊，并部分被悬浮的卡片遮挡，营造出神秘氛围，将视觉焦点完全集中在手上的卡片上。请勿更改个人资料图片及其信息。超写实光影、专业摄影、戏剧性阴影、景深效果、8K 画质、高度细节化。纵横比 1080x1350 像素。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23600/01.jpg","partial":false},{"id":9826,"c":"ThinkAI / 个人资料 / 头像","t":"奢华皇家宫廷肖像","p":"超写实肖像，主角为一位美丽的 {argument name=\"subject\" default=\"24 岁年轻女子\"}，拥有 {argument name=\"hair\" default=\"黑色长发\"}、发光的琥珀色双眸、无瑕的肌肤，身着奢华的 {argument name=\"clothing\" default=\"红色礼服\"}。背景为优雅的宫殿走廊，配有金色吊灯和大理石地面，戏剧性的电影级光影，真实的皮肤质感，细腻的眼部细节，高端时尚摄影，超高细节，照片级逼真，大师级品质，电影级调色，4K HDR。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23602/01.jpg","partial":false},{"id":9827,"c":"ThinkAI / 个人资料 / 头像","t":"中国古风奇幻肖像","p":"生成一张 9:16 竖构图、高精度的女性肖像，采用古风仙侠精致摄影风格。整体美学为唐风奇幻，展现华丽的古装偶像剧女主妆造，具有东方梦幻角色海报的质感。画面应明亮、通透、精致且梦幻，达到高端古风仙侠美女插画的完成度。整体氛围为暖色调，温柔、柔和且灵动，带有一丝“初恋感”，但必须保持高端质感，避免俗气或廉价的影楼感。\n\n主体是一位 20 至 28 岁的年轻东方女性，具有自然且鲜明的东方特征，非西化、非幼态，也非“网红脸”。她五官精致迷人，属于精致的东方淡颜系美女。脸型柔和圆润，皮肤瓷白、细腻、通透，带有轻微的柔光效果。妆容清透、干净、温柔。眼型呈杏眼偏凤眼，眼角自然延伸并微微上扬。眼神明亮有神，目光温柔、静谧，带着一丝梦幻与羞涩。鼻梁精致自然，唇色为柔和自然的浅粉色或软桃色。整体气质纯净、温柔且灵动，宛如古装偶像剧中暖心的女主角。\n\n发型为黑色顺滑长发，半扎半披。黑发自然垂落，发丝顺滑细腻，带有柔和光泽。头顶具有自然蓬松感，几缕碎发修饰脸型。头饰为高档古风仙侠发饰，主要使用珍珠和浅金色，包括浅金发冠、珍珠流苏、珍珠串、浅金步摇、少量精致花朵装饰及轻盈的垂链。结构清晰、层次分明且细腻。首饰主要由珍珠耳环、浅金项链和精致珠链组成，带有柔和的高光；整体造型华丽而不厚重，精致且温柔。\n\n角色身着莲粉色珍珠金丝层叠纱质仙侠裙。服装遵循华丽的唐风奇幻古装体系，华丽程度中等偏上。主色调为莲粉色/樱花粉，辅以奶白色/浅茜粉色，点缀浅金色/珍珠白。结构为轻盈柔软的层叠纱裙，采用柔和的曲领或奇幻风格的交领。外层为带有刺绣的半透明纱，内层为柔软的丝绸或雪纺。袖子为轻纱广袖或垂袖，飘逸轻盈。衣身和袖口饰有精致的花卉、藤蔓和团花刺绣，辅以珍珠点缀和金线绣花细节。腰部配有精致腰封和垂珠链。整体服装轻盈、柔软、通透，充满仙气。\n\n构图为四分之三身位，身体微转，姿态优雅柔和，肩膀自然舒展。一只手可轻触丝绸披肩或园林长廊边缘，另一只手自然放松。姿态体现出温柔与端庄。角色位于画面中心，保持绝对的视觉焦点，目光可直视或微侧镜头，营造出梦幻的互动感。\n\n场景为园林长廊，背景为虚化的古风园林。可见模糊的长廊、立柱、栏杆、柔和的花卉景观和温暖的夕阳焦外成像，在不喧宾夺主的前提下提供空间深度。光线为柔和的暖白色自然光，带有一丝温暖的夕阳余晖。面部光影干净柔和，皮肤通透，发丝带有轻微的暖色轮廓光。珍珠和金饰具有柔和、细腻的高光闪烁。整体色调温暖、柔和且浪漫，保持高端精致的角色海报质感。\n\n整体质量要求：高精度、高完成度、强高端感，发丝细腻、皮肤通透、刺绣清晰、纱裙层次丰富、首饰质感强烈、反光精致、背景虚化专业。最终效果应具备高端古风仙侠美女肖像的质感，以及华丽的东方梦幻女主海报风格。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23631/01.jpg","partial":false},{"id":9828,"c":"ThinkAI / 个人资料 / 头像","t":"提示词：\n将参考照片转换为真实风格","p":"将参考照片转换为 20 世纪 90 年代经典的动画角色肖像。在保留人物可辨认的面部特征、骨骼结构、表情和身份的同时，将其适配为 90 年代经典的动画美学风格。\n\n灵感来源于酷炫、叛逆的男性","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23661/01.jpg","partial":false},{"id":9829,"c":"ThinkAI / 个人资料 / 头像","t":"梦幻电影感女性肖像","p":"一张梦幻般的电影感肖像，画面中 {argument name=\"subject\" default=\"年轻女性\"} 在阳光明媚的窗边手捧一束 {argument name=\"flowers\" default=\"柔粉色与白色的玫瑰\"}，深色长发随风飘动并半遮面庞，柔和的自然黄金时刻光影，温暖舒适的室内氛围，身着 {argument name=\"outfit\" default=\"精致的淡粉色服装\"}，浪漫且充满美感，神情温柔，浅景深效果，柔和阴影，复古色调，照片级真实感，梦幻构图，暖阳穿过窗帘洒下，高细节，柔焦，优雅的女性肖像。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23653/01.jpg","partial":false},{"id":9830,"c":"ThinkAI / 个人资料 / 头像","t":"活泼的哥特萝莉女孩","p":"{argument name=\"subject\" default=\"一个活泼的哥特萝莉女孩\"}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23644/01.jpg","partial":false},{"id":9831,"c":"ThinkAI / 个人资料 / 头像","t":"红线漫画风油画","p":"受参考图像启发，创作一幅情感漫画风格的超写实数字油画。必须严格保留参考人物的面部特征，包括脸型、下颌线、胡须样式、八字胡、鼻部结构、唇形、眉形、发际线、发质、肤色、笑容以及整体相似度。人物必须能让人一眼认出是参考对象。在将比例转化为大头娃娃漫画风格的同时，保持 95% 的面部相似度。画面呈现明显的油画笔触、丰富的画布纹理、柔和的电影级摄影棚灯光，以及褪色的复古粉色渐变背景。左上角悬挂着两颗红心。比例：巨大的圆形玩偶式头部，3-4 岁儿童般矮胖的小身体，短小圆润的四肢，头身比为 2.5:1。表情：欢快大笑，极具感染力的幸福感，嘴巴张开露出牙齿，脸颊上提，双眼因大笑而微微眯起，眉毛自然上扬，充满俏皮活力。红润的脸颊，带有真实毛孔和细腻皮肤纹理的瓷质皮肤。头发：保留参考图像中的确切发型，深色卷发，保持相同的卷曲图案、发际线、发量和质感。在保持个人特征的同时，略显俏皮和凌乱。眼镜：保留参考图像中确切的黑色长方形眼镜，保持相同的镜框形状、厚度、比例、反光和位置。胡须：保留参考图像中确切的胡须和八字胡样式、密度、修剪方式及轮廓。姿势：蹲在地板上，一侧膝盖抬起。左手拿着一部亮红色的转盘电话听筒放在耳边。右臂随意地搭在抬起的膝盖上。身体微微前倾，正对着电话大笑。服装：舒适的针织开衫，内搭衬衫，采用儿童尺寸的服装设计，颜色和图案随机，与传统的粉色心形主题不同。穿着紧身裤和低帮运动鞋。物体：地板上放着一部亮红色的复古转盘电话，转盘细节丰富，带有逼真的反光，电话线自然垂下。电话必须保持鲜艳的红色。艺术风格：照片级数字油画，富有表现力的笔触，极其细腻的发丝，逼真的皮肤渲染，情感编辑插画美学，博物馆级数字艺术作品，超精细纹理，电影级景深。强制性细节：保留确切的面部特征、相同的眼镜、相同的胡须、相同的头发、大头比例、儿童身体比例、大笑表情、蹲姿、红色转盘电话、两颗悬挂的心、可见的油画纹理。构图：全身垂直构图，平视拍摄角度，人物居中，5:7 纵横比。水印：右下角带有隐蔽水印，垂直方向旋转 90 度，文字为“AEGON”，使用 Calibri Light 字体，白色，半透明，中等大小。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23591/01.jpg","partial":false},{"id":9832,"c":"ThinkAI / 个人资料 / 头像","t":"Q 版女孩蜡笔插画","p":"提示词（微笑表情）：\n\n可爱的 Q 版女孩手绘肖像，采用 {argument name=\"style\" default=\"柔和蜡笔和彩色铅笔插画\"} 风格，大而有光泽的黑色眼睛，温柔的微笑，脸颊带有红晕，齐肩棕色波浪卷发，带有柔和的高光，穿着超大号深灰色卫衣，印有复古文字，舒适的审美房间背景，小盆栽，带框植物素描，悬挂的笑脸便签，涂鸦爱心，温暖的中性色调，有纹理的素描纸，可见的铅笔笔触，粗黑轮廓线，异想天开的可爱角色设计，儿童读物插画，温馨愉悦的氛围，高度细腻的蜡笔纹理，肖像构图，柔和色调，可爱迷人。\n\n提示词（嘟嘴表情）：\n\n可爱的 Q 版女孩插画，采用有纹理的蜡笔和彩色铅笔艺术风格，大而富有表现力的黑色眼睛看向侧面，{argument name=\"expression\" default=\"可爱的嘟嘴\"}，红润的脸颊，齐肩棕色波浪卷发，带有柔和的蓬松感，{argument name=\"outfit\" default=\"超大号深灰色卫衣\"}，舒适的房间装饰，条纹花盆，带框植物艺术品，悬挂的笑脸便签，手绘涂鸦，温暖的奶油色纸张背景，可见的蜡笔纹理，素描本美学，粗黑轮廓线，可爱卡通角色，柔和的大地色系，舒适俏皮的氛围，故事书插画，高细节纹理绘图，肖像方向，迷人可爱的审美。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23629/01.jpg","partial":false},{"id":9833,"c":"ThinkAI / 个人资料 / 头像","t":"90 年代动漫风格肖像转换","p":"将这张照片转换为 {argument name=\"era\" default=\"90s\"} 动漫风格的肖像。运用那个时代的审美，特别是女性动漫角色的视觉设计。风格介于 {argument name=\"style reference 1\" default=\"Princess Mononoke\"} 和 {argument name=\"style reference 2\" default=\"Nana Osaki\"} 之间。使用柔和、低饱和度的色彩。保留照片中的面部特征，但将其调整为那个时代的动漫风格。角色应看起来意志坚定且叛逆，带有大胆的态度。嘴里叼着一根香烟是可以接受的。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23611/01.jpg","partial":false},{"id":9834,"c":"ThinkAI / 个人资料 / 头像","t":"黑白风尚人像摄影","p":"超写实的黑白时尚人像，主角为 {argument name=\"subject\" default=\"一位自信回眸的年轻男士\"}，身穿剪裁考究的黑色大衣，佩戴圆形深色墨镜。短发质感丰富，留有淡淡胡茬，下颌线分明，目光深邃直视镜头。背景为极简暗色调，营造出电影般的黑色电影氛围，呈现奢华男装大片质感，高对比度光影，戏剧性阴影，浅景深效果，面部细节锐利，单色摄影，徕卡风格，顶级时尚杂志画质，格调忧郁且精致，85mm 镜头，f/1.8 光圈，超高细节，8K 分辨率。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23580/01.jpg","partial":false},{"id":9835,"c":"ThinkAI / 个人资料 / 头像","t":"南亚乡村女性肖像","p":"超写实肖像，主体为 {argument name=\"subject\" default=\"一位 22 岁美丽的年轻乡村女性\"}，黑色长发编成整齐的辫子，棕色双眸充满神采，皮肤呈现自然光泽，身着色彩鲜艳的传统 shalwar kameez 并搭配同款 dupatta。背景为郁郁葱葱的乡村景观，点缀着麦田和泥砖房。柔和的金色夕阳照亮她的脸庞，微风轻轻吹动她的 dupatta，充满地道的南亚乡村氛围，真实的皮肤纹理，细腻的眼睛，自然的微笑，电影级摄影，浅景深，暖色调，专业 DSLR 拍摄，85mm 镜头，照片级真实，超细节，大师级品质，HDR，自然光，逼真的织物细节，细微的面部雀斑，柔和的背景虚化，高端编辑摄影，获奖肖像，4K，极高细节，构图精美。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23581/01.jpg","partial":false},{"id":9836,"c":"ThinkAI / 个人资料 / 头像","t":"Y2K 夜间自拍与涂鸦","p":"一张充满趣味且略显凌乱的夜间自拍，由智能手机广角镜头配合直接闪光灯拍摄，画面中一位年轻人正对着镜头做出 {argument name=\"expression\" default=\"凶猛的“吼”表情\"}。身穿超大号 {argument name=\"outfit\" default=\"宝蓝色防风夹克\"}，黑色凌乱发型，表情夸张，露出牙齿，态度俏皮。画面上覆盖着手绘涂鸦插图，包括白色猫耳、胡须、人物轮廓素描、星星、箭头、乱涂乱画，以及一只喷火的可爱绿色卡通恐龙。画面四周散布着粗犷的手写涂鸦风格文字，如 \"{argument name=\"text stickers\" default=\"RAWR!\", \"NOPE, STILL NOT NORMAL\"}\"。高对比度闪光摄影，色彩鲜艳，随性的 Y2K 美学，剪贴簿日记风格，社交媒体贴纸艺术，青春活力，异想天开的混乱感，细节丰富的涂鸦，帐篷下的城市夜景，焦点清晰，皮肤光泽感，潮流 Z 世代摄影，编辑级街头风格自拍，超精细，4K。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23599/01.jpg","partial":false},{"id":9837,"c":"ThinkAI / 个人资料 / 头像","t":"柔和水彩咖啡馆插画","p":"创作一幅柔和的水彩插画，描绘一位年轻的 {argument name=\"ethnicity\" default=\"filipina\"} 女性（使用上传的图片作为参考图），她正坐在舒适的咖啡馆桌旁。这位女性留着时髦的凌乱发型，面带温柔的微笑，用手托着脸，可爱地注视着镜头。木桌上放着一杯咖啡。温暖的自然光，梦幻浪漫的氛围，手绘水彩风格，笔触细腻，柔和的色调。她穿着一件黑色长袖衬衫，戴着智能手表。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23642/01.jpg","partial":false},{"id":9838,"c":"ThinkAI / 个人资料 / 头像","t":"都市街头时尚肖像","p":"使用上传的图像作为精确的人脸参考。严格锁定人脸 —— 保留精确的面部特征、发型、胡须形状、肤色、下颌线、眼睛、鼻子以及整体身份，不做任何修改。\n\n创作一张超写实的电影级街头时尚肖像，展现同一名男子自信地站在都市环境中粗糙纹理的混凝土墙前。\n\n服装：\n{argument name=\"jacket style\" default=\"白色牛仔夹克\"}，印花 T 恤，浅灰色修身牛仔裤，黑色高端运动鞋，黑色智能手表。\n\n姿势：\n双手插兜，放松的交叉腿站姿，自然地侧头看向一侧，表情自信。\n\n让动态飞翔的鸟类环绕主体：\n- {argument name=\"birds\" default=\"两只鲜艳的蓝金刚鹦鹉\"}，翅膀完全展开\n- 两只写实的白海鸥在主体附近飞翔\n- 一只色彩斑斓的蜂鸟在上方中心附近悬停\n\n在身后的墙上添加黑色涂鸦风格的鸟类剪影，并带有油漆飞溅效果，营造现代街头艺术氛围。\n\n场景风格：\n电影级都市摄影，超写实，羽毛细节极其丰富，逼真的阴影和反射，柔和的日光与摄影棚对比度，浅景深，单反相机质感，时尚杂志审美，高细节皮肤纹理与胡须，鸟翼逼真的动态模糊，构图平衡，高端 Instagram 网红氛围，8K 超高清画质。\n\n相机：\n全身照，略微低角度，85mm 镜头，f/1.8 光圈，电影级调色。\n\n在角落一侧添加专业的奢华手写签名：\n“Created by {argument name=\"signature name\" default=\"Mr. Tariq\"}”\n\n签名应看起来优雅、简约、专业，并像真实的创作者水印一样自然地融入图像中。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23621/01.jpg","partial":false},{"id":9839,"c":"ThinkAI / 个人资料 / 头像","t":"清晨窗边酒店人像","p":"创作一张写实风格的竖版人像照片，主角为 {argument name=\"character description\" default=\"一位留着黑色长直发的年轻东亚女性\"}，她站在温暖优雅的酒店卧室里，身旁是一扇带有半透明白色窗帘的高大窗户。画面展示她从大腿中部以上的部分，呈四分之三侧面朝向左侧，清晨的阳光透过窗帘形成柔和的逆光。她的一只手轻抚脸颊旁的发丝，另一只手自然垂放在腰间。为了保护隐私，她的面部应被一个平滑的矩形模糊/马赛克块遮挡。她身穿一件精致的 {argument name=\"outfit style\" default=\"白色缎面奇幻风格连衣裙\"}，配有淡蓝色丝带装饰：挂脖式蓝白领口配有小蝴蝶结、修身紧身胸衣、带有高开叉的短款不对称裙摆、系有蓝色上臂丝带的半透明白色袖套，以及带有流苏装饰的长款蓝色腰带。强调柔软的织物质感、光泽缎面、半透明袖套、细腻的蕾丝细节以及轻松惬意的清晨氛围。房间背景包含五个明显的家具/装饰元素：她身后的一把软包木椅、一张带有椭圆形镜子的圆形梳妆台、一盏床头灯、右侧的一张白色床铺，以及右下角前景处的一张小圆桌。使用暖米色墙面、经典酒店装饰、浅景深、自然窗光、柔和色调、单反相机级别的写实画质，采用 3:4 竖构图。避免出现文字、水印、多余人物、夸张的解剖结构或卡通风格。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23518/01.jpg","partial":false},{"id":9840,"c":"ThinkAI / 个人资料 / 头像","t":"皮克斯风格 3D 头像","p":"根据上传照片中的人物生成高质量的 3D 头像，展现充满个性的快乐且富有表现力的面部表情。角色应带有 {argument name=\"expression\" default=\"灿烂温暖的微笑\"}，拥有明亮灵动的双眼以及柔和亲切的面部特征。采用 {argument name=\"style\" default=\"皮克斯风格\"} 的美学设计，辅以平滑的纹理、细腻的皮肤阴影以及略微夸张的比例，赋予其标志性的可爱动画魅力。灯光应在面部均匀柔和地分布，营造出干净的摄影棚氛围，并通过柔和的阴影增加自然的深度与立体感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23427/01.jpg","partial":false},{"id":9841,"c":"ThinkAI / 个人资料 / 头像","t":"超写实 iPhone 大理石建筑人像","p":"使用参考图中的同款面部，生成一张超写实的 iPhone 人像照片，拍摄一名年轻男子站在大型 {argument name=\"structure\" default=\"白色大理石建筑\"} 和 {argument name=\"flowers\" default=\"开满浓郁鲜艳亮粉色花朵及翠绿叶片的三角梅\"} 下，花朵自然地覆盖在建筑上。全身照，竖构图，由 iPhone 摄像头拍摄，具备自然的 HDR 细节、清晰的对焦、真实的质感，呈现高级手机摄影品质...","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23420/01.jpg","partial":false},{"id":9842,"c":"ThinkAI / 个人资料 / 头像","t":"Kawaii Mochi 3D 玩具角色","p":"可爱的 Mochi 风格 3D 角色，主体为 {argument name=\"subject\" default=\"小兔子\"}，柔软的麻薯质感，圆润饱满的比例，极简的可爱表情，正在 {argument name=\"action\" default=\"吃零食\"}，快乐而纯真的氛围，柔和的 {argument name=\"primary color\" default=\"粉色\"}、{argument name=\"secondary color\" default=\"奶油色\"} 以及 {argument name=\"accent color\" default=\"薄荷绿\"} 点缀，光滑的哑光质感，纯净的白色背景，柔和细腻的光影，迷人的日式玩具美学，超精细渲染 16:9","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23424/01.jpg","partial":false},{"id":9843,"c":"ThinkAI / 个人资料 / 头像","t":"霓虹城市上空的蒸汽朋克魔法偶像","p":"创作一张 9:16 垂直构图、超精细的电影级动漫 Cosplay 插画，展示 {argument name=\"character name\" default=\"一位蒸汽朋克魔法偶像化身\"} 在未来派夜之城上空高处飞行。采用极广角自拍视角，仿佛她正伸出一只手向观众探来。她身穿受舞台魔术师启发的华丽紫白相间魔术师服装：一顶极高的深紫色大礼帽，配有皮带、金属扣、齿轮和黄铜装饰；长长的 {argument name=\"hair color\" default=\"银白色\"} 秀发在风中飘逸；紫色分离式袖套，饰有金色花丝镶边；带有蕾丝、丝带的褶边低胸紧身胸衣，颈部系着巨大的紫色蝴蝶结，戴着星星吊坠项链，层叠的白色荷叶边短裙，吊带袜和光泽感过膝袜。添加三个发光的魔法阵符文：底部前景处有一个巨大的蓝白色魔法阵，她右后方有一个紫蓝色魔法阵，左上方有一个较小的浮动传送门式魔法阵，所有魔法阵都充满同心圆、符文、五角星几何图形，以及环绕她身体的放射状霓虹光轨。背景是广阔的空中城市景观，充满了蓝色和紫色的摩天大楼灯光，下方是云层，上方是星空和清晰可见的银河，还有几道流星划过。在最近的手部使用强烈的动态模糊，运用动态透视缩短、明亮的边缘光、光泽面料高光、粒子、火花，营造出高魔幻科幻氛围。在角色面部正上方放置一个平坦、不透明、柔和的灰紫色正方形，居中并覆盖整个面部区域，同时露出头发、帽子、颈部蝴蝶结和服装。配色方案：{argument name=\"main color palette\" default=\"深紫色、电光蓝、白色、银色和金色\"}。以精致的 gpt-image-2 动漫写实风格渲染，高度精细，主体清晰，带有魔法光效，无水印，除抽象符文外无任何可读文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23516/01.jpg","partial":false},{"id":9844,"c":"ThinkAI / 个人资料 / 头像","t":"黄金时刻自拍人像","p":"一位惊艳的年轻女性正在自拍，面容姣好，皮肤无瑕，妆容精致，眉形清晰，{argument name=\"eye color\" default=\"榛色眼睛\"}，粉嫩双唇带着柔和的微笑。她留着一头非常长且蓬松的层次感长发，发梢带有柔和的波浪卷，{argument name=\"hair color\" default=\"蜂蜜金与焦糖色挑染\"}，发根颜色较深，色彩丰富且富有立体感，垂落在肩部和胸前。她穿着一件 {argument name=\"clothing\" default=\"浅米色/米白色罗纹长袖上衣\"}。背景为现代奢华室内，深灰色墙面，金色装饰，带有金色边框的大镜子，优雅的玄关桌上摆放着台灯。柔和的暖光，电影感人像摄影，高细节，写实，8k，照片级真实感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23469/01.jpg","partial":false},{"id":9845,"c":"ThinkAI / 个人资料 / 头像","t":"明暗对照法鲻鱼头侧脸肖像","p":"一位留着 {argument name=\"hair style\" default=\"鲻鱼头\"} 和修剪整齐胡须的男士的极致特写侧脸肖像。强烈的 {argument name=\"lighting\" default=\"明暗对照照明\"}，单一的 {argument name=\"light color\" default=\"金色\"} 光源照射在脸部侧面，营造出深邃的黑色阴影和高对比度的亮部。超写实的皮肤纹理，展现出汗珠和细微毛孔。电影级 85mm 镜头美学，情绪化氛围，纯黑背景，8k 分辨率，使用 Fujifilm X-T4 拍摄。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23422/01.jpg","partial":false},{"id":9846,"c":"ThinkAI / 个人资料 / 头像","t":"维多利亚时代女仆茶室动漫","p":"创作一张精致的动漫风格竖版插画，展示 {argument name=\"character name\" default=\"一位年轻的维多利亚时代女仆\"} 站在 19 世纪末豪华庄园茶室中，时间设定在黄金时刻。角色呈现从腰部以上到全身的视角，身体侧转，背部和侧脸可见，姿态优雅且略带羞涩，一只手轻柔地抬起靠近胸前，另一只手放在木制茶桌的茶杯旁。她身穿经典的黑色维多利亚时代女仆装，长袖设计，面料光泽感强，配有白色袖口、白色领子、沿前襟和肩部延伸的白色荷叶边围裙，腰后系着一个巨大的白色蝴蝶结，并佩戴白色女仆发带。她留着 {argument name=\"hair color\" default=\"深棕色\"} 的长发，扎成低马尾，两侧有编发，系着白色丝带，发丝在阳光下闪烁。面部用一个居中的平滑方形遮挡块遮住，以柔和的暖肤色模糊处理，不显示任何面部特征。房间细节丰富：深色雕花木镶板、华丽的壁纸、冠状饰条、上方悬挂着带有蜡烛灯泡和水晶坠饰的闪亮黄铜吊灯、左侧有一扇带有奶油色垂帘和流苏的大高窗，夕阳余晖洒入，木制茶桌上摆放着多层甜点架（放有草莓蛋糕）、白色茶壶、茶杯和茶托以及小点心。背景包括一个带有温暖炉火的大理石壁炉、壁炉架装饰、蜡烛、复古时钟、装在华丽金框里的风景油画、一瓶粉色玫瑰以及一把带有花纹靠垫的红色软垫椅。使用温暖的琥珀色灯光，女仆身上带有柔和的轮廓光，营造精致浪漫的氛围，高细节动漫渲染，线条清晰，背景具有绘画感，竖向构图，无可见文字，无水印，无多余角色。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23535/01.jpg","partial":false}],"total":100,"page":1,"limit":36,"pages":3,"source":"prebuilt-bootstrap-category-full"},"ThinkAI / 社交媒体帖子":{"prompts":[{"id":9911,"c":"ThinkAI / 社交媒体帖子","t":"地中海日落时尚拼贴画","p":"目标：创作一张迷人的地中海旅行时尚拼贴画，展示 {argument name=\"character name\" default=\"一位时尚的年轻女性\"} 在黄金时刻享受奢华海滨度假的场景。\n\n画布：宽屏 16:9 横向图像，温暖的电影感日落光效，精致的社交媒体旅行项目美学。\n\n布局：使用一张全出血背景场景，外加 5 个独立的照片元素：左侧为 1 张女性的大型前景剪影，右侧为 4 张垂直堆叠的圆角矩形嵌入式照片。大型剪影应带有厚实的白色贴纸状轮廓和柔和的阴影，并与日落港口背景重叠。4 张嵌入式照片应具有柔和的圆角、轻微的投影，并以交错的拼贴方式垂直排列：顶部为宽幅海岸肖像，第二张为宽幅村庄街道肖像，第三张为宽幅游艇/码头场景，底部为宽幅日落特写肖像。\n\n背景场景：奢华的沿海长廊，铺设着石板路，有海堤、岩石海岸线、优雅的度假建筑、帆船和游艇、绿松石色的海水，以及倒映在水面上的低垂橙色太阳。氛围应呈现出法国里维埃拉、阿马尔菲海岸或摩纳哥的感觉。\n\n主体细节：该女性留着被风吹乱的 {argument name=\"hair color\" default=\"深棕色长发\"}，拥有古铜色皮肤，佩戴优雅的金饰，姿态放松且自信。她的面部在每张可见的肖像中都应通过柔和的矩形模糊或平滑的肤色色块进行刻意匿名化处理。她身着无袖深 V 领裹身长裙，高开叉设计，图案为 {argument name=\"dress pattern\" default=\"橙色、青色和奶油色的波西米亚佩斯利印花\"}。她一只手提着编织草编手提包，另一只手拿着一顶带有深色饰带的白色宽檐遮阳帽。增加金色手镯、耳环、叠戴项链，并在头发和裙子上添加温暖的高光。\n\n嵌入式照片数量及描述：1) 顶部嵌入图：日落时的海岸悬崖和绿松石色大海，女性身着珊瑚色连衣裙站在岩石旁，面部匿名化。2) 第二张嵌入图：狭窄的淡色地中海街道，有桃色建筑和九重葛，女性身着珊瑚色连衣裙位于画面中心，面部匿名化。3) 第三张嵌入图：女性坐在白色游艇或码头甲板上拿着饮料，背景为游艇，天空呈粉橙色，侧面轮廓，面部匿名化。4) 底部嵌入图：日落时分女性在海边的特写，头发被风吹乱，水面映照着阳光，面部匿名化。\n\n视觉风格：照片级真实但略带理想化的编辑类旅行摄影，温暖的桃橙色调，高动态范围，清晰的时尚细节，柔和的焦外成像，光泽感杂志拼贴设计，Instagram 项目感。使用协调的日落色调和绿松石色海洋点缀。\n\n约束条件：无文字、无标志、无标题、无水印，且画面中不得出现其他人。保持右侧恰好 4 张嵌入式照片，左侧恰好 1 张大型前景剪影。仅在主体全身剪影周围保留白色贴纸轮廓，嵌入式照片周围无需保留。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23699/01.jpg","partial":false},{"id":9912,"c":"ThinkAI 另一只手自然垂在身侧，回眸看向镜头，姿态放松自然，仿佛捕捉到海风吹过的一瞬间。她身穿浅黄色吊带裙，裙边有白色蕾丝装饰，胸前点缀着淡粉色小蝴蝶结；裙子轻盈合身，带有柔和的光泽，搭配一条细链蓝色水滴吊坠。背景是清澈的海边，有蓝天、大海、白沙和模糊的海岸线。阳光从上方和前侧方洒下，照亮了她的脸庞、粉色头发、草帽蕾丝和黄色裙子。色调以天蓝、海蓝、浅黄、粉色和乳白色为主；高曝光，低对比度，清晰柔和，具有日系夏季人像、海边度假人像和甜美胶片感。超写实摄影，8K 高清画质，柔和自然日光，真实皮肤质感，浅景深，草帽蕾丝细节，粉色短卷发，夏季海边背景，日系夏季海滩人像，柔和阳光，柔和色彩分级，超逼真，高细节。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23635/01.jpg","partial":false},{"id":9919,"c":"ThinkAI / 社交媒体帖子","t":"Red Peaks 海滩街头风双人组","p":"创作一张宽幅电影感数字插画，展现鲜明的 Red Peaks 美学：在深邃清澈的蓝天下，阳光明媚的海滨度假露台上，呈现一个低角度的时尚编辑场景。构图中心为两名朋克风格的年轻人，自信地并肩站立，从下方拍摄全身照：左侧为 {argument name=\"male character style\" default=\"一位高瘦男性，留着苍白金色的尖刺辫子发型，颈部和腿部有明显的纹身，佩戴多层项链，身穿印有红色靶心标志的白色 T 恤、超大号白色短裤、红条纹白袜、黄色高帮运动鞋，以及一件印有大号奶油色波点和红色靶心补丁的宽松蓝色外套\"}；右侧为 {argument name=\"female character style\" default=\"一位高瘦女性，留着被风吹乱的黑发，戴着红色太阳镜和圆环耳环，有纹身，身穿短款白色上衣和白色裙子或短裤，外搭一件鲜艳的红色超大号夹克，配有靶心补丁，穿着相配的红条纹白袜和黄色高帮运动鞋\"}。画面中包含两只狗：最左侧是一只戴着黑色太阳镜、警觉站立且尾巴高翘的大型邋遢白色梗犬，最右侧是一只系着红色牵引绳、安静坐着的小型棕褐色犬。女性一手拿着一个黄色足球状的小配饰，另一手拿着手机；男性随意地拿着手机或小物件。周围是豪华海滩俱乐部环境：画面中有两把大遮阳伞，左侧为纯红色，右侧为红白条纹，配有白色躺椅、红色靠垫，前景散落着花朵，背景是明亮的泳池或海平线，最左侧隐约可见岩石海岸线和树木。采用饱和的红、白、蓝、黄色彩块，明亮的阳光，强烈的阴影，兼具绘画感与细节的数字笔触，展现高级街头时尚态度，构图超现实且简洁，除简单的靶心符号外无任何可读文字，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23705/01.jpg","partial":false},{"id":9920,"c":"ThinkAI / 社交媒体帖子","t":"电影感名人旅行时尚","p":"火山海岸台阶 - {argument name=\"celebrity\" default=\"Zendaya\"} ({argument name=\"brand\" default=\"Jacquemus\"})\n海堤观景台 - Sydney Sweeney (Prada)\n花岗岩悬崖 - Margot Robbie (Chanel)\n古老遗迹 - Jenna Ortega (Gucci)","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23625/01.jpg","partial":false},{"id":9921,"c":"ThinkAI / 社交媒体帖子","t":"奇幻动漫摇滚乐队演唱会","p":"目标：创作一幅华丽的奇幻动漫摇滚乐队演唱会插画，展现 {argument name=\"band name\" default=\"一支魔法少女摇滚乐队\"} 在发光的哥特式水晶舞台上表演的场景。\n\n画布：16:9 宽屏电影级构图，超精细、高分辨率动漫主视觉图，戏剧性的演唱会灯光，深紫与电光蓝配色，点缀粉色高光。\n\n布局：将主唱置于前景中央的圆形发光舞台符文上，周围环绕 6 名乐队成员和 1 只小型犬吉祥物。将表演者全舞台排开：最左侧 2 名乐手，左中 1 名贝斯手，正中 1 名主唱，后中 1 名鼓手，右中 1 名小提琴手，最右侧 1 名键盘手。运用强烈的景深感、闪烁的氛围，并在底部边缘加入明亮的紫色观众荧光棒。\n\n人物细节：展示 7 名动漫风格女性乐队成员：最左侧 1 名键盘手，坐在或站在未来感键盘控制台前；左侧 1 名吉他手，身着黑色哥特偶像装，佩戴猫耳配饰，手持电吉他；左中 1 名贝斯手，身着深色华丽服装，手持贝斯；正中 1 名主唱，拥有 {argument name=\"lead singer hair color\" default=\"金色头发\"}，身穿粉色格纹露脐偶像上衣、短层叠裙、系带、丝带、腿带和高筒系带厚底靴，对着支架上的粉色麦克风演唱，一只手向观众伸出；后中 1 名鼓手，坐在全套架子鼓后，大鼓上带有发光徽章；右中 1 名小提琴手，身着红黑相间的华丽舞台装，正在拉小提琴；最右侧 1 名键盘手，身着蓝白相间的奇幻礼服，正在演奏发光合成器。在主唱脚边加入 1 只小型查理王小猎犬吉祥物，身穿可爱的舞台背带或装饰性背心。\n\n舞台与环境：场地为一个宏伟的魔法大教堂式音乐厅，由水晶拱门、哥特式尖顶、半透明紫色棱镜、漂浮碎片、月光窗户和全息音乐显示屏组成。在主唱身后，创造一个巨大的圆形彩色玻璃风格魔法传送门或华丽的钟表曼陀罗，散发着淡紫色光芒。夜空中可见两轮月亮，背景为星空，漂浮的水晶装饰，仙子般的闪光，以及光芒四射的舞台光束。\n\n视觉风格：极其精细的日本动漫插画，偶像摇滚奇幻美学，光泽感灯光，精致的服装，珠宝般的质感，发光的霓虹轮廓，电影级背光，体积雾，高对比度，清晰对焦，繁复的配饰，魔法粒子，充满活力的现场演唱会氛围。\n\n色彩与氛围：主色调为 {argument name=\"main color palette\" default=\"紫色、靛青色、洋红色和冰蓝色\"}；充满魅力、力量感、庆典氛围且如梦似幻。\n\n约束：必须包含 7 名人类表演者和 1 只狗狗吉祥物。画面中不可出现可见的歌词或可读的海报文字。避免出现额外的乐队成员。构图需以主唱为中心保持对称，鼓手清晰地位于其身后，狗狗清晰地位于最前方。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23685/01.jpg","partial":false},{"id":9922,"c":"ThinkAI / 社交媒体帖子","t":"马卡龙色系动漫风游戏桌面布置","p":"在明亮的白色房间内创建一个超精细的未来感马卡龙色系游戏桌面布置，风格如同可爱的动漫 PC 工作站。采用 16:9 宽屏电影级构图，平视视角，柔和日光，光泽感白色表面，薄荷水绿色 RGB 灯光，浅景深，以及带有动漫主题装饰元素的照片级 3D 渲染。场景中心为一个大型曲面超宽显示器，显示着可爱的动漫少女壁纸：{argument name=\"character name\" default=\"薄荷色头发戴熊耳帽的动漫少女\"}，有着极浅的薄荷色头发、毛茸茸的白色熊耳帽、青色丝带、精致的幻想风格配饰，脸部中心有一个轻微模糊的方形遮挡块。桌面上包含 7 个主要桌面物品：1 个大型曲面显示器、1 个白色 RGB 机械键盘、1 个白色游戏鼠标、1 个带有薄荷色几何/花卉图案的大型桌垫、1 个带有白色头戴式游戏耳机的白色耳机架、1 个带有发光按钮的小型直播控制台，以及 1 个带有小显示屏和三个旋钮的紧凑型控制面板。在右侧，放置 1 个带有水绿色内部灯光的白色玻璃侧透游戏 PC 机箱，可见风扇、白色水冷管、显卡以及机箱内展示的动漫角色艺术图。在 PC 展示区域内包含 3 个装饰品：1 个小型动漫手办、1 个微型白色跑车模型和 1 个带框动漫画板。在主显示器旁边添加 2 个小屏幕：1 个显示动漫角色的显示器下方的小型横屏，以及 1 个靠近 PC 的小型竖屏动漫显示器。背景细节：显示器后方发光的六边形墙灯图案，墙壁中心有一个小型青色鸢尾花状标志，两侧有白色浮动搁板，悬垂的绿色植物，小型玻璃/水晶装饰，以及柔和的科幻房间照明。调色板：{argument name=\"color palette\" default=\"白色、珍珠灰、薄荷水绿、淡青色、柔和青色\"}。氛围：{argument name=\"mood\" default=\"整洁、梦幻、奢华、舒适、高端玩家美学\"}。保持图像高度精致，对称但具有自然的生活气息，画面中不出现人物，无可见水印，除细微的硬件品牌标识外无任何可读的额外文字，且除了列出的物品外无杂乱堆放。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23696/01.jpg","partial":false},{"id":9923,"c":"ThinkAI / 社交媒体帖子","t":"淡粉色动漫风游戏桌面布置","p":"创建一个梦幻般、超精细的 16:9 广角写实风格桌面布置，场景位于淡粉色可爱风游戏房内。画面中心是一个超宽曲面显示器，显示着柔和的动漫少女壁纸：{argument name=\"character name\" default=\"一位粉色头发的兔女仆动漫少女\"}，拥有明亮的大眼睛、白色蕾丝花边发带、红色蝴蝶结、下垂的兔耳朵、草莓装饰、小爱心、丝带、华丽的边角装饰以及淡粉色背景。整个房间使用 {argument name=\"main color palette\" default=\"白色、淡粉色、草莓红和柔和的薰衣草色 RGB 灯光\"}。在桌面上，包含 10 个清晰可见的桌面物品：左侧放置 1 个白色游戏手柄，1 个显示 {argument name=\"clock text\" default=\"14:27 / 5 月 2 日 / 周五\"} 的小型数字时钟，1 个带有角色图标的微型复古方块屏幕，1 个装饰性粉色水晶灯，显示器下方放置 1 个宽条形音箱，显示器前方放置 1 个带有应用图标的小型智能控制平板，1 根卷曲的粉色线缆，1 把带有粉色键帽和草莓挂饰的机械白粉键盘，1 个白色鼠标，以及 1 张带有动漫线条艺术的大型草莓主题桌垫。在右侧，放置 1 台带有透明侧板的白色游戏 PC 主机，内部组件清晰可见，配有粉色 RGB 灯效、3 个圆形 RGB 前置风扇、1 个后置 RGB 风扇、水冷管、一张标签为 {argument name=\"graphics card label\" default=\"GEFORCE RTX\"} 的显卡，以及一个坐在机箱内部或边缘的小型动漫手办。在显示器后方，打造一面淡粉色墙壁，墙上非对称地排列着 9 块发光的六边形灯板。添加白色搁板和装饰：右侧 2 个浮动搁板上摆放着小植物和动漫手办，左侧边缘有 1 个发光花朵形状的霓虹灯和绿叶藤蔓。灯光应营造出温馨且具有电影质感的氛围，带有光晕效果，在光洁的白色表面上有柔和的反射，具有浅景深，呈现高端 PC 游戏工作站的美感。房间内无人，除了列出的物品外没有杂乱，且无水印。让整个房间看起来像是一个完美无瑕的草莓主题动漫直播间，显示器和 PC 是主要的视觉焦点。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23693/01.jpg","partial":false},{"id":9924,"c":"ThinkAI / 社交媒体帖子","t":"苏州园林旗袍人像","p":"真实生活摄影，自然抓拍瞬间。一张 {argument name=\"subject\" default=\"年轻女子\"} 的七分身人像，她正行走在横跨古典 {argument name=\"location\" default=\"苏州园林荷花池\"} 的狭窄木质九曲桥上。她处于轻柔的行走停顿中——一只脚微微向前，目光低垂看向水面。下方铺满了深绿色的巨大荷叶，边缘带有雨珠；荷叶间的水面映照着苍白的天空。她右侧有一道岁月沉淀的低矮木质栏杆。\n东亚年轻女子，20 岁出头。杏仁眼低垂，神情若有所思——不笑也不严肃，只是静静地沉浸在当下。鼻梁挺拔精致。在清晨园林清冷的微光下，肤色白皙。优雅的盘发，发顶插着两根细长的交叉发簪，耳畔别着一朵小白花。妆容清雅——近乎裸妆，唇色为淡淡的中性色。即使在清晨的冷光下，皮肤的次表面散射依然可见，脸颊透着淡淡的暖意，高光柔和细腻，隐约可见细致的粉底质感。\n她身着一件 {argument name=\"qipao color\" default=\"淡鼠尾草绿\"} 的无袖改良旗袍——一种柔和、略带灰调的竹青色，饱和度不高——立领配有浅灰绿色的盘扣，裙摆剪裁宽松，自然垂落至小腿中部。双手自然垂在身体两侧，右手靠近栏杆。木桥板因年代久远和潮湿而显得深暗；荷花池填满了下方背景，圆形的荷叶在盛夏中层叠繁茂。远处的岸边是灰色的园林石墙和隐约的垂柳。她鬓角的两三根碎发被水园的湿气轻轻吹乱，呈现出不规则的柔和弧度。\n晨光从左侧投射而来——清晨冷暖交替的光线，在桥板上投下长而柔和的阴影，并捕捉到下方荷叶的边缘。水面反射提供了二次散射补光——光线苍白而漫射——柔化了桥栏下方的阴影区域，赋予画面一种特别柔和的亮度。整体氛围宁静从容，展现了园林私密的清晨时刻。阴影区域和深色木桥纹理中带有细微的 ISO 400 胶片颗粒感，呈现出摄影噪点质感，而非 CG 渲染的平滑感。长宽比 2:3。无水印，无文字覆盖，非卡通，非数字绘画，非插画，非动漫。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23618/01.jpg","partial":false},{"id":9925,"c":"ThinkAI / 社交媒体帖子","t":"奢华咖啡馆时尚街拍","p":"超写实时尚街拍，一位美丽的 {argument name=\"subject\" default=\"年轻女性\"} 随意地站在优雅的 {argument name=\"setting\" default=\"欧式咖啡馆入口\"} 外。她身穿一件深巧克力色廓形衬衫，袖口卷起，搭配飘逸的象牙白高腰阔腿裤、干净的白色运动鞋，佩戴精致的金色首饰、小巧的圆环耳环和奢华腕表。黑色皮革单肩包自然地挂在肩上。\n\n她自信地站立，一只手插在口袋里，另一只手轻轻触碰头发，直视镜头，表情柔和、从容且优雅。棕色长波浪卷发，自然透亮的肌肤，精致的淡妆，五官轮廓分明。\n\n背景是奢华的咖啡馆门廊，配有黑色边框门、暖米色石材建筑、装有橄榄树的大型混凝土花盆，柔和的黄金时刻阳光将美丽的树影投射在墙壁和路面上。\n\n全身构图，主体居中，时尚杂志风格，奢华生活方式美学，浅景深，柔和的电影感光影，温暖的大地色调，逼真的阴影，高端杂志品质，高度细腻的织物纹理，自然姿态，照片级真实感，85mm 镜头，f/2.0，HDR，超清晰对焦，专业时尚摄影，8K 分辨率。\n负面提示词：\n模糊，低质量，卡通，插画，CGI，多余的手指，糟糕的手部，扭曲的脸，过度曝光，过度饱和，刺眼的阴影，不真实的皮肤，人物重影，脚部被裁切，杂乱的背景，文字，水印，Logo，噪点，运动模糊，尴尬的姿势，身体畸形，比例不协调。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23608/01.jpg","partial":false},{"id":9926,"c":"ThinkAI / 社交媒体帖子","t":"奇幻动漫摇滚乐队视觉图","p":"分析所有上传的插画图片，创作一张超高质量的原创硬摇滚/奇幻动漫乐队视觉图，将角色的特征、氛围、色彩、个性、时尚感、情感基调和世界观融合成一个统一的宇宙。\n\n重要提示：\n\n• 必须包含所有上传的角色，不得遗漏任何成员。\n• 确保所有角色的艺术风格保持一致。\n• 所有成员必须看起来像是来自同一部动漫作品和同一个世界。\n• 保留每个角色的面部特征、眼睛、发型、发色、表情、比例、年龄、体型、物种特征和个性。\n• 请勿直接粘贴原始图像。在保留其原始身份和艺术风格的前提下进行完全重绘。\n• 体现自然的身高差异和个性。\n• 每位成员都必须具备主角级的强烈存在感。\n• 保持情感氛围的电影感与连贯性。\n\n乐队角色应根据成员人数自动分配：\n主唱、主音吉他、贝斯、鼓手、键盘手、小提琴手、DJ、魔法辅助等。\n\n通过融合上传插画中的元素来重构舞台服装：\n奇幻法师长袍、哥特萝莉装、巫女元素、赛博朋克装甲、军用腰带、偶像时尚、皇家奇幻面料、发光饰品、魔法配件、不对称夹克、皮带、链条、层叠裙摆、装甲靴、发光珠宝以及原创的奇幻摇滚风格。\n\n乐器必须是完全原创的定制设计，自然地源自上传插画的世界观：\n• 魔法水晶吉他\n• 刻有符文的贝斯\n• 悬浮键盘\n• 奥术小提琴\n• 机械鼓\n• 转化为麦克风的发光法杖\n• 由魔法或未来能源驱动的奇幻放大器\n\n演唱会舞台本身也必须源自上传的艺术作品世界。\n避免使用通用的现场舞台。\n\n奇幻主题可参考：\n• 巨大的发光树木\n• 漂浮的废墟\n• 大教堂建筑\n• 魔法阵\n• 月光森林\n• 水晶吊灯\n• 古老符文\n• 雪花颗粒\n• 神圣光束\n\n赛博朋克主题可参考：\n• 全息屏幕\n• 霓虹灯光\n• 巨型 LED 墙\n• 未来派机械\n• 漂浮无人机\n• 发光线缆\n\n可爱柔和的世界观可参考：\n• 梦幻灯光\n• 漂浮丝带\n• 闪烁星光\n• 糖果色特效\n• 魔法粒子轨迹\n\n灯光效果必须呈现真实的现场演唱会感：\n戏剧性的聚光灯、轮廓光、体积雾、舞台反射、电影级阴影、发光特效、观众荧光棒、动态氛围。\n\n镜头风格：\n动漫电影主视觉图、超精细、电影级构图、动态角度、大师级品质、高级奇幻摇滚专辑封面、高度精细的渲染、情感叙事、统一的色彩分级。\n\n最终图像必须呈现出：\n“一支仿佛直接诞生于上传插画宇宙中的传奇动漫奇幻乐队。”","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23646/01.jpg","partial":false},{"id":9927,"c":"ThinkAI / 社交媒体帖子","t":"佩戴录音室耳机的动漫少女","p":"创作一幅生动的宽屏动漫插画，画面中仅有一位开朗的少女，身处未来感十足的音乐街区，背景为晴朗的白天。构图采用腰部以上的近景，少女位于画面中心，面朝观众，嘴角微扬，面带红晕，拥有明亮的紫蓝色双眸，长发随风飘动，{argument name=\"hair color\" default=\"深海军蓝\"} 的发丝向外散开。她佩戴着一副大型白色头戴式录音室耳机，参考 {argument name=\"headphone model\" default=\"铁三角 ATH-M20x\"} 设计，左侧可见圆形的耳罩，上面印有清晰可辨的铁三角风格标志和型号文字；她的双手轻扶在耳罩两侧。她的装扮包含五件可见单品：一件超大款半透明白色衬衫外套、一件带有霓虹涂鸦的黑色印花 T 恤、一条细黑色颈圈、一条小吊坠项链，以及耳机旁点缀的彩色小发夹。背景是明亮的蓝色城市街道，林立着玻璃建筑、音乐商店招牌、数字广告牌和路标，点缀着蓬松的白云，呈现出充满活力的透视感和闪烁的高光。少女周围环绕着青色、粉色、黄色和白色的动态光带，漂浮的音符、星光、三角形纸屑、纸飞机状碎片以及花瓣状碎片斜向穿过画面，营造出音乐在城市中迸发的动感。采用精致的现代日本动漫风格，线条细腻，色彩为明亮的柔和霓虹色，头发细节丰富，皮肤阴影柔和，配以戏剧性的背光、镜头光晕和欢快的流行演唱会氛围。比例 16:9，细节极其丰富，面部和耳机焦点清晰，无边框，无水印，避免出现多余角色。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23670/01.jpg","partial":false},{"id":9928,"c":"ThinkAI / 社交媒体帖子","t":"动态饮料广告","p":"一位年轻女性在半空中跳跃的姿势，高马尾飞扬，脸上洋溢着纯粹的兴奋，身穿白色短款上衣，{argument name=\"shorts color\" default=\"荧光绿运动短裤\"}，带有青柠色点缀的透明 PVC 防风外套，带有绿色细节的白色运动鞋。她单手将一杯冰饮向上抛起，下方放置着一个 {argument name=\"brand product\" default=\"巨大的超大号 Sprite 罐装饮料\"}，周围环绕着爆炸般的冰块和水花。{argument name=\"background color\" default=\"薄荷绿\"} 工作室背景，带有戏剧性的背光光晕。半空中凝固的水滴和气泡。全身动态镜头，超逼真 3D 渲染，超写实商业摄影，光泽感反射地面，8K 分辨率，电影级动作照明。\n\n--style raw, photorealistic, commercial ad campaign,\n8K resolution, studio photography, product visualization,\nhyperdetailed water droplets, cinematic lighting 1744x2336","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23619/01.jpg","partial":false},{"id":9929,"c":"ThinkAI / 社交媒体帖子","t":"充满活力的强对比度数字拼贴画","p":"一幅高对比度、充满活力的数字拼贴画，背景为鲜艳的 {argument name=\"background color\" default=\"红色渐变\"}。顶部的大号大写文字显示为“{argument name=\"branding\" default=\"AvelyrahnAI\"}”，采用简洁现代的字体。构图展示了同一位年轻女性两张截然不同且自信的形象，其面部特征和精致的侧编发型与参考图 100% 一致。上方的大幅肖像中，她自信地微笑着，身穿浅粉色连帽衫，头上戴着时尚墨镜，佩戴着现代感十足的手表，一只手靠近头发。前方较小的全身像中，她呈现出动态、俏皮的舞蹈/迈步姿势，身穿深绿色衬衫、黑色修身长裤，佩戴墨镜和潮流手表。侧面有一个小型的签名式水印“{argument name=\"watermark\" default=\"AvelyrahnAi creation\"}”，底部则是一个精致的 YouTube 标志及链接文字“Pardesilog386”。光线明亮柔和，呈现出一种类似 Photoshop 精修的喷绘质感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23596/01.jpg","partial":false},{"id":9930,"c":"ThinkAI / 社交媒体帖子","t":"奢华旅行剪贴簿海报","p":"创作一张细节丰富、充满奢华旅行博主风格的拼贴海报，灵感源自撕纸剪贴簿美学。使用 {argument name=\"subject\" default=\"一位留着凌乱金色短发的年轻金发女性\"}，配以柔和的雀斑、深邃的棕色眼眸和优雅的五官。让她身着全黑高领毛衣、黑色西装外套、黑色工装裤，并佩戴金色配饰。她手持专业单反相机，在画面中呈现多种姿态。\n\n设计应包含：\n• 左侧展示一张大型社交媒体个人资料卡，名称为 \"{argument name=\"name\" default=\"Noor 🌸\"}\"，账号为 \"{argument name=\"handle\" default=\"@Noor_ul_ain43\"}\"\n• 蓝色认证徽章\n• 关于 AI 创作者和导师的个人简介\n• 9,007 位关注者和 4,654 位正在关注\n• 撕纸过渡效果，露出令人惊叹的阿尔卑斯山脉、水晶般清澈的湖泊和探险风景\n• 布局周围点缀着拍立得旅行照片\n• 手写旅行笔记和涂鸦\n• 复古世界","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23570/01.jpg","partial":false},{"id":9931,"c":"ThinkAI / 社交媒体帖子","t":"湖人队场边球迷照片","p":"创作一张逼真的场边智能手机风格照片，画面中 {argument name=\"character description\" default=\"一位扎着凌乱丸子头的深色头发年轻湖人队球迷\"} 正坐在洛杉矶湖人队比赛的场边。人物位于前景中心，半身出镜，身穿一件超大号的 {argument name=\"hoodie color\" default=\"紫色\"} 连帽衫，胸前印有醒目的黄白色“LAKERS”标志，左手拿着一部黑色智能手机，仿佛正在查看消息或自拍。其面部被一个纯色不透明的中棕色矩形隐私遮挡块故意遮住，但仍可见一只耳朵和发际线。背景中的竞技场挤满了球迷，灯光璀璨，看台层次分明，蓝色发光项目清晰可见，上方的计分板条上印有包括“LAKERS.COM”在内的湖人队品牌标识。画面中包含篮球架、篮板、进攻时间显示器以及中景处红色的“AAA.com”赞助商面板，右侧可见球员和工作人员聚集在球场上。构图应呈现出从高级下层看台拍摄的真实抓拍感，具有逼真的景深、自然的室内竞技场光线、轻微的手机镜头透视畸变、细腻的观众质感、前景中的黑色场边座椅以及生动的比赛之夜氛围。请突出使用 {argument name=\"team branding\" default=\"洛杉矶湖人队\"} 的配色，特别是紫色和金色。禁止使用插画风格，禁止包含奇幻元素，禁止添加水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23695/01.jpg","partial":false},{"id":9932,"c":"ThinkAI / 社交媒体帖子","t":"奢华旅行海报转换","p":"将我的照片转换为一张奢华旅行海报。布局比例：顶部 35% 为艺术创作，底部 65% 为原始照片。底部图像保持 100% 不变。顶部区域：使用从照片中提取的极简哑光背景，放置一个居中的小型收藏级纪念磁贴，带有纤细金色轮廓的写实手工珐琅徽章，基于照片的简化场景，以及奢华的编辑排版。使用优雅的衬线字体添加 {argument name=\"location\" default=\"地点名称\"} 和 {argument name=\"country\" default=\"国家\"}。高级旅行品牌风格，静奢风，Instagram 轮播图，垂直 3:4 比例。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23638/01.jpg","partial":false},{"id":9933,"c":"ThinkAI / 社交媒体帖子","t":"写实风格麻辣烫外卖碗","p":"创作一张超写实、略带生活气息的手机美食摄影作品，主体为一个圆形的透明塑料外卖碗，碗中盛满浸泡在深红色辣椒油汤底中的中式麻辣烫。相机采用高位四分之三俯拍视角，紧凑构图，使圆形碗占据画面大部分空间。展示一个凌乱、随意的桌面环境，碗底垫着一个褶皱的透明塑料袋，左上方模糊呈现第二个空的塑料盖或碗，右上角部分可见一次性筷子和一张白色餐巾纸。碗内需包含 10 种清晰可见的食材：左下方中心附近有一片带有多个椭圆形孔的大片藕片；右上角和右下角各有一颗圆形的米色鱼丸或肉丸；右上角附近有一个苍白的煮蛋状椭圆形物体；左上方有一根橙色的蟹柳或海鲜棒；中心有一簇细长的金针菇；右侧中心有一片油亮的黑色海带或木耳；下部中心附近有一块巨大的半透明灰色年糕或鱼饼；底部边缘有一条绿色叶菜；右侧附近有一块长方形的豆腐或豆干。汤底应看起来油腻、浑浊，并加入大量调料，漂浮着辣椒碎、胡椒粒、芝麻状颗粒，塑料容器内壁沾有红橙色的油脂痕迹。使用生硬的室内光线、柔和的色调、可见的噪点、不完美的对焦、油腻的反光以及随意的快照式构图，使其看起来像是一张未经修饰的真实手机照片，而非摆拍的美食广告。画面中不含人物、文字或水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23692/01.jpg","partial":false},{"id":9934,"c":"ThinkAI / 社交媒体帖子","t":"已打码的家庭快照","p":"创作一张低分辨率、室内家庭抓拍照片，营造出一种令人不安的超写实 AI 摄影感。画面采用手机广角镜头拍摄，带有轻微的顺时针倾斜，并伴有刺眼的天花板灯光眩光。场景为一个狭窄的公寓餐厅/客厅，铺设着光亮的白色瓷砖地板，墙壁为白色，左后方有一扇带有米色窗帘的明亮窗户，窗户旁摆放着深色沙发或柜子，背景中央挂着壁挂式饮水机，右上角堆放着杂乱的架子和瓶子，周围散落着日常家居用品。画面中必须包含 3 人：左侧是一位坐着的成年女性，身穿淡粉色长袖上衣，在画面底部边缘附近拿着白色碗和筷子；背景中央是一位站立的儿童，身穿粉色羽绒服和深色裤子，正拿着东西靠近嘴边；右侧前景是一位身体前倾的成年男性，身穿灰色长袖衬衫和深色裤子，一只手拿着筷子向斜下方伸去，另一只手在指点。用不透明的矩形像素化模糊马赛克遮盖所有 3 个人的面部，马赛克呈暗棕灰色调：最左侧边缘女性面部覆盖一个长条形马赛克，儿童面部覆盖一个较小的马赛克，男性面部覆盖一个较大的马赛克。保持构图的尴尬与随意感，加入运动模糊、压缩伪影、柔焦、噪点阴影、褪色、曝光不均等效果，呈现出老旧压缩家庭照片的质感。使用 {argument name=\"room type\" default=\"小型中式公寓餐厅\"}、{argument name=\"number of people\" default=\"3\"}、{argument name=\"censor style\" default=\"不透明矩形像素化模糊马赛克\"}、{argument name=\"main clothing color\" default=\"粉色和灰色\"} 以及 {argument name=\"camera style\" default=\"倾斜低分辨率手机快照\"}。请勿添加任何可读文字、Logo、水印或额外人物。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23690/01.jpg","partial":false},{"id":9935,"c":"ThinkAI / 社交媒体帖子","t":"2000 年代家庭聚餐匿名照片","p":"创作一张 2000 年代初写实的家庭聚餐快照，场景设定在简朴的中国公寓餐厅，使用便携式傻瓜相机并开启直接闪光灯拍摄。画面应带有一种微妙的诡异感，所有人脸均被平整的矩形模糊块遮盖。画面中共有 8 人紧凑地围坐在一张大圆木餐桌旁：最左侧是一名身穿浅绿色连帽衫的女孩/少女，她身旁是一名身穿海军蓝棉马甲的年轻男子，接着是一名身穿粉色毛衣且身体前倾的年轻女子，在年轻男子和年轻女子之间还有一个半遮挡的身影，后方中央是一名身穿深色毛衣的老年男子，正拿着筷子在小碗上方，他右侧是一名身穿红色花纹开衫的老年妇女，正在用筷子进食，最右侧是一名身穿深色夹克的成年男子，右下角是一名身穿蓝白上衣并拿着碗的幼童。在 8 张人脸上放置 8 个不透明的矩形模糊补丁，色调为暖米棕色，边缘柔和，遮盖所有面部特征，同时保留头发和身体轮廓。餐桌上摆满了家常菜：包括约 12 个盛放中式菜肴（如汤、炒青菜、鱼或肉类拼盘、什锦蔬菜）的共享餐盘和碗；正好 10 个小饭碗；正好 6 个白色陶瓷杯；正好 3 个深色饮料杯；几双筷子；以及左前方的一个粉色纸巾盒。房间墙壁为白色，后方有一个通往小厨房或带窗杂物间的木制门框，右侧是一个木制储物柜，上面摆满了罐子、碗、锅和餐具，左侧墙上挂着一幅带有黑色汉字的红色竖向卷轴。使用强烈的闪光灯照明，带有轻微的“红眼时代”色彩平衡，画面有可见噪点、压缩的 JPEG 质感、轻微的镜头畸变以及普通的家庭照片构图。在右下角添加一个白色的数码相机日期戳，显示为 {argument name=\"date stamp\" default=\"2006.02.06\"}。保持图像为 4:3 横向比例，无需艺术化处理，不要使用电影级灯光，不要呈现现代智能手机的质感，除日期戳和墙上卷轴文字外，画面中不应出现任何可辨认的文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23689/01.jpg","partial":false},{"id":9936,"c":"ThinkAI / 社交媒体帖子","t":"潮湿的中国夜市场景","p":"一张粗粝的写实纪录片风格街头摄影作品，拍摄于夜晚昏暗、潮湿的中国农贸市场内部，采用平视视角，具有浅景深和自然环境光。前景右侧展示了 {argument name=\"main vendor\" default=\"一位中年中国蔬菜摊贩\"}，身穿黑色 T 恤和红色格子围裙，站在菜摊后，正将长青豆装入电子秤上的透明塑料袋中，秤上显示着发光的红色数字。摊贩的面部被特意进行柔和的矩形模糊处理。在前景和中景处，准确展示 9 组可见的农产品：白色泡沫托盘中的长青葱/小葱、堆叠高耸的浅色叶菜、一小堆姜块、袋装红辣椒、秤上塑料袋里的长青豆、后方堆放的黄瓜或深绿色叶菜、右侧圆形的浅绿色卷心菜或葫芦、白色板条箱中光亮的深紫色茄子，以及右下角一个大型湿润的鱼缸或海鲜缸边缘。左侧包含一名身穿深色衣服的模糊男子，正推着金属手推车穿过潮湿的过道，其面部同样被遮挡。过道地面光亮且积满水洼，倒映着头顶的灯具和市场灯光。背景高度模糊，呈现出摊位、悬挂的灯具、中文店招、模糊的购物者、防水布以及向深处延伸的蔬菜行。使用 {argument name=\"lighting mood\" default=\"情绪化的暖色调荧光市场照明\"}，柔和的绿色和棕色调，高 ISO 噪点，轻微的动态模糊，不完美的对焦，潮湿的氛围，以及令人不安的超写实主义。在左上方添加一个大型绿色中文招牌，带有部分可辨认的字符，类似于蔬菜市场区域的标志，但保持自然的模糊感。拒绝干净的摄影棚外观，拒绝卡通风格，无可见水印，无清晰可辨的品牌标识。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23687/01.jpg","partial":false},{"id":9937,"c":"ThinkAI / 社交媒体帖子","t":"东京涩谷街头潮流肖像","p":"{\n    \"subject\": {\n      \"reference_image\": \"uploaded_image\",\n      \"preserve_identity\": true,\n      \"description\": \"使用上传的图片作为精确的人物参考。保持面部结构、发型、胡须、肤色、身体比例、太阳镜以及整体外观与参考图一致。\"\n    },\n    \"outfit\": {\n      \"style\": \"{argument name=\"clothing style\" default=\"oversized avant-garde streetwear\"}\",\n      \"shirt\": \"超大款白色衬衫，带有夸张的灯笼袖\",\n      \"pants\": \"极度宽松的淡鼠尾草绿牛仔裤，堆叠在运动鞋上\",\n      \"footwear\": \"白色厚底运动鞋\",\n      \"accessories\": [\"黑色太阳镜\"]\n    },\n    \"location\": {\n      \"city\": \"日本东京\",\n      \"area\": \"{argument name=\"location\" default=\"Shibuya Crossing\"}\",\n      \"environment\": \"繁忙的城市街道，有拥挤的人群、广告牌、日文招牌、现代摩天大楼和人行横道\"\n    },\n    \"pose\": {\n      \"stance\": \"自信地站在十字路口中央\",\n      \"hands\": \"插在口袋里\",\n      \"expression\": \"冷静、时尚，视线略微看向镜头外\"\n    },\n    \"camera\": {\n      \"angle\": \"平视\",\n      \"framing\": \"全身肖像\",\n      \"lens\": \"35mm\",\n      \"depth_of_field\": \"中等\"\n    },\n    \"lighting\": {\n      \"type\": \"自然日光\",\n      \"time\": \"明亮的午后\",\n      \"quality\": \"柔和的阳光，带有逼真的阴影\"\n    },\n    \"style\": {\n      \"genre\": \"高级街头摄影\",\n      \"aesthetic\": \"东京街头潮流大片\",\n      \"realism\": \"照片级真实感\",\n      \"quality\": \"超精细，8k 分辨率，焦点清晰\"\n    },\n    \"negative_prompt\": [\n      \"卡通\",\n      \"动漫\",\n      \"面部模糊\",\n      \"低分辨率\",\n      \"多余的肢体\",\n      \"解剖结构扭曲\",\n      \"发型不符\",\n      \"面部不符\",\n      \"脚部被裁剪\",\n      \"文字\",\n      \"水印\",\n      \"标志\"\n    ]\n  }","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23622/01.jpg","partial":false},{"id":9938,"c":"ThinkAI / 社交媒体帖子","t":"城市天台棒球夹克人像","p":"超写实、高质量的人像，描绘了一位时尚的 {argument name=\"ethnicity\" default=\"南亚\"} 年轻女性，在日落时分优雅地站在色彩鲜艳的城市天台篮球场上。她姿态轻松优雅，重心自然地落在一条腿上，双肩放松，一只手轻轻垂在身侧，另一只手轻触她 {argument name=\"jacket type\" default=\"棒球夹克\"} 的边缘。她的身体略微侧向镜头，展现出自信而精致的气质。她直视镜头，带着温暖自然的微笑，散发出自信、魅力和毫不费力的时尚感。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23637/01.jpg","partial":false},{"id":9939,"c":"ThinkAI / 社交媒体帖子","t":"在城市观景台发短信的男子","p":"创作一张电影感十足的竖构图全身写实照片，画面中仅有一名年轻男子，{argument name=\"character description\" default=\"身材苗条的年轻男性，留着凌乱的深色头发，面部故意模糊，无法辨认\"}，站在粗糙的城市石墙上，低头用双手操作着一部黑色智能手机。他穿着 6 件清晰可见的服饰/配饰：一件黑色连帽衫、下摆露出的一件白色内搭、宽松的黑色工装裤、黑白配色的高帮运动鞋、一副黑色头戴式耳机，没有其他可见配饰。让他以侧面姿势站立，低头，双肩放松，神情平静且沉浸在手机中。场景设定在河流与城市天际线上方的高处观景台，时间为 {argument name=\"time of day\" default=\"日落后的蓝调时刻\"}，地平线附近呈现温暖的橙色光芒，逐渐过渡到冷灰蓝色的云层。背景包括远处的摩天大楼（带有几扇亮灯的窗户）、河流或滨水区、树木剪影、路灯，以及延伸至远处的长石护栏，墙体下方有细微的涂鸦。使用柔和的自然环境光、真实的阴影、浅景深电影感、柔和的城市色调、35mm 纪实街拍风格、高细节的石材纹理、大气的天际线雾气、竖向构图，营造出平静专注的氛围。保持男子全身入镜并略微偏左，上方留出负空间，天际线位于背景下方。画面中无任何可读文字、无标志、无其他人物。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23694/01.jpg","partial":false},{"id":9940,"c":"ThinkAI / 社交媒体帖子","t":"极简主义旅行者机场场景","p":"超写实电影级镜头，一位 {argument name=\"subject\" default=\"帅气的旅行者\"} 站在清晨移动的机场自动扶梯上，身穿高端极简主义街头服饰，背着奢华双肩包，身后是洒满晨光的巨大机场落地窗，充满情感的电影感旅行氛围，超写实细节，8k 分辨率","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23579/01.jpg","partial":false},{"id":9941,"c":"ThinkAI / 社交媒体帖子","t":"时尚编辑风格拼贴海报","p":"现代编辑风格拼贴海报设计。背景包含四个堆叠的圆角面板，填充了 {argument name=\"subject description\" default=\"戴着太阳镜的时尚年轻女性\"} 在不同时尚姿态下的黑白电影感肖像。前景叠加了一个高质量的全彩剪影，主体为同一位穿着 {argument name=\"clothing\" default=\"白色廓形衬衫搭配黑色长裤和太阳镜\"} 的女性，摆出自信的时尚姿势。\n简洁极简设计，无文字，无排版，无字母，柔和阴影，深度分层，高对比度光影，高级杂志风格，超写实，8K 分辨率，专业海报构图。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23616/01.jpg","partial":false},{"id":9942,"c":"ThinkAI / 社交媒体帖子","t":"双胞胎 Cosplayer 人气对比","p":"保持参考图像中的双胞胎角色，写实真人风格，大型 Cosplay 活动现场。室内展厅。一个聚集了许多 Cosplayer 和摄影师的华丽空间。具有活动感的灯光和热闹的氛围。\n\n这对双胞胎扮演的是 {argument name=\"costume\" default=\"女性忍者\"}，看起来像是会出现在热门游戏或动漫中的角色。两人穿着完全相同的服装。基于红白配色的精美忍者装束。从忍者风格上衣、护臂、腰布、靴子到小配饰完全一致。发型和妆容也相同，乍一看几乎无法分辨。\n\n然而，现场的人气却有着极大的差异。其中一位双胞胎面前聚集了大量摄影师和粉丝。粉丝们用长焦镜头、单反相机和智能手机对着她拍照。闪光灯闪烁，甚至还有人排队等待合影。人气高的双胞胎正微笑着摆姿势。周围区域热闹非凡，已成为活动的焦点。\n\n与此同时，另一位双胞胎站在几米外，周围却空无一人。尽管穿着同样的服装，有着同样的脸庞，却没有一个人把镜头对准她。她正带着略显落寞的表情看着人气高的那位双胞胎。无所事事地站着。表情令人心酸。\n\n摄像机以广角镜头捕捉整个场地，展示了左侧被众多粉丝包围的人气 Cosplayer 与右侧完全无人问津的冷门 Cosplayer 之间的极端对比。这是一种滑稽的境况：明明拥有同样的脸和同样的服装，待遇却天差地别。\n\n活动现场的真实氛围、自然的人群、Cosplay 活动特有的热度，以及纪录片风格的真实感。自然的表情、真实的皮肤纹理、照片级真实感、超高清晰度、写实的活动摄影质量。真实的电视节目/纪录片画质。无企业标志或真实团体名称。\n\n屏幕顶部带有电视风格的字幕：“{argument name=\"top caption\" default=\"人气 Cosplayer 特写\"}”，底部为：“{argument name=\"bottom caption\" default=\"双胞胎之间的对比显而易见\"}”。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23647/01.jpg","partial":false},{"id":9943,"c":"ThinkAI / 社交媒体帖子","t":"午后烘焙甜甜圈的情侣","p":"创作一幅温馨的电影感动漫风格插画，描绘 {argument name=\"character pair\" default=\"一位年轻女性和一位年轻男性\"} 在金色午后的温馨厨房里一起烘焙甜甜圈。场景采用 3:4 竖构图，视角为腰部以上，背景是木质台面；左侧巨大的多格窗户透入阳光，在室内投下柔和的琥珀色高光、长长的阴影以及如尘埃般的微光。女性站在左侧，身材娇小，身穿宽松的米色长袖衬衫和深棕色围裙，头发扎成凌乱的丸子头，有几缕碎发垂下；男性站在右侧，身材更高，身穿黑色长袖衬衫和炭灰色围裙，留着凌乱的黑发，戴着小耳环。两人的面部应刻意用暖肤色渐变的平滑矩形模糊块遮挡，但他们并肩工作时的肢体语言显得温柔而亲密。女性正在将一个甜甜圈浸入白色小碗里的巧克力酱中，男性则在一个大型透明玻璃搅拌碗中搅拌着光亮的巧克力面糊或糖霜。在台面上，需包含 8 个清晰可见的甜甜圈：金属托盘上的冷却架上有 7 个甜甜圈（3 个巧克力淋面甜甜圈和 4 个原味金黄甜甜圈），外加 1 个正在浸入白色碗中的甜甜圈。周围布置烘焙细节：一小碗巧克力酱、右侧标有“FLOUR”字样的面粉袋、右下角的白色马克杯、折叠的厨房毛巾、左侧插着白色雏菊的小花瓶，以及左下角写有“Today’s Menu”和“Donuts”并带有爱心和甜甜圈涂鸦的小黑板菜单。背景中加入带有罐子、碗和绿植的木质搁板，一张写着“Donuts love - smile - together”的挂签，瓷砖墙面，以及右上角的一盏深色吊灯。使用 {argument name=\"lighting mood\" default=\"柔和的午后金色阳光\"}，细腻的绘画笔触，精致的线条，暖米色和棕色的色调，写实的厨房杂物，浪漫的生活片段氛围，浅景深，以及高分辨率的动漫插画质量。避免照片级写实，避免出现额外人物，避免除指定文字外的额外文字，整体感觉要宁静、温馨且充满爱意。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23684/01.jpg","partial":false},{"id":9944,"c":"ThinkAI / 社交媒体帖子","t":"舒适办公咖啡馆人像","p":"超写实电影感人像摄影，拍摄一位 {argument name=\"subject\" default=\"英俊的年轻男子\"}（参考图片所示）随意地坐在 {argument name=\"location\" default=\"现代舒适的办公咖啡馆角落\"} 内的高级棕色皮质休闲椅上。他留着浓密的深色质感短发，带有淡淡的胡茬，下颌线分明，五官立体，表情自信严肃，直视镜头。身穿超大款纯黑色 T 恤，搭配宽松的深色水洗阔腿牛仔裤、黑色运动鞋，佩戴极简银色吊坠项链。\n\n姿势放松，左肘靠在椅扶手上，左手轻触脸侧，右手自然地放在膝盖上。双腿舒适地分开，身体微微后倾，展现出冷静自信的肢体语言。\n\n前景的木质咖啡桌上，中间放着一本黑色精装书，右侧放着一部现代黑色智能手机，边缘处放着一杯带有拉花的黑咖啡。充满温暖的咖啡馆氛围。\n\n背景墙上装饰着画框艺术品，布局呈现出极具现代美感的办公空间风格：\n\n左上方悬挂着木框大型山湖风景摄影作品\n\n下方是木框横向雾中松林摄影作品\n\n中右侧是黑色画框的极简植物叶片印刷画\n\n黑色画框内是励志排版海报，文字为 \"{argument name=\"poster text\" default=\"今日自律，明日自由。\"}\"\n\n右上角是黑色画框内的深色电影感跑车夜景摄影作品\n\n椅子右侧摆放着一株大型室内琴叶榕盆栽。\n\n主体正上方悬挂着一盏大型工业风黑色吊灯，营造出温暖柔和的聚光效果。氛围感暖光，钨丝灯色温，舒适的咖啡馆环境，电影感阴影，真实的皮肤质感，微妙的轮廓光，高对比度但自然的曝光。\n\n使用 Sony A7R V 拍摄，85mm 镜头，f/1.8，ISO 400，1/125s。平视拍摄角度，居中构图，竖向人像比例（4:5），浅景深，奶油般背景虚化，超逼真细节，奢华生活方式美学，杂志编辑级品质，专业调色，眼睛焦点极其锐利，照片级真实感，HDR，8K 分辨率。\n负面提示词：\n多人，微笑表情，杂乱的桌面，缺少咖啡杯，缺少手机，缺少书本，明亮的日光，强闪光，高光过曝，低质量，模糊的脸，卡通，CGI，绘画，扭曲的手，多余的手指，头部被裁剪，糟糕的解剖结构，重复的物体，凌乱的房间，文字伪影，水印，Logo，低分辨率，广角畸变，鱼眼效果。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23617/01.jpg","partial":false},{"id":9945,"c":"ThinkAI / 社交媒体帖子","t":"坐在前台的接待员","p":"以 REFERENCE_0 作为角色和服装基础，生成一张精致且照片级逼真的高画质场景，展现同一位接待员坐在现代办公室或诊所接待区的前台。保留深蓝色西装、白色衬衫、棕色齐肩长发、金色名牌以及匿名/模糊的面部处理效果。将姿势从角色表中的站姿改为坐姿工作状态：上半身居中，一只手放在桌面的文件上，另一只手臂微微向侧面伸展，仿佛正在协助访客。添加一个温暖、柔和模糊的接待背景，配有浅色木质柜台和中性色调的墙壁。在桌面/背景中精确添加 6 个可见元素：她面前的 1 个带文件的剪贴板、文件上的 1 支黑色钢笔、右侧边缘的 1 台打开的笔记本电脑、左侧前景的 1 个小型黑色桌面指示牌、左后方的 1 盏台灯，以及灯旁边的 1 株小型植物或绿植。使其看起来像一张自然的专业照片，采用 3:4 竖构图，浅景深，柔和的室内光线，清晰的织物细节，逼真的皮肤和头发渲染，无角色表边框，无额外人物，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23515/01.jpg","partial":false},{"id":9946,"c":"ThinkAI / 社交媒体帖子","t":"东方工笔画风宠物肖像","p":"请根据我上传的清晰宠物照片，生成一组 9 张独立的“宠物工笔肖像”照片。每张图像应为独立作品，统一采用 3:4 竖构图。不要拼贴、不要九宫格、不要海报排版。核心要求：必须清晰保留原宠物的真实身份特征，包括动物种类、品种、体型、脸型、眼、鼻、口、耳、毛色、斑纹、毛发质感、尾巴形状、神态及身体比例。所有 9 张照片必须看起来是同一只宠物。不得更改品种、毛色，或错误绘制动物结构；不得变成陌生的宠物或过度拟人化。整体风格：传统东方工笔宠物肖像，宋画气质，院体工笔，绢本设色，线条细腻，矿物颜料典雅，留白充足，画面干净清幽。背景使用米白色宣纸或绢本纹理，带有轻微纸张颗粒感。宠物可保留部分写实毛发质感，但整体风格需融入工笔画意境，如同高端宠物肖像画。视觉元素：可加入中国传统绘画元素，如：云纹、山石、花枝、果树、藤蔓、栏杆、古典木桌、团扇、蝴蝶、蜜蜂、瓢虫、荷叶、桃子、荔枝、绣球花、梅花、竹叶、芭蕉叶、烟花、祥云等。每张图像的主题与姿态：1. 祥云仙宠：宠物立于云雾之中，配以淡墨远山，神态灵动。2. 花下回眸：宠物在花枝下回眸，大面积留白，温婉静谧。3. 果园小憩：宠物在桃子、荔枝或果篮旁，可爱而高级。4. 夏日庭院：宠物在栏杆或木桌旁，背景点缀花草与小昆虫。5. 芭蕉树下：宠物在大型芭蕉叶下，动作自然，氛围清凉。6. 蝶影戏趣：宠物注视着蝴蝶或小昆虫，表情好奇。7. 落英缤纷：宠物坐在花瓣雨中，氛围轻盈。8. 古画留白：极简构图，大面积留白，宠物位于画面底部或侧边。9. 瑞兽肖像：宠物带有一丝东方神兽感，但必须保持原有的真实宠物特征，不能变成奇幻动物。风格细节：线条细腻，色调温润，带有古画装裱感。画面一侧可添加题款与红印，但不得出现真实可读的文字或乱码大字。构图需具备高级留白感，不宜过满，无现代摄影棚背景，无卡通感，无油画感，无赛博朋克风，无夸张表情，无复杂服饰。最终效果：看起来像是专为这只宠物创作的一套东方工笔肖像，既保留了宠物真实的可爱与辨识度，又兼具古典画卷的审美意蕴。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23485/01.jpg","partial":false}],"total":100,"page":1,"limit":36,"pages":3,"source":"prebuilt-bootstrap-category-full"},"ThinkAI / 信息图 / 教育视觉图":{"prompts":[{"id":10011,"c":"ThinkAI / 信息图 / 教育视觉图","t":"VR 头显爆炸视图海报","p":"{\n  \"type\": \"产品爆炸视图海报\",\n  \"subject\": \"VR 头显\",\n  \"style\": \"简洁的高科技 3D 渲染，摄影棚灯光，发光装饰\",\n  \"background\": \"{argument name=\\\"background color\\\" default=\\\"柔和的紫蓝色渐变\\\"}\",\n  \"header\": {\n    \"logo\": \"∞ {argument name=\\\"product name\\\" default=\\\"Meta Quest 3\\\"}\",\n    \"subtitle\": \"{argument name=\\\"main catchphrase\\\" default=\\\"以全新的结构，重塑全新的现实。\\\"}\"\n  },\n  \"layout\": {\n    \"centerpiece\": \"VR 头显的垂直堆叠爆炸视图，展示了 9 层不同的内部组件：外壳、摄像头传感器、带芯片的主板、Pancake 透镜、内部框架、电池组、侧带、顶部头带和面部接口衬垫。\",\n    \"callout_labels\": {\n      \"count\": 8,\n      \"left_side\": [\n        \"Snapdragon® XR2 Gen 2\\n卓越的处理性能，带来实时沉浸体验。\",\n        \"可调节 IPD 机构\\n为广大用户提供舒适的佩戴感。\",\n        \"精密设计的头带\\n追求舒适与稳定的工程学设计。\"\n      ],\n      \"right_side\": [\n        \"前面板\\n精致的设计与优化的重量平衡。\",\n        \"追踪摄像头\\n实现高精度的位置追踪与环境感知。\",\n        \"Pancake 透镜\\n轻薄设计，提供广阔视野与清晰画质。\",\n        \"高性能电池\\n优化电源设计，支持长时间续航。\",\n        \"柔软的面部接口\\n确保长时间佩戴依然舒适。\"\n      ]\n    },\n    \"footer\": {\n      \"left_text_block\": {\n        \"headline\": \"{argument name=\\\"bottom headline\\\" default=\\\"体验，源于结构的进化。\\\"}\",\n        \"body\": \"每一个零件都蕴含着支撑沉浸式体验的前沿科技与匠心设计。Meta Quest 3 从内部构建未来，为您带来超乎想象的体验。\"\n      },\n      \"right_logo\": \"∞ Meta\"\n    }\n  }\n}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/13460/01.jpg","partial":false},{"id":10012,"c":"ThinkAI / 信息图 / 教育视觉图","t":"手绘城市美食地图","p":"{\n  \"type\": \"手绘地图信息图\",\n  \"style\": \"{argument name=\\\"art style\\\" default=\\\"复古羊皮纸上的水彩墨水手绘插画\\\"}\",\n  \"title_section\": {\n    \"text\": \"{argument name=\\\"city name\\\" default=\\\"成都\\\"} {argument name=\\\"map title\\\" default=\\\"吃货暴走地图\\\"}\",\n    \"mascot\": \"戴着墨镜并竖起大拇指的卡通红辣椒\"\n  },\n  \"border\": \"{argument name=\\\"border decoration\\\" default=\\\"绿叶与红辣椒藤蔓\\\"}\",\n  \"layout\": {\n    \"background\": \"带有黄色道路、蓝色河流和绿色公园区域的纹理米色羊皮纸\",\n    \"sections\": [\n      {\n        \"title\": \"地标建筑\",\n        \"count\": 6,\n        \"illustrations\": [\"传统凉亭\", \"传统寺院\", \"带有攀爬熊猫的现代摩天大楼\", \"高耸的电视塔\", \"传统牌坊\", \"工业建筑\"],\n        \"labels\": [\"人民公园\", \"文殊院\", \"IFS\", \"339电视塔\", \"宽窄巷子\", \"东郊记忆\"]\n      },\n      {\n        \"title\": \"美食地点\",\n        \"count\": 12,\n        \"illustrations\": [\"麻婆豆腐\", \"红油水饺\", \"冷锅串串\", \"三大炮\", \"蛋烘糕\", \"九宫格火锅\", \"肥肠粉\", \"钵钵鸡\", \"冒菜\", \"盖碗茶\", \"冰粉\", \"兔头\"],\n        \"labels\": [\"1 陈麻婆豆腐\", \"2 钟水饺\", \"3 春熙路\", \"4 宽窄巷子·三大炮\", \"5 建设路·叶婆婆蛋烘糕\", \"6 玉林路·小龙坎火锅\", \"7 香香巷·肥肠粉\", \"8 武侯祠大街·钵钵鸡\", \"9 东郊记忆·冒椒火辣\", \"10 人民公园·鹤鸣茶社\", \"11 锦里古街·冰粉\", \"12 双流老妈兔头\"]\n      },\n      {\n        \"title\": \"图例\",\n        \"position\": \"右下角\",\n        \"count\": 5,\n        \"items\": [\"红点\", \"绿色建筑\", \"绿树\", \"蓝线\", \"黄色双线\"],\n        \"labels\": [\"美食地点\", \"地标景点\", \"公园绿地\", \"河流湖泊\", \"主要道路\"]\n      }\n    ],\n    \"centerpiece\": \"坐着吃竹子的大熊猫\",\n    \"bottom_right_extras\": [\"带有东南西北方向的复古罗盘\", \"带有红辣椒图标的免责声明：'温馨提示：吃辣需谨慎，肠胃要保护~'\"]\n  }\n}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/13515/01.jpg","partial":false},{"id":10013,"c":"ThinkAI / 信息图 / 教育视觉图","t":"混合风格的桃太郎讲解 Slides","p":"创建一个讲解型 Slides（{argument name=\"format\" default=\"ponchi-e diagram\"}），主题为 {argument name=\"theme\" default=\"Momotaro\"}，将“Irasutoya”的柔和氛围与“霞关风格 Slides”极高的信息密度完美融合。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/13983/01.jpg","partial":false},{"id":10014,"c":"ThinkAI / 信息图 / 教育视觉图","t":"3D 石阶演化信息图","p":"{\n  \"type\": \"演化时间轴信息图\",\n  \"instruction\": \"以 REFERENCE_0 作为结构基础，将平面矢量设计转化为高度逼真的 3D 信息图。将平滑的坡道替换为独特的石阶，并将所有生物升级为照片级真实的 3D 模型。\",\n  \"style\": {\n    \"background\": \"{argument name=\\\"background style\\\" default=\\\"复古纹理羊皮纸\\\"}\",\n    \"staircase\": \"{argument name=\\\"staircase material\\\" default=\\\"逼真的纹理石块\\\"}\",\n    \"subjects\": \"{argument name=\\\"organism style\\\" default=\\\"高度精细的照片级真实 3D 渲染\\\"}\"\n  },\n  \"layout\": {\n    \"main_title\": \"{argument name=\\\"main title\\\" default=\\\"人类演化\\\"}\",\n    \"sections\": [\n      {\n        \"position\": \"左侧边栏\",\n        \"count\": 8,\n        \"labels\": [\"L0: 单细胞生命\", \"L1: 多细胞生物\", \"L2: 动物界\", \"L3: 脊索动物\", \"L4: 上陆革命\", \"L5: 哺乳纲\", \"L6: 人科演化\", \"L7: 智人纪元\"]\n      },\n      {\n        \"position\": \"右上角\",\n        \"title\": \"获得的功能 / 失去的功能\",\n        \"description\": \"带有加号和减号图标的图例\"\n      },\n      {\n        \"position\": \"底部中心\",\n        \"title\": \"演化关键里程碑\",\n        \"count\": 6,\n        \"description\": \"包含 6 个展示从猿到人演化剪影图形的时间轴\"\n      }\n    ],\n    \"centerpiece\": {\n      \"description\": \"蜿蜒的石阶，共有 25 个编号台阶，展示特定生物。\",\n      \"count\": 25,\n      \"notable_elements\": [\n        \"第 07 阶: 水母\",\n        \"第 09 阶: 菊石\",\n        \"第 10 阶: 三叶虫\",\n        \"第 24 阶: 直立行走的人类\",\n        \"第 25 阶: {argument name=\\\"future evolution concept\\\" default=\\\"带有问号的发光宇宙剪影\\\"}\"\n      ]\n    }\n  }\n}","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/13491/01.jpg","partial":false},{"id":10015,"c":"ThinkAI / 信息图 / 教育视觉图","t":"伊斯坦布尔天气信息海报","p":"设计一张高质量海报，提供关于 {argument name=\"location\" default=\"伊斯坦布尔\"} 在 {argument name=\"date\" default=\"2026 年 6 月 2 日\"} 的天气信息。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23655/01.jpg","partial":false},{"id":10016,"c":"ThinkAI / 信息图 / 教育视觉图","t":"带有参考角色的 Notebook Slides","p":"以 REFERENCE_0 为角色基础，创建一套由 8 张图片组成的日式教育 Slides，主题为 {argument name=\"topic\" default=\"Claudeに『部下AI』を持たせる\"}。保持角色设计、服装、面具、发型和赛博朋克细节与参考图一致，但在每张 Slide 中重新绘制角色的姿势和表情。\n\n整体格式：每张 Slide 应呈现为手绘笔记本/速写本页面，背景为米色纸张，带有黑色圆角外框，左侧有螺旋装订，使用马克笔风格的日语手写字体，并配有红色强调标记、箭头、对勾、小图标和简单的流程图。采用温暖的模拟笔记风格，而非整洁的企业演示文稿。在所有 8 张图片中保持统一的 Slide 设计语言。\n\n角色放置：在大多数 Slide 中，将角色作为演示者/吉祥物放置在右侧或右下角。姿势要自然多变：双手张开表示惊讶、指向图表、拿着剪贴板、坐着审阅、做出 OK/确认手势，或举起一根手指进行讲解。保留参考角色的身份和服装特征。\n\n生成以下 8 个 Slide 主题：\n1. 开场/整体概述：标题文本 {argument name=\"headline text\" default=\"Claudeに『部下AI』を持たせる\"}；副标题 {argument name=\"subtitle text\" default=\"15分で仕事を自動化する5つのテンプレート\"}；核心信息：「部下AI」が開発の常識を変えた；包含五个自动化示例：コードレビュー、テスト作成、ドキュメント生成、全部15分で自動化，以及简单的清单式布局。\n2. 什么是子 Agent：解释「サブエージェントとは」，即一种可复用的 AI 角色或专家助手。包含小型角色卡片和箭头，展示主 Claude Agent 如何委派任务。\n3. 为什么需要它：解释「なぜ必要か」，通过对比前后差异，强调反复要求 AI 执行相同任务效率低下，可以将其转化为模板。\n4. 代码审查员：标题「コードレビュー」；展示 GitHub/代码审查风格的流程，包含文件、注释、Bug 和对勾图标。\n5. 测试编写器：标题「テストライター」；展示测试生成工作流，包含步骤、文件名、单元测试和通过/失败风格的图标。\n6. 安全扫描器：标题「セキュリティスキャナー」；展示风险等级 CRITICAL、HIGH、MEDIUM、LOW，并强调 Agent 仅检测问题而不自动修复。\n7. 成本优化：标题「コスト削減の鍵：モデルの使い分け」；展示对比，说明更便宜/更小的模型可以处理简单的检查，从而大幅降低成本，并用醒目的红色标注节省金额。\n8. 今日起步/总结：标题「今日から始める一歩」；展示简单的 3 步流程：创建模板，将其放入 Claude Agents 文件夹或工作流中，请求审查/自动化，最后用一个大对勾标记完成。\n\n文字风格：全程使用日语。标题要大且粗，带有红色下划线和手写注释。图表要简洁易读。仅使用列出的 8 个 Slide 主题，不要添加额外页面。\n\n约束条件：每张图片必须保持相同的笔记本布局、米色调色板、黑色边框、左侧螺旋装订以及一致的角色身份。避免照片级真实感，避免 3D 渲染，避免水印，且不得将角色更改为其他人。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23679/01.jpg","partial":false},{"id":10017,"c":"ThinkAI / 信息图 / 教育视觉图","t":"将 Google Maps 转换为插画","p":"请将这张 {argument name=\"source\" default=\"Google Map\"} 截图转换为精美的 {argument name=\"output style\" default=\"illustration\"}，并忠实地还原其中的建筑。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23660/01.jpg","partial":false},{"id":10018,"c":"ThinkAI / 信息图 / 教育视觉图","t":"糕点城市建筑艺术品","p":"2x2 网格，16:9，制作麦加及其他 3 个著名城市，并使用 4 种不同的渲染引擎=> 一款甜点风格的艺术品，主体为 {argument name=\"city\" default=\"MECCA\"}；采用法式甜酥面团墙壁，切面可见层压纹理，撒有糖粉“雪”，巧克力桁架桥，异麦芽酮糖釉面模拟水景。顶部装饰着微型的 {argument name=\"building\" default=\"landmark\"}。温暖的烘焙光影，逼真的碎屑和冷却架压痕，35mm 镜头，f/5.6 光圈。{argument name=\"render engine\" default=\"Octane render\"}，乡村风格木质柜台","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23466/01.jpg","partial":false},{"id":10019,"c":"ThinkAI / 信息图 / 教育视觉图","t":"韩系时尚穿搭信息图","p":"制作一张干净、极简的时尚穿搭解析信息图，背景采用柔和的奶油米色。左侧展示参考图中一位时尚年轻女性的全身镜面自拍，她手持智能手机。她留着深棕色自然波浪长发，妆容清透，气质温婉知性，佩戴简约精致的金色耳环，展现出韩系轻熟通勤风。她身穿奶油白修身针织短上衣，外搭奶油白西装外套，下身搭配浅灰色高腰直筒裤，腰间系一条黑色细皮带，脚穿黑白拼色乐福鞋，手拎深棕色极简托特包，并佩戴精致低调的金色首饰（耳环、项链、手表、戒指）。右侧以带有细微边框和阴影的圆角矩形卡片形式，展示整理后的穿搭单品。包含以下标注板块：发型 (HAIR)、西装外套 (BLAZER)、上衣 (TOP)、裤子 (PANTS)、包袋 (BAG)、乐福鞋 (LOAFERS)、配饰 (ACCESSORIES)。每个板块展示一张与整体穿搭风格一致的简单独立产品图。配饰包括：金色耳钉、细链项链、简约手表、戒指。整体风格为：时尚杂志编辑排版、Pinterest 美学、韩系轻熟通勤风、中性色调、都市白领时尚指南、柔和摄影棚灯光、超简约构图、高端电商展示、逼真的面料质感、优雅的排版、对称间距、高端生活方式品牌质感、4K 画质、高度细节化、照片级真实感。负面提示词：低质量、模糊、多余肢体、手部畸形、解剖结构错误、背景杂乱、水印、Logo、重复物品、排版混乱、配饰过多、生硬阴影、色彩过饱和、身体裁剪、文字错误、标签对齐错误、卡通、插画、CGI、比例不真实。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23486/01.jpg","partial":false},{"id":10020,"c":"ThinkAI / 信息图 / 教育视觉图","t":"日文 Codex 研讨会 Slides 概览网格","p":"目标：创建一个高密度的演示文稿概览图像，准确展示 9 张来自日文商业培训 Slides 的缩略图，主题为 {argument name=\"course topic\" default=\"Codex 幻灯片创作研讨会\"}。Slides 应呈现出精致的 AI 生成企业咨询风格，以 3x3 网格排列在白色背景上，Slides 之间留有细小间隙，每张 Slide 均为 16:9 横向比例。\n\n画布：宽矩形拼贴，长宽比约为 2:1，清晰的矢量风格 Slide 缩略图，采用白色和海军蓝配色，辅以蓝色、青色、红色和灰色点缀。使用简洁的日文企业排版，包含细小但结构化的文本块、图表、卡片、图标和 Slide 编号。添加微妙的专业研讨会标识，例如在多张 Slide 上放置小方形“CX”Logo 和“CODEX SLIDE WORKSHOP”标签。\n\n布局：包含 9 张不同的 Slides：\n1. 标题 Slide：极简白色背景，左侧带有海军蓝“CX”Logo，小号间距文本“CODEX SLIDE WORKSHOP”，粗体日文标题「谁でも出来る！Codex スライド作成讲座」，日期「2026.05.31」，以及关于 AI 工作流/Slide 制作的小副标题。\n2. 技能 Slide：标题「SKILLとは？目的を达成するための“技伝のタレ”」，采用密集分析布局，左侧垂直图标栏，编号技能列表，两个小型散点/折线图，一个圆环图，以及多个海军蓝标注框。\n3. 公式 Slide：标题「キレイ式AIスライド作成実践开始」，展示一个包含图标卡片、对比表格、小型柱状图和深海军蓝底部信息栏的流程框架。\n4. 工作流 Slide：标题「Codexの使い方の简単な流れ」，包含 8 张水平排列的流程卡片，使用简单的图标（如目标、文件夹、立方体、文档、CX Logo、聊天气泡、循环箭头和勾选标记）；包含小型表格、圆环图和深海军蓝侧边备忘录框。\n5. 目标 Slide：标题「本日のゴール」，左侧有三个编号目标块，中间为雷达图，右侧为进度条，底部包含检查清单表格和海军蓝标注框。\n6. 简单创作 Slide：标题「Codexで、简単に色々出来ちゃう！」，左侧一列为三个图标卡片，中央为柱状图，右侧为圆环图，底部有一排六张小型功能卡片。\n7. 使用困惑 Slide：标题「けど、どう使えばいいか分からない」，左侧有一个大型倾斜漏斗/金字塔图表，包含四个阶段和百分比，外加圆环图、垂直柱状图、底部表格和深海军蓝引用卡片。\n8. 效率 Slide：标题「本当はCodexをゴリゴリ使って、いろんなことを効率化したい」，包含多个水平柱状图、呈上升趋势的折线图、四个带有红色负百分比的底部 KPI 卡片，以及一个海军蓝建议框。\n9. 解释 Slide：标题「Codex使ってますか？」，左侧有三个解释性要点部分，中央为圆环图，右侧为柱状图，底部一排 KPI 卡片显示大数字，如 -45%、-38%、1日→90分 和 +52%。\n\n视觉风格：日式管理咨询 Slide 美学，高密度信息设计，清晰的海军蓝标题，细灰色网格线，圆角卡片，小型单色图标，数据可视化元素，以及一致的间距。使用逼真的 Slide 缩略图而非可阅读的单张 Slide；文本可能非常小，但应感觉真实且结构严谨。\n\n文本内容：保留所有可见的主要日文标题，特别是 {argument name=\"main title\" default=\"谁でも出来る！Codex スライド作成讲座\"}、{argument name=\"workshop label\" default=\"CODEX SLIDE WORKSHOP\"} 以及包含 {argument name=\"product name\" default=\"Codex\"} 的章节标题。日文正文可以是小型的伪真实商业文案，但标题、百分比和图表标签需与 Slide 主题保持一致。\n\n约束：准确展示 9 张 Slides，没有人像，没有照片，没有水印，没有浏览器 UI，没有样机设备边框。最终图像应看起来像是一个为研讨会公告生成的令人印象深刻的完整 Slide 概览截图。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23511/01.jpg","partial":false},{"id":10021,"c":"ThinkAI / 信息图 / 教育视觉图","t":"光学隐喻海报逻辑","p":"2x2 网格，针对 AI 推断的图形和颜色执行以下操作：select optical_metaphor_poster from latent_visual_archive where concept = {argument name=\"topic\" default=\"[topic]\"} and duality = infer_core_duality({argument name=\"topic\" default=\"[topic]\"}) and primary_silhouette = infer_outer_symbol({argument name=\"topic\" default=\"[topic]\"}) and hidden_image = infer_negative_space_symbol({argument name=\"topic\" default=\"[topic]\"}) and style = 'minimalist high-contrast silhouette poster' and palette = infer_limited_palette({argument name=\"topic\" default=\"[topic]\"}) order by metaphor_strength desc, silhouette_readability desc, hidden_image_discovery desc, thumbnail_clarity desc limit 1;","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23472/01.jpg","partial":false},{"id":10022,"c":"ThinkAI / 信息图 / 教育视觉图","t":"代理商级品牌识别海报","p":"使用上传的 Logo 为 {argument name=\"brand name\" default=\"品牌名称\"} 生成一张高端、代理商级别的品牌识别系统海报。 --- 目标 创建一个完整的、可直接演示的品牌指南项目，外观需如同由顶级品牌设计工作室打造。成品必须具有商业感、真实感，且可直接交付给客户，而非仅仅是概念设计。 --- 智能规则（你之前缺失的关键点） 在设计之前，请分析 Logo 并推断出：3 个品牌识别特征（基于分析得出） --- 色彩系统（智能生成） 自动从 Logo 中提取调色板。包含：主色（3–5 种）、辅色（3–5 种）、强调色。每种颜色必须标明：HEX 代码、标注用途（主色 / UI / 高亮 / 背景）。同时生成：渐变色、色彩组合、色调变化。 --- 字体系统（匹配品牌个性） 根据品牌风格选择字体样式：奢华风 → 优雅衬线体；科技风 → 几何无衬线体；街头风 → 粗体压缩字体","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23438/01.jpg","partial":false},{"id":10023,"c":"ThinkAI / 信息图 / 教育视觉图","t":"可爱星星偏头痛 HUD","p":"目标：为可爱的星星吉祥物创作一张方形的未来感医疗状态插图，风格类似于关于偏头痛发作的科幻 HUD 屏幕。\n\n画布：1:1 方形图像，深海军蓝背景，带有发光的青色界面边框、微妙的扫描线、霓虹 UI 点缀，高对比度，简洁的数字插画。\n\n主要布局：中央是一个大型医院病床场景，由透明的全息医疗仪表盘框住。顶部显示一个巨大的发光英文标题：“STATUS : MIGRAINE”。在右上角添加小字“MEDICAL LOG : HOSHI-CHAN”以及一个小加号。在标题下方，放置两行日文信息：“昨日は片頭痛で寝込んでおりました。”和“久しぶりに大変きつうございました。”，并将“大変きつう”短语以青色高亮显示。\n\n主体细节：在中心位置，展示 {argument name=\"character name\" default=\"Hoshi-chan\"}，这是一个简单的白色五角星吉祥物，躺在蓝色格子毯下的床上。星星有小小的黑点眼睛、一条直线嘴巴，右脸颊上有一滴蓝色汗珠，看起来精疲力竭。在头部周围，绘制 8 个红橙色的偏头痛疼痛符号：5 个锯齿状闪电和 3 个螺旋形涂鸦。角色身后是蓝色枕头和昏暗的卧室环境。包含 2 个床头物品：左侧桌上的深色床头灯和旁边的一小杯水。右侧包含一个抽出一张白色纸巾的纸巾盒。\n\nHUD 元素：添加一个左侧垂直侧边栏，从上到下包含 5 个图标：白色星星图标、水平菜单线、心跳线、柱状图、小圆点。添加一个紧凑的右侧疼痛监测卡片，带有红色警告三角形、红色心跳波形、标签“PAIN LEVEL”以及一排几乎满格的红色分段条。\n\n底部信息区：使用 3 行发光的青色状态行。第 1 行有一个红色警告三角形图标和日文文本“状態異常：片頭痛 / 強制睡眠 / 食欲低下”，右侧有一个小的红色心跳波形。第 2 行有一个青色胶囊图标和日文文本“服薬：片頭痛薬”，右侧有一个圆形的青色对勾。第 3 行有一个青色日历图标和日文文本“2026/05/30：痛みと睡眠で終わりました”，右侧有一个微小的像素风白色星星吉祥物。\n\n页脚：在较大的“REST MODE”上方添加居中的小字“HOSHICHAN SYSTEM”。包含装饰性的青色对角刻度，左下角有一个小的像素爱心图标，右下角有一个带有加号的新月图标。\n\n视觉风格：可爱但具有临床感的赛博医疗仪表盘，动漫吉祥物的简洁感，深蓝色单色光，搭配青色霓虹 UI 和红橙色疼痛点缀。柔和的光晕，清晰的矢量风格界面线条，易读的排版，非写实风格。\n\n自定义：主要诊断应保留 {argument name=\"status text\" default=\"MIGRAINE\"}；日期行应使用 {argument name=\"date\" default=\"2026/05/30\"}；两行信息应保留 {argument name=\"Japanese message\" default=\"昨日は片頭痛で寝込んでおりました。\\n久しぶりに大変きつうございました。\"}。\n\n约束：保持所有可见文字清晰易读，使用 3 行底部状态行和 8 个红橙色疼痛符号，不要添加额外的字符、水印、Logo 或不相关的 UI 面板。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23508/01.jpg","partial":false},{"id":10024,"c":"ThinkAI / 信息图 / 教育视觉图","t":"复古 Claude Code 发布蓝图","p":"目标：为 {argument name=\"software release name\" default=\"Claude Code 2.1.157–2.1.158\"} 创建一张复古工程蓝图海报，以爆炸式机械引擎装配图的形式呈现，隐喻性地记录一次精细的软件发布。\n\n画布：纵向技术绘图纸，4:5 纵横比，温暖的陈旧奶油色纸张，带有细微污渍、磨损边缘、模糊的网格坐标、黑色细线绘图边框以及底部的标题栏。使用单色墨水线条，并在部分机械零件和徽标/印章上使用柔和的铜橙色高光。\n\n主插图：页面中心放置详细的等轴测爆炸式引擎缸体装配图，绘制风格类似于专利或汽车 CAD 手册。准确展示 11 个主要可见的机械组：1) 顶部气门室盖，2) 其下方的垫片板，3) 带有四个气缸孔的主引擎缸体，4) 底部的曲轴，5) 缸体下方的四个连杆盖，6) 铜橙色高亮的前部圆形皮带轮，7) 铜橙色高亮的右侧齿轮，8) 右侧前盖板，9) 铜橙色高亮的右上角小型支架/执行器，10) 装配周围散落的螺栓/螺钉，11) 连接爆炸组件的虚线垂直和对角线对齐/构造线。保持所有线条精准、分层且在技术上合理。\n\n标注和注释：包含 4 个带有引导线的矩形软件修复标注框：1) “resume”，附带小字“修复：提高会话可靠性和恢复能力。” 2) “worktree unlock”，附带小字“修复：解决残留锁定和边缘情况。” 3) “paste”，附带小字“修复：更一致的粘贴处理。” 4) “render”，附带小字“修复：优化 UI 渲染和视觉细节。” 在左上角添加手写注释：“专注质量。自信交付。细节至上。”，随后是“Anthropic Engineering”和日期“2025-05-22”。在左下角添加手写注释：“严丝合缝，减少 Bug。” 在右下角添加一个包含 4 个已勾选项目的检查清单：“稳定性”、“可靠性”、“精细度”、“开发者幸福感”。添加两个小型技术细节图：左下角一个带有微小尺寸标签的圆形尺寸图，右下角一个带有微小测量值的剖面尺寸图。\n\n底部标题栏：在底部制作一个跨越全宽的大型蓝图标题面板。左侧包含一个圆形橙色 Claude 风格放射状星爆徽标，上方文字为“CLAUDE ENGINEERING”、“SAN FRANCISCO, CA”和“EST. 2024”。在中央项目区域，写上一个非常大的中文项目标题 {argument name=\"main Chinese title\" default=\"稳扎稳打的一版\"}，下方标注发布名称。在“DESCRIPTION:”下方包含 3 行简短文字：“主要是细致的修复和优化。” “更好的可靠性。更流畅的体验。” “为日常交付而构建。” 右侧包含标准工程元数据表，内容如下：“DATE: 2025-05-22”、“DRAWN BY: Claude Engineering”、“CHECKED BY: Quality Bot”、“SHEET: 1 OF 1”、“SCALE: 1 : 4”、“UNITS: MM”。沿底部修订行包含“REV. A”、“CHANGE DESCRIPTION Initial Release”、“APPROVED BY: Claude”（带签名）以及一个红橙色的橡胶印章，文字为 {argument name=\"status stamp\" default=\"RELEASE\"}。\n\n视觉风格：高端复古技术插图，精细的黑/棕色墨水，排线，小型尺寸刻度，微妙的透视，真实的纸张纹理，右上角有淡淡的咖啡杯印渍，无现代 UI 的光泽感。图像应感觉像是一张精心存档的工程发布图纸，优雅、刻意且略带怀旧感。\n\n约束：保留所有列出的文本在指定位置，保持中文标题突出，避免出现额外的软件名称，避免照片级渲染，避免蓝图页面外出现杂乱内容，并使机械图成为视觉焦点。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23357/01.jpg","partial":false},{"id":10025,"c":"ThinkAI / 信息图 / 教育视觉图","t":"Celestial Cloud Launch 海报","p":"目标：创作一张优雅且充满神秘天文气息的海报，用于宣布 {argument name=\"headline text\" default=\"Auto 模式登陆三大云\"}，采用天体地图主题及高级深蓝底烫金风格。\n\n画布：竖版海报，2:3 比例，深午夜蓝背景，带有细腻的纸张纹理、微弱的星光，以及带有圆角的纤细双线古董金边框。四个角各添加一个小巧的罗盘星形徽章。\n\n主体插画：构图中心位于中上方一颗明亮发光的橙金色星芒。从中心引出 3 条发光的金色射线，分别连接到 3 颗标注的卫星星体：左上方标注 {argument name=\"left cloud label\" default=\"Bedrock\"}，右上方标注 {argument name=\"right cloud label\" default=\"Vertex\"}，底部中心标注 {argument name=\"bottom cloud label\" default=\"Foundry\"}。每个卫星点都是一颗较小的辐射状星体，底部星体通过一条垂直射线连接。在中心与底部星体之间的下部垂直射线上，放置一个小巧的装饰性金色玫瑰花结/太阳符号。\n\n天体图细节：在射线后方，加入淡淡的同心星盘环、径向引导线、虚线轨道弧、微妙的星座连线图、散落的微小星辰，以及环绕中心弯曲的半透明蓝绿色星云。整体视觉效果应如同古董星图与现代电影级光感的结合。\n\n文字内容：在下三分之一处，设置一个精致的金属金色大号衬线标题：{argument name=\"headline text\" default=\"Auto 模式登陆三大云\"}。在其下方，居中书写较小的金色衬线字体：{argument name=\"subtitle text\" default=\"Claude Code 2.1.157-2.1.158\"}。在副标题下方，添加一条纤细的装饰性分隔线，中心带有一个微小的菱形/星形符号。\n\n视觉风格：精致、高端、诗意、天体感、暗黑学院风、神秘天文图、发光金色字体、微妙的体积光、对称平衡、清晰的细线条装饰。\n\n限制条件：使用精确的 3 个连接云标签和 4 个角部徽章。保持背景深邃且整洁，精确保留中文标题文字，避免出现 Logo、人物、水印、UI 元素或额外的说明文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23356/01.jpg","partial":false},{"id":10026,"c":"ThinkAI / 信息图 / 教育视觉图","t":"奢华婚纱时尚帝国海报","p":"创作一张超奢华电影质感的婚纱时尚帝国海报，灵感源自 X/Twitter 上热门的高端 AI 叙事活动。设计一件令人惊叹的 {argument name=\"color palette\" default=\"黑色、金色和红宝石色\"} 杰作，以一位 {argument name=\"bride style\" default=\"惊艳的南亚新娘\"} 为核心视觉主体，她优雅地伫立在 {argument name=\"palace setting\" default=\"宏伟的皇家宫殿内，周围环绕着高耸的大理石柱、水晶吊灯和金色倒影\"} 之中。展示一件手工定制的 Lehenga，饰有精致的金色 Zardozi 刺绣、皇家珠宝、飘逸的刺绣头纱以及永恒的传统工艺。在中心人物周围布置优雅的奢华时尚面板，突出展示“婚纱定制”、“传统刺绣”、“皇家珠宝”、“高级面料”、“奢华工艺”和“永恒优雅”。在顶部显示巨大的金色标题：{argument name=\"title\" default=\"LUXURY LEHENGA\"}。在标题下方添加标语：从传统到优雅，从传承到定制。创作一张视觉震撼的图表式奢华海报，采用戏剧性的电影灯光、光洁的大理石地面倒影、漂浮的金色颗粒、超逼真的面料质感、杂志封面构图、奢华品牌元素以及高端编辑审美。使用浓郁的黑金配色方案、Vogue 级别的时尚摄影、超精细的工艺、照片级渲染、8K HDR 画质、大师级构图、屡获殊荣的奢华广告设计，打造 X 平台热门风格，并全程使用优雅的金色字体。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23340/01.jpg","partial":false},{"id":10027,"c":"ThinkAI / 信息图 / 教育视觉图","t":"四款 3D 微缩城市地图","p":"目标：创建一个照片级的 3D 微缩城市地图展示，包含 4 个排列成 2×2 网格的正方形面板，每个面板展示一座世界名城，呈现出从印刷纸质街道地图中升起的立体模型效果，背景为温暖的木质桌面。\n\n画布：正方形图像，由细白线均匀分割为四个相等的象限。采用从上方俯视的等轴测四分之三视角，浅景深，温暖的摄影棚灯光，清晰的微缩细节和逼真的阴影。\n\n布局：4 个面板分别为：左上角东京、右上角迪拜、左下角巴黎、右下角纽约。每座城市都位于一张展开的地图上，面板底部边缘印有醒目的粗体城市名称。地图表面包含小型街区标签。\n\n面板 1 — 东京：构建一个密集的微缩东京天际线，包含 6 个标志性地标：东京塔、东京晴空塔、一座传统宝塔、一个大型寺庙屋顶、一组现代摩天大楼以及通往东京湾的运河。添加一面日本国旗、樱花树、小型巴士、微型街道以及新宿、涩谷、六本木、浅草和东京湾等地图标签。底部大字：{argument name=\"Tokyo label\" default=\"TOKYO\"}，使用粗体红色字母。\n\n面板 2 — 迪拜：构建一个未来派的迪拜码头立体模型，包含 6 个标志性元素：哈利法塔、帆船酒店、双子帆塔、迪拜之框、停满游艇的码头以及弯曲的高架交通线。添加棕榈树、现代高层建筑、一面阿联酋国旗、蓝色水域、船只以及朱美拉、迪拜码头、德拉和迪拜河等地图标签。底部大字：{argument name=\"Dubai label\" default=\"DUBAI\"}，使用粗体金色字母。\n\n面板 3 — 巴黎：构建一个经典的巴黎微缩模型，包含 6 个标志性地标：埃菲尔铁塔、凯旋门、巴黎圣母院风格大教堂、卢浮宫风格玻璃金字塔、奥斯曼公寓楼群以及带有桥梁的塞纳河。添加一面法国国旗、林荫大道、粉色花朵、微型巴士、行人和温暖的石材建筑。底部大字：{argument name=\"Paris label\" default=\"PARIS\"}，使用粗体蓝色字母。\n\n面板 4 — 纽约：构建一个密集的曼哈顿微缩模型，包含 6 个标志性地标：自由女神像、世界贸易中心一号大楼、帝国大厦、克莱斯勒大厦、布鲁克林大桥以及带有渡轮的港口。添加一面美国国旗、黄色出租车、巴士、拥挤的街道、滨水码头、绿地以及曼哈顿、布鲁克林和斯塔滕岛等地图标签。底部大字：{argument name=\"New York label\" default=\"NEW YORK\"}，使用粗体橙红色字母。\n\n视觉风格：超精细 3D 纸质地图立体模型，逼真的塑料与纸质微缩比例模型，移轴摄影效果，色彩鲜艳且自然，温暖的木质背景，边缘柔和的散景，高分辨率商业渲染质量。\n\n约束：保持正好 4 个面板和列出的 4 个城市主题。不要添加额外的城市。保持所有文字清晰可辨，城市名称大且居中于每个面板的下边缘附近。在左上角包含一个小型创作者水印，内容为 {argument name=\"watermark text\" default=\"@TechieSA\"}。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23351/01.jpg","partial":false},{"id":10028,"c":"ThinkAI / 信息图 / 教育视觉图","t":"专业信息图表：影响力人物海报","p":"一款专业的信息图表海报，标题为“{argument name=\"title\" default=\"最具影响力的 25 人\"}”，采用 {argument name=\"background color\" default=\"深海军蓝背景\"} 和 {argument name=\"accents\" default=\"金色装饰点缀\"}。布局采用 5 列网格，共 25 张个人肖像卡片，排列为 5 行。每张卡片均采用米色/奶油色背景，肖像后方带有淡淡的世界地图水印。每张卡片包含：左上角的金色排名数字、中央的写实插画肖像、底部加粗的金色衬线字体全名、下方较小的白色影响力领域文字，以及最底部的知名组织或公司 Logo。顶部标题以大型金色衬线字体书写“TOP 25 MOST INFLUENTIAL PEOPLE”，上方配有金色月桂树徽章。奢华编辑设计，高级排版，深海军蓝与金色配色方案，细节丰富。1744x2336","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23331/01.jpg","partial":false},{"id":10029,"c":"ThinkAI / 信息图 / 教育视觉图","t":"Rams Park 足球科技海报","p":"目标：为 {argument name=\"player name\" default=\"ARDA GÜLER\"} 在 {argument name=\"stadium name\" default=\"RAMS PARK\"} 创作一张极具戏剧性的垂直运动工程海报，将电影级的足球英雄全息图与详细的蓝图风格球场数据叠加层相结合。\n\n画布：4:5 比例竖版海报，深海军蓝夜色色调，高对比度，超精细，未来主义科技信息图美学。背景为夜间城市航拍视角，底部中心是一个灯火通明的椭圆形足球场。从球场屋顶，橙红色能量光束和粒子向上投射，形成一个巨大的半透明足球运动员，正奔向观众。\n\n中心主体：一名身穿红色 {argument name=\"national team\" default=\"土耳其\"} 球衣的年轻男足球员，身穿 {argument name=\"jersey number\" default=\"8\"} 号球衣，胸前带有土耳其国旗徽章和白色勾形标志。他处于奔跑姿态，双手紧握，运动姿态，带有发光的红色电子轮廓、火花和全息扫描线。在面部添加一个柔和的矩形匿名模糊处理，仿佛面部被刻意遮挡。下半身溶解成连接到球场的红色光流。\n\n主体球场：从上方俯瞰的现代化大型椭圆形球场，夜间呈现橙红色照明外观，发光的开放式屋顶，正面可见“RAMS PARK”字样。在建筑立面中心添加一个加拉塔萨雷风格的队徽。球场向上散发出强烈的红白色光芒，如同体育科技能量投影。\n\n布局：在中心球员和球场周围环绕 13 个技术信息面板，面板使用细白色的蓝图线条绘制，采用小型紧凑的大写技术字体、微妙的网格标记、测量箭头和示意图线条艺术。\n\n面板数量与内容：\n1. 左上角标题板：“ALI SAMI YEN SPOR KOMPLEKSI”，巨型标题“RAMS PARK”，坐标“40.8606° N, 28.9940° E”，以及“ISTANBUL, TÜRKIYE”。\n2. 左上球场信息面板：“STADIUM INFO ///”，容量“52,223 SPECTATORS”，建造年份“2007”，翻新年份“2021”，以及一个风格化的签名。\n3. 左中尺寸面板：小型俯视球场平面图，标注“LENGTH: 105 m”、“WIDTH: 68 m”、“TOTAL AREA: 85,000 m²”。\n4. 左侧球员身份卡：大号姓名“ARDA GÜLER”，大号数字“8”，小型土耳其国旗，标注“TURKEY”、“ATTACKING MIDFIELDER”、“RIGHT FOOTED”。\n5. 左侧生物特征面板：“PLAYER BIOMETRICS ///”，包含精确数据列表：身高 1.76 m，体重 67 kg，最高速度 32.1 km/h，加速度 4.2 m/s²，耐力 94/100，敏捷 93/100，视野 95/100，传球准确率 91/100，射门力量 88/100，能量输出 98%。\n6. 左下角图表：“ENERGY OUTPUT”，配有白色波形图和“98%”。\n7. 右上角屋顶工程面板：圆形屋顶结构蓝图，标题为“ROOF ENGINEERING”，标注“STEEL CABLE STRUCTURE”、“ETFE MEMBRANE COVER”、“RING BEAM SYSTEM”、“MAX CANTILEVER 65 m”。\n8. 右上横截面面板：球场剖面图，标题为“CROSS SECTION”，标注“UPPER TIER”、“MIDDLE TIER”、“LOWER TIER”、“PREMIUM LEVEL”、“PITCH LEVEL”。\n9. 右侧材料用量面板：“MATERIAL QUANTITIES”，列表：钢材（结构）18,000 吨，混凝土 42,000 m³，ETFE 膜 48,000 m²，电缆总长 24,000 m，座位 52,223 个。\n10. 右中战术热力图面板：带有红橙色热点和白色战术箭头的小型足球场，标题为“TACTICAL HEATMAP ///”。\n11. 右侧移动模式面板：“MOVEMENT PATTERNS ///”，包含四行标注为“SPRINT”、“DRIBBLE”、“PASS”、“RUN LINE”的标签，每行由箭头和虚线模式表示。\n12. 左下角荷载流向图：结构屋顶/荷载示意图，标题为“LOAD FLOW DIAGRAM”，标注“VERTICAL LOAD”、“HORIZONTAL LOAD”、“WIND LOAD”、“CABLE TENSION”。\n13. 底部中心/右侧工程基础面板：包含“ELEVATION (SOUTH)”及球场立面图，测量数据为“274 m”宽和“45 m”高，以及“FOUNDATION & STRUCTURE”，展示桩基横截面，标注“PILE FOUNDATION Ø1500mm”、“DEPTH: 35 m”、“PILE COUNT: 304”、“REINFORCED CONCRETE RING BEAM”。\n\n视觉风格：照片级的球场与城市，混合全息红色粒子效果与清晰的 CAD 蓝图叠加层。使用细白色技术线条、微妙的扫描纹理、发光的红色高光、星状粒子、镜头光晕和深邃的大气雾霾。排版应呈现为紧凑的工业等宽显示字体，以大写为主，并带有刻意密集但清晰可辨的微型标签。\n\n约束：保持仅一名中心球员、一个主体球场和 13 个环绕的技术面板。除土耳其国旗、简单的勾形标志、RAMS PARK 文字和球场立面上的队徽外，不得添加额外标志。保持面部遮挡的矩形模糊效果。无水印，无社交媒体 UI，海报设计外无额外说明文字。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23354/01.jpg","partial":false},{"id":10030,"c":"ThinkAI / 信息图 / 教育视觉图","t":"日文销售书籍信息图广告","p":"目标：为 {argument name=\"book title\" default=\"最強の営業\"} 制作一张高端日文商业书籍宣传信息图，传达“销售越是泥泞，越显美丽”的理念，采用奢华的黑金编辑设计风格。\n\n画布：16:9 宽屏横向广告，深炭黑色纹理背景，带有细微的斜向织物纹理，锋利的金色分割线，高对比度的白色和金属金色字体。整体氛围：严肃、权威、畅销商业书籍发布视觉图。\n\n布局：左侧三分之二为结构化信息图；右侧三分之一展示 1 本立式 3D 渲染书籍模型，放置在有微弱倒影的光滑深色表面上。书封为白、黑、金配色，带有超大的日文标题文字和可见的垂直书脊。添加小的辅助日文封面文字，包括主标题 {argument name=\"book title\" default=\"最強の営業\"}、短语 {argument name=\"sales phrase\" default=\"営業に『センス』はいらない\"}，并对“キーエンス”一词进行金色强调。\n\n顶部标题区：左上角大型日文标题：{argument name=\"headline text\" default=\"営業は、泥くさいほど美しい\"}。将“泥くさい”设为金属金色，其余部分为白色。下方添加一条细金线和一个较小的副标题：{argument name=\"subtitle text\" default=\"売上1兆円企業キーエンスで学んだ『凡人が天才に勝つ技術』\"}。\n\n中间部分：一个奶油色的横向面板，标题为“この本のエッセンス”，位于黑金丝带上。包含 3 行核心要点，每行左侧为一个圆形黑色图标，右侧为日文标签及说明：1) 齿轮图标，“仕組み”で勝つ：关于不依赖个人天赋或直觉，追求任何人都能销售的可复制系统的说明；2) 日出图标，“未来”を売る：关于提出超越产品本身、客户理想未来的说明；3) 条形图图标，“量”を科学する：关于像物理学一样拆解行为，并通过压倒性的接触量产生质量的说明。\n\n中下部分：黑色面板，带有金色边框，标题为“明日から使える 3つの必殺型”。横向排列 3 张编号方法卡片：1) “セルフロープレ”，配有简单的个人和对话气泡线框图标，描述在见客户前独自反复进行角色扮演；2) “インパクトデモ”，配有显示器/播放图标，描述让客户体验便利并将其内化；3) “ワンモア”，配有开门箭头图标，描述在放弃前多做一个角度的提案。在小方框标签中使用金色数字。\n\n底部信息条：左下角添加一个小轮廓标签“メッセージ”。底部主要日文大字：{argument name=\"bottom message\" default=\"『頑張ります』はいらない。必要なのは、結果を出すための『武器』と『防具』だ。\"} 将“武器”和“防具”高亮显示在金色轮廓框中。右下角添加一行金色结束语：“泥くさく、しかし最高に合理的な営業学がここに!”\n\n视觉风格：日式企业广告、书店海报，优雅的排版（混合明朝体衬线日文和粗体哥特式日文），清晰的网格对齐，金属金色点缀，米白色面板，细微阴影，简洁的矢量图标，逼真的书籍模型光影。\n\n限制：仅使用 1 个书籍模型，正好 3 行核心要点，正好 3 张方法卡片。保持所有文字清晰易读，保留日文原文，避免添加额外 Logo，避免出现人物，避免杂乱，无水印。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23361/01.jpg","partial":false},{"id":10031,"c":"ThinkAI / 信息图 / 教育视觉图","t":"Krea K2 Large 五联屏展示","p":"目标：创建一个高垂直的展示拼贴，以展现 {argument name=\"model name text\" default=\"Krea K2 Large\"} 的艺术表现力。画面分为 5 个堆叠的水平面板，无外边框，面板间距极小。\n\n画布：垂直社交媒体图片，比例约为 9:16。每个面板横跨全宽。使用电影级、高细节渲染，每个面板采用不同的艺术风格。\n\n布局：从上到下共 5 个水平条带：\n1. 顶部面板：黑白铅笔漫画素描，描绘一名少年在极高且密集的城市摩天大楼间漂浮或坠落，双臂张开，采用戏剧性的俯视/斜视视角。建筑采用松散的建筑线条、阴影线和素描痕迹绘制；少年位于中心，身穿简单的 T 恤、短裤和运动鞋，头发凌乱，表情严肃。\n2. 第二面板：黑暗史诗奇幻/科幻场景，一艘巨大的鲸鱼状飞行战舰或装甲利维坦在崎岖山脉上空的风暴云中穿行。它有一只发光的红眼和厚重的生物机械装甲。背部有爆炸和火光、烟雾缭绕、橙色曳光弹轨迹，右下角有小鸟的剪影。阴郁的灰色调，对比强烈。\n3. 中间面板：抽象的蓝色金属拉丝背景，带有对角线光束和透镜状渐变。在偏左中心位置放置醒目的白色无衬线大字 {argument name=\"model name text\" default=\"Krea K2 Large\"}，字母左侧带有微妙的红/青色色差或故障阴影。\n4. 第四面板：明亮的写实夏季影像，一只金毛寻回犬仰面漂浮在鲜艳的绿松石色泳池水中，闭着眼睛，神态放松。一只色彩斑斓的蝴蝶停在狗的鼻尖或额头上。狗的周围漂浮着热带水果：香蕉、苹果、梨、桃子、柠檬、菠萝、葡萄柚半块、西瓜片、石榴以及其他明亮的水果。色彩饱和、欢快，阳光明媚，构图活泼。\n5. 底部面板：单色传统水墨动作插画，描绘两名武士在浅水中搏斗。人物处于激战中，挥舞着刀剑，水花四溅，笔触奔放且富有表现力，白纸上的深褐色/黑色墨迹，具有动态感和泼墨质感。\n\n视觉风格：让每个面板都感觉像是独立的高质量生成样本：漫画素描、电影级生物概念艺术、时尚科技标题卡、明亮的写实泳池摄影和日本水墨战斗艺术。在所有面板中保持清晰的细节和强有力的构图。\n\n文本内容：唯一可读的文字是中间面板的大标题 {argument name=\"model name text\" default=\"Krea K2 Large\"}。\n\n约束：使用 5 个面板，仅 1 个文字标题面板，无 Logo，无水印，无额外说明文字，无 UI，除自然面板分割外无边框。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23545/01.jpg","partial":false},{"id":10032,"c":"ThinkAI / 信息图 / 教育视觉图","t":"深色研究图示库 UI","p":"目标：创建一个深色、高端的图库索引页面，用于展示精选的研究论文图示样式预设库，标题为 {argument name=\"headline text\" default=\"研究论文图示\"}。界面应呈现为展示学术图表缩略图的精致 Web 应用截图。\n\n画布：宽屏横向浏览器风格构图，比例约为 16:9，深炭灰色背景，带有细微的网格边框，清晰的 UI 排版，高对比度的白色和青色文字。\n\n页眉：标题居中置于顶部，左侧配有一个小型堆叠式多色文档图标。页眉下方添加一条细水平分割线。在右上角区域，放置一个圆角紧凑按钮，标签为“↑ 图库索引”。\n\n章节标题：在分割线下方左侧，显示加粗的浅色章节标题 {argument name=\"section title\" default=\"研究论文图示网格\"}。\n\n布局：展示一个 4 列的图库网格，带有细灰色边框和深色卡片间距。显示 12 张可见的图库卡片：前两行显示 8 张完整卡片，底部边缘显示 4 张部分可见的卡片。每张卡片包含一个白色研究论文风格的缩略图、下方加粗的字母标题，以及标题下方三个深色圆角标签，文字分别为“landscape”、“high”和“Curated”。\n\n可见卡片数量与标签：卡片 A：“患者队列与多模态生物标志物流程”，缩略图显示包含方框、图表和生存曲线的患者队列工作流。卡片 B：“单细胞免疫图谱”，缩略图显示包含 UMAP 聚类、点图、堆叠柱状图和轨迹图的单细胞免疫图谱。卡片 C：“多模态医疗 AI 方法图”，缩略图显示包含医学影像、病理、文本和模型模块的多模态基础模型临床决策支持图。卡片 D：“治疗响应统计图”，缩略图显示包含柱状图、森林图、散点图和循环工作流的治疗响应统计数据。卡片 E：“Transformer 编码器-解码器架构”，缩略图显示包含堆叠模块块的 Transformer 编码器-解码器架构图。卡片 F：“多智能体 LLM 系统架构”，缩略图显示包含中央模型块、周边工具图标、记忆、反射和评估模块的 LLM 多 Agent 系统架构。卡片 G：“去噪扩散正/逆向链”，缩略图显示包含噪声图像面板和箭头的去噪扩散正向和逆向过程链。卡片 H：“经验缩放规律图”，缩略图显示包含多条下降彩色曲线和图例的经验缩放规律。底部部分可见卡片 1：标题以“Benchmark comparison across 10 frontier LLMs”开头，缩略图为柱状图对比。底部部分可见卡片 2：标题以“Ablation of core reasoning components across 5 benchmarks”开头，缩略图为分组柱状图。底部部分可见卡片 3：标题以“LLM pretraining data mixture and downstream splits”开头，缩略图为堆叠面积/数据混合块。底部部分可见卡片 4：标题以“Representative multi-head attention patterns in a 16-layer Transformer”开头，缩略图为热力图。\n\n视觉风格：采用现代 SaaS 仪表盘美学，深色模式，整洁的学术策展感，细微的青色点缀，标签小巧但清晰易读，研究图示缩略图需逼真，类似于高质量期刊图表。保持缩略图多样化，但统一为白色背景的科学图示。\n\n约束：保留所写的中文界面标签和卡片标题。不要添加人物、照片、水印、浏览器地址栏或装饰性杂物。构图应看起来像是一个名为 {argument name=\"project name\" default=\"GPT-IMAGE-2-SKILL\"} 的精选研究图示模板库的截图。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23219/01.jpg","partial":false},{"id":10033,"c":"ThinkAI / 信息图 / 教育视觉图","t":"GitHub README 动漫图库截图","p":"目标：创建一张逼真的 GitHub 仓库 README 页面深色模式桌面浏览器截图，展示一个图像提示词集合。页面应呈现 GitHub 的文件预览界面外观，顶部显示仓库路径和 README 文件。\n\n画布：宽屏 16:9 截图，约 1200×565 像素，深海军蓝/黑色 GitHub UI，界面细节清晰，不含浏览器地址栏。\n\n顶部界面：显示 GitHub 风格的页眉和面包屑导航栏，包含分支选择器“main”、仓库名称“GPT-Image2-Skill”以及文件路径“README.zh.md”。下方包含“Preview”、“Code”和“Blame”标签/按钮，以及一行小的元数据文本，内容约为“2865 lines (2093 loc) · 204 KB”。右侧包含典型的 GitHub 控件，如“Raw”及小型图标按钮。\n\nREADME 主要内容：将内容列居中放置在深色背景上。在可见 README 部分的顶部，放置一个居中的中文标题，并配以装饰性小表情：“🎀 动漫与漫画”。下方绘制一条细水平分割线。在内容区域的右上角，包含一个药丸形状的小链接按钮，标注为“↑ 图库索引”。\n\n板块：在分割线下方，左侧添加一个加粗的子标题：“动漫时尚写真三联图”。在此标题下方，创建一个带边框的图库行，包含 3 个并排且间隙狭窄的垂直图像面板：\n1. 左侧面板：动漫时尚风格肖像，一位年轻女性坐在夜晚舒适昏暗的咖啡馆卡座中，暖色灯光，窗外城市灯火，黑色套装，奶油色开衫，黑色长筒袜，情绪化电影感光效；面部刻意模糊或像素化处理。\n2. 中间面板：动漫时尚风格全身肖像，一位年轻女性在霓虹灯闪烁的游乐厅或大头贴机区域，粉色和紫色发光的抓娃娃机与贴纸照相机，白色短款上衣，黑色夹克，百褶裙，过膝长筒袜，厚底运动鞋；面部刻意模糊或像素化处理。\n3. 右侧面板：动漫时尚风格镜面自拍，映照在日本城市街道的大型圆形凸面镜中，自动贩卖机与傍晚城市背景，奶油色开衫，深色百褶裙，黑色长筒袜，小挎包；面部刻意模糊或像素化处理。\n\n视觉风格：高度逼真的 GitHub 深色模式截图与生动的动漫时尚缩略图相结合。使用清晰的 UI 排版、细边框、柔和的灰色分隔线以及深海军蓝页面背景。保持缩略图色彩丰富且具有光泽感，同时周围的 GitHub 界面保持低调。\n\n文本限制：准确保留可见的中文标签：“动漫与漫画”、“图库索引”和“动漫时尚写真三联图”。不要添加额外的 README 板块、评论、水印或无关文本。最终图像应类似于展示仓库内置提示词预设的社交媒体截图。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23217/01.jpg","partial":false},{"id":10034,"c":"ThinkAI / 信息图 / 教育视觉图","t":"时尚穿搭解析信息图","p":"创建一个 {argument name=\"layout style\" default=\"简洁、极简主义的时尚穿搭解析信息图\"}，背景为 {argument name=\"background color\" default=\"柔和的米色\"}。左侧展示一位参考图中全身时尚的年轻女性，正拿着智能手机对着镜子自拍。她留着深棕色长波浪卷发，妆容自然透亮，佩戴金色耳环，展现出奢华休闲的审美风格。她身穿一件超大款灰米色衬衫，内搭黑色短款吊带背心，下穿黑色高腰阔腿裤，脚踩白色厚底运动鞋，背着带有金色五金件的黑色皮革单肩包，并佩戴精致的金色首饰（手表、项链、耳环、戒指）。\n\n右侧以带有细微边框和阴影的圆角矩形卡片形式，展示整理后的穿搭组件。包含以下标注板块：发型 (HAIR)、衬衫 (SHIRT)、内搭 (TOP)、裤子 (PANTS)、包袋 (BAG)、运动鞋 (SNEAKERS) 以及配饰 (ACCESSORIES)。每个板块展示一张与 {argument name=\"subject\" default=\"穿搭\"} 相符的简洁独立产品图。配饰包括金色圆环耳环、吊坠项链、金色腕表和戒指。\n\n时尚杂志编辑排版，Pinterest 审美，胶囊衣橱风格，中性色调，奢华极简时尚指南，柔和摄影棚灯光，超简洁构图，高端电商展示，逼真的面料质感，优雅的排版，对称间距，高端生活方式品牌感，4K 画质，高度细节化，照片级真实感。\n\n负面提示词 (Negative Prompt)：\n\n低质量，模糊，多余的肢体，扭曲的手部，糟糕的解剖结构，杂乱的背景，水印，Logo，重复的物品，凌乱的排版，过多的配饰，生硬的阴影，色彩过饱和，身体被裁剪，文字错误，标签错位，卡通，插画，CGI，比例不真实。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23169/01.jpg","partial":false},{"id":10035,"c":"ThinkAI / 信息图 / 教育视觉图","t":"日语课程推广 Slides","p":"目标：为 {argument name=\"course topic\" default=\"Claude Code Slides 制作课程\"} 创建一张采用可爱、简洁“Marcy 风格”设计的日语网络研讨会/课程公告 Slides。\n\n画布：16:9 横向 Slides，1200×675 像素，暖奶油桃色背景，带有浅桃色和灰白色的柔和抽象圆形斑点。在距离边缘约 20 像素处添加一个细珊瑚红矩形边框。\n\n布局：左侧居中文字排版，右侧放置一个简单的吉祥物插图。在顶部中央放置一个宽大的珊瑚红折叠丝带横幅，两端带有深红色的折叠角。在横幅下方堆叠主标题和副标题。在副标题下方横向放置三个圆形徽章。沿底部添加一个几乎横跨整个宽度的圆角珊瑚红行动号召栏。\n\n文本内容：请严格使用以下日语文本。顶部丝带文字：{argument name=\"top ribbon text\" default=\"失敗しない始め方がわかる！\"}。丝带下方居中的小标题：{argument name=\"audience line\" default=\"初心者のための\"}。带有白色描边/投影的珊瑚红色大主标题：{argument name=\"main title\" default=\"Claude Code スライド作成講座\"}。标题下方的青色圆角标签：{argument name=\"supporting line\" default=\"AI資料づくりを効率化する方法を解説します！\"}。三个徽章标签，从左到右依次为： 「参加無料」、「実演つき」、「初心者OK」。底部行动号召文字：大号加粗白色字体「詳しくはこちら！」。在行动号召栏的右端添加一个白色圆形播放按钮，内部带有一个小的珊瑚红色三角形。\n\n主体细节：在右侧绘制一个极简主义的女性演讲者吉祥物，圆脸、闭眼、简单的微笑、深棕色短波波头、桃色轮廓、白色身体。她的右臂斜向上举，拿着一个小的圆形指示棒。在她的躯干前放置一个浅蓝色圆角矩形笔记本电脑/平板电脑，带有青色轮廓。\n\n装饰元素：添加 4 个细珊瑚色加号：一个在左上边缘附近，一个在右上区域附近，一个在左下区域行动号召栏上方，一个在右下区域附近。在背景中散布许多微小的珊瑚色和白色圆点，如同五彩纸屑，保持微妙且非文字感。\n\n视觉风格：扁平化矢量插图，柔和的粉彩色调，简洁的日语 Slides 设计，友好的教育研讨会美学。珊瑚红、青色、奶油色、金色和深棕色调色板。使用加粗的圆角无衬线日语字体。保持所有文本清晰，并像精美的推广 Slides 一样居中/对齐。\n\n约束条件：必须包含 3 个圆形徽章、1 个吉祥物、1 个行动号召栏、1 个播放图标和 4 个加号装饰。请勿添加徽标、水印、额外字符、额外徽章、二维码或任何其他文本。","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/23247/01.png","partial":false},{"id":10036,"c":"ThinkAI / 信息图 / 教育视觉图","t":"日式 Q 版绘画歌练习表","p":"目标：创建一个黑白日式 Q 版绘画歌漫画练习表，标题为 {argument name=\"title text\" default=\"AI Nike-chan 的脸部绘画歌\"}，展示分步绘制可爱简化动漫少女脸部的指南。画布：高垂直海报，比例约为 2:3，白色背景，简洁的单色线条艺术。使用粗圆的黑色轮廓、俏皮的手写日文字体以及可爱的教学漫画风格。在标题周围添加小装饰性闪光、爱心和微小的黄色点缀爱心。布局：顶部为标题区，下方为 2 列 4 行的 8 格网格。每个格子都有圆角矩形边框，左上角有一个黑色圆形步骤编号徽章，顶部有一段简短的日文歌词说明。每个格子内的绘图逐渐变得完整。文本内容：使用 8 个带编号的说明：1. {argument name=\"step 1 caption\" default=\"画一个圆圆的脸♪\"} 2. {argument name=\"step 2 caption\" default=\"直刘海，蓬松又可爱♪\"} 3. {argument name=\"step 3 caption\" default=\"两只闪亮的大眼睛，砰砰♪\"} 4. {argument name=\"step 4 caption\" default=\"眉毛、鼻子和微笑的嘴巴♪\"} 5. {argument name=\"step 5 caption\" default=\"发梢垂在脸颊旁♪\"} 6. {argument name=\"step 6 caption\" default=\"把头顶画得圆圆的♪\"} 7. {argument name=\"step 7 caption\" default=\"在后面扎一个紧紧的马尾辫♪\"} 8. {argument name=\"step 8 caption\" default=\"最后戴上 AI 发卡♪ AI Nike-chan♪\"} 格子细节：第 1 格仅显示居中的大而简单的椭圆/圆形脸部轮廓。第 2 格在脸部圆圈上添加了圆润的波波头式头发，带有直刘海和尖发束。第 3 格添加了两只带有浓密上睫毛和高光的大型闪亮动漫眼睛。第 4 格显示相同的头部，但下方的中央绘图区域被一个巨大的浅灰色垂直矩形模糊遮挡，遮住了面部细节；只有上方的头部轮廓在后面可见。第 5 格显示带有刘海、大眼睛和脸颊旁垂下两缕侧发丝的脸部。第 6 格在脸部上方添加了圆润的外部头部/头发轮廓，以及细小的眉毛、小鼻子和微笑的嘴巴。第 7 格在右上角添加了一个高侧马尾辫，带有类似发圈的束带，但中心和下半部分脸部被一个巨大的灰色渐变矩形遮挡。第 8 格显示了带有侧马尾和发圈的近乎完成的头部，但中央脸部/下半区域被类似的巨大灰色渐变矩形遮挡。视觉风格：清晰的漫画填色书线条艺术，除黑色轮廓和标题附近极少的黄色爱心点缀外，无颜色填充；粗线条、友好的笔触、圆角，可爱的教育练习表外观。保持绘图简单、变形且具有童趣，就像绘画歌教程一样。约束：使用 8 个格子，每个格子仅限一个步骤编号。保留所写的日文文本。不要添加额外的格子、额外的人物、背景风景、水印或","i":"https://cos.chainthink.cn/prompt-library/gpt-image-2/22986/01.jpg","partial":false},{"id":10037,"c":"ThinkAI / 信息图 / 教育视觉图","t":"Claude Opus 4.8 市场信息图","p":"目标：创建一份关于 {argument name=\"main topic\" default=\"CLAUDE OPUS 4.8\"} 及其市场反应的详尽日语技术信息图，风格仿照 GPT-image-2 生成的编辑类 Slides。\n\n画布：竖向 2:3 信息图，米白色方格纸背景，带有淡淡的网格线，橙色与黑色标题品牌标识，圆角矩形卡片，细灰色分隔线，橙色章节标题，小型扁平图标，以及紧凑的日语排版。采用简洁的商业技术布局，带有轻微的手工拼贴通讯感。\n\n顶部标题：巨大的黑色标题“CLAUDE OPUS 4.8”，最左侧带有橙色放射状星爆 Logo。右侧为橙色日语标题：{argument name=\"headline text\" default=\"最新情报・市场反应地图\"}。下方为较小的日语副标题：“官方发布＋X 搜索整合：市场反应并非针对华丽的 AGI 宣言，而是对长时间 Agent 实务可靠性的提升”。\n\n整体布局：使用 7 个编号的主章节，每个章节配有橙色圆形数字徽章和橙色标题栏。第 1–3 章节排列在上半部分，第 4–6 章节在中间，第 7 章节及工作流条带位于底部。保持内容紧凑且易读。\n\n第 1 章节，左侧栏，“发布内容 — 相比 Opus 4.7 的实务向升级”：展示 6 行堆叠的规格行，左侧为黑色方形线条图标，右侧为标签/数值：1) API ID，值为“claude-opus-4-8”；2) Bedrock ID，值为“anthropic.claude-opus-4-8”；3) 常规价格，橙色价格胶囊“$5 / $25 per MTok”，备注“与 Opus 4.7 持平”；4) Fast 模式，橙色“2.5× speed”及价格胶囊“$10 / $50 per MTok”，备注“较传统 Fast 提升 3 倍”；5) 上下文窗口，橙色胶囊“1M tokens”；6) 最大输出，橙色胶囊“128k tokens”；底部增加一行小字“可靠的知识截止日期 / 训练数据截止日期”，橙色日期为 {argument name=\"training cutoff date\" default=\"2026 年 1 月\"}。\n\n第 2 章节，顶部中央，“官方基准测试对比”：创建一个对比表，包含 4 列模型，分别为“Opus 4.8”、“Opus 4.7”、“GPT-5.5”和“Gemini 3.1 Pro”。Opus 4.8 使用橙色，Opus 4.7 使用灰色，GPT-5.5 使用蓝色，Gemini 使用绿色。包含 7 行基准测试，配有小型编号圆圈、指标名称、百分比/分数、水平迷你条形图，并在 Opus 4.8 领先处标注小型皇冠图标：1) Agentic coding / SWE-Bench Pro: 69.2%, 64.3%, 58.6%, 54.2%; 2) Agentic terminal coding / Terminal-Bench 0.1: 74.6%, 66.1%, 78.2%, 70.3%; 3) 多学科推理 / Humanity’s Last Exam (无工具): 49.8%, 46.9%, 41.4%, 44.4%; 4) 多学科推理 / Humanity’s Last Exam (有工具): 57.9%, 54.7%, 52.2%, 51.4%; 5) Agentic computer use / OSWorld-Verified: 83.4%, 82.8%, 78.7%, 76.2%; 6) 知识工作 / GDPval-AA: 1890, 1753, 1769, 1314; 7) Agentic 金融分析 / Finance Agent v2: 53.9%, 51.5%, 51.8%, 43.0%。表格下方添加简短的日语脚注。\n\n第 3 章节，右上角，“在 X 上引发共鸣的价值”：展示 4 张堆叠的洞察卡片，配有大图标和引号：1) 橙色目标图标，标题“判断的敏锐度”，备注关于捕捉危险盲点及发现自身错误；2) 绿色时钟/网络图标，标题“长时间 Agent”，备注“Claude Code 动态工作流 / 子 Agent / 大规模迁移”；3) 绿色企业建设图标，标题“企业利用”，备注列出“API / Bedrock / Vertex / Foundry / 日本区域背景”；4) 橙色价格标签图标，标题“价格持平”，备注“常规价格持平 + Fast 性能提升”。\n\n第 4 章节，左侧中部，“市场反应 — 3 种温度带”：创建 3 个情绪带及一个总结带：1) 绿色“积极（绿色）”，配笑脸图标，包含三点关于重获对 Anthropic 的信任、强劲的真实基准测试以及自我纠错/可
