    if(e.key==="Escape"){e.preventDefault();closeImageViewer();return}
    if(e.key==="Tab"){
      var viewerFocusables=Array.prototype.filter.call(viewer.querySelectorAll('button:not([disabled]),[tabindex]:not([tabindex="-1"])'),function(el){return el.offsetParent!==null});
      if(!viewerFocusables.length){e.preventDefault();viewer.focus();return}
      var viewerFirst=viewerFocusables[0],viewerLast=viewerFocusables[viewerFocusables.length-1],viewerActive=document.activeElement;
      if(e.shiftKey&&(viewerActive===viewerFirst||!viewer.contains(viewerActive))){e.preventDefault();viewerLast.focus()}
      else if(!e.shiftKey&&(viewerActive===viewerLast||!viewer.contains(viewerActive))){e.preventDefault();viewerFirst.focus()}
    }
    return
  }
  var modal=document.getElementById("modal");
  if(!modal||!modal.classList.contains("show"))return;
  if(e.key==="Escape"){e.preventDefault();closeModal();return}
  if(e.key!=="Tab")return;
  var focusables=modalFocusables();

  var first=focusables[0],last=focusables[focusables.length-1],active=document.activeElement;
  if(e.shiftKey&&(active===first||!modal.contains(active))){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&(active===last||!modal.contains(active))){e.preventDefault();first.focus()}
});
